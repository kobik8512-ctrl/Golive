<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Go Live</title>

<style>
:root{
 --bg:#09090b;
 --card:#151519;
 --card2:#1d1d23;
 --accent:#ff2d55;
 --text:#f5f5f7;
 --muted:#8b8b96;
 --green:#30d158;
 --danger:#ff453a;
 --border:#292930;
 --gold:#ffd60a;
}

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
}

html,body{
 width:100%;
 min-height:100%;
 background:var(--bg);
 color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 -webkit-tap-highlight-color:transparent;
 overflow-x:hidden;
}

button,input{
 font:inherit;
}

button{
 border:0;
 cursor:pointer;
 color:inherit;
}

.screen{
 display:none;
 min-height:100vh;
 flex-direction:column;
}

.screen.active{
 display:flex;
}


/* LOGIN */

#login-screen{
 align-items:center;
 justify-content:center;
 padding:24px;
 background:radial-gradient(ellipse at top,#1a0a12 0%,var(--bg) 60%);
}

.login-box{
 width:100%;
 max-width:360px;
 text-align:center;
}

.login-logo{
 font-size:2.4rem;
 font-weight:800;
 margin-bottom:8px;
}

.login-logo span,
.menu-title span{
 color:var(--accent);
}

.login-sub{
 color:var(--muted);
 margin-bottom:40px;
}

.btn-google{
 width:100%;
 background:white;
 color:#1f1f1f;
 padding:14px 20px;
 border-radius:14px;
 font-weight:600;
 display:flex;
 justify-content:center;
 align-items:center;
 gap:12px;
}

.btn-google svg{
 width:20px;
 height:20px;
}

.login-note{
 margin-top:24px;
 font-size:.8rem;
 color:var(--muted);
}


/* MENU */

#menu{
 padding:20px 16px 160px;
}

.broadcast-label,
.section-label{
 font-size:.7rem;
 font-weight:700;
 letter-spacing:1.5px;
 color:var(--muted);
 text-transform:uppercase;
 margin-bottom:8px;
}

.menu-title{
 font-size:2.1rem;
 font-weight:800;
 margin-bottom:10px;
}

.signed-in{
 color:var(--muted);
 margin-bottom:28px;
}

.signed-in strong{
 color:var(--green);
}

.lives-list{
 display:flex;
 flex-direction:column;
 gap:10px;
}

.live-card{
 background:var(--card);
 border:1px solid var(--border);
 border-radius:16px;
 padding:14px;
 display:flex;
 align-items:center;
 gap:12px;
}

.live-info{
 flex:1;
 min-width:0;
}

.live-name{
 font-weight:700;
 font-size:1.05rem;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.live-meta{
 color:var(--muted);
 font-size:.82rem;
 margin-top:3px;
}

.live-meta .dot{
 display:inline-block;
 width:7px;
 height:7px;
 background:var(--accent);
 border-radius:50%;
 margin-right:6px;
}

.btn-join{
 background:var(--accent);
 font-weight:700;
 padding:10px 18px;
 border-radius:999px;
}

.btn-x-small{
 width:32px;
 height:32px;
 border-radius:50%;
 background:var(--card2);
 color:var(--muted);
}

.empty-state{
 text-align:center;
 padding:48px 20px;
 color:var(--muted);
 background:var(--card);
 border-radius:16px;
 border:1px dashed var(--border);
 line-height:1.5;
}

.bottom-actions{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 padding:16px 16px 28px;
 background:linear-gradient(transparent,var(--bg) 25%);
 display:flex;
 flex-direction:column;
 gap:10px;
 z-index:30;
}

.btn-go-live{
 background:var(--accent);
 font-size:1.15rem;
 font-weight:700;
 padding:16px;
 border-radius:999px;
 box-shadow:0 8px 28px rgba(255,45,85,.3);
}

.btn-secondary{
 background:transparent;
 color:var(--muted);
 padding:12px;
 border-radius:999px;
 border:1px solid var(--border);
}


/* LIVE */

#live-room{
 position:relative;
 width:100%;
 height:100vh;
 height:100dvh;
 background:#000;
 overflow:hidden;
}

#video-wrap{
 position:absolute;
 inset:0;
 background:#0d0d10;
 display:flex;
 align-items:center;
 justify-content:center;
}

#local-video,
#remote-video{
 width:100%;
 height:100%;
 object-fit:cover;
 display:none;
}

#local-video.mirror{
 transform:scaleX(-1);
}

.cam-off{
 text-align:center;
 color:var(--muted);
}

.cam-off .icon{
 font-size:3.5rem;
 margin-bottom:10px;
}


/* HEADER */

.live-header{
 position:absolute;
 top:0;
 left:0;
 right:0;
 padding:12px;
 display:flex;
 justify-content:space-between;
 align-items:flex-start;
 z-index:100;
 pointer-events:none;
}

.live-header>*{
 pointer-events:auto;
}

.live-pill{
 max-width:65%;
 background:rgba(0,0,0,.65);
 backdrop-filter:blur(12px);
 border-radius:999px;
 padding:8px 14px;
 display:flex;
 align-items:center;
 gap:8px;
 font-size:.88rem;
 font-weight:600;
}

.red-dot{
 width:8px;
 height:8px;
 background:var(--accent);
 border-radius:50%;
 animation:blink 1.3s infinite;
}

.title-text{
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis;
}

.watchers{
 color:var(--muted);
 white-space:nowrap;
}

.header-btns{
 display:flex;
 gap:8px;
}

.icon-btn{
 width:40px;
 height:40px;
 border-radius:50%;
 background:rgba(0,0,0,.6);
 backdrop-filter:blur(10px);
 border:1px solid rgba(255,255,255,.08);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:1rem;
}

.b-btn{
 background:linear-gradient(135deg,#7c3aed,#06b6d4);
 font-weight:900;
}


/* BOT MENU */

.b-wrap{
 position:relative;
}

.bot-menu{
 position:absolute;
 top:48px;
 right:0;
 width:220px;
 padding:12px;
 background:rgba(20,20,24,.98);
 border:1px solid #38383f;
 border-radius:16px;
 box-shadow:0 12px 40px rgba(0,0,0,.6);
 display:none;
 z-index:500;
}

.bot-menu.show{
 display:block;
}

.bot-menu-title{
 font-size:.75rem;
 color:var(--muted);
 text-transform:uppercase;
 letter-spacing:1px;
 font-weight:700;
 margin-bottom:9px;
}

.bot-options{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:7px;
}

.bot-options button{
 padding:10px 5px;
 border-radius:10px;
 background:var(--card2);
 font-weight:800;
 font-size:.85rem;
}

.bot-options button.selected{
 background:var(--accent);
}

.bot-selected{
 margin-top:9px;
 text-align:center;
 color:var(--muted);
 font-size:.72rem;
}


/* CHAT */

.chat-wrap{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 height:42%;
 display:flex;
 flex-direction:column;
 background:linear-gradient(to top,rgba(0,0,0,.93) 45%,transparent);
 z-index:50;
 pointer-events:none;
}

.chat-list{
 flex:1;
 overflow:hidden;
 padding:12px 12px 5px;
 display:flex;
 flex-direction:column;
 justify-content:flex-end;
 gap:3px;
 pointer-events:auto;
 contain:layout paint;
}

.msg{
 font-size:.84rem;
 line-height:1.25;
 word-break:break-word;
 flex:none;
}

.msg .uname{
 font-weight:800;
 margin-right:5px;
}

.msg .c0{color:#ff6b9d}
.msg .c1{color:#5ac8fa}
.msg .c2{color:#30d158}
.msg .c3{color:#ffd60a}
.msg .c4{color:#bf5af2}
.msg .c5{color:#ff9f0a}
.msg .c6{color:#64d2ff}
.msg .c7{color:#ff375f}

.msg.host .uname{
 color:var(--accent);
}

.msg.gift-msg{
 color:var(--gold);
 font-weight:700;
}

.chat-bar{
 display:flex;
 gap:7px;
 padding:6px 10px 16px;
 pointer-events:auto;
 align-items:center;
}

#chat-input{
 flex:1;
 min-width:0;
 background:rgba(255,255,255,.1);
 border:1px solid rgba(255,255,255,.12);
 border-radius:999px;
 padding:11px 15px;
 color:white;
 outline:none;
}

.btn-send,
.btn-gift{
 font-weight:800;
 padding:11px 13px;
 border-radius:999px;
}

.btn-send{
 background:var(--accent);
}

.btn-gift{
 background:linear-gradient(135deg,#ffd60a,#ff9f0a);
 color:#111;
}


/* STATUS */

.mic-status{
 position:absolute;
 bottom:43%;
 left:12px;
 color:var(--green);
 font-size:.75rem;
 z-index:40;
 pointer-events:none;
}

.coins-badge{
 position:absolute;
 bottom:43%;
 right:12px;
 z-index:40;
 background:rgba(0,0,0,.65);
 backdrop-filter:blur(8px);
 border-radius:999px;
 padding:6px 12px;
 font-size:.82rem;
 font-weight:700;
 border:1px solid rgba(255,215,0,.3);
}

.coin-icon{
 color:var(--gold);
}


/* GIFT */

#gift-panel,
#title-modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.72);
 display:none;
 z-index:900;
}

#gift-panel.show,
#title-modal.show{
 display:flex;
}

.gift-sheet{
 margin-top:auto;
 width:100%;
 max-height:65vh;
 background:var(--card);
 border-radius:20px 20px 0 0;
}

.gift-sheet-header{
 padding:14px 16px;
 border-bottom:1px solid var(--border);
 display:flex;
 justify-content:space-between;
}

.gift-grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 padding:12px;
 overflow-y:auto;
 max-height:55vh;
}

.gift-item{
 background:var(--card2);
 border-radius:14px;
 padding:10px 6px;
 text-align:center;
}

.g-emoji{
 font-size:1.7rem;
}

.g-name{
 font-size:.66rem;
 color:var(--muted);
}

.g-cost{
 font-size:.7rem;
 font-weight:800;
 color:var(--gold);
}

#gift-anim{
 position:fixed;
 inset:0;
 pointer-events:none;
 z-index:1000;
 display:flex;
 align-items:center;
 justify-content:center;
}

.gift-fly{
 font-size:4.5rem;
}

.gift-label{
 position:absolute;
 bottom:38%;
 background:rgba(0,0,0,.8);
 color:var(--gold);
 padding:8px 18px;
 border-radius:999px;
 font-weight:800;
}


/* TITLE */

#title-modal{
 align-items:center;
 justify-content:center;
 padding:20px;
}

.modal-card{
 background:var(--card);
 border-radius:20px;
 padding:28px 22px;
 width:100%;
 max-width:340px;
}

.modal-card h3{
 text-align:center;
 margin-bottom:18px;
}

#title-input{
 width:100%;
 background:var(--bg);
 border:1px solid var(--border);
 border-radius:12px;
 padding:14px;
 color:white;
 outline:none;
 margin-bottom:16px;
}

.modal-actions{
 display:flex;
 gap:10px;
}

.modal-actions button{
 flex:1;
 padding:13px;
 border-radius:12px;
 font-weight:700;
}

.btn-cancel{
 background:var(--card2);
}

.btn-confirm{
 background:var(--accent);
}


/* TOAST */

#toast{
 position:fixed;
 top:60px;
 left:50%;
 transform:translateX(-50%) translateY(-12px);
 background:rgba(20,20,24,.94);
 padding:10px 18px;
 border-radius:999px;
 font-size:.86rem;
 opacity:0;
 transition:.2s;
 z-index:2000;
 border:1px solid var(--border);
 pointer-events:none;
}

.show-toast{
 opacity:1!important;
 transform:translateX(-50%) translateY(0)!important;
}

@keyframes blink{
 0%,100%{opacity:1}
 50%{opacity:.35}
}
</style>
</head>

<body>

 <div class="coins-badge">

 </div>

</div>


<!-- GIFTS -->

 </div>

</div>

<div id="gift-anim"></div>


<!-- TITLE -->

 </div>

/* =========================================================

/* =========================================================

const adjs=[

const tags=[

const normalMessages=[

function rand(a){
 return a[Math.floor(Math.random()*a.length)];
}

function makeName(){
 return rand(adjs)+rand(nouns)+rand(tags)+
 (Math.random()<.35?Math.floor(Math.random()*900+100):"");
}

const names=Array.from(

);

function nextName(){

 ];
}

function nextBotMessage(opening=false){

 if(opening && Math.random()<.70){
  return rand(openingGreetings);
 }

 if(Math.random()<.72){
  return rand(normalMessages);
 }

 return [
  rand(normalMessages),
  rand(normalMessages)

 n=Math.max(0,Number(n)||0);

  return (n/1e9).toFixed(1)+"B";

 if(n>=1e6)

 if(n>=1000)

 return String(Math.floor(n));
}

/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

 try{

  if(stream){

   stream.getTracks()
   .forEach(t=>t.stop());

   stream=null;
  }

  const newStream=
  await navigator.mediaDevices.getUserMedia({

   video:{
    facingMode,
    width:{ideal:1280},
    height:{ideal:720},
    frameRate:{ideal:30,max:30}
   },

   audio:true

  });

  stream=newStream;
  cameraOn=true;

  const video=
  document.getElementById("local-video");

  video.srcObject=stream;
  video.style.display="block";

  document.getElementById("cam-off")
  .style.display="none";

  video.classList.toggle(
   "mirror",
   facingMode==="user"
  );

  document.getElementById("btn-camera")
  .textContent="📷";

  document.getElementById("mic-status")
  .textContent=
   isMuted
   ?"Mic: muted"
   :"Mic: on";

  /*
   CRITICAL:
   The peer connections already contain
   persistent transceivers.
   We only replace their tracks.
   No giant renegotiation.
  */

  for(const pc of Object.values(peerConnections)){

   const videoSender=
   pc.getSenders().find(
    s=>s.track?.kind==="video"
   );

   const audioSender=
   pc.getSenders().find(
    s=>s.track?.kind==="audio"
   );

   if(videoSender){

    await videoSender
    .replaceTrack(
     newStream.getVideoTracks()[0]||null
    );

   }

   if(audioSender){

    await audioSender
    .replaceTrack(
     newStream.getAudioTracks()[0]||null
    );

   }

  }

 }catch(e){

  cameraOn=false;

  document.getElementById("local-video")
  .style.display="none";

  document.getElementById("cam-off")
  .style.display="block";

  document.getElementById("mic-status")
  .textContent="Camera off";

  toast("Camera permission denied");

 }

}

  document.getElementById("local-video")
  .style.display="none";

  document.getElementById("cam-off")
  .style.display="block";

  /*
   Stop sending without destroying WebRTC.
  */

  for(const pc of Object.values(peerConnections)){

   const sender=
   pc.getSenders()
   .find(s=>s.track?.kind==="video");

   if(sender)
    await sender.replaceTrack(null);

  .textContent="📷";

  document.getElementById("mic-status")
  .textContent=
   isMuted

   :"Camera off";

 }else{

 }

};


/* =========================================================
   WEBRTC HOST
========================================================= */

function listenForViewers(){

 if(unsubViewers)
  unsubViewers();

 const viewersRef=
 ref(
  db,
  "lives/"+currentLiveId+"/viewers"
 );

 unsubViewers=
 onChildAdded(
  viewersRef,
  async snap=>{

   const id=snap.key;
   const data=snap.val();

   if(!data)return;

   if(peerConnections[id])
    return;

   realViewers++;

   updateViewerCount();

   await createHostPeer(id);

  }
 );

 onChildRemoved(
  viewersRef,
  snap=>{

   const id=snap.key;

   if(peerConnections[id]){

    try{
     peerConnections[id].close();
    }catch(e){}

    delete peerConnections[id];

   }

   realViewers=
    Math.max(0,realViewers-1);

   updateViewerCount();

  }
 );

}


async function createHostPeer(id){

 const pc=
 new RTCPeerConnection(
  ICE_SERVERS
 );

 peerConnections[id]=pc;

 /*
  Persistent transceivers fix the camera-on-after-connect
  problem.
 */

 const videoTrans=
 pc.addTransceiver(
  "video",
  {direction:"sendonly"}
 );

 const audioTrans=
 pc.addTransceiver(
  "audio",
  {direction:"sendonly"}
 );

 if(stream){

  await videoTrans.sender
  .replaceTrack(
   stream.getVideoTracks()[0]||null
  );

  await audioTrans.sender
  .replaceTrack(
   stream.getAudioTracks()[0]||null
  );

 }

 pc.onicecandidate=e=>{

  if(!e.candidate)return;

  push(
   ref(
    db,
    `lives/${currentLiveId}/signals/${id}/hostCandidates`
   ),
   e.candidate.toJSON()
  );

 };


 const answerRef=
 ref(
  db,
  `lives/${currentLiveId}/signals/${id}/answer`
 );

 onValue(
  answerRef,
  async snap=>{

   const answer=snap.val();

   if(!answer)return;

   if(
    pc.signalingState!=="have-local-offer"
   )
    return;

   try{

    await pc.setRemoteDescription(
     new RTCSessionDescription(answer)
    );

   }catch(e){}

  }
 );


 onChildAdded(
  ref(
   db,
   `lives/${currentLiveId}/signals/${id}/viewerCandidates`
  ),
  snap=>{

   const c=snap.val();

   if(!c)return;

   pc.addIceCandidate(
    new RTCIceCandidate(c)
   ).catch(()=>{});

  }
 );


 pc.onconnectionstatechange=()=>{

  if(
   ["failed","closed"].includes(
    pc.connectionState
   )
  ){

   try{
    pc.close();
   }catch(e){}

   delete peerConnections[id];

  }

 };


 try{

  const offer=
  await pc.createOffer();

  await pc.setLocalDescription(offer);

  await set(
   ref(
    db,
    `lives/${currentLiveId}/signals/${id}/offer`
   ),
   {
    type:offer.type,
    sdp:offer.sdp
   }
  );

 }catch(e){

  console.error("WebRTC offer error",e);

 }

}

async function joinViewer(live){

 cleanupViewer();

 isHost=false;

 currentLiveId=live.id;

 document.getElementById("live-title-text")

 document.getElementById("chat-list")

 .style.display=
 isSpecialUser
 ?"flex"
 :"none";

 show("live-room");

 viewerId=
 "v"+Date.now()+"_"+
 Math.random().toString(36).slice(2,7);


 await set(
  ref(
   db,
   `lives/${live.id}/viewers/${viewerId}`
  ),
  {
   name:user?.name||"Viewer",
   joinedAt:Date.now()
  }
 );


 unsubLiveEnd=
 onValue(
  ref(db,"lives/"+live.id),
  snap=>{

   if(
    !snap.exists()&&
    currentLiveId===live.id
   ){

    forceLeaveLive("Live ended");

   }

  }
 );


 listenToChat(live.id);
 listenToBotBatches(live.id);

 viewerPC=
 new RTCPeerConnection(
  ICE_SERVERS
 );


 viewerPC.ontrack=e=>{

  const video=
  document.getElementById("remote-video");

  if(e.streams&&e.streams[0]){

   video.srcObject=e.streams[0];

   video.style.display="block";

   document.getElementById("cam-off")
   .style.display="none";

   video.play().catch(()=>{});

  }

 };


 viewerPC.onicecandidate=e=>{

  if(!e.candidate)return;

  push(
   ref(
    db,
    `lives/${live.id}/signals/${viewerId}/viewerCandidates`
   ),
   e.candidate.toJSON()
  );

 };


 onValue(
  ref(
   db,
   `lives/${live.id}/signals/${viewerId}/offer`
  ),
  async snap=>{

   const offer=snap.val();

   if(
    !offer||
    !viewerPC||
    viewerPC.signalingState!=="stable"
   )
    return;

   try{

    await viewerPC.setRemoteDescription(
     new RTCSessionDescription(offer)
    );

    const answer=
    await viewerPC.createAnswer();

    await viewerPC.setLocalDescription(answer);

    await set(
     ref(
      db,
      `lives/${live.id}/signals/${viewerId}/answer`
     ),
     {
      type:answer.type,
      sdp:answer.sdp
     }
    );

   }catch(e){

    console.error("Viewer WebRTC error",e);

   }

  }
 );


 onChildAdded(
  ref(
   db,
   `lives/${live.id}/signals/${viewerId}/hostCandidates`
  ),
  snap=>{

   const c=snap.val();

   if(!c||!viewerPC)return;

   viewerPC.addIceCandidate(
    new RTCIceCandidate(c)
   ).catch(()=>{});

  }
 );

}

function calculateBotCount(){

 let total=0;

 const now=Date.now();

 Object.values(botBatches||{})
 .forEach(batch=>{

  if(
   batch &&
   Number(batch.expiresAt||0)>now
  ){

   total+=Number(batch.amount||0);

  }

 });

 return total;
}

========================================================= */

function startBotExpiryWatcher(){

 clearInterval(botExpiryTimer);

 botExpiryTimer=
 setInterval(async()=>{

  if(
   !isHost||
   !currentLiveId
  )
   return;

  const now=Date.now();

  const updates={};

  Object.entries(botBatches||{})
  .forEach(([id,batch])=>{

   if(
    batch &&
    Number(batch.expiresAt||0)<=now
   ){

    updates[
     `lives/${currentLiveId}/botBatches/${id}`
    ]=null;

   }

  });

  if(Object.keys(updates).length){

   await update(
    ref(db),
    updates
   ).catch(()=>{});

  }

  updateViewerCount();

 },5000);

}


/* =========================================================
   BOT CHAT ENGINE
=========================================================

   IMPORTANT:

   Bot chat is NOT pushed to Firebase.

   That means 100K bots do not create 100K database writes.

   Every viewer creates its own lightweight visual chat stream.
========================================================= */

function getChatSpeed(){

 const count=calculateBotCount();

 if(count<10)
  return {
   interval:1600,
   burst:1
  };

 if(count<100)
  return {
   interval:650,
   burst:1
  };

 if(count<1000)
  return {
   interval:180,
   burst:2
  };

 if(count<3000)
  return {
   interval:80,
   burst:3
  };

 if(count<7000)
  return {
   interval:40,
   burst:5
  };

 /*
  7K+:
  CHAT EXPLOSION MODE
 */

 if(count<20000)
  return {
   interval:25,
   burst:8
  };

 if(count<100000)
  return {
   interval:18,
   burst:12
  };

 /*
  At huge numbers don't literally create
  millions of DOM nodes per second.
  We simulate the visual speed with large
  batches while keeping the page alive.
 */

 return {
  interval:16,
  burst:18
 };

}


function startLocalBotChat(){

 clearTimeout(localBotChatTimer);

 if(calculateBotCount()<=0)
  return;

 localBotChatTick();

}


function localBotChatTick(){

 const count=
 calculateBotCount();

 if(count<=0){

  localBotChatTimer=
   setTimeout(
    localBotChatTick,
    1000
   );

  return;
 }

 const speed=
 getChatSpeed();

 /*
  First 45 seconds of a live:
  approximately 70% greeting messages.
 */

 const opening=
 Date.now()-
 (window.__liveStartedAt||Date.now())
 <45000;

 for(let i=0;i<speed.burst;i++){

  enqueueChat({
   name:nextName(),
   text:nextBotMessage(opening),
   host:false,
   gift:false,
   bot:true
  });

 }

 localBotChatTimer=
  setTimeout(
   localBotChatTick,
   speed.interval
  );

}


/* =========================================================
   CHAT RENDERER
========================================================= */

function enqueueChat(msg){

 chatQueue.push(msg);

 if(chatQueue.length>300){

  chatQueue.splice(
   0,
   chatQueue.length-300
  );

 }

 if(!chatFramePending){

  chatFramePending=true;

  requestAnimationFrame(
   renderChat
  );

 }

}


function renderChat(){

 chatFramePending=false;

 const list=
 document.getElementById("chat-list");

 /*
  Never allow an enormous queue to be
  inserted in one JavaScript task.
 */

 const batch=
 chatQueue.splice(0,80);

 const fragment=
 document.createDocumentFragment();

 batch.forEach(msg=>{

  const div=
  document.createElement("div");

  div.className=
   "msg"+
   (msg.host?" host":"")+
   (msg.gift?" gift-msg":"");

  const cls=
   msg.host||msg.gift
   ?""
   :colorClass(msg.name);

  div.innerHTML=
   `<span class="uname ${cls}">
    ${esc(msg.name)}
    </span>${esc(msg.text)}`;

  fragment.appendChild(div);

 });

 list.appendChild(fragment);

 /*
  Keep the chat visually explosive but tiny
  in DOM size.
 */

 while(
  list.children.length>
  MAX_CHAT_DOM
 ){

  list.removeChild(
   list.firstChild
  );

 }

 /*
  No expensive smooth scrolling.
 */

 list.scrollTop=
 list.scrollHeight;

 if(chatQueue.length){

  chatFramePending=true;

  requestAnimationFrame(
   renderChat
  );

 }

}


/* =========================================================
   FIREBASE CHAT
========================================================= */

function listenToChat(id){

 if(unsubChat){

  try{
   unsubChat();
  }catch(e){}

 }

 seenChat.clear();

 /*
  Only listen to the newest chat data.
  Bot chat is NOT stored here.
 */

 unsubChat=
 onChildAdded(
  ref(db,`lives/${id}/chat`),
  snap=>{

   if(seenChat.has(snap.key))
    return;

   seenChat.add(snap.key);

   const msg=snap.val();

   if(!msg)return;

   /*
    Ignore old bot records created by an older
    version of the game.
   */

   if(msg.bot)
    return;

   enqueueChat({
    name:msg.name||"User",
    text:msg.text||"",
    host:!!msg.host,
    gift:!!msg.gift
   });

  }
 );

}

async function sendGift(g){

 if(
  !currentLiveId||
  isHost
 )
  return;

 const cost=g[2];

 if(
  !isInfinite&&
  coins<cost
 ){

  toast("Not enough coins!");
  return;

 }

 if(!isInfinite){

  coins-=cost;
  saveCoins();
  updateCoins();

 }

 document.getElementById("gift-panel")
 .classList.remove("show");

 playGiftAnim(
  g[0],
  g[1],
  cost
 );

 try{

  await push(
   ref(
    db,
    `lives/${currentLiveId}/chat`
   ),
   {
    name:user.name,
    text:
     `sent ${g[0]} ${g[1]} (🪙${format(cost)})`,
    host:false,
    gift:true,
    at:Date.now()
   }
  );

  await push(
   ref(
    db,
    `lives/${currentLiveId}/gifts`
   ),
   {
    from:user.name,
    emoji:g[0],
    name:g[1],
    cost,
    toHost:Math.floor(cost*.7),
    at:Date.now()
   }
  );

 }catch(e){

  toast("Gift failed");

 }

}

async function stopLive(){

 const id=currentLiveId;

 clearTimeout(localBotChatTimer);
 clearInterval(botExpiryTimer);

 localBotChatTimer=null;
 botExpiryTimer=null;

 if(unsubBotData){

  try{
   unsubBotData();
  }catch(e){}

  unsubBotData=null;

 }

 if(unsubViewers){

  try{
   unsubViewers();
  }catch(e){}

  unsubViewers=null;

 }

 if(unsubChat){

  try{
   unsubChat();
  }catch(e){}

  unsubChat=null;

 }

 if(unsubGifts){

  try{
   unsubGifts();
  }catch(e){}

  unsubGifts=null;

 }

 if(unsubLiveEnd){

  try{
   unsubLiveEnd();
  }catch(e){}

  unsubLiveEnd=null;

 }


 if(stream){

  stream.getTracks()
  .forEach(t=>t.stop());

  stream=null;

 }


 Object.values(peerConnections)
 .forEach(pc=>{

  try{
   pc.close();
  }catch(e){}

 });

 peerConnections={};


 if(viewerPC){

  try{
   viewerPC.close();
  }catch(e){}

  viewerPC=null;

 }


 if(
  viewerId&&
  id
 ){

  await remove(
   ref(
    db,
    `lives/${id}/viewers/${viewerId}`
   )
  ).catch(()=>{});

 }


 if(isHost&&id){

  await remove(
   ref(db,"lives/"+id)
  ).catch(()=>{});

 }


 isHost=false;
 cameraOn=false;

 currentLiveId=null;
 viewerId=null;

 botCount=0;
 realViewers=0;
 botBatches={};

 document.getElementById("local-video")
 .srcObject=null;

 document.getElementById("remote-video")
 .srcObject=null;

 document.getElementById("local-video")
 .style.display="none";

 document.getElementById("remote-video")
 .style.display="none";

 document.getElementById("cam-off")
 .style.display="block";

 document.getElementById("chat-list")
 .innerHTML="";

 chatQueue=[];

 show("menu");

 toast("Live ended");

}

     db,

    )
   );

 }
