<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Zoom Chat</title>
<style>
:root {
  --bg: #0f0f10;
  --panel: #1a1b1e;
  --card: #222328;
  --text: #eeeef0;
  --muted: #9a9aa3;
  --border: #2e2f35;
  --accent: #2d8cff;
  --accent2: #7c5cff;
  --ok: #3dd68c;
  --danger: #ff5c7a;
  --bubble-me: #2d8cff;
  --bubble-them: #2a2b32;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
img { max-width: 100%; }

/* AUTH */
#auth {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 24px 16px; overflow-y: auto;
  background: radial-gradient(ellipse at top, #0d1a2e 0%, var(--bg) 55%);
}
#auth.hidden { display: none; }
.auth-card {
  width: 100%; max-width: 400px; margin-top: 8vh;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 20px; padding: 28px 22px 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.45);
}
.auth-logo {
  width: 56px; height: 56px; border-radius: 16px;
  background: #0a0a0a; display: grid; place-items: center; margin: 0 auto 12px;
}
.auth-logo svg { width: 36px; height: 36px; }
.auth-card h1 { text-align: center; font-size: 22px; margin-bottom: 4px; }
.auth-card .sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tabs button {
  flex: 1; padding: 10px; border-radius: 12px; background: var(--card);
  color: var(--muted); font-weight: 600;
}
.tabs button.active { background: var(--accent); color: #fff; }
label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
input[type=text], input[type=password], textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg); outline: none;
}
input:focus, textarea:focus { border-color: var(--accent); }
.auth-err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 10px; }
.btn-primary {
  width: 100%; margin-top: 16px; padding: 14px;
  border-radius: 14px; background: var(--accent); color: #fff;
  font-weight: 700; font-size: 15px;
}
.btn-primary:disabled { opacity: 0.5; }

/* APP SHELL */
#app { display: none; height: 100dvh; flex-direction: column; }
#app.show { display: flex; }
header.app-bar {
  flex-shrink: 0; height: 56px; display: flex; align-items: center;
  gap: 10px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--border);
}
header .title { font-weight: 700; font-size: 17px; flex: 1; min-width: 0;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--card); color: var(--text); flex-shrink: 0;
}
.icon-btn:active { opacity: 0.8; }

/* TABS MAIN */
.nav-tabs {
  display: flex; gap: 4px; padding: 8px 10px; background: var(--panel);
  border-bottom: 1px solid var(--border); flex-shrink: 0;
}
.nav-tabs button {
  flex: 1; padding: 10px 8px; border-radius: 12px; font-weight: 600; font-size: 13px;
  color: var(--muted); background: transparent;
}
.nav-tabs button.active { background: var(--card); color: var(--text); }

.view { display: none; flex: 1; min-height: 0; flex-direction: column; overflow: hidden; }
.view.active { display: flex; }

.list { flex: 1; overflow-y: auto; padding: 8px 10px 24px; -webkit-overflow-scrolling: touch; }
.row {
  display: flex; align-items: center; gap: 12px; padding: 12px;
  border-radius: 14px; background: var(--card); margin-bottom: 8px;
  border: 1px solid transparent;
}
.row:active { border-color: var(--border); }
.avatar {
  width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
  background: #2a2a30; flex-shrink: 0;
}
.avatar.sm { width: 36px; height: 36px; }
.row-info { flex: 1; min-width: 0; }
.row-info .name { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-info .meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill {
  font-size: 11px; padding: 4px 8px; border-radius: 999px; background: var(--bg);
  color: var(--muted); flex-shrink: 0;
}
.empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

.fab-row { padding: 10px 12px; display: flex; gap: 8px; flex-shrink: 0; border-top: 1px solid var(--border); background: var(--panel); }
.fab {
  flex: 1; padding: 12px; border-radius: 14px; background: var(--accent); color: #fff;
  font-weight: 700; font-size: 14px;
}
.fab.secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }

/* CHAT */
#chat-view { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; flex-direction: column; }
#chat-view.open { display: flex; }
#chat-messages {
  flex: 1; overflow-y: auto; padding: 12px 12px 8px;
  display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch;
}
.msg {
  max-width: 82%; padding: 10px 12px; border-radius: 16px; font-size: 14.5px;
  line-height: 1.4; word-break: break-word; position: relative;
}
.msg.me { align-self: flex-end; background: var(--bubble-me); color: #fff; border-bottom-right-radius: 6px; }
.msg.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 6px; }
.msg .who { font-size: 11px; font-weight: 700; opacity: 0.8; margin-bottom: 4px; }
.msg .time { font-size: 10px; opacity: 0.65; margin-top: 6px; text-align: right; }
.msg img.attach {
  display: block; border-radius: 12px; margin-top: 6px; max-height: 240px;
  cursor: pointer; background: #000;
}
.composer {
  flex-shrink: 0; display: flex; align-items: flex-end; gap: 8px;
  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: var(--panel); border-top: 1px solid var(--border);
}
.composer .tools { display: flex; gap: 6px; }
.composer textarea {
  flex: 1; min-height: 42px; max-height: 120px; resize: none;
  border-radius: 14px; padding: 10px 12px; border: 1px solid var(--border); background: var(--bg);
}
.composer .send {
  width: 44px; height: 44px; border-radius: 14px; background: var(--accent);
  color: #fff; display: grid; place-items: center; flex-shrink: 0;
}
.preview-bar {
  display: none; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--border);
  align-items: center; gap: 10px;
}
.preview-bar.show { display: flex; }
.preview-bar img { height: 56px; border-radius: 10px; }
.preview-bar button { color: var(--danger); font-weight: 600; font-size: 13px; }

/* MODALS */
.overlay {
  position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.7);
  display: none; align-items: flex-end; justify-content: center; padding: 12px;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
  background: var(--panel); border-radius: 20px 20px 16px 16px;
  padding: 18px 16px 20px; border: 1px solid var(--border);
}
.sheet h3 { font-size: 18px; margin-bottom: 12px; }
.sheet .actions { display: flex; gap: 8px; margin-top: 16px; }
.sheet .actions button {
  flex: 1; padding: 12px; border-radius: 12px; font-weight: 700;
  background: var(--card);
}
.sheet .actions button.main { background: var(--accent); color: #fff; }
.sheet .actions button.danger { background: #4a1520; color: var(--danger); }

.section-label { font-size: 12px; color: var(--muted); font-weight: 700; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: 0.04em; }
.small-btn {
  padding: 8px 12px; border-radius: 10px; background: var(--card);
  font-size: 12px; font-weight: 600; border: 1px solid var(--border);
}
.small-btn.accent { background: var(--accent); color: #fff; border: none; }
.small-btn.danger { color: var(--danger); }

.profile-edit .avatar-big {
  width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
  display: block; margin: 0 auto 12px; background: #2a2a30; border: 2px solid var(--border);
}

#toast {
  position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(80px);
  background: #222; color: #fff; padding: 12px 18px; border-radius: 12px;
  font-size: 13px; z-index: 100; opacity: 0; transition: .25s; pointer-events: none;
  border: 1px solid var(--border); max-width: 90%;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.lightbox {
  position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.lightbox.open { display: flex; }
.lightbox img { max-width: 100%; max-height: 90vh; border-radius: 12px; }
</style>
</head>
<body>

<div id="auth">
  <div class="auth-card">
    <div class="auth-logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none"><rect width="64" height="64" rx="16" fill="#1a5cff"/><path d="M18 22h28v6H28l12 14h-8L20 28v14h-2V22z" fill="#fff"/></svg>
    </div>
    <h1>Zoom Chat</h1>
    <p class="sub">Groups · friends · photos</p>
    <div class="tabs">
      <button type="button" class="active" id="tab-login">Log in</button>
      <button type="button" id="tab-signup">Sign up</button>
    </div>
    <form id="login-form">
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username" required maxlength="20" />
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password" required />
      <div class="auth-err" id="login-err"></div>
      <button class="btn-primary" type="submit">Log in</button>
    </form>
    <form id="signup-form" style="display:none">
      <label>Username</label>
      <input type="text" id="su-user" autocomplete="username" required maxlength="20" placeholder="3–20 characters" />
      <label>Display name</label>
      <input type="text" id="su-display" maxlength="40" placeholder="How friends see you" />
      <label>Password</label>
      <input type="password" id="su-pass" autocomplete="new-password" required minlength="8" />
      <label>Confirm password</label>
      <input type="password" id="su-pass2" autocomplete="new-password" required />
      <div class="auth-err" id="su-err"></div>
      <button class="btn-primary" type="submit">Create account</button>
    </form>
  </div>
</div>

<div id="app">
  <header class="app-bar">
    <div class="auth-logo" style="width:36px;height:36px;margin:0;border-radius:10px;background:#1a5cff">
      <svg viewBox="0 0 64 64" width="22" height="22"><path d="M18 22h28v6H28l12 14h-8L20 28v14h-2V22z" fill="#fff"/></svg>
    </div>
    <div class="title" id="app-title">Zoom Chat</div>
    <button class="icon-btn" id="btn-profile" title="Profile">👤</button>
  </header>
  <div class="nav-tabs">
    <button type="button" class="active" data-tab="groups">Groups</button>
    <button type="button" data-tab="friends">Friends</button>
  </div>

  <div class="view active" id="view-groups">
    <div class="list" id="groups-list"></div>
    <div class="fab-row">
      <button class="fab" id="btn-create-group">+ Create group</button>
    </div>
  </div>

  <div class="view" id="view-friends">
    <div class="list" id="friends-list"></div>
    <div class="fab-row">
      <button class="fab secondary" id="btn-add-friend">+ Add friend</button>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-view">
  <header class="app-bar">
    <button class="icon-btn" id="chat-back">←</button>
    <img class="avatar sm" id="chat-avatar" alt="" />
    <div class="title" id="chat-title">Chat</div>
    <button class="icon-btn" id="chat-info" title="Info">ⓘ</button>
  </header>
  <div id="chat-messages"></div>
  <div class="preview-bar" id="img-preview-bar">
    <img id="img-preview" alt="preview" />
    <span style="flex:1;font-size:12px;color:var(--muted)">Photo ready</span>
    <button type="button" id="img-preview-clear">Remove</button>
  </div>
  <div class="composer">
    <div class="tools">
      <button class="icon-btn" id="btn-pick-photo" title="Photo">📷</button>
      <input type="file" id="photo-input" accept="image/*" hidden />
    </div>
    <textarea id="composer-input" rows="1" placeholder="Message…"></textarea>
    <button class="send" id="btn-send" title="Send">➤</button>
  </div>
</div>

<!-- MODALS -->
<div class="overlay" id="modal-create-group">
  <div class="sheet">
    <h3>Create group</h3>
    <label>Group name</label>
    <input type="text" id="cg-name" maxlength="60" placeholder="e.g. Weekend crew" />
    <label>Invite friends (usernames, comma separated)</label>
    <input type="text" id="cg-invite" placeholder="alice, bob" />
    <div class="actions">
      <button type="button" data-close="modal-create-group">Cancel</button>
      <button type="button" class="main" id="cg-submit">Create</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-add-friend">
  <div class="sheet">
    <h3>Add friend</h3>
    <label>Their username</label>
    <input type="text" id="af-user" maxlength="20" placeholder="username" />
    <div class="auth-err" id="af-err"></div>
    <div class="actions">
      <button type="button" data-close="modal-add-friend">Cancel</button>
      <button type="button" class="main" id="af-submit">Send request</button>
    </div>
  </div>
</div>

<div class="overlay" id="modal-profile">
  <div class="sheet profile-edit">
    <h3>Your profile</h3>
    <img class="avatar-big" id="pf-avatar" alt="" />
    <div style="text-align:center;margin-bottom:12px">
      <button type="button" class="small-btn accent" id="pf-change-photo">Change photo</button>
      <input type="file" id="pf-photo-input" accept="image/*" hidden />
    </div>
    <label>Display name</label>
    <input type="text" id="pf-display" maxlength="40" />
    <label>Username</label>
    <input type="text" id="pf-username" maxlength="20" />
    <label>Bio</label>
    <textarea id="pf-bio" rows="3" maxlength="160" placeholder="Say something…"></textarea>
    <div class="auth-err" id="pf-err"></div>
    <div class="actions">
      <button type="button" data-close="modal-profile">Close</button>
      <button type="button" class="main" id="pf-save">Save</button>
    </div>
    <button type="button" class="btn-primary" style="background:#4a1520;margin-top:12px" id="btn-logout">Log out</button>
  </div>
</div>

<div class="overlay" id="modal-group-info">
  <div class="sheet">
    <h3 id="gi-title">Group</h3>
    <div id="gi-members"></div>
    <label style="margin-top:12px">Invite by username</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="gi-invite" placeholder="username" style="flex:1" />
      <button type="button" class="small-btn accent" id="gi-invite-btn">Add</button>
    </div>
    <div class="actions">
      <button type="button" data-close="modal-group-info">Close</button>
      <button type="button" class="danger" id="gi-leave">Leave group</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt="" /></div>
<div id="toast"></div>

<script>
(() => {
  // ========== CONFIG — put your Worker URL here ==========
  const API = 'https://zoom-chat.kobik8512.workers.dev';
  // =======================================================

  const $ = (id) => document.getElementById(id);
  const state = {
    token: localStorage.getItem('zc_token') || null,
    profile: null,
    friends: [],
    incoming: [],
    outgoing: [],
    groups: [],
    chatId: null,
    chatKind: null, // group | dm
    chatMeta: null,
    messages: [],
    pollTimer: null,
    pendingImage: null,
    myUserId: null,
  };

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  async function api(action, body = {}) {
    const payload = { action, ...body };
    if (state.token) payload.token = state.token;
    const res = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    let data;
    try { data = await res.json(); } catch { data = { ok: false, error: 'Bad response' }; }
    if (data && data.error === 'Session expired.') {
      logout(true);
    }
    return data;
  }

  function defaultAvatar(name) {
    const letter = String(name || '?').slice(0, 1).toUpperCase();
    return 'data:image/svg+xml,' + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96"><rect fill="#2a2a30" width="96" height="96" rx="48"/><text x="48" y="58" text-anchor="middle" fill="#aaa" font-size="36" font-family="sans-serif">${letter}</text></svg>`
    );
  }

  function timeStr(ts) {
    if (!ts) return '';
    const d = new Date(ts);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  // compress image for upload
  function readImageFile(file, maxSide = 1280, quality = 0.72) {
    return new Promise((resolve, reject) => {
      if (!file || !file.type.startsWith('image/')) return reject(new Error('Not an image'));
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        const scale = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * scale); h = Math.round(h * scale);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not load image')); };
      img.src = url;
    });
  }

  // ----- Auth UI -----
  $('tab-login').onclick = () => {
    $('tab-login').classList.add('active');
    $('tab-signup').classList.remove('active');
    $('login-form').style.display = '';
    $('signup-form').style.display = 'none';
  };
  $('tab-signup').onclick = () => {
    $('tab-signup').classList.add('active');
    $('tab-login').classList.remove('active');
    $('signup-form').style.display = '';
    $('login-form').style.display = 'none';
  };

  $('login-form').onsubmit = async (e) => {
    e.preventDefault();
    $('login-err').textContent = '';
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const data = await api('login', {
        username: $('login-user').value.trim(),
        password: $('login-pass').value,
      });
      if (!data.ok) { $('login-err').textContent = data.error || 'Login failed'; return; }
      state.token = data.token;
      localStorage.setItem('zc_token', data.token);
      state.profile = data.profile;
      await enterApp();
    } catch (err) {
      $('login-err').textContent = 'Network error';
    } finally { btn.disabled = false; }
  };

  $('signup-form').onsubmit = async (e) => {
    e.preventDefault();
    $('su-err').textContent = '';
    const p1 = $('su-pass').value, p2 = $('su-pass2').value;
    if (p1 !== p2) { $('su-err').textContent = 'Passwords do not match'; return; }
    if (p1.length < 8) { $('su-err').textContent = 'Password min 8 characters'; return; }
    const btn = e.target.querySelector('button');
    btn.disabled = true;
    try {
      const data = await api('register', {
        username: $('su-user').value.trim(),
        password: p1,
        displayName: $('su-display').value.trim() || $('su-user').value.trim(),
      });
      if (!data.ok) { $('su-err').textContent = data.error || 'Sign up failed'; return; }
      state.token = data.token;
      localStorage.setItem('zc_token', data.token);
      state.profile = data.profile;
      await enterApp();
    } catch {
      $('su-err').textContent = 'Network error — check Worker URL';
    } finally { btn.disabled = false; }
  };

  async function enterApp() {
    $('auth').classList.add('hidden');
    $('app').classList.add('show');
    await refreshAll();
  }

  function logout(silent) {
    const tok = state.token;
    state.token = null;
    state.profile = null;
    localStorage.removeItem('zc_token');
    stopPoll();
    $('app').classList.remove('show');
    $('chat-view').classList.remove('open');
    $('auth').classList.remove('hidden');
    if (tok) api('logout', { token: tok }).catch(() => {});
    if (!silent) toast('Logged out');
  }

  async function refreshAll() {
    const data = await api('get_profile');
    if (!data.ok) {
      if (data.error) toast(data.error);
      return;
    }
    state.profile = data.profile;
    // resolve my userId via lookup
    const look = await api('lookup_user', { username: data.profile.username });
    if (look.ok) state.myUserId = look.userId;
    await Promise.all([loadFriends(), loadGroups()]);
  }

  async function loadFriends() {
    const data = await api('friend_list');
    if (!data.ok) return;
    state.friends = data.friends || [];
    state.incoming = data.incoming || [];
    state.outgoing = data.outgoing || [];
    renderFriends();
  }

  async function loadGroups() {
    const data = await api('group_list');
    if (!data.ok) return;
    state.groups = data.groups || [];
    renderGroups();
  }

  function renderGroups() {
    const el = $('groups-list');
    if (!state.groups.length) {
      el.innerHTML = '<div class="empty">No groups yet.<br>Create one and invite friends.</div>';
      return;
    }
    el.innerHTML = state.groups.map((g) => {
      const av = g.avatarDataUrl || defaultAvatar(g.name);
      return `<div class="row" data-gid="${g.groupId}">
        <img class="avatar" src="${av}" alt="" />
        <div class="row-info">
          <div class="name">${esc(g.name)}</div>
          <div class="meta">${g.memberCount || 0} members</div>
        </div>
        <span class="pill">Open</span>
      </div>`;
    }).join('');
    el.querySelectorAll('.row').forEach((row) => {
      row.onclick = () => openChat({ kind: 'group', id: row.dataset.gid, title: row.querySelector('.name').textContent, avatar: row.querySelector('img').src });
    });
  }

  function renderFriends() {
    const el = $('friends-list');
    let html = '';
    if (state.incoming.length) {
      html += '<div class="section-label">Requests</div>';
      state.incoming.forEach((f) => {
        html += `<div class="row">
          <img class="avatar" src="${f.avatarDataUrl || defaultAvatar(f.displayName)}" />
          <div class="row-info"><div class="name">${esc(f.displayName)}</div><div class="meta">@${esc(f.username)}</div></div>
          <button class="small-btn accent" data-accept="${f.userId}">Accept</button>
          <button class="small-btn" data-decline="${f.userId}">No</button>
        </div>`;
      });
    }
    if (state.outgoing.length) {
      html += '<div class="section-label">Sent</div>';
      state.outgoing.forEach((f) => {
        html += `<div class="row">
          <img class="avatar" src="${f.avatarDataUrl || defaultAvatar(f.displayName)}" />
          <div class="row-info"><div class="name">${esc(f.displayName)}</div><div class="meta">Pending…</div></div>
        </div>`;
      });
    }
    html += '<div class="section-label">Friends</div>';
    if (!state.friends.length) {
      html += '<div class="empty">No friends yet. Add someone by username.</div>';
    } else {
      state.friends.forEach((f) => {
        html += `<div class="row" data-dm="${f.userId}">
          <img class="avatar" src="${f.avatarDataUrl || defaultAvatar(f.displayName)}" />
          <div class="row-info"><div class="name">${esc(f.displayName)}</div><div class="meta">@${esc(f.username)}</div></div>
          <span class="pill">Message</span>
        </div>`;
      });
    }
    el.innerHTML = html;
    el.querySelectorAll('[data-accept]').forEach((b) => {
      b.onclick = async (e) => {
        e.stopPropagation();
        await api('friend_respond', { fromUserId: b.dataset.accept, accept: true });
        toast('Friend added');
        loadFriends();
      };
    });
    el.querySelectorAll('[data-decline]').forEach((b) => {
      b.onclick = async (e) => {
        e.stopPropagation();
        await api('friend_respond', { fromUserId: b.dataset.decline, accept: false });
        loadFriends();
      };
    });
    el.querySelectorAll('[data-dm]').forEach((row) => {
      row.onclick = async () => {
        const uid = row.dataset.dm;
        const data = await api('dm_open', { userId: uid });
        if (!data.ok) { toast(data.error || 'Could not open DM'); return; }
        openChat({
          kind: 'dm',
          id: data.chatId,
          title: data.other ? data.other.displayName : 'Chat',
          avatar: data.other && data.other.avatarDataUrl ? data.other.avatarDataUrl : defaultAvatar(data.other && data.other.displayName),
        });
      };
    });
  }

  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // tabs
  document.querySelectorAll('.nav-tabs button').forEach((b) => {
    b.onclick = () => {
      document.querySelectorAll('.nav-tabs button').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      document.querySelectorAll('.view').forEach((v) => v.classList.remove('active'));
      $('view-' + b.dataset.tab).classList.add('active');
    };
  });

  // modals
  document.querySelectorAll('[data-close]').forEach((b) => {
    b.onclick = () => $(b.getAttribute('data-close')).classList.remove('open');
  });
  document.querySelectorAll('.overlay').forEach((ov) => {
    ov.addEventListener('click', (e) => { if (e.target === ov) ov.classList.remove('open'); });
  });

  $('btn-create-group').onclick = () => $('modal-create-group').classList.add('open');
  $('btn-add-friend').onclick = () => { $('af-err').textContent = ''; $('modal-add-friend').classList.add('open'); };
  $('btn-profile').onclick = () => openProfile();

  $('cg-submit').onclick = async () => {
    const name = $('cg-name').value.trim();
    if (!name) { toast('Enter a group name'); return; }
    const invite = $('cg-invite').value.split(',').map((s) => s.trim()).filter(Boolean);
    const data = await api('group_create', { name, invite });
    if (!data.ok) { toast(data.error || 'Failed'); return; }
    $('modal-create-group').classList.remove('open');
    $('cg-name').value = '';
    $('cg-invite').value = '';
    toast('Group created');
    loadGroups();
  };

  $('af-submit').onclick = async () => {
    $('af-err').textContent = '';
    const data = await api('friend_request', { username: $('af-user').value.trim() });
    if (!data.ok) { $('af-err').textContent = data.error || 'Failed'; return; }
    $('modal-add-friend').classList.remove('open');
    $('af-user').value = '';
    toast(data.accepted ? 'You are now friends!' : 'Request sent');
    loadFriends();
  };

  function openProfile() {
    const p = state.profile || {};
    $('pf-avatar').src = p.avatarDataUrl || defaultAvatar(p.displayName);
    $('pf-display').value = p.displayName || '';
    $('pf-username').value = p.username || '';
    $('pf-bio').value = p.bio || '';
    $('pf-err').textContent = '';
    $('modal-profile').classList.add('open');
  }

  $('pf-change-photo').onclick = () => $('pf-photo-input').click();
  $('pf-photo-input').onchange = async () => {
    const f = $('pf-photo-input').files[0];
    if (!f) return;
    try {
      const dataUrl = await readImageFile(f, 512, 0.7);
      $('pf-avatar').src = dataUrl;
      $('pf-avatar').dataset.pending = dataUrl;
    } catch { toast('Could not read photo'); }
  };

  $('pf-save').onclick = async () => {
    $('pf-err').textContent = '';
    const body = {
      displayName: $('pf-display').value.trim(),
      bio: $('pf-bio').value.trim(),
      newUsername: $('pf-username').value.trim(),
    };
    if ($('pf-avatar').dataset.pending) body.avatarDataUrl = $('pf-avatar').dataset.pending;
    const data = await api('update_profile', body);
    if (!data.ok) { $('pf-err').textContent = data.error || 'Save failed'; return; }
    state.profile = data.profile;
    delete $('pf-avatar').dataset.pending;
    toast('Profile saved');
    $('modal-profile').classList.remove('open');
  };

  $('btn-logout').onclick = () => logout();

  // ----- Chat -----
  async function openChat(meta) {
    state.chatId = meta.id;
    state.chatKind = meta.kind;
    state.chatMeta = meta;
    $('chat-title').textContent = meta.title || 'Chat';
    $('chat-avatar').src = meta.avatar || defaultAvatar(meta.title);
    $('chat-view').classList.add('open');
    $('composer-input').value = '';
    clearPendingImage();
    await pullMessages(true);
    startPoll();
  }

  function closeChat() {
    stopPoll();
    state.chatId = null;
    $('chat-view').classList.remove('open');
    loadGroups();
  }

  $('chat-back').onclick = closeChat;

  async function pullMessages(scrollEnd) {
    if (!state.chatId) return;
    const data = await api('messages_get', { chatId: state.chatId });
    if (!data.ok) return;
    const box = $('chat-messages');
    const nearBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    state.messages = data.messages || [];
    renderMessages();
    if (scrollEnd || nearBottom) box.scrollTop = box.scrollHeight;
  }

  function renderMessages() {
    const box = $('chat-messages');
    const me = state.myUserId;
    box.innerHTML = state.messages.map((m) => {
      const mine = m.senderId === me;
      const who = m.sender ? (m.sender.displayName || m.sender.username) : '';
      const img = m.imageDataUrl
        ? `<img class="attach" src="${m.imageDataUrl}" alt="photo" data-full="${m.imageDataUrl}" />`
        : '';
      const text = m.text ? esc(m.text) : '';
      return `<div class="msg ${mine ? 'me' : 'them'}">
        ${!mine ? `<div class="who">${esc(who)}</div>` : ''}
        ${text}${img}
        <div class="time">${timeStr(m.at)}</div>
      </div>`;
    }).join('');
    box.querySelectorAll('img.attach').forEach((img) => {
      img.onclick = () => {
        $('lightbox-img').src = img.dataset.full;
        $('lightbox').classList.add('open');
      };
    });
  }

  $('lightbox').onclick = () => $('lightbox').classList.remove('open');

  function startPoll() {
    stopPoll();
    state.pollTimer = setInterval(() => pullMessages(false), 2500);
  }
  function stopPoll() {
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  }

  $('btn-pick-photo').onclick = () => $('photo-input').click();
  $('photo-input').onchange = async () => {
    const f = $('photo-input').files[0];
    $('photo-input').value = '';
    if (!f) return;
    try {
      state.pendingImage = await readImageFile(f, 1280, 0.72);
      $('img-preview').src = state.pendingImage;
      $('img-preview-bar').classList.add('show');
    } catch { toast('Could not load photo'); }
  };
  function clearPendingImage() {
    state.pendingImage = null;
    $('img-preview-bar').classList.remove('show');
    $('img-preview').src = '';
  }
  $('img-preview-clear').onclick = clearPendingImage;

  async function sendMessage() {
    const text = $('composer-input').value.trim();
    const imageDataUrl = state.pendingImage;
    if (!text && !imageDataUrl) return;
    if (!state.chatId) return;
    $('btn-send').disabled = true;
    try {
      const data = await api('messages_send', { chatId: state.chatId, text, imageDataUrl });
      if (!data.ok) { toast(data.error || 'Send failed'); return; }
      $('composer-input').value = '';
      clearPendingImage();
      if (data.message) {
        state.messages.push(data.message);
        renderMessages();
        $('chat-messages').scrollTop = $('chat-messages').scrollHeight;
      } else {
        await pullMessages(true);
      }
    } finally {
      $('btn-send').disabled = false;
    }
  }

  $('btn-send').onclick = sendMessage;
  $('composer-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // group info
  $('chat-info').onclick = async () => {
    if (state.chatKind !== 'group') {
      toast('Direct message');
      return;
    }
    const data = await api('group_get', { groupId: state.chatId });
    if (!data.ok) { toast(data.error || 'Failed'); return; }
    $('gi-title').textContent = data.group.name;
    $('gi-members').innerHTML = '<div class="section-label">Members</div>' + (data.members || []).map((m) => {
      return `<div class="row" style="margin-bottom:6px">
        <img class="avatar sm" src="${m.avatarDataUrl || defaultAvatar(m.displayName)}" />
        <div class="row-info"><div class="name">${esc(m.displayName)}${m.isOwner ? ' · owner' : ''}</div>
        <div class="meta">@${esc(m.username)}</div></div>
      </div>`;
    }).join('');
    $('modal-group-info').classList.add('open');
  };

  $('gi-invite-btn').onclick = async () => {
    const data = await api('group_invite', { groupId: state.chatId, username: $('gi-invite').value.trim() });
    if (!data.ok) { toast(data.error || 'Invite failed'); return; }
    $('gi-invite').value = '';
    toast('Added to group');
    $('chat-info').click();
  };

  $('gi-leave').onclick = async () => {
    if (!confirm('Leave this group?')) return;
    const data = await api('group_leave', { groupId: state.chatId });
    if (!data.ok) { toast(data.error || 'Failed'); return; }
    $('modal-group-info').classList.remove('open');
    closeChat();
    toast('Left group');
  };

  // boot
  (async () => {
    if (API.includes('YOUR-WORKER')) {
      console.warn('Set your Cloudflare Worker URL in API constant');
    }
    if (state.token) {
      const data = await api('get_profile');
      if (data.ok) {
        state.profile = data.profile;
        await enterApp();
        return;
      }
      localStorage.removeItem('zc_token');
      state.token = null;
    }
  })();
})();
</script>
</body>
</html>
