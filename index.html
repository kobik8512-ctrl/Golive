<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>AI Zoom</title>
  <style>
    :root { --green: #39ff14; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }
    #app { position: fixed; inset: 0; background: #000; }
    .stage { position: absolute; inset: 0; overflow: hidden; background: #111; touch-action: none; }

    #preview {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; background: #111; opacity: 0; transition: opacity .2s;
    }
    #preview.live { opacity: 1; }
    #result {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: contain; background: #000; display: none;
    }
    canvas#work { display: none; }

    .empty {
      position: absolute; inset: 0; z-index: 8;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 28px; text-align: center; background: #111;
    }
    .empty.hide { display: none; }
    .empty h2 { font-size: 22px; font-weight: 800; }
    .empty p { font-size: 13px; color: #aaa; max-width: 300px; line-height: 1.5; }
    .empty .row { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 260px; margin-top: 6px; }
    .empty button {
      width: 100%; padding: 14px; border-radius: 14px; border: none;
      font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .empty .primary { background: var(--green); color: #000; }
    .empty .secondary { background: #222; color: #fff; border: 1px solid #333; }

    .hud-top {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      padding: 12px 16px; padding-top: max(12px, env(safe-area-inset-top));
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
      pointer-events: none;
    }
    .hud-top button { pointer-events: auto; }
    .badge {
      font-size: 15px; font-weight: 700;
      display: inline-flex; align-items: center; gap: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    .badge .check {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--green); color: #000;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900;
    }
    .icons { display: flex; gap: 10px; }
    .icons button {
      width: 40px; height: 40px; border: none; background: transparent;
      color: var(--green); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .zoom-readout {
      position: absolute; left: 0; right: 0; top: 46%;
      transform: translateY(-50%); text-align: center;
      pointer-events: none; z-index: 4;
    }
    .zoom-readout span {
      font-size: 28px; font-weight: 700; color: rgba(255,255,255,.92);
      text-shadow: 0 2px 12px rgba(0,0,0,.9);
    }

    .zoom-bar {
      position: absolute; left: 0; right: 0; bottom: 120px; z-index: 6;
      display: flex; align-items: center; justify-content: center; gap: 14px;
    }
    .zoom-bar button {
      width: 42px; height: 42px; border-radius: 50%;
      border: 2px solid var(--green); background: rgba(0,0,0,.5);
      color: var(--green); font-size: 22px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .zoom-bar .val {
      min-width: 64px; text-align: center; font-size: 18px; font-weight: 700;
      text-shadow: 0 1px 6px #000;
    }

    .controls {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
      padding: 12px 24px 28px;
      padding-bottom: max(28px, env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: space-around;
      background: linear-gradient(to top, rgba(0,0,0,.8), transparent);
    }
    .ctrl {
      width: 54px; height: 54px; border-radius: 50%;
      border: 3px solid var(--green); background: transparent;
      color: var(--green); display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .ctrl.record {
      width: 70px; height: 70px; background: var(--green);
      border-color: var(--green); color: #000;
    }
    .ctrl.record.busy { background: #ff3b30; border-color: #ff3b30; color: #fff; }
    .ctrl svg { width: 24px; height: 24px; }

    .overlay-msg {
      position: absolute; inset: 0; z-index: 20;
      display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: rgba(0,0,0,.75);
      text-align: center; padding: 24px;
    }
    .overlay-msg.show { display: flex; }
    .spinner {
      width: 42px; height: 42px;
      border: 3px solid rgba(57,255,20,.25); border-top-color: var(--green);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .overlay-msg p { font-size: 14px; color: #ccc; }
    .hint {
      position: absolute; bottom: 105px; left: 12px; right: 12px; z-index: 3;
      text-align: center; font-size: 12px; color: rgba(255,255,255,.55);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="stage" id="stage">
      <video id="preview" playsinline muted autoplay webkit-playsinline></video>
      <img id="result" alt="" />
      <canvas id="work"></canvas>

      <div class="empty" id="empty">
        <h2>AI Zoom</h2>
        <p id="empty-msg">Allow camera, or upload a photo to enhance.</p>
        <div class="row">
          <button type="button" class="primary" id="btn-start-cam">Open camera</button>
          <button type="button" class="secondary" id="btn-pick">Upload photo</button>
        </div>
      </div>

      <div class="hud-top">
        <div style="width:40px"></div>
        <div class="badge"><span>100% AI</span><span class="check">✓</span></div>
        <div class="icons">
          <button type="button" id="btn-upload" title="Upload">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.5"/><path d="M21 15l-5-5-4 4-2-2-5 5"/></svg>
          </button>
          <button type="button" id="btn-settings" title="Strength">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
          </button>
        </div>
      </div>

      <div class="zoom-readout"><span id="zoom-label">1.0x</span></div>
      <div class="zoom-bar">
        <button type="button" id="zoom-out">−</button>
        <div class="val" id="zoom-val">1.0x</div>
        <button type="button" id="zoom-in">+</button>
      </div>
      <p class="hint" id="hint"></p>

      <div class="controls">
        <button type="button" class="ctrl" id="btn-flip" title="Flip">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </button>
        <button type="button" class="ctrl record" id="btn-enhance" title="Enhance">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2zm6 10l.9 2.6L22 16l-3.1.9L18 20l-.9-3.1L14 16l3.1-.9L18 12zM6 14l.8 2.2L9 17l-2.2.8L6 20l-.8-2.2L3 17l2.2-.8L6 14z"/></svg>
        </button>
        <button type="button" class="ctrl" id="btn-reset" title="Reset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.5 15a9 9 0 103-9.7L1 10"/></svg>
        </button>
      </div>

      <div class="overlay-msg" id="loading">
        <div class="spinner"></div>
        <p id="load-text">AI enhancing…</p>
      </div>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" style="display:none" />

  <script>
    const $ = (id) => document.getElementById(id);
    const preview = $('preview');
    const result = $('result');
    const work = $('work');
    const ctx = work.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let facing = 'environment';
    let zoom = 1;
    let sourceMode = null;
    let stillBitmap = null;
    let strength = 1.4;
    let cameraReady = false;

    function isSecure() {
      return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    }

    function setZoom(z) {
      zoom = Math.max(1, Math.min(20, Math.round(z * 10) / 10));
      $('zoom-label').textContent = zoom.toFixed(1) + 'x';
      $('zoom-val').textContent = zoom.toFixed(1) + 'x';
      applyView();
    }

    function showEmpty(msg) {
      $('empty').classList.remove('hide');
      if (msg) $('empty-msg').innerHTML = msg;
      preview.classList.remove('live');
      result.style.display = 'none';
    }
    function hideEmpty() { $('empty').classList.add('hide'); }

    function applyView() {
      if (sourceMode === 'camera' && stream && cameraReady) {
        preview.classList.add('live');
        preview.style.display = 'block';
        result.style.display = 'none';
        preview.style.transform = 'scale(' + Math.max(1, zoom) + ')';
        preview.style.transformOrigin = 'center center';
        try {
          const track = stream.getVideoTracks()[0];
          const caps = track.getCapabilities && track.getCapabilities();
          if (caps && caps.zoom) {
            const z = Math.min(caps.zoom.max, Math.max(caps.zoom.min, zoom));
            track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function(){});
          }
        } catch (e) {}
      } else if (sourceMode === 'image' && stillBitmap) {
        drawStill(false);
      }
    }

    function drawStill(doEnhance) {
      const img = stillBitmap;
      if (!img) return;
      const vw = Math.max(320, window.innerWidth);
      const vh = Math.max(480, window.innerHeight);
      const iw = img.naturalWidth || img.width || img.videoWidth;
      const ih = img.naturalHeight || img.height || img.videoHeight;
      if (!iw || !ih) return;

      const cropW = iw / zoom;
      const cropH = ih / zoom;
      const sx = (iw - cropW) / 2;
      const sy = (ih - cropH) / 2;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      work.width = Math.floor(vw * dpr);
      work.height = Math.floor(vh * dpr);
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, work.width, work.height);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, vw, vh);
      ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, vw, vh);

      if (doEnhance) {
        enhanceCanvas(strength);
        if (zoom >= 5) enhanceCanvas(strength * 0.85);
      }

      result.src = work.toDataURL('image/jpeg', 0.92);
      result.style.display = 'block';
      preview.classList.remove('live');
      preview.style.display = 'none';
      hideEmpty();
    }

    function enhanceCanvas(str) {
      var imageData = ctx.getImageData(0, 0, work.width, work.height);
      imageData = unsharp(imageData, 1.15 * str);
      imageData = contrast(imageData, 1 + 0.16 * str);
      imageData = sharpen(imageData, 0.5 * str);
      imageData = liftShadows(imageData, 10 * str);
      ctx.putImageData(imageData, 0, 0);
    }

    function unsharp(imageData, amount) {
      return convolute(imageData, [0, -amount, 0, -amount, 1 + 4 * amount, -amount, 0, -amount, 0], 1);
    }
    function sharpen(imageData, amount) {
      return convolute(imageData, [0, -1, 0, -1, 5, -1, 0, -1, 0], amount);
    }
    function contrast(imageData, factor) {
      var d = imageData.data, out = new Uint8ClampedArray(d.length);
      for (var i = 0; i < d.length; i += 4) {
        out[i] = (d[i] - 128) * factor + 128;
        out[i + 1] = (d[i + 1] - 128) * factor + 128;
        out[i + 2] = (d[i + 2] - 128) * factor + 128;
        out[i + 3] = d[i + 3];
      }
      return new ImageData(out, imageData.width, imageData.height);
    }
    function liftShadows(imageData, lift) {
      var d = imageData.data, out = new Uint8ClampedArray(d.length);
      for (var i = 0; i < d.length; i += 4) {
        var lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        var t = Math.max(0, 1 - lum / 100);
        out[i] = d[i] + lift * t;
        out[i + 1] = d[i + 1] + lift * t;
        out[i + 2] = d[i + 2] + lift * t;
        out[i + 3] = d[i + 3];
      }
      return new ImageData(out, imageData.width, imageData.height);
    }
    function convolute(imageData, weights, amount) {
      var w = imageData.width, h = imageData.height, src = imageData.data;
      var out = new Uint8ClampedArray(src.length);
      var side = 3, half = 1, amt = Math.max(0, Math.min(1, amount));
      for (var y = 0; y < h; y++) {
        for (var x = 0; x < w; x++) {
          var r = 0, g = 0, b = 0;
          for (var cy = 0; cy < side; cy++) {
            for (var cx = 0; cx < side; cx++) {
              var scx = Math.min(w - 1, Math.max(0, x + cx - half));
              var scy = Math.min(h - 1, Math.max(0, y + cy - half));
              var wt = weights[cy * side + cx];
              var i = (scy * w + scx) * 4;
              r += src[i] * wt; g += src[i + 1] * wt; b += src[i + 2] * wt;
            }
          }
          var i = (y * w + x) * 4;
          out[i] = src[i] * (1 - amt) + r * amt;
          out[i + 1] = src[i + 1] * (1 - amt) + g * amt;
          out[i + 2] = src[i + 2] * (1 - amt) + b * amt;
          out[i + 3] = src[i + 3];
        }
      }
      return new ImageData(out, w, h);
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(function(t) { t.stop(); });
        stream = null;
      }
      preview.srcObject = null;
      preview.classList.remove('live');
      cameraReady = false;
    }

    async function startCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showEmpty('This browser does not support camera. Use <b>Upload photo</b>.');
        return false;
      }
      if (!isSecure()) {
        showEmpty('Camera needs <b>https://</b> (GitHub Pages works).<br>You are on <b>' + location.protocol + '</b>.<br><br>Use <b>Upload photo</b> for now.');
        return false;
      }

      stopCamera();
      $('hint').textContent = 'Requesting camera…';

      var tries = [
        { video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
        { video: { facingMode: facing }, audio: false },
        { video: true, audio: false }
      ];
      var lastErr = null;
      for (var i = 0; i < tries.length; i++) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(tries[i]);
          break;
        } catch (e) { lastErr = e; }
      }

      if (!stream) {
        var name = lastErr && lastErr.name ? lastErr.name : 'Error';
        var msg = 'Camera blocked (' + name + ').';
        if (name === 'NotAllowedError' || name === 'PermissionDeniedError') {
          msg = 'Camera permission denied.<br>Allow camera in browser settings, or use <b>Upload photo</b>.';
        } else if (name === 'NotFoundError') {
          msg = 'No camera found. Use <b>Upload photo</b>.';
        }
        showEmpty(msg);
        $('hint').textContent = '';
        return false;
      }

      preview.style.display = 'block';
      preview.srcObject = stream;
      preview.muted = true;
      try { await preview.play(); } catch (e) {}

      await new Promise(function(resolve) {
        if (preview.videoWidth > 0) return resolve();
        var onMeta = function() {
          preview.removeEventListener('loadedmetadata', onMeta);
          resolve();
        };
        preview.addEventListener('loadedmetadata', onMeta);
        setTimeout(resolve, 2500);
      });

      cameraReady = preview.videoWidth > 0;
      if (!cameraReady) {
        showEmpty('Camera opened but no video. Try again or <b>Upload photo</b>.');
        return false;
      }

      sourceMode = 'camera';
      stillBitmap = null;
      result.style.display = 'none';
      hideEmpty();
      preview.classList.add('live');
      setZoom(1);
      $('hint').textContent = 'Zoom, then tap green to enhance';
      return true;
    }

    function captureFrame() {
      if (!preview.videoWidth) return null;
      var c = document.createElement('canvas');
      c.width = preview.videoWidth;
      c.height = preview.videoHeight;
      c.getContext('2d').drawImage(preview, 0, 0);
      return c;
    }

    async function runEnhance() {
      $('loading').classList.add('show');
      $('load-text').textContent = zoom > 4 ? 'AI enhancing zoom…' : 'AI unblurring…';
      $('btn-enhance').classList.add('busy');
      await new Promise(function(r) { setTimeout(r, 40); });

      try {
        if (sourceMode === 'camera') {
          if (!cameraReady || !preview.videoWidth) throw new Error('Camera not ready');
          var frame = captureFrame();
          if (!frame) throw new Error('No frame');
          stillBitmap = frame;
          sourceMode = 'image';
          stopCamera();
        }
        if (!stillBitmap) throw new Error('No image');
        drawStill(true);
        $('hint').textContent = 'Enhanced · Reset to start over';
      } catch (e) {
        $('hint').textContent = 'Enhance failed — open camera or upload first';
        if (!stillBitmap && !cameraReady) {
          showEmpty('Nothing to enhance yet. Open camera or upload a photo.');
        }
      } finally {
        $('loading').classList.remove('show');
        $('btn-enhance').classList.remove('busy');
      }
    }

    function loadFile(file) {
      if (!file) return;
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function() {
        stillBitmap = img;
        sourceMode = 'image';
        stopCamera();
        preview.style.display = 'none';
        hideEmpty();
        setZoom(1);
        drawStill(false);
        $('hint').textContent = 'Zoom in, then tap green to unblur';
      };
      img.onerror = function() {
        showEmpty('Could not read that image. Try another photo.');
      };
      img.src = url;
    }

    $('btn-start-cam').onclick = function() { startCamera(); };
    $('btn-pick').onclick = function() { $('file').click(); };
    $('btn-upload').onclick = function() { $('file').click(); };
    $('file').onchange = function() {
      var f = $('file').files[0];
      $('file').value = '';
      loadFile(f);
    };
    $('zoom-in').onclick = function() { setZoom(zoom + (zoom < 5 ? 0.5 : 1)); };
    $('zoom-out').onclick = function() { setZoom(zoom - (zoom <= 5 ? 0.5 : 1)); };
    $('btn-enhance').onclick = runEnhance;
    $('btn-reset').onclick = async function() {
      stillBitmap = null;
      result.style.display = 'none';
      result.removeAttribute('src');
      setZoom(1);
      var ok = await startCamera();
      if (!ok) showEmpty();
    };
    $('btn-flip').onclick = async function() {
      facing = facing === 'environment' ? 'user' : 'environment';
      stillBitmap = null;
      await startCamera();
    };
    $('btn-settings').onclick = function() {
      strength = strength < 1.2 ? 1.4 : strength < 1.55 ? 1.8 : 1.1;
      $('hint').textContent = 'Strength: ' + (strength < 1.2 ? 'Soft' : strength < 1.55 ? 'Normal' : 'Strong');
    };

    var pinchStart = null;
    $('stage').addEventListener('touchstart', function(e) {
      if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        pinchStart = { dist: Math.hypot(dx, dy), zoom: zoom };
      }
    }, { passive: true });
    $('stage').addEventListener('touchmove', function(e) {
      if (e.touches.length === 2 && pinchStart) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        setZoom(pinchStart.zoom * (Math.hypot(dx, dy) / pinchStart.dist));
      }
    }, { passive: true });
    $('stage').addEventListener('touchend', function() { pinchStart = null; }, { passive: true });
    $('stage').addEventListener('wheel', function(e) {
      e.preventDefault();
      setZoom(zoom + (e.deltaY < 0 ? 0.5 : -0.5));
    }, { passive: false });

    if (!isSecure()) {
      showEmpty('Camera needs <b>https://</b> (open from github.io).<br>You are on <b>' + location.protocol + '</b>. Use <b>Upload photo</b>.');
    } else {
      startCamera();
    }
  </script>
</body>
</html>
