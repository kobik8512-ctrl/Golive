<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Go Live</title>
  <style>
    :root {
      --bg: #0a0a0c;
      --card: #16161a;
      --card2: #1c1c22;
      --accent: #ff2d55;
      --text: #f2f2f5;
      --muted: #8b8b96;
      --green: #30d158;
      --danger: #ff453a;
      --border: #2a2a32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { cursor: pointer; border: none; font-family: inherit; background: none; color: inherit; }
    input { font-family: inherit; }

    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* LOGIN */
    #login-screen {
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1a0a12 0%, var(--bg) 60%);
    }
    .login-box { width: 100%; max-width: 360px; text-align: center; }
    .login-logo { font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    .login-logo span { color: var(--accent); }
    .login-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 40px; }
    .btn-google {
      width: 100%;
      background: #fff;
      color: #1f1f1f;
      padding: 14px 20px;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.6; }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
    .login-note { margin-top: 24px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }

    /* MENU */
    #menu { padding: 20px 16px 160px; }
    .broadcast-label {
      font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 6px;
    }
    .menu-title { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
    .menu-title span { color: var(--accent); }
    .signed-in { font-size: 0.95rem; color: var(--muted); margin-bottom: 28px; }
    .signed-in strong { color: var(--green); font-weight: 600; }

    .section-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 1.2px;
      color: var(--muted); text-transform: uppercase; margin-bottom: 12px;
    }
    .lives-list { display: flex; flex-direction: column; gap: 10px; }
    .live-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 16px; padding: 14px 14px 14px 16px;
      display: flex; align-items: center; gap: 12px;
    }
    .live-info { flex: 1; min-width: 0; }
    .live-name { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-meta { font-size: 0.82rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
    .live-meta .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }
    .btn-join {
      background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem;
      padding: 10px 18px; border-radius: 999px; flex-shrink: 0;
    }
    .btn-join:active { transform: scale(0.96); }
    .btn-x-small {
      width: 32px; height: 32px; border-radius: 50%; background: var(--card2);
      color: var(--muted); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .empty-state {
      text-align: center; padding: 48px 20px; color: var(--muted);
      background: var(--card); border-radius: 16px; border: 1px dashed var(--border);
      font-size: 0.95rem; line-height: 1.5;
    }

    .bottom-actions {
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 16px 16px 28px;
      background: linear-gradient(transparent, var(--bg) 25%);
      display: flex; flex-direction: column; gap: 10px; z-index: 30;
    }
    .btn-go-live {
      background: var(--accent); color: #fff; font-size: 1.15rem; font-weight: 700;
      padding: 16px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: 0 8px 28px rgba(255, 45, 85, 0.35);
    }
    .btn-go-live:active { transform: scale(0.98); }
    .btn-secondary {
      background: transparent; color: var(--muted); font-size: 0.95rem; font-weight: 500;
      padding: 12px; border-radius: 999px; border: 1px solid var(--border);
    }
    .btn-secondary:active { background: var(--card); }

    /* LIVE ROOM */
    #live-room {
      position: relative; background: #000;
      height: 100vh; height: 100dvh; overflow: hidden;
    }
    #video-wrap {
      position: absolute; inset: 0; background: #0d0d10;
      display: flex; align-items: center; justify-content: center;
    }
    #local-video { width: 100%; height: 100%; object-fit: cover; display: none; }
    .cam-off { text-align: center; color: var(--muted); }
    .cam-off .icon { font-size: 3.5rem; margin-bottom: 10px; opacity: 0.5; }

    .live-header {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 12px 12px 0; display: flex; justify-content: space-between;
      align-items: flex-start; z-index: 40; pointer-events: none;
    }
    .live-header > * { pointer-events: auto; }

    .live-pill {
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 999px; padding: 8px 14px; display: flex; align-items: center; gap: 8px;
      font-size: 0.88rem; font-weight: 600; max-width: 70%;
    }
    .live-pill .red-dot {
      width: 8px; height: 8px; background: var(--accent); border-radius: 50%;
      animation: blink 1.4s infinite; flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .live-pill .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-pill .watchers { color: var(--muted); font-weight: 500; white-space: nowrap; }

    .header-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08); color: #fff; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.muted { background: var(--danger); border-color: transparent; }
    .icon-btn.b-btn {
      background: linear-gradient(135deg, #7c3aed, #06b6d4);
      font-weight: 800; font-size: 0.95rem; border: none;
    }

    .chat-wrap {
      position: absolute; bottom: 0; left: 0; right: 0; height: 48%;
      display: flex; flex-direction: column;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 40%, transparent);
      z-index: 30; pointer-events: none;
    }
    .chat-list {
      flex: 1; overflow-y: auto; padding: 16px 14px 10px;
      display: flex; flex-direction: column; gap: 5px; pointer-events: auto; scrollbar-width: none;
    }
    .chat-list::-webkit-scrollbar { display: none; }

    .msg { font-size: 0.92rem; line-height: 1.35; animation: msgIn 0.2s ease; word-break: break-word; }
    @keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    .msg .uname { font-weight: 700; margin-right: 6px; }
    .msg .c0{color:#ff6b9d} .msg .c1{color:#5ac8fa} .msg .c2{color:#30d158}
    .msg .c3{color:#ffd60a} .msg .c4{color:#bf5af2} .msg .c5{color:#ff9f0a}
    .msg .c6{color:#64d2ff} .msg .c7{color:#ff375f}
    .msg.host .uname { color: var(--accent); }

    .chat-bar {
      display: flex; gap: 10px; padding: 8px 12px 20px;
      pointer-events: auto; align-items: center;
    }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px; padding: 13px 18px; color: #fff; font-size: 0.95rem; outline: none;
    }
    #chat-input::placeholder { color: rgba(255,255,255,0.4); }
    .btn-send {
      background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem;
      padding: 13px 20px; border-radius: 999px; flex-shrink: 0;
    }
    .btn-send:active { transform: scale(0.96); }

    .mic-status {
      position: absolute; bottom: 52%; left: 14px; font-size: 0.8rem;
      color: var(--green); z-index: 25; pointer-events: none; opacity: 0.85;
    }

    /* Modal */
    #title-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
    }
    #title-modal.show { display: flex; }
    .modal-card {
      background: var(--card); border-radius: 20px; padding: 28px 22px;
      width: 100%; max-width: 340px; border: 1px solid var(--border);
    }
    .modal-card h3 { text-align: center; font-size: 1.2rem; margin-bottom: 18px; }
    #title-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 1rem; margin-bottom: 16px; outline: none;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; padding: 13px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; }
    .btn-cancel { background: var(--card2); color: var(--text); }
    .btn-confirm { background: var(--accent); color: #fff; }

    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-12px);
      background: rgba(20,20,24,0.92); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 0.88rem; opacity: 0; transition: all 0.28s; z-index: 200; pointer-events: none;
      border: 1px solid var(--border);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="screen active">
    <div class="login-box">
      <div class="login-logo">GO <span>LIVE</span></div>
      <div class="login-sub">Broadcast & join lives</div>
      <button class="btn-google" id="btn-google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>
        Continue with Google
      </button>
      <div class="login-note">Real Google login powered by Firebase</div>
    </div>
  </div>

  <!-- MENU -->
  <div id="menu" class="screen">
    <div class="broadcast-label">Broadcast</div>
    <div class="menu-title">GO <span>LIVE</span></div>
    <div class="signed-in">Signed in as <strong id="display-name">—</strong></div>

    <div class="section-label">Live now</div>
    <div class="lives-list" id="lives-list">
      <div class="empty-state" id="empty-state">No one is live right now.<br>Be the first to go live!</div>
    </div>

    <div class="bottom-actions">
      <button class="btn-go-live" id="btn-go-live">● Go Live</button>
      <button class="btn-secondary" id="btn-clear">Clear stuck lives</button>
      <button class="btn-secondary" id="btn-signout">Sign out</button>
    </div>
  </div>

  <!-- LIVE ROOM -->
  <div id="live-room" class="screen">
    <div id="video-wrap">
      <video id="local-video" autoplay playsinline muted></video>
      <div class="cam-off" id="cam-off">
        <div class="icon">📷</div>
        <div>Camera off</div>
      </div>
    </div>

    <div class="live-header">
      <div class="live-pill">
        <div class="red-dot"></div>
        <span class="title-text" id="live-title-text">LIVE</span>
        <span class="watchers" id="watchers-text">0 watching</span>
      </div>
      <div class="header-btns">
        <button class="icon-btn b-btn" id="btn-b" style="display:none;" title="Add bot">B</button>
        <button class="icon-btn" id="btn-mic" title="Mute">🔇</button>
        <button class="icon-btn" id="btn-flip" title="Flip camera">🔄</button>
        <button class="icon-btn" id="btn-leave" title="Leave">✕</button>
      </div>
    </div>

    <div class="mic-status" id="mic-status">Mic: listening...</div>

    <div class="chat-wrap">
      <div class="chat-list" id="chat-list"></div>
      <div class="chat-bar">
        <input type="text" id="chat-input" placeholder="Say something..." maxlength="140" autocomplete="off" />
        <button class="btn-send" id="btn-send">Send</button>
      </div>
    </div>
  </div>

  <!-- Title modal -->
  <div id="title-modal">
    <div class="modal-card">
      <h3>Name your live</h3>
      <input type="text" id="title-input" placeholder="e.g. my live" maxlength="40" />
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel">Cancel</button>
        <button class="btn-confirm" id="btn-start">Start Live</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDaQ06E5Zvj6M9XnqOpWgmUsbe5T_EnaPo",
      authDomain: "golive-ff5ad.firebaseapp.com",
      projectId: "golive-ff5ad",
      storageBucket: "golive-ff5ad.firebasestorage.app",
      messagingSenderId: "994701431927",
      appId: "1:994701431927:web:4e7615434facc5b54ae272",
      measurementId: "G-Q99XRZG8EG"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // ================== CONFIG ==================
    const SPECIAL_EMAIL = 'kobik8512@gmail.com';

    // ================== STATE ==================
    let user = null;
    let isHost = false;
    let liveTitle = '';
    let stream = null;
    let facingMode = 'user';
    let isMuted = false;

    let botCount = 0;
    let realViewers = 0;
    let botTimer = null;
    let chatTimer = null;
    let realTimer = null;
    let activeLives = [];

    // ================== NAME / MESSAGE POOLS ==================
    const adjs = ['Cool','Epic','Pro','Shadow','Neon','Cyber','Swift','Fire','Ice','Nova','Turbo','Elite','Ace','Ninja','Pixel','Lucky','Wild','Silent','Blaze','Ghost','Royal','Crystal','Golden','Omega','Alpha','Hyper','Magic','Storm','Jade','Violet'];
    const nouns = ['Gamer','Player','Stream','Live','Chat','Fan','Master','Legend','Hero','Star','Soul','Wave','Blade','Flash','Coder','Dev','Cat','Dog','Panda','Wolf','Dragon','Fox','Tiger','Shark','Raven','Owl','Bro','Kid','Pro','Chad'];
    const tags = ['', '123', '99', 'X', 'XX', '69', '420', 'YT', 'TV', 'GG', 'OP', 'Live', 'Pro', '77', '01'];

    const phrases = [
      'w','W','WW','www','W W','lets go','LETS GO','lets goo','hi','hello','hey','yo','sup',
      'first','FIRST','nice stream','great stream','fire','🔥','🔥🔥','💯','👏','❤️','😂','🤣',
      'lmao','lol','haha','this is good','love this','keep going','what game?','audio good?',
      'new here','just joined','pog','POG','based','cringe','mid','ratio','L','W',
      'drop a like','anyone else?','chat is wild','so many people','nice cam','good lighting',
      'what mic?','rate 1-10','10/10','clip that','main character','aura','rizz','no cap','fr',
      'sheesh','yooo','bussin','lowkey','highkey','goated','cooked','skill issue','git gud',
      'I was here from start','algorithm brought me','fyp','this needs more viewers',
      'someone screenshot','history being made','bots going crazy','view count brrr',
      'chat exploding','help chat too fast','peak internet','absolute cinema','huge W',
      'new favorite','bookmarking','say my name','hi from the future','2026 is wild',
      'pushup challenge','hello host','random recommend','mic check','can you hear me',
      'where you from?','how long live?','sub?','gifted','thanks for stream','gotta go',
      'bye chat','hype train','choo choo','mod?','ban him','setup clean','PC or console?',
      'better than twitch','who else watching?','raise hand','day 1 viewer','recommended',
      'share the stream','instant classic','emotional damage','plot twist','respect',
      'who is this?','typing so you notice','can you say hi?','I\'m early','early gang'
    ];
    const fillers = ['omg','bruh','dude','bro','fam','chat','guys','real talk','no lie','for real','tbh','ngl','fr','idk','imo','literally','basically','kinda','lowkey','highkey','sheesh','yooo','ayy','bussin','cooked','raw','mid','goated'];

    function rand(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function makeName() {
      return rand(adjs) + rand(nouns) + rand(tags) + (Math.random() < 0.35 ? Math.floor(Math.random()*900+100) : '');
    }
    function makeMsg() {
      if (Math.random() < 0.6) return rand(phrases);
      const parts = [];
      const n = 1 + Math.floor(Math.random()*3);
      for (let i=0;i<n;i++) parts.push(Math.random()<0.55 ? rand(phrases) : rand(fillers));
      if (Math.random()<0.25) parts.push(String(Math.floor(Math.random()*99)));
      return parts.join(' ').slice(0,90);
    }

    const NAME_POOL = new Set();
    while (NAME_POOL.size < 4000) NAME_POOL.add(makeName());
    const NAMES = [...NAME_POOL];
    const MSG_POOL = new Set();
    while (MSG_POOL.size < 6000) MSG_POOL.add(makeMsg());
    const MSGS = [...MSG_POOL];

    let ni = 0, mi = 0;
    function nextName() {
      const n = NAMES[ni % NAMES.length];
      ni++;
      return ni > NAMES.length ? n + Math.floor(Math.random()*50) : n;
    }
    function nextMsg() {
      const m = MSGS[mi % MSGS.length];
      mi++;
      return mi > MSGS.length && Math.random()<0.3 ? m + ' ' + Math.floor(Math.random()*99) : m;
    }

    // ================== HELPERS ==================
    function toast(txt, ms=1600) {
      const el = document.getElementById('toast');
      el.textContent = txt;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), ms);
    }
    function show(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function colorClass(name) {
      let h = 0;
      for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
      return 'c' + (h % 8);
    }

    // ================== AUTH (Firebase Google) ==================
    const btnGoogle = document.getElementById('btn-google');

    btnGoogle.onclick = async () => {
      btnGoogle.disabled = true;
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        console.error(err);
        toast(err.code === 'auth/popup-closed-by-user' ? 'Login cancelled' : (err.message || 'Login failed'));
        btnGoogle.disabled = false;
      }
    };

    onAuthStateChanged(auth, (firebaseUser) => {
      if (firebaseUser) {
        user = {
          name: firebaseUser.displayName || (firebaseUser.email ? firebaseUser.email.split('@')[0] : 'User'),
          email: firebaseUser.email || '',
          picture: firebaseUser.photoURL
        };
        document.getElementById('display-name').textContent = user.name;
        show('menu');
        renderLives();
        toast('Signed in as ' + user.name);
        btnGoogle.disabled = false;
      } else {
        user = null;
        show('login-screen');
        btnGoogle.disabled = false;
      }
    });

    document.getElementById('btn-signout').onclick = async () => {
      try {
        await signOut(auth);
        toast('Signed out');
      } catch (e) {
        toast('Sign out failed');
      }
    };

    document.getElementById('btn-clear').onclick = () => {
      activeLives = [];
      renderLives();
      toast('Cleared');
    };

    // ================== LIVES LIST ==================
    function renderLives() {
      const list = document.getElementById('lives-list');
      const empty = document.getElementById('empty-state');
      list.querySelectorAll('.live-card').forEach(c => c.remove());

      if (!activeLives.length) {
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      activeLives.forEach(live => {
        const card = document.createElement('div');
        card.className = 'live-card';
        card.innerHTML = `
          <div class="live-info">
            <div class="live-name">${esc(live.title)}</div>
            <div class="live-meta">
              <span class="dot"></span>
              ${esc(live.host)} · ${live.viewers} watching
            </div>
          </div>
          <button class="btn-x-small" data-remove="${live.id}">✕</button>
          <button class="btn-join" data-join="${live.id}">Join</button>
        `;
        list.appendChild(card);
      });

      list.querySelectorAll('[data-join]').forEach(btn => {
        btn.onclick = () => {
          const live = activeLives.find(l => l.id === btn.dataset.join);
          if (live) joinViewer(live);
        };
      });
      list.querySelectorAll('[data-remove]').forEach(btn => {
        btn.onclick = () => {
          activeLives = activeLives.filter(l => l.id !== btn.dataset.remove);
          renderLives();
        };
      });
    }

    // ================== GO LIVE ==================
    document.getElementById('btn-go-live').onclick = () => {
      if (!user) return;
      document.getElementById('title-input').value = '';
      document.getElementById('title-modal').classList.add('show');
      setTimeout(() => document.getElementById('title-input').focus(), 80);
    };
    document.getElementById('btn-cancel').onclick = () => {
      document.getElementById('title-modal').classList.remove('show');
    };
    document.getElementById('btn-start').onclick = startLive;
    document.getElementById('title-input').onkeydown = e => { if (e.key==='Enter') startLive(); };

    async function startLive() {
      liveTitle = document.getElementById('title-input').value.trim() || (user.name + "'s Live");
      document.getElementById('title-modal').classList.remove('show');

      isHost = true;
      botCount = 0;
      realViewers = 0;
      ni = 0; mi = 0;
      updateCount();

      const id = 'l' + Date.now();
      activeLives = [{
        id,
        title: liveTitle,
        host: user.name,
        viewers: 0,
        mine: true
      }];
      renderLives();

      const special = user.email && user.email.toLowerCase() === SPECIAL_EMAIL.toLowerCase();
      document.getElementById('btn-b').style.display = special ? 'flex' : 'none';

      document.getElementById('live-title-text').textContent = liveTitle;
      document.getElementById('chat-list').innerHTML = '';
      document.getElementById('mic-status').textContent = 'Mic: listening...';
      document.getElementById('mic-status').style.color = 'var(--green)';

      show('live-room');
      await startCam();

      if (special) startBots();
      startRealSim();
    }

    // ================== CAMERA ==================
    async function startCam() {
      stopCam();
      const vid = document.getElementById('local-video');
      const off = document.getElementById('cam-off');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: true
        });
        vid.srcObject = stream;
        vid.style.display = 'block';
        off.style.display = 'none';
        vid.muted = true;
        isMuted = false;
        document.getElementById('btn-mic').textContent = '🎤';
        document.getElementById('btn-mic').classList.remove('muted');
      } catch (e) {
        vid.style.display = 'none';
        off.style.display = 'block';
        toast('Camera permission denied');
      }
    }
    function stopCam() {
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      document.getElementById('local-video').srcObject = null;
    }

    document.getElementById('btn-mic').onclick = () => {
      if (!isHost || !stream) return;
      isMuted = !isMuted;
      stream.getAudioTracks().forEach(t => t.enabled = !isMuted);
      const btn = document.getElementById('btn-mic');
      btn.textContent = isMuted ? '🔇' : '🎤';
      btn.classList.toggle('muted', isMuted);
      document.getElementById('mic-status').textContent = isMuted ? 'Mic: muted' : 'Mic: listening...';
      document.getElementById('mic-status').style.color = isMuted ? 'var(--danger)' : 'var(--green)';
      toast(isMuted ? 'Muted' : 'Mic on');
    };

    document.getElementById('btn-flip').onclick = async () => {
      if (!isHost) return;
      facingMode = facingMode === 'user' ? 'environment' : 'user';
      await startCam();
      toast(facingMode === 'user' ? 'Front camera' : 'Back camera');
    };

    document.getElementById('btn-leave').onclick = () => stopLive();

    function stopLive() {
      stopCam();
      stopBots();
      stopRealSim();
      isHost = false;
      botCount = 0;
      realViewers = 0;
      activeLives = [];
      renderLives();
      show('menu');
      toast('Live ended');
    }

    function joinViewer(live) {
      isHost = false;
      document.getElementById('btn-b').style.display = 'none';
      document.getElementById('live-title-text').textContent = live.title;
      document.getElementById('chat-list').innerHTML = '';
      document.getElementById('local-video').style.display = 'none';
      document.getElementById('cam-off').style.display = 'block';
      document.getElementById('mic-status').textContent = '';
      updateCountDisplay(live.viewers || 1);
      show('live-room');
      toast('Joined ' + live.title);
    }

    // ================== VIEWER COUNT ==================
    function updateCount() {
      const total = botCount + realViewers;
      updateCountDisplay(total);
      if (activeLives[0]?.mine) activeLives[0].viewers = total;
    }
    function updateCountDisplay(n) {
      document.getElementById('watchers-text').textContent = format(n) + ' watching';
    }
    function format(n) {
      if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
      if (n >= 1000) return (n/1000).toFixed(1) + 'K';
      return String(n);
    }

    // ================== B BUTTON ==================
    document.getElementById('btn-b').onclick = () => {
      if (!isHost || !user || user.email.toLowerCase() !== SPECIAL_EMAIL.toLowerCase()) return;
      addBot();
      toast('+1 bot');
    };

    function addBot() {
      botCount++;
      updateCount();
      if (Math.random() < 0.55) addMsg(nextName(), nextMsg());
    }

    // ================== BOTS (SLOWED) ==================
    function startBots() {
      stopBots();
      botTimer = setTimeout(scheduleJoin, 6000 + Math.random()*6000);
      scheduleChat();
    }
    function stopBots() {
      clearTimeout(botTimer); botTimer = null;
      clearTimeout(chatTimer); chatTimer = null;
    }

    function scheduleJoin() {
      let delay;
      if (botCount < 3)       delay = 8000 + Math.random()*7000;
      else if (botCount < 10) delay = 5000 + Math.random()*5000;
      else if (botCount < 25) delay = 3000 + Math.random()*3000;
      else if (botCount < 60) delay = 1800 + Math.random()*1800;
      else if (botCount < 150) delay = 900 + Math.random()*900;
      else if (botCount < 400) delay = 450 + Math.random()*400;
      else                     delay = 250 + Math.random()*250;

      const burst = botCount > 100 ? (1 + Math.floor(Math.random() * Math.min(3, Math.floor(botCount/120)))) : 1;

      botTimer = setTimeout(() => {
        for (let i=0;i<burst;i++) addBot();
        scheduleJoin();
      }, delay);
    }

    function scheduleChat() {
      let delay;
      if (botCount < 4)       delay = 7000 + Math.random()*8000;
      else if (botCount < 12) delay = 4000 + Math.random()*4000;
      else if (botCount < 30) delay = 2200 + Math.random()*2000;
      else if (botCount < 80) delay = 1200 + Math.random()*1000;
      else if (botCount < 200) delay = 600 + Math.random()*500;
      else if (botCount < 500) delay = 280 + Math.random()*220;
      else                     delay = 140 + Math.random()*140;

      const multi = botCount > 250 ? Math.min(3, 1 + Math.floor(botCount/300)) : 1;

      chatTimer = setTimeout(() => {
        if (botCount > 0) {
          for (let i=0;i<multi;i++) addMsg(nextName(), nextMsg());
        }
        scheduleChat();
      }, delay);
    }

    function startRealSim() {
      stopRealSim();
      realTimer = setInterval(() => {
        if (Math.random() < 0.35) {
          realViewers = Math.max(0, Math.min(8, realViewers + (Math.random()<0.55 ? 1 : -1)));
          updateCount();
        }
      }, 10000 + Math.random()*8000);
    }
    function stopRealSim() {
      clearInterval(realTimer); realTimer = null;
    }

    // ================== CHAT ==================
    function addMsg(name, text, host=false) {
      const list = document.getElementById('chat-list');
      const div = document.createElement('div');
      div.className = 'msg' + (host ? ' host' : '');
      const cls = host ? '' : colorClass(name);
      div.innerHTML = `<span class="uname ${cls}">${esc(name)}</span>${esc(text)}`;
      list.appendChild(div);
      while (list.children.length > 100) list.removeChild(list.firstChild);
      list.scrollTop = list.scrollHeight;
    }

    document.getElementById('btn-send').onclick = sendMsg;
    document.getElementById('chat-input').onkeydown = e => { if (e.key==='Enter') sendMsg(); };

    function sendMsg() {
      const input = document.getElementById('chat-input');
      const t = input.value.trim();
      if (!t) return;
      const name = isHost ? user.name : 'You';
      addMsg(name, t, isHost);
      input.value = '';
    }
  </script>
</body>
</html>
