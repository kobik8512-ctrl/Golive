<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ledger Life — Financial Simulator</title>
<style>

:root {
  --bg: #0a0b0d;
  --panel: #12141a;
  --card: #1a1d27;
  --border: #2a2e3a;
  --text: #e8eaed;
  --muted: #8b92a5;
  --green: #00c853;
  --red: #ff5252;
  --blue: #448aff;
  --gold: #ffc107;
  --purple: #b388ff;
  --cyan: #18ffff;
  --orange: #ff9100;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif;
  overflow: hidden; }
#app { display: flex; flex-direction: column; height: 100%; max-width: 480px; margin: 0 auto; position: relative; }

/* AUTH */
.auth-screen { position: absolute; inset: 0; background: var(--bg); z-index: 100;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
.auth-screen.hidden { display: none; }
.auth-logo { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px; }
.auth-logo span { color: var(--green); }
.auth-sub { color: var(--muted); font-size: 13px; margin-bottom: 28px; text-align: center; max-width: 280px; line-height: 1.4; }
.auth-card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--border);
  border-radius: 16px; padding: 22px; }
.auth-card h2 { font-size: 16px; margin-bottom: 14px; }
.auth-card label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.auth-card input, .auth-card select { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 15px; outline: none; }
.auth-card input:focus { border-color: var(--blue); }
.auth-btn { width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 10px;
  background: var(--green); color: #000; font-weight: 700; font-size: 15px; cursor: pointer; }
.auth-btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 8px; }
.auth-err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
.auth-switch { text-align: center; margin-top: 14px; font-size: 13px; color: var(--muted); }
.auth-switch a { color: var(--blue); cursor: pointer; }

/* TOP BAR */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.topbar .net { font-size: 13px; color: var(--muted); }
.topbar .net b { color: var(--text); font-size: 16px; display: block; }
.topbar .day { font-size: 11px; color: var(--muted); text-align: right; }
.topbar .credit { font-size: 11px; color: var(--gold); }

/* SCREENS */
.screens { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.screen { display: none; padding: 14px 16px 90px; }
.screen.active { display: block; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px; color: var(--muted);
  margin: 16px 0 8px; font-weight: 600; }
.section-title:first-child { margin-top: 0; }

/* CARDS */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
.card-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-row + .card-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.card h3 { font-size: 14px; font-weight: 600; }
.card .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
.card .val { font-size: 15px; font-weight: 700; text-align: right; }
.card .val.pos { color: var(--green); }
.card .val.neg { color: var(--red); }
.card .val.gold { color: var(--gold); }
.card .val.blue { color: var(--blue); }

/* HERO BALANCE */
.hero { background: linear-gradient(135deg, #1a2332 0%, #12141a 100%); border: 1px solid var(--border);
  border-radius: 16px; padding: 18px; margin-bottom: 12px; }
.hero .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
.hero .amount { font-size: 32px; font-weight: 800; margin: 4px 0; letter-spacing: -1px; }
.hero .change { font-size: 13px; }
.hero .change.pos { color: var(--green); }
.hero .change.neg { color: var(--red); }
.hero-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.hero-stat { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 10px; }
.hero-stat .l { font-size: 10px; color: var(--muted); }
.hero-stat .v { font-size: 14px; font-weight: 700; margin-top: 2px; }

/* BUTTONS */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 16px; border-radius: 10px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
.btn-primary { background: var(--green); color: #000; }
.btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn-danger { background: rgba(255,82,82,0.15); color: var(--red); border: 1px solid rgba(255,82,82,0.3); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-block { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12px; }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row .btn { flex: 1; }

/* LIST ITEMS */
.list-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
.list-item:active { background: var(--card); }
.list-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 16px; font-weight: 800; flex-shrink: 0; }
.list-body { flex: 1; min-width: 0; }
.list-body .name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.list-body .sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
.list-right { text-align: right; flex-shrink: 0; }
.list-right .amt { font-size: 14px; font-weight: 700; }
.list-right .chg { font-size: 11px; }

/* NAV */
.bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; background: var(--panel);
  border-top: 1px solid var(--border); display: flex; padding: 6px 4px max(6px, env(safe-area-inset-bottom));
  z-index: 50; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 2px; border: none; background: none; color: var(--muted); font-size: 10px; cursor: pointer; }
.nav-item.active { color: var(--green); }
.nav-item svg { width: 22px; height: 22px; }

/* MODAL */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: none; align-items: flex-end; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--panel); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
  max-height: 85vh; overflow-y: auto; padding: 20px 18px max(20px, env(safe-area-inset-bottom)); }
.modal h2 { font-size: 18px; margin-bottom: 6px; }
.modal .desc { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.4; }
.modal label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; text-transform: uppercase; }
.modal input, .modal select, .modal textarea {
  width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 15px; }
.modal textarea { min-height: 80px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-actions .btn { flex: 1; }

/* NEWS */
.news-item { padding: 12px; border-left: 3px solid var(--blue); background: var(--panel);
  border-radius: 0 10px 10px 0; margin-bottom: 8px; }
.news-item.bad { border-left-color: var(--red); }
.news-item.good { border-left-color: var(--green); }
.news-item .time { font-size: 10px; color: var(--muted); }
.news-item .title { font-size: 13px; font-weight: 600; margin: 3px 0; }
.news-item .body { font-size: 12px; color: var(--muted); line-height: 1.35; }

/* CHART mini */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 32px; }
.spark span { flex: 1; background: var(--green); border-radius: 2px 2px 0 0; opacity: 0.7; min-width: 3px; }

/* TOAST */
.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--card); border: 1px solid var(--border); color: var(--text);
  padding: 12px 18px; border-radius: 12px; font-size: 13px; z-index: 300; opacity: 0;
  transition: all 0.25s; pointer-events: none; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* PROGRESS */
.bar-bg { height: 6px; background: var(--card); border-radius: 3px; overflow: hidden; margin-top: 6px; }
.bar-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s; }

/* TABS inside screen */
.subtabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
.subtab { padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.subtab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

/* BADGE */
.badge { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 10px; font-weight: 700; }
.badge-green { background: rgba(0,200,83,0.15); color: var(--green); }
.badge-red { background: rgba(255,82,82,0.15); color: var(--red); }
.badge-gold { background: rgba(255,193,7,0.15); color: var(--gold); }
.badge-blue { background: rgba(68,138,255,0.15); color: var(--blue); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.muted { color: var(--muted); }
.pos { color: var(--green); }
.neg { color: var(--red); }
.text-sm { font-size: 12px; }
.text-xs { font-size: 11px; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-8 { margin-bottom: 8px; }
.fw-700 { font-weight: 700; }
.hidden { display: none !important; }

/* Job card special */
.job-card { border-left: 3px solid var(--purple); }
.property-card { border-left: 3px solid var(--cyan); }
.biz-card { border-left: 3px solid var(--orange); }

.empty-state { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty-state p { font-size: 13px; margin-top: 8px; line-height: 1.4; }

/* Transaction history */
.tx-item { display: flex; justify-content: space-between; padding: 10px 0;
  border-bottom: 1px solid var(--border); font-size: 13px; }
.tx-item:last-child { border-bottom: none; }
.tx-item .tx-name { font-weight: 500; }
.tx-item .tx-date { font-size: 11px; color: var(--muted); }

/* Credit meter */
.credit-meter { display: flex; align-items: center; gap: 12px; }
.credit-score-num { font-size: 36px; font-weight: 800; }
.credit-label { font-size: 12px; color: var(--muted); }

/* Life event banner */
.life-banner { background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px; margin-bottom: 10px; font-size: 13px; }
.life-banner.urgent { background: rgba(255,82,82,0.12); border-color: rgba(255,82,82,0.35); }


/* Candlestick chart */
.candle-chart { width:100%; height:220px; background:#0d0f14; border-radius:12px; border:1px solid var(--border); }
.candle-toolbar { display:flex; flex-wrap:wrap; gap:6px; margin:10px 0; align-items:center; }
.candle-toolbar .chip { padding:6px 10px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--muted); font-size:12px; cursor:pointer; }
.candle-toolbar .chip.on { background:var(--blue); color:#fff; border-color:var(--blue); }
.trade-bs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.trade-bs .sell-btn { background:rgba(255,82,82,0.2); color:var(--red); border:1px solid rgba(255,82,82,0.4); }
.trade-bs .buy-btn { background:rgba(0,200,83,0.2); color:var(--green); border:1px solid rgba(0,200,83,0.4); }


/* Verified — inline with name size (Twitter-style) */
.v-badge {
  display: inline-block;
  width: 1.05em;
  height: 1.05em;
  margin-left: 0.28em;
  vertical-align: -0.12em;
  border-radius: 50%;
  background: #1d9bf0;
  flex-shrink: 0;
  position: relative;
  box-shadow: none;
  border: none;
}
.v-badge svg {
  position: absolute;
  inset: 18%;
  width: 64%;
  height: 64%;
  display: block;
}
.name-row {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
}
/* profile h3 is ~18–20px so badge ~18–20px via em */
h3 .v-badge {
  width: 1em;
  height: 1em;
  vertical-align: -0.1em;
}

/* Pay app style */
.pay-hero {
  text-align: center; padding: 8px 0 18px;
}
.pay-hero .pay-amount-wrap {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  margin: 12px 0 6px;
}
.pay-hero .pay-currency {
  font-size: 28px; font-weight: 700; color: var(--muted); margin-top: 8px;
}
.pay-hero input#pay-amt {
  font-size: 48px !important; font-weight: 800 !important; text-align: center !important;
  border: none !important; background: transparent !important; color: var(--text) !important;
  width: 100%; max-width: 280px; padding: 0 !important; outline: none !important;
  font-variant-numeric: tabular-nums;
}
.pay-field {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px; margin-bottom: 10px;
}
.pay-field label {
  display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px;
  text-transform: none; letter-spacing: 0; font-weight: 500;
}
.pay-field input {
  display: block; width: 100%; border: none; background: transparent;
  color: var(--text); font-size: 16px; padding: 0; outline: none;
  font-family: inherit; box-sizing: border-box;
}
.pay-chip-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
.pay-chip {
  padding: 8px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
}
.pay-send {
  margin-top: 16px; width: 100%; padding: 16px !important; font-size: 16px !important;
  border-radius: 14px !important;
}


/* Bank-style home overview */
.home-greet { font-size: 15px; color: var(--muted); margin-bottom: 4px; }
.home-greet strong { color: var(--text); font-weight: 700; }
.home-avail-label { font-size: 12px; color: var(--muted); margin-top: 12px; }
.home-avail { font-size: 36px; font-weight: 800; letter-spacing: -1.2px; margin: 2px 0 4px; }
.home-nw-line { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
.home-nw-line b { color: var(--text); font-weight: 600; }
.acct-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--border);
}
.acct-row:first-of-type { border-top: none; }
.acct-icon {
  width: 40px; height: 40px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; flex-shrink: 0;
}
.acct-body { flex: 1; min-width: 0; }
.acct-body .n { font-size: 14px; font-weight: 600; }
.acct-body .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.acct-amt { font-size: 15px; font-weight: 700; text-align: right; }
.util-bar {
  height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08);
  margin-top: 10px; overflow: hidden;
}
.util-bar > i { display: block; height: 100%; border-radius: 2px; background: var(--blue); }
.spark {
  width: 100%; height: 48px; margin: 8px 0 4px;
}



/* Luba AI */
#screen-luba {
  display: flex !important;
  flex-direction: column !important;
  overflow: hidden !important;
  height: 100% !important;
  min-height: 0 !important;
  /* keep space above bottom nav (nav is position:absolute) */
  padding: 0 0 calc(64px + env(safe-area-inset-bottom)) 0 !important;
}
#screen-luba.hidden, #screen-luba:not(.active) {
  display: none !important;
}
#luba-root {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  height: 100%;
  overflow: hidden;
}
.luba-head {
  flex-shrink: 0;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: var(--bg);
  z-index: 5;
}
.luba-head .id { display:flex; align-items:center; gap:10px; min-width:0; }
.luba-head .avatar {
  width:40px; height:40px; border-radius:12px;
  background: linear-gradient(145deg, #1a2332, #0d1118);
  border: 1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
}
.luba-head .avatar svg { width:22px; height:22px; color: #ffc107; }
.luba-head .titles { min-width:0; }
.luba-head .titles .n { font-size:16px; font-weight:700; letter-spacing:-0.02em; display:flex; align-items:center; gap:6px; }
.luba-head .titles .t { font-size:12px; color:var(--muted); margin-top:1px; }
.luba-coins {
  font-size:12px; font-weight:600; padding:6px 10px; border-radius:20px;
  background: rgba(255,193,7,0.12); color: var(--gold); border: 1px solid rgba(255,193,7,0.25);
  white-space:nowrap;
}
.luba-msgs {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.luba-bubble {
  max-width:88%; padding:10px 12px; border-radius:14px; font-size:14px; line-height:1.45;
  white-space:pre-wrap; word-break:break-word;
}
.luba-bubble.bot {
  align-self:flex-start; background:var(--panel); border:1px solid var(--border);
  border-bottom-left-radius:4px;
}
.luba-bubble.me {
  align-self:flex-end; background:rgba(10,132,255,0.22); border:1px solid rgba(10,132,255,0.3);
  border-bottom-right-radius:4px;
}
.luba-compose {
  flex-shrink: 0;
  padding: 10px 12px max(10px, env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  display: flex;
  gap: 8px;
  align-items: flex-end;
  background: var(--bg);
  z-index: 5;
}
.luba-compose textarea {
  flex:1; min-height:42px; max-height:110px; resize:none;
  border-radius:12px; border:1px solid var(--border); background:var(--card);
  color:var(--text); padding:10px 12px; font-size:14px; font-family:inherit;
}
.luba-compose button.send {
  height:42px; padding:0 16px; border-radius:12px; border:none;
  background:#0a84ff; color:#fff; font-weight:600; font-size:14px;
}
.luba-empty { text-align:center; color:var(--muted); font-size:13px; padding:24px 12px; line-height:1.5; }
.luba-buy-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
.luba-buy-card {
  border:1px solid var(--border); background:var(--panel); border-radius:14px; padding:14px;
  text-align:center; cursor:pointer;
}
.luba-buy-card:active { background:var(--card); }
.luba-buy-card .amt { font-size:20px; font-weight:800; color:var(--gold); }
.luba-buy-card .price { font-size:12px; color:var(--muted); margin-top:4px; }
.luba-buy-card.featured { border-color: rgba(255,193,7,0.45); background: rgba(255,193,7,0.06); }


.bottom-nav .nav-item { flex: 1; min-width: 0; padding: 4px 2px; font-size: 9px; }
.bottom-nav .nav-item svg { width: 20px; height: 20px; }

</style>
</head>
<body>

<div id="app">
  <!-- AUTH -->
  <div class="auth-screen" id="auth-screen">
    <div class="auth-logo">Ledger<span>Life</span></div>
    <div class="auth-sub">Personal banking, investing, career, and credit — manage your full financial life.</div>
    <div class="auth-card" id="auth-login">
      <h2>Sign in</h2>
      <label>Username</label>
      <input type="text" id="login-user" autocomplete="username" maxlength="24">
      <label>Password</label>
      <input type="password" id="login-pass" autocomplete="current-password">
      <div class="auth-err" id="login-err"></div>
      <button class="auth-btn" id="btn-login">Sign in</button>
      <div class="auth-switch">No account? <a id="goto-register">Create one</a></div>

    </div>
    <div class="auth-card hidden" id="auth-register">
      <h2>Create account</h2>
      <label>Username</label>
      <input type="text" id="reg-user" maxlength="24" placeholder="letters, numbers, _" autocomplete="username">
      <label>Password</label>
      <input type="password" id="reg-pass" maxlength="64" placeholder="min 4 characters" autocomplete="new-password">

}

let S = null; // active state
let sessionUser = null;

// ---------- PERSISTENCE ----------
function allUsers(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY+"_users") || "{}"); } catch { return {}; }
}
function saveUsers(u){ localStorage.setItem(SAVE_KEY+"_users", JSON.stringify(u)); }
function saveGame(){
  if (!S || !sessionUser) return;
  const users = allUsers();
  if (!users[sessionUser]) return;
  users[sessionUser].state = S;
  users[sessionUser].updatedAt = Date.now();
  saveUsers(users);
}
function save(){ return saveGame(); }
function loadUserState(username){
  const users = allUsers();
  return users[username] ? users[username].state : null;
}

// ---------- AUTH ----------
function hashPass(p){
  // lightweight non-crypto hash for local toy auth only
  let h = 0;
  for (let i=0;i<p.length;i++){ h = ((h<<5)-h) + p.charCodeAt(i); h|=0; }
  return "h"+Math.abs(h)+"_"+p.length;
}

function register(username, password, displayName, diff){
  username = String(username||"").trim().toLowerCase();
  if (!/^[a-z0-9_]{3,24}$/.test(username)) return "Username: 3–24 letters, numbers, underscore";
  if (!password || password.length < 4) return "Password min 4 characters";
  const users = allUsers();
  if (users[username]) return "Username taken";
  const state = defaultState(diff, username, displayName);
  // setup initial bills
  state.bills = BILL_TEMPLATES.map(b => ({
    id: b.id,
    name: b.name,
    amount: b.base * (diff==="hard"?1.15:diff==="easy"?0.9:1),
    dueDay: state.day + b.period,
    period: b.period,
    category: b.category,
    autoPay: false
  }));
  // first month rent already partially covered
  users[username] = {
    username,
    displayName: displayName || username,
    pass: hashPass(password),
    createdAt: Date.now(),
    state
  };
  saveUsers(users);
  return null;
}

function login(username, password){
  username = String(username||"").trim().toLowerCase();
  const users = allUsers();
  const u = users[username];
  if (!u) return "Account not found";
  if (u.pass !== hashPass(password)) return "Wrong password";
  sessionUser = username;
  S = u.state;
  // migrate missing fields
  if (!S.stocks) S = defaultState(S.diff, username, u.displayName);
  if (!S.cryptos) { /* ensure */ }
  ensureMarket(S);
  return null;
}

function ensureMarket(state){
  STOCK_DEFS.forEach(s => {
    if (!state.stocks[s.symbol]) {
      state.stocks[s.symbol] = { price:s.base, prev:s.base, history:[], vol:s.vol, sector:s.sector, name:s.name, div:s.div||0 };
    }
  });
  CRYPTO_DEFS.forEach(c => {
    if (!state.cryptos[c.symbol]) {
      state.cryptos[c.symbol] = { price:c.base, prev:c.base, history:[], vol:c.vol, name:c.name };
    }
  });
}

// ---------- NET WORTH ----------
function portfolioStocks(){
  let v = 0;
  Object.keys(S.stockHoldings||{}).forEach(sym => {
    const h = S.stockHoldings[sym];
    const p = S.stocks[sym] ? S.stocks[sym].price : 0;
    v += h.shares * p;
  });
  return v;
}
function portfolioCrypto(){
  let v = 0;
  Object.keys(S.cryptoHoldings||{}).forEach(sym => {
    const h = S.cryptoHoldings[sym];
    const p = S.cryptos[sym] ? S.cryptos[sym].price : 0;
    v += h.amount * p;
  });
  return v;
}
function portfolioFunds(){
  let v = 0;
  Object.keys(S.fundHoldings||{}).forEach(id => {
    v += (S.fundHoldings[id].value || S.fundHoldings[id].amount || 0);
  });
  return v;
}
function propertyEquity(){
  let eq = 0;
  (S.properties||[]).forEach(p => {
    eq += (p.value || 0) - (p.mortgage || 0);
  });
  return eq;
}
function totalDebt(){
  let d = S.creditBalance || 0;
  (S.loans||[]).forEach(l => d += l.principal);
  (S.properties||[]).forEach(p => d += (p.mortgage||0));
  return d;
}
function netWorth(){
  return (S.checking||0) + (S.savings||0) + (S.brokerage||0) + (S.ira||0)
    + portfolioStocks() + portfolioCrypto() + portfolioFunds()
    + propertyEquity()
    - totalDebt();
}
function investTotal(){
  return (S.brokerage||0) + portfolioStocks() + portfolioCrypto() + portfolioFunds() + (S.ira||0);
}

// ---------- TRANSACTIONS ----------
function addTx(type, label, amount, account){
  S.transactions.unshift({
    id: uid(),
    day: S.day,
    type, label, amount, account: account||"checking",
    at: Date.now()
  });
  if (S.transactions.length > 200) S.transactions.length = 200;
  if (amount > 0) S.totalEarned = (S.totalEarned||0) + amount;
  else S.totalSpent = (S.totalSpent||0) + Math.abs(amount);
}

function canAfford(amount, from){
  from = from || "checking";
  if (from === "checking") return S.checking >= amount;
  if (from === "savings") return S.savings >= amount;
  if (from === "brokerage") return S.brokerage >= amount;
  return false;
}
function debit(amount, from, label){
  from = from || "checking";
  if (from === "checking") S.checking -= amount;
  else if (from === "savings") S.savings -= amount;
  else if (from === "brokerage") S.brokerage -= amount;
  addTx("debit", label, -amount, from);
}
function credit(amount, to, label){
  to = to || "checking";
  if (to === "checking") S.checking += amount;
  else if (to === "savings") S.savings += amount;
  else if (to === "brokerage") S.brokerage += amount;
  addTx("credit", label, amount, to);
}

// ---------- CREDIT SCORE ----------
function adjustCredit(delta, reason){
  S.creditScore = clamp(Math.round(S.creditScore + delta), 300, 850);
  // credit limit scales
  if (S.creditScore >= 750) S.creditLimit = Math.max(S.creditLimit, 12000);
  else if (S.creditScore >= 700) S.creditLimit = Math.max(S.creditLimit, 8000);
  else if (S.creditScore >= 650) S.creditLimit = Math.max(S.creditLimit, 4000);
  else if (S.creditScore >= 600) S.creditLimit = Math.max(S.creditLimit, 2000);
}

function creditLabel(score){
  if (score >= 800) return "Exceptional";
  if (score >= 740) return "Very Good";
  if (score >= 670) return "Good";
  if (score >= 580) return "Fair";
  return "Poor";
}

// ---------- MARKET ENGINE ----------
function tickMarkets(){
  // drift + noise + sentiment
  const sent = S.marketSentiment || 0;
  Object.keys(S.stocks).forEach(sym => {
    const st = S.stocks[sym];
    const shock = rnd(-1,1) * st.vol * st.price;
    const drift = sent * 0.002 * st.price;
    st.prev = st.price;
    st.price = Math.max(0.5, st.price + shock + drift);
    st.history.push(st.price);
    if (st.history.length > 30) st.history.shift();
  });
  Object.keys(S.cryptos).forEach(sym => {
    const c = S.cryptos[sym];
    const shock = rnd(-1,1) * c.vol * c.price;
    const drift = sent * 0.004 * c.price;
    c.prev = c.price;
    c.price = Math.max(0.0001, c.price + shock + drift);
    c.history.push(c.price);
    if (c.history.length > 30) c.history.shift();
  });
  // funds mark-to-model
  Object.keys(S.fundHoldings||{}).forEach(id => {
    const def = FUND_DEFS.find(f=>f.id===id);
    const h = S.fundHoldings[id];
    if (!def || !h) return;
    const ret = def.expected + rnd(-1,1)*def.vol - def.expense/365;
    h.value = (h.value || h.amount) * (1 + ret);
  });
  // decay sentiment
  S.marketSentiment *= 0.95;
}

function applyNewsEffect(effect){
  if (!effect) return;
  if (effect.stocks) {
    Object.keys(S.stocks).forEach(sym => {
      S.stocks[sym].price *= (1 + effect.stocks * rnd(0.6, 1.2));
    });
  }
  if (effect.crypto) {
    Object.keys(S.cryptos).forEach(sym => {
      S.cryptos[sym].price *= (1 + effect.crypto * rnd(0.7, 1.3));
    });
  }
  if (effect.tech) {
    Object.keys(S.stocks).forEach(sym => {
      if (S.stocks[sym].sector === "Tech") S.stocks[sym].price *= (1 + effect.tech);
    });
  }
  if (effect.finance) {
    Object.keys(S.stocks).forEach(sym => {
      if (S.stocks[sym].sector === "Finance") S.stocks[sym].price *= (1 + effect.finance);
    });
  }
  if (effect.energy) {
    Object.keys(S.stocks).forEach(sym => {
      if (S.stocks[sym].sector === "Energy") S.stocks[sym].price *= (1 + effect.energy);
    });
  }
  if (effect.bonds) {
    // bond funds
    Object.keys(S.fundHoldings||{}).forEach(id => {
      if (id === "bnd" || id === "income") {
        S.fundHoldings[id].value *= (1 + effect.bonds);
      }
    });
  }
  S.marketSentiment = clamp((S.marketSentiment||0) + (effect.stocks||0)*5, -1, 1);
}

function maybeNews(){
  if (S.day === S.lastNewsDay) return;
  if (!chance(0.45)) return;
  S.lastNewsDay = S.day;
  const n = NEWS_POOL[Math.floor(Math.random()*NEWS_POOL.length)];
  S.news.unshift({ day:S.day, t:n.t, title:n.title, body:n.body, at:Date.now() });
  if (S.news.length > 40) S.news.length = 40;
  applyNewsEffect(n.effect);
}

// ---------- TRADING ----------
function buyStock(symbol, dollars){
  const st = S.stocks[symbol];
  if (!st) return "Unknown symbol";
  dollars = Number(dollars);
  if (!(dollars > 0)) return "Invalid amount";
  if (S.brokerage < dollars) return "Not enough brokerage cash — transfer first";
  const shares = dollars / st.price;
  S.brokerage -= dollars;
  if (!S.stockHoldings[symbol]) S.stockHoldings[symbol] = { shares:0, avgCost:0 };
  const h = S.stockHoldings[symbol];
  const total = h.shares * h.avgCost + dollars;
  h.shares += shares;
  h.avgCost = total / h.shares;
  addTx("invest", "Buy "+symbol, -dollars, "brokerage");
  adjustCredit(0.2);
  return null;
}
function sellStock(symbol, dollars){
  const st = S.stocks[symbol];
  const h = S.stockHoldings[symbol];
  if (!st || !h || h.shares <= 0) return "No position";
  dollars = Number(dollars);
  const maxVal = h.shares * st.price;
  if (!(dollars > 0)) return "Invalid amount";
  if (dollars > maxVal) dollars = maxVal;
  const shares = dollars / st.price;
  h.shares -= shares;
  if (h.shares < 1e-8) delete S.stockHoldings[symbol];
  S.brokerage += dollars;
  addTx("invest", "Sell "+symbol, dollars, "brokerage");
  return null;
}
function buyCrypto(symbol, dollars){
  const c = S.cryptos[symbol];
  if (!c) return "Unknown coin";
  dollars = Number(dollars);
  if (!(dollars > 0)) return "Invalid amount";
  if (S.brokerage < dollars) return "Not enough brokerage cash";
  const amt = dollars / c.price;
  S.brokerage -= dollars;
  if (!S.cryptoHoldings[symbol]) S.cryptoHoldings[symbol] = { amount:0, avgCost:0 };
  const h = S.cryptoHoldings[symbol];
  const total = h.amount * h.avgCost + dollars;
  h.amount += amt;
  h.avgCost = total / h.amount;
  addTx("invest", "Buy "+symbol, -dollars, "brokerage");
  return null;
}
function sellCrypto(symbol, dollars){
  const c = S.cryptos[symbol];
  const h = S.cryptoHoldings[symbol];
  if (!c || !h || h.amount <= 0) return "No position";
  dollars = Number(dollars);
  const maxVal = h.amount * c.price;
  if (!(dollars > 0)) return "Invalid amount";
  if (dollars > maxVal) dollars = maxVal;
  const amt = dollars / c.price;
  h.amount -= amt;
  if (h.amount < 1e-12) delete S.cryptoHoldings[symbol];
  S.brokerage += dollars;
  addTx("invest", "Sell "+symbol, dollars, "brokerage");
  return null;
}
function buyFund(id, dollars){
  const def = FUND_DEFS.find(f=>f.id===id);
  if (!def) return "Unknown fund";
  dollars = Number(dollars);
  if (dollars < def.min) return "Minimum $"+def.min;
  if (S.brokerage < dollars) return "Not enough brokerage cash";
  S.brokerage -= dollars;
  if (!S.fundHoldings[id]) S.fundHoldings[id] = { amount:0, value:0 };
  S.fundHoldings[id].amount += dollars;
  S.fundHoldings[id].value = (S.fundHoldings[id].value||0) + dollars;
  addTx("invest", "Buy fund "+def.name, -dollars, "brokerage");
  return null;
}
function sellFund(id, dollars){
  const h = S.fundHoldings[id];
  if (!h || (h.value||0) <= 0) return "No position";
  dollars = Number(dollars);
  if (dollars > h.value) dollars = h.value;
  if (!(dollars > 0)) return "Invalid";
  const ratio = dollars / h.value;
  h.value -= dollars;
  h.amount *= (1-ratio);
  if (h.value < 1) delete S.fundHoldings[id];
  S.brokerage += dollars;
  addTx("invest", "Sell fund", dollars, "brokerage");
  return null;
}

function contributeIRA(dollars){
  dollars = Number(dollars);
  if (!(dollars > 0)) return "Invalid";
  if (S.checking < dollars) return "Need cash in checking";
  // annual cap simplified ~6500
  const yearContrib = S._iraYear || 0;
  if (yearContrib + dollars > 6500) return "Annual IRA limit $6,500";
  S.checking -= dollars;
  S.ira += dollars;
  S._iraYear = yearContrib + dollars;
  addTx("retire", "IRA contribution", -dollars, "checking");
  adjustCredit(0.5);
  return null;
}


// ---------- CAREER ----------
function currentJob(){
  if (!S.jobId) return null;
  return JOB_TREE.find(j => j.id === S.jobId) || null;
}
function meetsReq(req){
  if (!req) return true;
  return Object.keys(req).every(k => (S.skills[k]||0) >= req[k]);
}
function availableJobs(){
  return JOB_TREE.filter(j => meetsReq(j.req));
}
function applyJob(jobId){
  const job = JOB_TREE.find(j => j.id === jobId);
  if (!job) return "Job not found";
  if (!meetsReq(job.req)) return "Skills requirement not met";
  S.jobId = jobId;
  S.jobDays = 0;
  S.lastSalaryAt = Date.now();
  toast("Hired: " + job.title + " at " + job.company);
  addTx("career", "Started job: "+job.title, 0, "checking");
  return null;
}
function quitJob(){
  if (!S.jobId) return "No job";
  S.jobId = null;
  S.jobDays = 0;
  toast("You left your job");
  return null;
}
function dailySalary(){
  const job = currentJob();
  if (!job) return 0;
  // annual salary → real 24h day rate
  let mult = (S._raiseMult || 1);
  return (job.salary / 365) * mult;
}
function hourlySalary(){
  return dailySalary() / 24;
}
/** Pay wages based on real elapsed time (ms) since last pay */
function accrueRealSalary(){
  if (!S || !S.jobId) return;
  const now = Date.now();
  if (!S.lastSalaryAt) S.lastSalaryAt = now;
  const elapsedMs = now - S.lastSalaryAt;
  if (elapsedMs < 1000) return; // min 1s
  const ratePerMs = dailySalary() / 86400000; // $ per real ms
  const pay = ratePerMs * elapsedMs;
  if (pay < 0.0001) return;
  S.lastSalaryAt = now;
  S.checking = (S.checking || 0) + pay;
  S.ytdIncome = (S.ytdIncome || 0) + pay;
  S.totalEarned = (S.totalEarned || 0) + pay;
  // batch tx every ~minute of accrual to avoid spam
  if (!S._salaryBuf) S._salaryBuf = 0;
  S._salaryBuf += pay;
  if (S._salaryBuf >= Math.max(0.5, dailySalary() / 48)) {
    if (typeof addTx === "function") addTx("income", "Wages (" + (currentJob()||{}).title + ")", S._salaryBuf, "checking");
    S._salaryBuf = 0;
  }
}
function trainSkill(skillId){
  const def = SKILL_DEFS.find(s => s.id === skillId);
  if (!def) return "Unknown skill";
  const level = S.skills[skillId] || 0;
  if (level >= def.max) return "Already maxed";
  const cost = Math.floor(def.costBase * Math.pow(1.55, level));
  if (S.checking < cost) return "Need "+fmt(cost)+" in checking";
  S.checking -= cost;
  S.skills[skillId] = level + 1;
  S.educationSpent = (S.educationSpent||0) + cost;
  addTx("education", "Training: "+def.name+" → "+(level+1), -cost, "checking");
  toast(def.name + " is now level " + (level+1));
  return null;
}
function toggleSide(id){
  const def = SIDE_HUSTLES.find(s => s.id === id);
  if (!def) return "Unknown";
  if (!meetsReq(def.req)) return "Requirements not met";
  if (S.sideActive[id]) {
    delete S.sideActive[id];
    toast("Stopped: " + def.name);
  } else {
    // limit concurrent
    if (Object.keys(S.sideActive).length >= 2) return "Max 2 side hustles at once";
    S.sideActive[id] = true;
    toast("Started: " + def.name);
  }
  return null;
}
function sideDailyIncome(){
  let total = 0;
  Object.keys(S.sideActive||{}).forEach(id => {
    const def = SIDE_HUSTLES.find(s => s.id === id);
    if (def) total += def.income * def.hours * 0.35; // scaled daily
  });
  return total;
}
function buyBusiness(id){
  const def = BUSINESS_DEFS.find(b => b.id === id);
  if (!def) return "Unknown";
  if (S.businesses[id]) return "Already owned";
  if (!meetsReq(def.req)) return "Requirements not met";
  if (S.checking < def.cost) return "Need "+fmt(def.cost);
  S.checking -= def.cost;
  S.businesses[id] = { since: S.day, level: 1 };
  addTx("business", "Bought: "+def.name, -def.cost, "checking");
  toast("Business acquired: " + def.name);
  return null;
}
function businessDailyNet(){
  let net = 0;
  Object.keys(S.businesses||{}).forEach(id => {
    const def = BUSINESS_DEFS.find(b => b.id === id);
    if (!def) return;
    const lvl = S.businesses[id].level || 1;
    net += (def.income * lvl - def.upkeep) * (S.diff==="hard"?0.85:1);
  });
  return net;
}

// ---------- PROPERTY ----------
function buyProperty(defId, withMortgage){
  const def = PROPERTY_DEFS.find(p => p.id === defId);
  if (!def) return "Unknown property";
  const price = def.price * (S.diff==="hard"?1.08:1);
  if (withMortgage) {
    if (S.creditScore < 620) return "Credit score too low for mortgage (need 620+)";
    const down = price * def.down;
    if (S.checking < down) return "Need "+fmt(down)+" down payment";
    const principal = price - down;
    const rate = S.creditScore >= 740 ? 0.055 : S.creditScore >= 680 ? 0.065 : 0.078;
    S.checking -= down;
    S.properties.push({
      id: uid(), defId, pricePaid: price, value: price,
      mortgage: principal, mortgageRate: rate,
      rented: true, since: S.day
    });
    addTx("property", "Bought "+def.name+" (mortgage)", -down, "checking");
    adjustCredit(-5);
    toast("Property purchased with mortgage");
  } else {
    if (S.checking < price) return "Need "+fmt(price)+" cash";
    S.checking -= price;
    S.properties.push({
      id: uid(), defId, pricePaid: price, value: price,
      mortgage: 0, mortgageRate: 0,
      rented: true, since: S.day
    });
    addTx("property", "Bought "+def.name+" (cash)", -price, "checking");
    toast("Property purchased free & clear");
  }
  return null;
}
function sellProperty(propId){
  const idx = S.properties.findIndex(p => p.id === propId);
  if (idx < 0) return "Not found";
  const p = S.properties[idx];
  const proceeds = p.value - (p.mortgage||0);
  if (proceeds < 0) return "Underwater — cannot sell easily";
  S.checking += proceeds;
  S.properties.splice(idx, 1);
  addTx("property", "Sold property", proceeds, "checking");
  toast("Property sold for "+fmt(proceeds)+" equity");
  return null;
}
function propertyDailyCashflow(){
  let net = 0;
  S.properties.forEach(p => {
    const def = PROPERTY_DEFS.find(d => d.id === p.defId);
    if (!def) return;
    const rent = p.rented ? def.rent / 30 : 0;
    const tax = (p.value * def.tax) / 365;
    const maint = (p.value * def.maint) / 365;
    const mortgagePay = p.mortgage > 0 ? (p.mortgage * p.mortgageRate / 365) + (p.mortgage * 0.001) : 0;
    // principal reduction small bit
    if (p.mortgage > 0) {
      const prin = Math.min(p.mortgage, p.mortgage * 0.0008);
      p.mortgage -= prin;
    }
    net += rent - tax - maint - mortgagePay;
    // value drift
    p.value *= 1 + rnd(-0.0005, 0.0008);
  });
  return net;
}

// ---------- LOANS & CREDIT CARD ----------
function takePersonalLoan(amount){
  amount = Number(amount);
  if (!(amount >= 500 && amount <= 25000)) return "Amount $500–$25,000";
  if (S.creditScore < 580) return "Credit too low";
  if ((S.loans||[]).length >= 3) return "Too many active loans";
  const rate = S.creditScore >= 720 ? 0.09 : S.creditScore >= 650 ? 0.14 : 0.22;
  S.loans.push({ id:uid(), type:"personal", principal:amount, rate, payment: amount * (rate/12 + 0.03) });
  S.checking += amount;
  addTx("loan", "Personal loan proceeds", amount, "checking");
  adjustCredit(-8);
  toast("Loan funded: "+fmt(amount));
  return null;
}
function payLoan(loanId, amount){
  const loan = (S.loans||[]).find(l => l.id === loanId);
  if (!loan) return "Loan not found";
  amount = Number(amount);
  if (!(amount > 0) || S.checking < amount) return "Insufficient funds";
  S.checking -= amount;
  loan.principal -= amount;
  addTx("loan", "Loan payment", -amount, "checking");
  if (loan.principal <= 1) {
    S.loans = S.loans.filter(l => l.id !== loanId);
    adjustCredit(12);
    toast("Loan paid off!");
  } else adjustCredit(1);
  return null;
}
function creditCharge(amount, label){
  amount = Number(amount);
  if (S.creditBalance + amount > S.creditLimit) return "Over credit limit";
  S.creditBalance += amount;
  addTx("credit", label||"Card purchase", -amount, "credit");
  return null;
}
function payCreditCard(amount){
  amount = Number(amount);
  if (!(amount > 0)) return "Invalid";
  if (S.checking < amount) return "Need cash";
  amount = Math.min(amount, S.creditBalance);
  S.checking -= amount;
  S.creditBalance -= amount;
  addTx("credit", "Credit card payment", -amount, "checking");
  if (S.creditBalance < 1) { S.creditBalance = 0; adjustCredit(3); }
  else adjustCredit(1);
  return null;
}

// ---------- BILLS ----------
function processBillsOnNewDay(){
  S.bills.forEach(b => {
    if (S.day >= b.dueDay) {
      if (b.autoPay && S.checking >= b.amount) {
        S.checking -= b.amount;
        addTx("bill", b.name+" (auto-pay)", -b.amount, "checking");
        b.dueDay = S.day + b.period;
      } else if (S.checking >= b.amount) {
        // mark overdue flag
        b.overdue = true;
      } else {
        b.overdue = true;
        adjustCredit(-4);
      }
    }
  });
}
function payBill(billId){
  const b = S.bills.find(x => x.id === billId);
  if (!b) return "Not found";
  if (S.checking < b.amount) return "Insufficient funds";
  S.checking -= b.amount;
  b.overdue = false;
  b.dueDay = S.day + b.period;
  addTx("bill", "Paid "+b.name, -b.amount, "checking");
  adjustCredit(1);
  return null;
}
function toggleAutoPay(billId){
  const b = S.bills.find(x => x.id === billId);
  if (!b) return;
  b.autoPay = !b.autoPay;
}

// ---------- TAXES ----------
function estimateTaxOwed(){
  // simplified progressive
  const income = S.ytdIncome || 0;
  let tax = 0;
  if (income > 50000) tax += (income - 50000) * 0.22;
  if (income > 20000) tax += (Math.min(income,50000) - 20000) * 0.12;
  tax += Math.min(income, 20000) * 0.05;
  return Math.max(0, tax - (S.ytdTaxPaid||0));
}
function payTaxes(){
  const owed = estimateTaxOwed();
  if (owed < 1) { toast("No taxes due"); return null; }
  if (S.checking < owed) return "Need "+fmt(owed)+" to pay taxes";
  S.checking -= owed;
  S.ytdTaxPaid = (S.ytdTaxPaid||0) + owed;
  addTx("tax", "Tax payment", -owed, "checking");
  adjustCredit(2);
  toast("Taxes paid: "+fmt(owed));
  return null;
}

// ---------- INSURANCE ----------
function buyInsurance(type){
  const costs = { health:280, auto:120, home:90, life:40 };
  const cost = costs[type];
  if (cost == null) return "Unknown";
  if (S.insurance[type]) return "Already covered";
  if (S.checking < cost) return "Need "+fmt(cost)+" first month";
  S.checking -= cost;
  S.insurance[type] = true;
  addTx("insurance", "Insured: "+type, -cost, "checking");
  // add recurring bill-ish via flag
  toast(type.charAt(0).toUpperCase()+type.slice(1)+" insurance active");
  return null;
}

// ---------- DAY / TICK ----------
function onNewDay(){
  // Calendar day/age are driven by real time (syncRealCalendar)
  try { syncRealCalendar(); } catch(_){}
  const todayKey = new Date().toDateString();
  if (S._lastCalDay === todayKey) return; // already ran real daily once
  S._lastCalDay = todayKey;

  // wages accrue in real time via accrueRealSalary() — not per game day
  if (S.jobId) S.jobDays = (S.jobDays || 0) + 1;
  // side hustles
  const side = sideDailyIncome();
  if (side > 0) {
    S.checking += side;
    S.ytdIncome += side;
    addTx("income", "Side hustle", side, "checking");
  }
  // businesses
  const biz = businessDailyNet();
  if (Math.abs(biz) > 0.01) {
    S.checking += biz;
    if (biz > 0) S.ytdIncome += biz;
    addTx("business", "Business cashflow", biz, "checking");
  }
  // property
  const prop = propertyDailyCashflow();
  if (Math.abs(prop) > 0.01) {
    S.checking += prop;
    addTx("property", "Property cashflow", prop, "checking");
  }
  // savings interest daily
  if (S.savings > 0) {
    const interest = S.savings * (S.savingsAPY / 365);
    S.savings += interest;
  }
  // IRA growth mild
  if (S.ira > 0) S.ira *= 1 + rnd(0.0001, 0.0004);
  // credit card interest
  if (S.creditBalance > 0) {
    S.creditBalance *= 1 + (0.22/365);
  }
  // loan interest
  (S.loans||[]).forEach(l => {
    l.principal *= 1 + (l.rate/365);
  });
  // insurance premiums monthly-ish
  if (S.day % 30 === 0) {
    let prem = 0;
    if (S.insurance.health) prem += 280;
    if (S.insurance.auto) prem += 120;
    if (S.insurance.home) prem += 90;
    if (S.insurance.life) prem += 40;
    if (prem > 0) {
      if (S.checking >= prem) {
        S.checking -= prem;
        addTx("insurance", "Insurance premiums", -prem, "checking");
      } else {
        // lapse
        Object.keys(S.insurance).forEach(k => S.insurance[k] = false);
        toast("Insurance lapsed — unpaid premiums");
        adjustCredit(-6);
      }
    }
  }
  // dividends quarterly-ish
  if (S.day % 90 === 0) {
    let div = 0;
    Object.keys(S.stockHoldings||{}).forEach(sym => {
      const h = S.stockHoldings[sym];
      const st = S.stocks[sym];
      if (h && st && st.div) div += h.shares * st.price * st.div / 4;
    });
    if (div > 0) {
      S.brokerage += div;
      addTx("invest", "Dividends", div, "brokerage");
    }
  }

  processBillsOnNewDay();
  maybeNews();
  maybeLifeEvent();

  // job tenure
  if (S.jobId) S.jobDays++;

  // track net
  const nw = netWorth();
  S.netHistory.push({ day:S.day, nw });
  if (S.netHistory.length > 120) S.netHistory.shift();

  // soft bankruptcy floor
  if (S.checking < -500) {
    S.checking = 0;
    adjustCredit(-30);
    toast("Overdraft crisis — accounts stabilized, credit damaged");
  }

  saveGame();
}

function maybeLifeEvent(){
  if (!chance(0.12)) return;
  const pool = LIFE_EVENTS.filter(e => !e.rare || chance(0.2));
  const e = pool[Math.floor(Math.random()*pool.length)];
  if (e.fn === "bonus" && S.jobId) {
    const amt = dailySalary() * rnd(3, 10);
    S.checking += amt;
    addTx("income", "Work bonus", amt, "checking");
    toast("🎉 "+e.title+" +"+fmt(amt));
  } else if (e.fn === "expense") {
    const amt = rnd(e.amount[0], e.amount[1]);
    if (S.insurance.health && e.id === "medical") {
      toast("Medical bill covered by insurance");
      return;
    }
    if (S.insurance.auto && e.id === "car_repair") {
      toast("Car repair covered by insurance");
      return;
    }
    if (S.checking >= amt) {
      S.checking -= amt;
      addTx("expense", e.title, -amt, "checking");
    } else {
      S.creditBalance += amt;
      addTx("credit", e.title+" (card)", -amt, "credit");
    }
    toast("⚠️ "+e.title+" −"+fmt(amt));
  } else if (e.fn === "income") {
    const amt = rnd(e.amount[0], e.amount[1]);
    S.checking += amt;
    addTx("income", e.title, amt, "checking");
    toast(e.title+" +"+fmt(amt));
  } else if (e.fn === "credit_hit") {
    adjustCredit(-15);
    toast(e.title);
  } else if (e.fn === "raise_chance" && S.jobId) {
    const job = currentJob();
    if (job && chance(0.4 + (S.skills.admin||0)*0.03)) {
      // bump via storing raise multiplier
      S._raiseMult = (S._raiseMult||1) * 1.05;
      toast("Raise approved! (+5% effective pay)");
    } else toast("Raise request denied");
  } else if (e.fn === "property_damage" && S.properties.length) {
    const p = S.properties[0];
    const dmg = p.value * rnd(0.005, 0.02);
    if (S.insurance.home) { toast("Property damage covered by insurance"); return; }
    p.value -= dmg;
    toast("Storm damage reduced property value "+fmt(dmg));
  }
}

function gameTick(){
  if (!S) return;
  S.tick++;
  // real-time wages (24h real clock)
  if (typeof accrueRealSalary === "function") accrueRealSalary();
  // markets every tick
  if (S.tick % 3 === 0) tickMarkets();
  // new day
  if (S.tick % DAY_TICKS === 0) {
    S.dayStartNet = netWorth();
    onNewDay();
  }
  // UI refresh light
  if (S.tick % 2 === 0) refreshTopbar();
  if (S.tick % 5 === 0) {
    const active = document.querySelector(".screen.active");
    if (active) renderScreen(active.dataset.screen);
  }
}

function esc(s){ return String(s||"").replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]); }
function formatWhen(t){
  const ts = (t && t.at) ? t.at : null;
  if (ts) {
    try {
      const d = new Date(ts);
      const now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      if (sameDay) return d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
      return d.toLocaleString(undefined, { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
    } catch(_){}
  }
  return "Recently";
}
function syncRealCalendar(){
  if (!S) return;
  // Account age from real createdAt — day/year track real time
  const created = S.createdAt || Date.now();
  const ms = Date.now() - created;
  const daysAlive = Math.max(1, Math.floor(ms / 86400000) + 1);
  S.day = daysAlive;
  // age: start 18 + full real years since create
  const years = Math.floor(ms / (365.25 * 86400000));
  S.age = Math.min(100, 18 + years);
}

  debit(amt, from, "Transfer to "+to);

  toast("Moved "+fmt(amt)+" to brokerage");

function renderPositions(){
  const rows = [];
  Object.keys(S.stockHoldings||{}).forEach(sym => {
    const h = S.stockHoldings[sym]; const st = S.stocks[sym];
    const val = h.shares * st.price;
    const pnl = val - h.shares * h.avgCost;
    rows.push(`<div class="list-item" onclick="uiTradeStock('${sym}')"><div class="list-body"><div class="name">${sym}</div>
      <div class="sub">${h.shares.toFixed(4)} sh · avg ${fmt(h.avgCost)}</div></div>
      <div class="list-right"><div class="amt">${fmt(val)}</div><div class="chg ${pnl>=0?'pos':'neg'}">${fmt(pnl)}</div></div></div>`);
  });
  Object.keys(S.cryptoHoldings||{}).forEach(sym => {
    const h = S.cryptoHoldings[sym]; const c = S.cryptos[sym];
    const val = h.amount * c.price;
    const pnl = val - h.amount * h.avgCost;
    rows.push(`<div class="list-item" onclick="uiTradeCrypto('${sym}')"><div class="list-body"><div class="name">${sym}</div>
      <div class="sub">${h.amount.toFixed(6)} · avg ${fmt(h.avgCost)}</div></div>
      <div class="list-right"><div class="amt">${fmt(val)}</div><div class="chg ${pnl>=0?'pos':'neg'}">${fmt(pnl)}</div></div></div>`);
  });
  Object.keys(S.fundHoldings||{}).forEach(id => {
    const h = S.fundHoldings[id]; const def = FUND_DEFS.find(f=>f.id===id);
    rows.push(`<div class="list-item" onclick="uiTradeFund('${id}')"><div class="list-body"><div class="name">${def?def.name:id}</div>

  });

      const hourPay = dayPay / 24;
      html += `<div class="card job-card">

    } else {

    }
    html += `<div class="section-title">Open roles</div>`;
    html += availableJobs().map(j => {
      const have = S.jobId === j.id;
      return `<div class="list-item">
        <div class="list-body">
          <div class="name">${esc(j.title)} ${have?'<span class="badge badge-green">CURRENT</span>':''}</div>

        </div>
        <button class="btn btn-sm btn-primary" ${have?'disabled':''} onclick="const e=applyJob('${j.id}');if(e)toast(e);renderWork();saveGame()">Apply</button>
      </div>`;
    }).join("");
    // locked jobs preview
    const locked = JOB_TREE.filter(j => !meetsReq(j.req)).slice(0, 6);
    if (locked.length) {
      html += `<div class="section-title">Locked (train skills)</div>`;
      html += locked.map(j => `<div class="list-item locked" style="opacity:0.5">
        <div class="list-body"><div class="name">${esc(j.title)}</div>
        <div class="sub">${reqText(j.req)} · ${fmt(j.salary,0)}/yr</div></div>
      </div>`).join("");
    }
    $("work-job").innerHTML = html;
  } else if (workTab === "skills") {
    try { if (typeof settleTraining === "function") settleTraining(); } catch(_){}
    const training = S.training;
    $("work-skills").innerHTML = (training ? `<div class="card" style="border-color:var(--accent)"><div class="name">Training in progress</div>
      <div class="meta">${esc(training.skillName)} · Lv ${training.from} → ${training.to}</div>
      <div class="meta">Time left: ${formatTrainLeft(training.endsAt - Date.now())}</div>
      <div class="meta">Paid ${fmt(training.cost||0)} · level unlocks when the timer finishes</div></div>` : "") +
    SKILL_DEFS.map(sk => {
      const lvl = S.skills[sk.id]||0;
      let cost = Math.floor((sk.costBase||200) * Math.pow(1.55, lvl));
      if (lvl === 0 && sk.id === "physical") cost = 0;
      const pct = (lvl/(sk.max||10))*100;
      const maxed = lvl >= (sk.max||10);
      const busy = !!training;
      const broke = (S.checking||0) < cost;
      const mins = Math.min(20 + lvl * 25, 8 * 60);
      let label = maxed ? "Maxed" : (busy ? "Busy" : (cost === 0 ? "Free · " + mins + "m" : "Train " + fmt(cost,0) + " · " + mins + "m"));
      const dis = maxed || busy || broke ? "disabled" : "";
      return `<div class="card">
        <div class="card-row"><div><h3>${esc(sk.name)} · Lv ${lvl}/${sk.max||10}</h3>
          <div class="meta">${esc(sk.desc)}</div>
          <div class="meta">${maxed ? "Complete" : (broke && !busy ? "Need " + fmt(cost) + " in checking" : "Study time ~" + mins + " min real time")}</div></div>
          <button class="btn btn-sm btn-primary" ${dis}
            onclick="const e=trainSkill('${sk.id}');if(e)toast(e);renderWork();saveGame()">${label}</button>
        </div>
        <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
      </div>`;
    }).join("");
  } else if (workTab === "side") {
    $("work-side").innerHTML = SIDE_HUSTLES.map(s => {
      const on = !!S.sideActive[s.id];
      const ok = meetsReq(s.req);
      return `<div class="list-item">
        <div class="list-body">
          <div class="name">${esc(s.name)} ${on?'<span class="badge badge-green">ACTIVE</span>':''}</div>
          <div class="sub">${esc(s.desc)} · ~${fmt(s.income*s.hours*0.35)}/day</div>
          <div class="sub">${reqText(s.req)}</div>
        </div>
        <button class="btn btn-sm ${on?'btn-danger':'btn-primary'}" ${!ok&&!on?'disabled':''}
          onclick="const e=toggleSide('${s.id}');if(e)toast(e);renderWork();saveGame()">${on?'Stop':'Start'}</button>
      </div>`;
    }).join("");
  } else if (workTab === "biz") {
    $("work-biz").innerHTML = BUSINESS_DEFS.map(b => {
      const owned = !!S.businesses[b.id];
      const ok = meetsReq(b.req);
      return `<div class="card biz-card">
        <div class="card-row"><div><h3>${esc(b.name)} ${owned?'<span class="badge badge-green">OWNED</span>':''}</h3>
          <div class="meta">${esc(b.desc)}</div>
          <div class="meta">Net ~${fmt(b.income-b.upkeep)}/day after upkeep · Cost ${fmt(b.cost,0)}</div>
          <div class="meta">${reqText(b.req)}</div></div></div>
        ${owned?'':`<button class="btn btn-primary btn-sm mt-8" ${!ok?'disabled':''}
          onclick="const e=buyBusiness('${b.id}');if(e)toast(e);renderWork();saveGame()">Buy ${fmt(b.cost,0)}</button>`}
      </div>`;
    }).join("");
  }
}
function reqText(req){
  if (!req || !Object.keys(req).length) return "No skill requirements";
  return "Requires: " + Object.keys(req).map(k => k+" "+req[k]).join(", ");
}

// Auth wiring (defensive — never throw)
(function wireAuth(){
  function safe(id){ try { return document.getElementById(id); } catch(_){ return null; } }
  const gotoReg = safe("goto-register");
  const gotoLog = safe("goto-login");
  const btnReg = safe("btn-register");
  const btnLog = safe("btn-login");
  if (gotoReg) gotoReg.onclick = () => {
    const a = safe("auth-login"), b = safe("auth-register");
    if (a) a.classList.add("hidden");
    if (b) b.classList.remove("hidden");
  };
  if (gotoLog) gotoLog.onclick = () => {
    const a = safe("auth-register"), b = safe("auth-login");
    if (a) a.classList.add("hidden");
    if (b) b.classList.remove("hidden");
  };
  if (btnReg) btnReg.onclick = () => {
    try {
      const user = (safe("reg-user")||{}).value;
      const pass = (safe("reg-pass")||{}).value;
      const name = (safe("reg-name")||{}).value;
      const err = register(user, pass, name, "normal");
      const errEl = safe("reg-err");
      if (err) { if (errEl) errEl.textContent = err; return; }
      if (errEl) errEl.textContent = "";
      // auto-login after successful register
      const loginErr = login(user, pass);
      if (loginErr) {
        toast("Account created — sign in");
        const a = safe("auth-register"), b = safe("auth-login");
        if (a) a.classList.add("hidden");
        if (b) b.classList.remove("hidden");
        if (safe("login-user")) safe("login-user").value = user;
        return;
      }
      toast("Welcome — account ready");
      enterGame();
    } catch (e) {
      console.error("register failed", e);
      const errEl = safe("reg-err");
      if (errEl) errEl.textContent = "Error: " + (e.message || e);
    }
  };
  if (btnLog) btnLog.onclick = () => {
    try {
      const user = (safe("login-user")||{}).value;
      const pass = (safe("login-pass")||{}).value;
      const err = login(user, pass);
      const errEl = safe("login-err");
      if (err) { if (errEl) errEl.textContent = err; return; }
      if (errEl) errEl.textContent = "";
      enterGame();
    } catch (e) {
      console.error("login failed", e);
      const errEl = safe("login-err");
      if (errEl) errEl.textContent = "Error: " + (e.message || e);
    }
  };
  ["login-pass","login-user","reg-pass","reg-user"].forEach(id => {
    const el = safe(id);
    if (!el) return;
    el.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      if (id.startsWith("reg") && btnReg) btnReg.click();
      else if (btnLog) btnLog.click();
    });
  });
})();

function checkGoals(){
  if (!S.achievements) S.achievements = [];
  GOAL_DEFS.forEach(g => {
    if (S.achievements.includes(g.id)) return;
    try {
      if (g.check(S)) {
        S.achievements.push(g.id);
        // No free cash — career tokens only
        if (!S.careerTokens) S.careerTokens = 0;
        const tok = Math.max(1, Math.min(15, Math.round((g.reward || 100) / 100)));
        S.careerTokens += tok;
        toast("Goal: " + g.name + " · +" + tok + " career token" + (tok > 1 ? "s" : ""));
      }
    } catch(_){}
  });
}

// ---------- ECONOMIC CYCLE ----------
function economicPhase(){
  // long cycle based on day
  const cycle = Math.sin(S.day / 40) + (S.marketSentiment||0);
  if (cycle > 0.6) return "expansion";
  if (cycle > 0) return "recovery";
  if (cycle > -0.6) return "slowdown";
  return "recession";
}
function phaseLabel(){
  const p = economicPhase();
  return ({ expansion:"Expansion", recovery:"Recovery", slowdown:"Slowdown", recession:"Recession" })[p];
}

// Patch onNewDay to check goals - monkey patch
const _onNewDay = onNewDay;
onNewDay = function(){
  _onNewDay();
  checkGoals();
  // phase effects on job security
  const phase = economicPhase();
  if (phase === "recession" && S.jobId && chance(0.03)) {
    toast("Layoffs — you lost your job in the recession");
    S.jobId = null;
    adjustCredit(-5);
  }
  if (phase === "expansion" && S.jobId && chance(0.04)) {
    S._raiseMult = (S._raiseMult||1) * 1.02;
  }
};

// ---------- BUDGET HELPER ----------
function monthlyBurn(){
  let burn = 0;
  S.bills.forEach(b => burn += b.amount);
  if (S.insurance.health) burn += 280;
  if (S.insurance.auto) burn += 120;
  if (S.insurance.home) burn += 90;
  if (S.insurance.life) burn += 40;
  return burn;
}
function monthlyIncomeEst(){
  return dailySalary()*30*(S._raiseMult||1) + sideDailyIncome()*30 + Math.max(0,businessDailyNet())*30 + Math.max(0,propertyDailyCashflow())*30;
}

window.uiTransfer = function(){
  const from = $("tx-from").value, to = $("tx-to").value;
  const amt = Number($("tx-amt").value);
  if (from === to) return toast("Pick different accounts");
  if (!(amt > 0)) return toast("Enter amount");
  if (!canAfford(amt, from)) return toast("Insufficient funds");
  if (from === "checking") S.checking -= amt;
  if (from === "savings") S.savings -= amt;
  if (from === "brokerage") S.brokerage -= amt;
  if (to === "checking") S.checking += amt;
  if (to === "savings") S.savings += amt;
  if (to === "brokerage") S.brokerage += amt;
  addTx("transfer", from+" → "+to, -amt, from);
  toast("Transferred "+fmt(amt));
  renderBank(); saveGame();
};

// ---------- EXTENDED MARKET MICROSTRUCTURE ----------
function tickMarketsExtended(){
  // sector correlations
  const sectorShock = {};
  ["Tech","Finance","Health","Energy","Consumer","Media","Industrial","Retail","Auto","Transport","Index"].forEach(s => {
    sectorShock[s] = rnd(-0.004, 0.004) + (S.marketSentiment||0)*0.001;
  });
  Object.keys(S.stocks).forEach(sym => {
    const st = S.stocks[sym];
    const sec = sectorShock[st.sector] || 0;
    st.price = Math.max(0.5, st.price * (1 + sec * 0.5));
  });
  // crypto BTC dominance spillover
  if (S.cryptos.BTC && S.cryptos.ETH) {
    const btcChg = (S.cryptos.BTC.price - S.cryptos.BTC.prev) / (S.cryptos.BTC.prev||1);
    Object.keys(S.cryptos).forEach(sym => {
      if (sym === "BTC") return;
      S.cryptos[sym].price = Math.max(0.0001, S.cryptos[sym].price * (1 + btcChg * 0.3 * rnd(0.5,1.2)));
    });
  }
}

// ---------- STATEMENT GENERATOR ----------
function monthStatement(){
  const startDay = Math.max(1, S.day - 30);
  const txs = (S.transactions||[]).filter(t => t.day >= startDay);
  let inflow = 0, outflow = 0;
  txs.forEach(t => { if (t.amount>=0) inflow+=t.amount; else outflow+=Math.abs(t.amount); });
  return { startDay, endDay:S.day, inflow, outflow, net:inflow-outflow, count:txs.length };
}

const WATCHLIST_DEFAULT = ["AAPL","MSFT","NVDA","SPY","BTC","ETH"];

function ensureExtras(){
  if (!S.watchlist) S.watchlist = WATCHLIST_DEFAULT.slice();
  if (!S.budgetCaps) S.budgetCaps = { living:500, utilities:250, fun:150 };
  if (!S.notes) S.notes = [];
  if (!S.priceAlerts) S.priceAlerts = [];
}

function allocationBreakdown(){
  const cash = (S.checking||0)+(S.savings||0);
  const eq = portfolioStocks();
  const cr = portfolioCrypto();
  const fu = portfolioFunds()+(S.ira||0);
  const pr = Math.max(0, propertyEquity());
  const total = cash+eq+cr+fu+pr;
  if (total <= 0) return { cash:0, equity:0, crypto:0, funds:0, property:0, total:0 };
  return {
    cash: cash/total, equity: eq/total, crypto: cr/total, funds: fu/total, property: pr/total, total
  };
}

function riskScore(){
  // 0 = conservative, 100 = aggressive
  const a = allocationBreakdown();
  let score = a.crypto*90 + a.equity*55 + a.property*35 + a.funds*30 + a.cash*5;
  score += Math.min(30, (totalDebt() / Math.max(1000, netWorth()+totalDebt())) * 40);
  return clamp(Math.round(score), 0, 100);
}

function riskLabel(n){
  if (n < 25) return "Conservative";
  if (n < 45) return "Moderate";
  if (n < 70) return "Growth";
  return "Aggressive";
}

function categorySpend(days){
  const start = S.day - (days||30);
  const map = {};
  (S.transactions||[]).forEach(t => {
    if (t.day < start || t.amount >= 0) return;
    const key = t.type || "other";
    map[key] = (map[key]||0) + Math.abs(t.amount);
  });
  return map;
}

function wealthSeries(){
  return (S.netHistory||[]).map(x => x.nw);
}

function maxDrawdown(series){
  if (!series || series.length < 2) return 0;
  let peak = series[0], maxDd = 0;
  series.forEach(v => {
    if (v > peak) peak = v;
    const dd = peak > 0 ? (peak - v) / peak : 0;
    if (dd > maxDd) maxDd = dd;
  });
  return maxDd;
}

function addNote(text){
  text = String(text||"").trim().slice(0, 280);
  if (!text) return "Empty note";
  S.notes.unshift({ id:uid(), day:S.day, text });
  if (S.notes.length > 50) S.notes.length = 50;
  return null;
}

function toggleWatch(sym){
  ensureExtras();
  const i = S.watchlist.indexOf(sym);
  if (i >= 0) S.watchlist.splice(i,1);
  else S.watchlist.push(sym);
}

function checkPriceAlerts(){
  ensureExtras();
  (S.priceAlerts||[]).forEach(a => {
    if (a.hit) return;
    const st = S.stocks[a.symbol] || S.cryptos[a.symbol];
    if (!st) return;
    if (a.dir === "above" && st.price >= a.price) { a.hit = true; toast("Alert: "+a.symbol+" above "+fmt(a.price)); }
    if (a.dir === "below" && st.price <= a.price) { a.hit = true; toast("Alert: "+a.symbol+" below "+fmt(a.price)); }
  });
}

// ---------- BOND LADDER HELPER (education + mild sim) ----------
function bondLadderValue(principal, years, rate){
  // future value of reinvested annual coupons simplified
  let v = principal;
  for (let y=0;y<years;y++) v *= (1+rate);
  return v;
}
function mortgagePayment(principal, annualRate, years){
  const r = annualRate/12;
  const n = years*12;
  if (r === 0) return principal/n;
  return principal * (r * Math.pow(1+r,n)) / (Math.pow(1+r,n)-1);
}
function affordabilityCheck(incomeMonthly, debtsMonthly, newPayment){
  // backend ratio style
  const dti = (debtsMonthly + newPayment) / Math.max(1, incomeMonthly);
  return { dti, ok: dti <= 0.43 };
}
function compound(principal, annualRate, years, compoundsPerYear){
  const n = compoundsPerYear || 12;
  return principal * Math.pow(1 + annualRate/n, n*years);
}
function ruleOf72(rate){
  return rate > 0 ? 72 / (rate*100) : Infinity;
}

// ---------- RETIREMENT PROJECTION ----------
function projectRetirement(years){
  let bal = (S.ira||0) + portfolioFunds()*0.3;
  const yearlyAdd = Math.min(6500, Math.max(0, monthlyIncomeEst()*0.1*12));
  for (let y=0;y<years;y++){
    bal = bal * 1.06 + yearlyAdd;
  }
  return bal;
}

function sectorPerformance(){
  const map = {};
  Object.keys(S.stocks).forEach(sym => {
    const st = S.stocks[sym];
    if (!map[st.sector]) map[st.sector] = [];
    const chg = st.prev ? (st.price-st.prev)/st.prev : 0;
    map[st.sector].push(chg);
  });
  const out = {};
  Object.keys(map).forEach(sec => {
    const arr = map[sec];
    out[sec] = arr.reduce((a,b)=>a+b,0) / arr.length;
  });
  return out;
}

// ---------- WATCHLIST & PRICE ALERTS ----------
function ensureWatchlist() {
  if (!S.watchlist) S.watchlist = [];
  if (!S.priceAlerts) S.priceAlerts = [];
  if (!S.notes) S.notes = [];
  if (!S.budgetCaps) S.budgetCaps = { housing: 0.3, food: 0.15, transport: 0.1, utilities: 0.08, entertainment: 0.05, other: 0.12 };
  if (!S.budgetSpent) S.budgetSpent = {};
  if (!S.netWorthHistory) S.netWorthHistory = [];
  if (!S.insurancePolicies) S.insurancePolicies = [];
  if (!S.taxWithheld) S.taxWithheld = 0;
  if (!S.ytdIncome) S.ytdIncome = 0;
  if (!S.ytdCapitalGains) S.ytdCapitalGains = 0;
  if (!S.emergencyFundGoal) S.emergencyFundGoal = 10000;
  if (!S.autoPayBills) S.autoPayBills = false;
  if (!S.dividendReinvest) S.dividendReinvest = true;
  if (!S.hardshipMode) S.hardshipMode = false;
  if (!S.tutorialStep) S.tutorialStep = 0;
  if (!S.seenTips) S.seenTips = [];
  if (!S.bondLadder) S.bondLadder = [];
  if (!S.optionsPositions) S.optionsPositions = [];
  if (!S.statements) S.statements = [];
}

function addToWatchlist(symbol, type) {
  ensureWatchlist();
  if (S.watchlist.find(w => w.symbol === symbol && w.type === type)) return "Already on watchlist";
  S.watchlist.push({ symbol, type, addedDay: S.day });
  save();
  return "Added " + symbol + " to watchlist";
}

function removeFromWatchlist(symbol, type) {
  ensureWatchlist();
  S.watchlist = S.watchlist.filter(w => !(w.symbol === symbol && w.type === type));
  save();
  return "Removed";
}

function setPriceAlert(symbol, type, direction, price) {
  ensureWatchlist();
  S.priceAlerts.push({
    id: "pa_" + Date.now(),
    symbol, type, direction, // "above" | "below"
    target: price,
    active: true,
    createdDay: S.day
  });
  save();
  return "Alert set: " + symbol + " " + direction + " $" + price;
}

function checkPriceAlerts() {
  ensureWatchlist();
  S.priceAlerts.forEach(a => {
    if (!a.active) return;
    let p = 0;
    if (a.type === "stock" && S.stocks[a.symbol]) p = S.stocks[a.symbol].price;
    else if (a.type === "crypto" && S.cryptos[a.symbol]) p = S.cryptos[a.symbol].price;
    if (!p) return;
    if (a.direction === "above" && p >= a.target) {
      a.active = false;
      toast("🔔 ALERT: " + a.symbol + " hit $" + p.toFixed(2) + " (above " + a.target + ")");
      addNews("Price Alert", a.symbol + " crossed above $" + a.target);
    } else if (a.direction === "below" && p <= a.target) {
      a.active = false;
      toast("🔔 ALERT: " + a.symbol + " hit $" + p.toFixed(2) + " (below " + a.target + ")");
      addNews("Price Alert", a.symbol + " crossed below $" + a.target);
    }
  });
}

function addNews(title, body) {
  if (!S.news) S.news = [];
  S.news.unshift({ day: S.day, t: "alert", title, body, at: Date.now() });
  if (S.news.length > 60) S.news.length = 60;
}

// ---------- BUDGET PLANNER ----------
function getMonthlyIncomeEstimate() {
  let inc = 0;
  if (S.jobId && typeof currentJob === "function") {
    const j = currentJob();
    if (j) inc += (j.salary || 0) / 12;
  }
  (S.sideHustles || []).forEach(id => {
    if (typeof SIDE_HUSTLES !== "undefined") {
      const d = SIDE_HUSTLES.find(s => s.id === id);
      if (d) inc += (d.income || 0) * 30;
    }
  });
  return inc;
}

function getCategorySpend(cat) {
  ensureWatchlist();
  return S.budgetSpent[cat] || 0;
}

function recordBudgetSpend(cat, amount) {
  ensureWatchlist();
  S.budgetSpent[cat] = (S.budgetSpent[cat] || 0) + amount;
}

function resetMonthlyBudget() {
  ensureWatchlist();
  S.budgetSpent = {};
}

function budgetStatus() {
  ensureWatchlist();
  const income = getMonthlyIncomeEstimate();
  const out = {};
  Object.keys(S.budgetCaps).forEach(cat => {
    const cap = income * S.budgetCaps[cat];
    const spent = getCategorySpend(cat);
    out[cat] = { cap, spent, pct: cap > 0 ? spent / cap : 0, over: spent > cap };
  });
  return out;
}

// ---------- TAX ENGINE ----------
function estimateFederalTax(taxableIncome) {
  // simplified progressive brackets (2024-ish single)
  const brackets = [
    { upTo: 11600, rate: 0.10 },
    { upTo: 47150, rate: 0.12 },
    { upTo: 100525, rate: 0.22 },
    { upTo: 191950, rate: 0.24 },
    { upTo: 243725, rate: 0.32 },
    { upTo: 609350, rate: 0.35 },
    { upTo: Infinity, rate: 0.37 },
  ];
  let tax = 0, prev = 0;
  for (const b of brackets) {
    const slice = Math.min(taxableIncome, b.upTo) - prev;
    if (slice <= 0) break;
    tax += slice * b.rate;
    prev = b.upTo;
  }
  return tax;
}

function estimateCapitalGainsTax(gains) {
  // long-term simplified 15%
  if (gains <= 0) return 0;
  return gains * 0.15;
}

function computeAnnualTaxBill() {
  ensureWatchlist();
  const ordinary = Math.max(0, (S.ytdIncome || 0) - 14600); // standard deduction approx
  const fed = estimateFederalTax(ordinary);
  const cg = estimateCapitalGainsTax(S.ytdCapitalGains || 0);
  const state = (S.ytdIncome || 0) * 0.05; // flat state approx
  const total = fed + cg + state;
  const withheld = S.taxWithheld || 0;
  return { fed, cg, state, total, withheld, due: Math.max(0, total - withheld) };
}

function payTaxes() {
  const bill = computeAnnualTaxBill();
  if (bill.due <= 0) {
    toast("No taxes due (or refund situation)");
    return;
  }
  if (S.checking < bill.due) return "Insufficient checking to pay taxes";
  S.checking -= bill.due;
  logTx(-bill.due, "Tax payment", "checking");
  S.taxWithheld = (S.taxWithheld || 0) + bill.due;
  S.ytdIncome = 0;
  S.ytdCapitalGains = 0;
  adjustCredit(5);
  save();
  toast("Taxes paid: $" + bill.due.toFixed(0));
  return "Paid";
}

// ---------- RETIREMENT / IRA HELPERS ----------
function iraContributionRoom() {
  const limit = (typeof CFG_IRA_ANNUAL_LIMIT !== "undefined") ? CFG_IRA_ANNUAL_LIMIT : 6500;
  return Math.max(0, limit - (S.iraContributedYTD || 0));
}

function contributeIRA(amount) {
  const room = iraContributionRoom();
  if (amount > room) return "Exceeds annual IRA limit remaining ($" + room.toFixed(0) + ")";
  if (S.checking < amount) return "Not enough checking";
  S.checking -= amount;
  S.ira = (S.ira || 0) + amount;
  S.iraContributedYTD = (S.iraContributedYTD || 0) + amount;
  logTx(-amount, "IRA contribution", "checking");
  save();
  return "Contributed $" + amount.toFixed(0) + " to IRA";
}

function projectRetirement(years, annualReturn) {
  const current = (S.ira || 0) + portfolioStocks() * 0.3; // rough
  const monthly = getMonthlyIncomeEstimate() * 0.15; // assume 15% savings rate
  let bal = current;
  const r = (annualReturn || 0.07) / 12;
  for (let m = 0; m < years * 12; m++) {
    bal = bal * (1 + r) + monthly;
  }
  return bal;
}

// ---------- BOND LADDER ----------
function buyBond(face, years, yieldRate) {
  ensureWatchlist();
  const cost = face; // par for simplicity
  if (S.brokerage < cost) return "Need brokerage cash";
  S.brokerage -= cost;
  logTx(-cost, "Bond purchase " + years + "yr", "brokerage");
  S.bondLadder.push({
    id: "bond_" + Date.now(),
    face, years, yield: yieldRate,
    boughtDay: S.day,
    maturesDay: S.day + years * 365,
    accrued: 0
  });
  save();
  return "Bond ladder rung added";
}

function tickBonds() {
  ensureWatchlist();
  S.bondLadder.forEach(b => {
    // daily accrual
    b.accrued += (b.face * b.yield) / 365;
  });
  // maturity
  const matured = S.bondLadder.filter(b => S.day >= b.maturesDay);
  matured.forEach(b => {
    S.brokerage += b.face + b.accrued;
    logTx(b.face + b.accrued, "Bond matured", "brokerage");
    toast("Bond matured: +$" + (b.face + b.accrued).toFixed(0));
  });
  S.bondLadder = S.bondLadder.filter(b => S.day < b.maturesDay);
}

// ---------- NET WORTH HISTORY & DRAWDOWN ----------
function recordNetWorthPoint() {
  ensureWatchlist();
  const nw = netWorth();
  S.netWorthHistory.push({ day: S.day, nw });
  if (S.netWorthHistory.length > 365) S.netWorthHistory.shift();
}

function maxDrawdown() {
  ensureWatchlist();
  const hist = S.netWorthHistory;
  if (hist.length < 2) return 0;
  let peak = hist[0].nw;
  let maxDd = 0;
  hist.forEach(p => {
    if (p.nw > peak) peak = p.nw;
    const dd = peak > 0 ? (peak - p.nw) / peak : 0;
    if (dd > maxDd) maxDd = dd;
  });
  return maxDd;
}

function riskScore() {
  // 0-100 higher = riskier
  const stocks = portfolioStocks();
  const crypto = portfolioCrypto();
  const funds = portfolioFunds();
  const total = stocks + crypto + funds + (S.ira || 0) + (S.brokerage || 0);
  if (total < 1) return 10;
  const cryptoPct = crypto / total;
  const equityPct = (stocks + funds * 0.7) / total;
  const cashPct = ((S.checking || 0) + (S.savings || 0) + (S.brokerage || 0)) / Math.max(1, netWorth());
  let score = equityPct * 50 + cryptoPct * 90 + (1 - cashPct) * 20;
  const dd = maxDrawdown();
  score += dd * 40;
  return clamp(Math.round(score), 0, 100);
}

function riskLabel(score) {
  if (score < 25) return { t: "Conservative", c: "var(--green)" };
  if (score < 45) return { t: "Moderate", c: "var(--cyan)" };
  if (score < 65) return { t: "Growth", c: "var(--gold)" };
  if (score < 80) return { t: "Aggressive", c: "var(--orange)" };
  return { t: "Speculative", c: "var(--red)" };
}

// ---------- ALLOCATION BREAKDOWN ----------
function allocationBreakdown() {
  const cash = (S.checking || 0) + (S.savings || 0);
  const brokerageCash = S.brokerage || 0;
  const stocks = portfolioStocks();
  const crypto = portfolioCrypto();
  const funds = portfolioFunds();
  const ira = S.ira || 0;
  const prop = (S.properties || []).reduce((s, p) => s + (p.value || 0) - (p.mortgage || 0), 0);
  const total = cash + brokerageCash + stocks + crypto + funds + ira + Math.max(0, prop);
  if (total < 1) return [];
  return [
    { name: "Cash", v: cash, pct: cash / total },
    { name: "Brokerage cash", v: brokerageCash, pct: brokerageCash / total },
    { name: "Stocks", v: stocks, pct: stocks / total },
    { name: "Crypto", v: crypto, pct: crypto / total },
    { name: "Funds/ETFs", v: funds, pct: funds / total },
    { name: "IRA", v: ira, pct: ira / total },
    { name: "Property equity", v: Math.max(0, prop), pct: Math.max(0, prop) / total },
  ].filter(x => x.v > 0);
}

// ---------- HARDSHIP / BANKRUPTCY RECOVERY ----------
function checkHardship() {
  ensureWatchlist();
  const nw = netWorth();
  if (nw < -5000 || ((S.checking || 0) + (S.savings || 0) < 0 && (S.creditBalance || 0) > (S.creditLimit || 0))) {
    if (!S.hardshipMode) {
      S.hardshipMode = true;
      toast("⚠️ Hardship mode activated — recovery path available");
      addNews("Hardship", "Your finances are in critical condition. Open Profile → Hardship Recovery.");
    }
  }
}

function hardshipRecovery() {
  ensureWatchlist();
  if (!S.hardshipMode) return "Not in hardship";
  // debt restructuring
  (S.loans || []).forEach(l => {
    l.principal *= 0.7;
    l.rate = Math.min(l.rate, 0.12);
  });
  S.creditBalance = Math.min(S.creditBalance || 0, (S.creditLimit || 1000) * 0.5);
  S.checking = Math.max(S.checking || 0, 500);
  S.hardshipMode = false;
  adjustCredit(-40);
  logTx(500, "Hardship recovery stipend", "checking");
  toast("Hardship recovery applied — debt reduced, small stipend granted. Credit took a hit.");
  save();
  return "Recovered";
}

// ---------- STATEMENT GENERATOR ----------
function generateMonthlyStatement() {
  ensureWatchlist();
  const bill = computeAnnualTaxBill();
  const stmt = {
    day: S.day,
    netWorth: netWorth(),
    checking: S.checking,
    savings: S.savings,
    brokerage: S.brokerage,
    ira: S.ira,
    creditBalance: S.creditBalance,
    creditScore: S.creditScore,
    portfolio: portfolioStocks() + portfolioCrypto() + portfolioFunds(),
    debt: totalDebt(),
    risk: riskScore(),
    incomeYTD: S.ytdIncome,
    taxEstimate: bill.total,
  };
  S.statements.unshift(stmt);
  if (S.statements.length > 24) S.statements.length = 24;
  return stmt;
}
