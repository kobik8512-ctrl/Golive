<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Go Live</title>

<style>
:root{
  --bg:#0a0a0c;
  --card:#16161a;
  --card2:#1c1c22;
  --accent:#ff2d55;
  --text:#f2f2f5;
  --muted:#8b8b96;
  --green:#30d158;
  --danger:#ff453a;
  --border:#2a2a32;
  --gold:#ffd60a
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent
}

button{
  cursor:pointer;
  border:0;
  font:inherit;
  background:none;
  color:inherit
}

input{
  font:inherit
}

.screen{
  display:none;
  min-height:100vh;
  flex-direction:column
}

.screen.active{
  display:flex
}

/* LOGIN */

#login-screen{
  align-items:center;
  justify-content:center;
  padding:24px;
  background:radial-gradient(ellipse at top,#1a0a12 0%,var(--bg) 60%)
}

.login-box{
  width:100%;
  max-width:360px;
  text-align:center
}

.login-logo{
  font-size:2.4rem;
  font-weight:800;
  margin-bottom:8px
}

.login-logo span,
.menu-title span{
  color:var(--accent)
}

.login-sub{
  color:var(--muted);
  margin-bottom:40px
}

.btn-google{
  width:100%;
  background:#fff;
  color:#1f1f1f;
  padding:14px 20px;
  border-radius:14px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px
}

.btn-google:disabled{
  opacity:.6
}

.btn-google svg{
  width:20px
}

.login-note{
  margin-top:24px;
  font-size:.8rem;
  color:var(--muted)
}

/* MENU */

#menu{
  padding:20px 16px 160px
}

.broadcast-label,
.section-label{
  font-size:.7rem;
  font-weight:600;
  letter-spacing:1.5px;
  color:var(--muted);
  text-transform:uppercase
}

.menu-title{
  font-size:2.1rem;
  font-weight:800;
  margin:6px 0 10px
}

.signed-in{
  font-size:.95rem;
  color:var(--muted);
  margin-bottom:28px
}

.signed-in strong{
  color:var(--green)
}

.lives-list{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-top:12px
}

.live-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:14px 14px 14px 16px;
  display:flex;
  align-items:center;
  gap:12px
}

.live-info{
  flex:1;
  min-width:0
}

.live-name{
  font-weight:700;
  font-size:1.05rem;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.live-meta{
  font-size:.82rem;
  color:var(--muted);
  margin-top:3px
}

.live-meta .dot{
  display:inline-block;
  width:7px;
  height:7px;
  background:var(--accent);
  border-radius:50%;
  margin-right:6px
}

.btn-join{
  background:var(--accent);
  font-weight:700;
  padding:10px 18px;
  border-radius:999px
}

.btn-x-small{
  width:32px;
  height:32px;
  border-radius:50%;
  background:var(--card2);
  color:var(--muted)
}

.empty-state{
  text-align:center;
  padding:48px 20px;
  color:var(--muted);
  background:var(--card);
  border-radius:16px;
  border:1px dashed var(--border);
  line-height:1.5
}

.bottom-actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:16px 16px 28px;
  background:linear-gradient(transparent,var(--bg) 25%);
  display:flex;
  flex-direction:column;
  gap:10px;
  z-index:30
}

.btn-go-live{
  background:var(--accent);
  font-size:1.15rem;
  font-weight:700;
  padding:16px;
  border-radius:999px;
  box-shadow:0 8px 28px rgba(255,45,85,.35)
}

.btn-secondary{
  background:transparent;
  color:var(--muted);
  padding:12px;
  border-radius:999px;
  border:1px solid var(--border)
}

/* LIVE ROOM */

#live-room{
  position:relative;
  background:#000;
  height:100vh;
  height:100dvh;
  overflow:hidden
}

#video-wrap{
  position:absolute;
  inset:0;
  background:#0d0d10;
  display:flex;
  align-items:center;
  justify-content:center
}

#local-video,
#remote-video{
  width:100%;
  height:100%;
  object-fit:cover;
  display:none
}

#local-video.mirror{
  transform:scaleX(-1)
}

.cam-off{
  text-align:center;
  color:var(--muted)
}

.cam-off .icon{
  font-size:3.5rem;
  margin-bottom:10px
}

/* HEADER */

.live-header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  padding:12px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  z-index:40;
  pointer-events:none
}

.live-header>*{
  pointer-events:auto
}

.live-pill{
  background:rgba(0,0,0,.6);
  backdrop-filter:blur(12px);
  border-radius:999px;
  padding:8px 14px;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:.88rem;
  font-weight:600;
  max-width:65%
}

.red-dot{
  width:8px;
  height:8px;
  background:var(--accent);
  border-radius:50%;
  animation:blink 1.4s infinite
}

.title-text{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.watchers{
  color:var(--muted);
  font-weight:500;
  white-space:nowrap
}

@keyframes blink{
  0%,100%{opacity:1}
  50%{opacity:.35}
}

.header-btns{
  display:flex;
  gap:8px
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:50%;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center
}

.icon-btn.b-btn{
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  font-weight:800;
  border:0
}

/* CHAT */

.chat-wrap{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:34%;
  display:flex;
  flex-direction:column;
  background:linear-gradient(to top,rgba(0,0,0,.92) 45%,transparent);
  z-index:30;
  pointer-events:none
}

.chat-list{
  flex:1;
  overflow:hidden;
  padding:10px 12px 6px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:3px;
  pointer-events:none;
  scrollbar-width:none
}

.msg{
  font-size:.86rem;
  line-height:1.3;
  word-break:break-word;
  contain:content
}

.msg .uname{
  font-weight:700;
  margin-right:5px
}

.msg .c0{color:#ff6b9d}
.msg .c1{color:#5ac8fa}
.msg .c2{color:#30d158}
.msg .c3{color:#ffd60a}
.msg .c4{color:#bf5af2}
.msg .c5{color:#ff9f0a}
.msg .c6{color:#64d2ff}
.msg .c7{color:#ff375f}

.msg.host .uname{
  color:var(--accent)
}

.msg.gift-msg{
  color:var(--gold);
  font-weight:600
}

.chat-bar{
  display:flex;
  gap:8px;
  padding:6px 10px 16px;
  pointer-events:auto;
  align-items:center
}

#chat-input{
  flex:1;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.12);
  border-radius:999px;
  padding:11px 16px;
  color:#fff;
  outline:0
}

.btn-send,
.btn-gift{
  font-weight:700;
  padding:11px 15px;
  border-radius:999px
}

.btn-send{
  background:var(--accent)
}

.btn-gift{
  background:linear-gradient(135deg,#ffd60a,#ff9f0a);
  color:#1a1a1a
}

.mic-status{
  position:absolute;
  bottom:36%;
  left:12px;
  font-size:.78rem;
  color:var(--green);
  z-index:25;
  pointer-events:none;
  opacity:.85
}

.coins-badge{
  position:absolute;
  bottom:36%;
  right:12px;
  z-index:25;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  border-radius:999px;
  padding:6px 12px;
  font-size:.82rem;
  font-weight:700;
  border:1px solid rgba(255,215,0,.3)
}

/* BOT + GIFT PANELS */

#gift-panel,
#bot-panel,
#title-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:90
}

#gift-panel.show,
#bot-panel.show,
#title-modal.show{
  display:flex
}

.sheet{
  background:var(--card);
  border-radius:20px 20px 0 0;
  width:100%;
  max-width:480px;
  max-height:72vh;
  border:1px solid var(--border);
  animation:up .22s ease;
  overflow:hidden
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:none}
}

.sheet-head{
  padding:14px 16px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center
}

.sheet-head h3{
  font-size:1.05rem
}

.close{
  font-size:1.3rem;
  color:var(--muted);
  padding:4px 8px
}

.bot-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:14px;
  overflow:auto
}

.bot-choice{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:15px;
  padding:15px;
  text-align:center;
  font-weight:800;
  font-size:1rem
}

.bot-choice small{
  display:block;
  color:var(--muted);
  font-weight:500;
  margin-top:4px
}

.bot-choice.selected{
  border-color:#06b6d4;
  background:rgba(6,182,212,.12)
}

/* GIFTS */

.gift-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  padding:12px;
  overflow:auto;
  max-height:58vh
}

.gift-item{
  background:var(--card2);
  border-radius:14px;
  padding:10px 6px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px
}

.g-emoji{
  font-size:1.7rem
}

.g-name{
  font-size:.68rem;
  color:var(--muted);
  text-align:center
}

.g-cost{
  font-size:.72rem;
  font-weight:700;
  color:var(--gold)
}

#gift-anim{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center
}

.gift-fly{
  font-size:4.5rem;
  animation:giftFly 1.6s ease forwards
}

@keyframes giftFly{
  0%{transform:scale(.3) translateY(80px);opacity:0}
  30%{transform:scale(1.3);opacity:1}
  100%{transform:scale(.6) translateY(-120px);opacity:0}
}

.gift-label{
  position:absolute;
  bottom:38%;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.75);
  color:var(--gold);
  padding:8px 18px;
  border-radius:999px;
  font-weight:700;
  animation:label 1.6s ease forwards
}

@keyframes label{
  0%{opacity:0;transform:translate(-50%,20px)}
  25%{opacity:1;transform:translate(-50%,0)}
  100%{opacity:0;transform:translate(-50%,-30px)}
}

/* TITLE */

.modal-card{
  background:var(--card);
  border-radius:20px;
  padding:28px 22px;
  width:100%;
  max-width:340px;
  border:1px solid var(--border)
}

.modal-card h3{
  text-align:center;
  margin-bottom:18px
}

#title-input{
  width:100%;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:14px;
  color:#fff;
  margin-bottom:16px;
  outline:0
}

.modal-actions{
  display:flex;
  gap:10px
}

.modal-actions button{
  flex:1;
  padding:13px;
  border-radius:12px;
  font-weight:600
}

.btn-cancel{
  background:var(--card2)
}

.btn-confirm{
  background:var(--accent)
}

#toast{
  position:fixed;
  top:60px;
  left:50%;
  transform:translateX(-50%) translateY(-12px);
  background:rgba(20,20,24,.94);
  padding:10px 18px;
  border-radius:999px;
  font-size:.88rem;
  opacity:0;
  transition:.28s;
  z-index:200;
  pointer-events:none;
  border:1px solid var(--border)
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0)
}

@media(max-width:420px){
  .chat-wrap{height:37%}
  .msg{font-size:.82rem}
  .icon-btn{width:38px;height:38px}
  .live-pill{max-width:60%}
}
</style>
</head>

<div id="live-room" class="screen">

    <div class="header-btns">

      <button class="icon-btn" id="btn-flip">🔄</button>
      <button class="icon-btn" id="btn-leave">✕</button>
    </div>

  </div>

  <div class="mic-status" id="mic-status">Mic: listening...</div>

  <div class="coins-badge">
    🪙 <span id="coins-count">0</span>
  </div>

  <div class="chat-wrap">
    <div class="chat-list" id="chat-list"></div>

    <div class="chat-bar">
      <input
        id="chat-input"
        placeholder="Say something..."

        autocomplete="off"
      >

      <button class="btn-gift" id="btn-gift">🎁</button>
      <button class="btn-send" id="btn-send">Send</button>
    </div>
  </div>
</div>

<!-- BOT MENU -->

<div id="bot-panel">
  <div class="sheet">

    <div class="sheet-head">
      <h3>Add bots</h3>
      <button class="close" id="bot-close">✕</button>
    </div>

    <div class="bot-grid" id="bot-grid"></div>

  </div>
</div>

<!-- GIFT MENU -->

<div id="gift-panel">
  <div class="sheet">

    <div class="sheet-head">
      <h3>Send a Gift</h3>
      <button class="close" id="gift-close">✕</button>
    </div>

    <div class="gift-grid" id="gift-grid"></div>

  </div>
</div>

<div id="gift-anim"></div>

<!-- TITLE -->

<div id="title-modal">

  <div class="modal-card">

    <h3>Name your live</h3>

    <input
      id="title-input"
      placeholder="e.g. my live"
      maxlength="40"
    >

    <div class="modal-actions">
      <button class="btn-cancel" id="btn-cancel">Cancel</button>
      <button class="btn-confirm" id="btn-start">Start Live</button>
    </div>

  </div>

</div>

<div id="toast"></div>

function rand(a){
  return a[Math.floor(Math.random()*a.length)];
}


function makeName(){
  return rand(ADJS)+rand(NOUNS)+
    (Math.random()<.5 ? Math.floor(Math.random()*9999) : "");
}


function normalMsg(){

  if(Math.random()<.62){
    return rand(PHRASES);
  }

  const a=[];

  for(
    let i=0;
    i<1+Math.floor(Math.random()*3);
    i++
  ){
    a.push(
      Math.random()<.6
        ? rand(PHRASES)
        : rand(FILLERS)
    );
  }

  return a.join(" ").slice(0,90);
}


function esc(s){
  return String(s)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}


function colorClass(n){

  let h=0;

  for(let i=0;i<n.length;i++){
    h=(h*31+n.charCodeAt(i))>>>0;
  }

  return "c"+h%8;
}


function format(n){

  if(n>=1000000){
    return (n/1000000)
      .toFixed(n>=10000000?0:1)+"M";
  }

  if(n>=1000){
    return (n/1000)
      .toFixed(n>=10000?0:1)+"K";
  }

  return String(
    Math.max(0,Math.floor(n))
  );
}

/* WEBRTC HOST */

function listenForViewers(){

  if(unsubViewers){
    unsubViewers();
  }

  unsubViewers=
    onChildAdded(
      ref(db,`lives/${currentLiveId}/viewers`),
      s=>{
        if(!peerConnections[s.key]){
          createHostPeer(s.key);
        }
      }
    );

  onChildRemoved(
    ref(db,`lives/${currentLiveId}/viewers`),
    s=>{
      if(peerConnections[s.key]){

        peerConnections[s.key].close();

        delete peerConnections[s.key];
      }
    }
  );
}


async function createHostPeer(id){

  const pc=
    new RTCPeerConnection(ICE_SERVERS);

  peerConnections[id]=pc;

  if(stream){

    stream.getTracks().forEach(
      t=>pc.addTrack(t,stream)
    );
  }

  pc.onicecandidate=e=>{

    if(e.candidate){

      push(
        ref(
          db,
          `lives/${currentLiveId}/signals/${id}/hostCandidates`
        ),
        e.candidate.toJSON()
      );
    }
  };

  onValue(
    ref(
      db,
      `lives/${currentLiveId}/signals/${id}/answer`
    ),
    s=>{

      const a=s.val();

      if(
        a &&
        pc.signalingState!=="closed"
      ){

        pc.setRemoteDescription(
          new RTCSessionDescription(a)
        ).catch(()=>{});
      }
    }
  );

  onChildAdded(
    ref(
      db,
      `lives/${currentLiveId}/signals/${id}/viewerCandidates`
    ),
    s=>{

      const c=s.val();

      if(c){
        pc.addIceCandidate(
          new RTCIceCandidate(c)
        ).catch(()=>{});
      }
    }
  );

  try{

    const o=await pc.createOffer();

    await pc.setLocalDescription(o);

    await set(
      ref(
        db,
        `lives/${currentLiveId}/signals/${id}/offer`
      ),
      {
        type:o.type,
        sdp:o.sdp
      }
    );

  }catch(e){}
}


/* VIEWER */

async function joinViewer(live){

  cleanupViewer();

  isHost=false;

  currentLiveId=live.id;

  viewerId=
    "v"+
    Date.now()+
    "_"+
    Math.random().toString(36).slice(2,6);

  document.getElementById("btn-b")
    .style.display=
      isSpecialUser?"flex":"none";

  document.getElementById("live-title-text")
    .textContent=live.title;

  document.getElementById("chat-list")
    .innerHTML="";

  document.getElementById("local-video")
    .style.display="none";

  document.getElementById("remote-video")
    .style.display="none";

  show("live-room");

  await set(
    ref(
      db,
      `lives/${live.id}/viewers/${viewerId}`
    ),
    {
      name:user?.name||"Viewer",
      joinedAt:Date.now()
    }
  );

  listenToChat(live.id);

  unsubLiveEnd=
    onValue(
      ref(db,"lives/"+live.id),
      s=>{
        if(!s.exists()&&!isHost){
          forceLeave("Live ended by host");
        }
      }
    );

  viewerPC=
    new RTCPeerConnection(ICE_SERVERS);

  viewerPC.ontrack=e=>{

    const v=
      document.getElementById("remote-video");

    v.srcObject=e.streams[0];
    v.style.display="block";

    document.getElementById("cam-off")
      .style.display="none";

    v.play().catch(()=>{});
  };

  let ice=[];
  let it=null;

  viewerPC.onicecandidate=e=>{

    if(e.candidate){

      ice.push(e.candidate.toJSON());

      if(!it){

        it=setTimeout(()=>{

          ice.splice(0).forEach(
            c=>
              push(
                ref(
                  db,
                  `lives/${live.id}/signals/${viewerId}/viewerCandidates`
                ),
                c
              )
          );

          it=null;

        },250);
      }
    }
  };


  onValue(
    ref(
      db,
      `lives/${live.id}/signals/${viewerId}/offer`
    ),
    async s=>{

      const o=s.val();

      if(
        !o ||
        offerHandled ||
        !viewerPC
      ){
        return;
      }

      offerHandled=true;

      try{

        await viewerPC.setRemoteDescription(
          new RTCSessionDescription(o)
        );

        const a=
          await viewerPC.createAnswer();

        await viewerPC.setLocalDescription(a);

        await set(
          ref(
            db,
            `lives/${live.id}/signals/${viewerId}/answer`
          ),
          {
            type:a.type,
            sdp:a.sdp
          }
        );

      }catch(e){

        offerHandled=false;
      }
    }
  );


  onChildAdded(
    ref(
      db,
      `lives/${live.id}/signals/${viewerId}/hostCandidates`
    ),
    s=>{

      const c=s.val();

      if(c){
        viewerPC
          .addIceCandidate(
            new RTCIceCandidate(c)
          )
          .catch(()=>{});
      }
    }
  );
}


function cleanupViewer(){

  if(unsubLiveEnd){

    unsubLiveEnd();
    unsubLiveEnd=null;
  }

  if(unsubChat){

    unsubChat();
    unsubChat=null;

  if(viewerPC){

    viewerPC.close();
    viewerPC=null;
  }

  offerHandled=false;
}

/* CREATE BOT */

function newBot(){

  const id=
    "b"+
    Date.now().toString(36)+
    Math.random().toString(36).slice(2,7);

  activeBotIds.add(id);

  const name=makeName();

  botNames.set(id,name);
  botJoinedAt.set(id,Date.now());

  botCount++;


  /*
   * During the beginning of a stream,
   * roughly 70% of bot messages are greetings.
   */

  if(initialGreetingPhase){

    initialGreetingCount++;

    addMsg(
      name,
      Math.random()<.7
        ?rand(GREETINGS)
        :normalMsg()
    );

  }else if(Math.random()<.35){

    addMsg(
      name,
      normalMsg()
    );
  }

  return id;
}


/* BOT LEAVING */

function removeBot(){

  if(!activeBotIds.size){
    return false;
  }

  const arr=[...activeBotIds];

  const id=
    arr[Math.floor(Math.random()*arr.length)];

  activeBotIds.delete(id);

  botNames.delete(id);
  botJoinedAt.delete(id);
  botLeaveAt.delete(id);

  botCount=
    Math.max(
      0,
      botCount-1
    );

  return true;
}


/* ADD BOT BATCH */

function addBots(n){

  /*
   * IMPORTANT:
   *
   * 1M bots does NOT create 1M DOM messages.
   *
   * The game keeps a numeric audience count
   * and only creates a small number of actual
   * chat elements.
   */

  const target=
    Math.min(n,1000000);

  const chunk=
    Math.min(target,500);

  let made=0;

  const loop=()=>{

    const take=
      Math.min(
        chunk,
        target-made
      );

    for(let i=0;i<take;i++){
      newBot();
    }

    made+=take;

    updateCount();

    if(made<target){

      requestAnimationFrame(loop);
    }
  };

  loop();

  initialGreetingPhase=false;

  toast(
    `+${format(target)} bots`
  );
}


/* NATURAL BOT MOVEMENT */

function scheduleBots(){

  clearTimeout(botTimer);

  if(!isHost){
    return;
  }

  botTimer=setTimeout(()=>{

    /* Some viewers leave */

    if(
      botCount>0 &&
      Math.random()<
        Math.min(
          .72,
          .08+botCount/600
        )
    ){

      removeBot();
    }


    /* Some new viewers arrive */

    const joinRate=
      botCount<20
        ?0.3
        :botCount<100
          ?.5
          :.72;


    if(Math.random()<joinRate){

      const natural=
        Math.max(
          1,
          Math.min(
            6,
            Math.ceil(botCount/300)
          )
        );

      for(
        let i=0;
        i<natural;
        i++
      ){
        newBot();
      }
    }

    updateCount();

    scheduleBots();

  },
  Math.max(
    250,
    1600-
      Math.min(
        1200,
        botCount*2
      )+
      Math.random()*900
  ));
}


/* CHAT SPEED */

function scheduleBotChat(){

  clearTimeout(chatTimer);

  if(!isHost){
    return;
  }

  chatTimer=setTimeout(()=>{

    const n=botCount;

    if(n>0){

      /*
       * Chat gets faster with more viewers,
       * but we never create thousands/millions
       * of DOM nodes.
       */

      const perBurst=
        n>=100000
          ?8
          :n>=10000
            ?6
            :n>=1000
              ?4
              :n>=100
                ?3
                :n>=20
                  ?2
                  :1;

      const burst=
        Math.min(perBurst,8);

      for(
        let i=0;
        i<burst;
        i++
      ){

        if(!activeBotIds.size){
          break;
        }

        const ids=[...activeBotIds];

        const id=
          ids[
            Math.floor(
              Math.random()*ids.length
            )
          ];

        addMsg(
          botNames.get(id)||makeName(),
          normalMsg()
        );
      }
    }

    scheduleBotChat();

  },nToChatDelay(n));
}


function nToChatDelay(n){

  if(n>=1000000){
    return 80;
  }

  if(n>=100000){
    return 100;
  }

  if(n>=10000){
    return 130;
  }

  if(n>=1000){
    return 180;
  }

  if(n>=100){
    return 300;
  }

  if(n>=20){
    return 600;
  }

  if(n>0){
    return 1200;
  }

  return 5000;
}


/* START/STOP BOTS */

function startBots(){

  stopBots();

  initialGreetingPhase=true;
  initialGreetingCount=0;

  scheduleBots();
  scheduleBotChat();
  scheduleBotLeaves();
}


function scheduleBotLeaves(){

  clearTimeout(leaveTimer);

  if(!isHost){
    return;
  }

  leaveTimer=setTimeout(()=>{

    if(botCount>0){

      const maxLeaves=
        botCount>=100000
          ?Math.min(
              1000,
              Math.ceil(botCount*.002)
            )
          :botCount>=1000
            ?Math.min(
                50,
                Math.ceil(botCount*.01)
              )
            :Math.max(
                1,
                Math.ceil(botCount*.03)
              );

      for(
        let i=0;
        i<maxLeaves;
        i++
      ){
        removeBot();
      }

      updateCount();
    }

    scheduleBotLeaves();

  },
  botCount>=10000
    ?1800
    :botCount>=1000
      ?2500
      :4500+Math.random()*3500
  );
}


function stopBots(){

  clearTimeout(botTimer);
  clearTimeout(chatTimer);
  clearTimeout(leaveTimer);

  botTimer=null;
  chatTimer=null;
  leaveTimer=null;

  activeBotIds.clear();
  botNames.clear();

  botCount=0;
}


/* SMALL REAL VIEWER SIMULATION */

function startRealSim(){

  stopRealSim();

  realTimer=
    setInterval(()=>{

      if(Math.random()<.4){

        realViewers=
          Math.max(
            0,
            Math.min(
              8,
              realViewers+
                (
                  Math.random()<.55
                    ?1
                    :-1
                )
            )
          );

        updateCount();
      }

    },
    9000+Math.random()*7000
  );
}


function stopRealSim(){

  clearInterval(realTimer);

  realTimer=null;
}


/* HIGH VOLUME CHAT RENDERER */

function scheduleRender(){

  if(renderScheduled){
    return;
  }

  renderScheduled=true;

  requestAnimationFrame(()=>{

    renderScheduled=false;

    renderQueuedMessages();
  });
}


function renderQueuedMessages(){

  const list=
    document.getElementById("chat-list");

  if(!renderQueue.length){
    return;
  }

  const frag=
    document.createDocumentFragment();

  /*
   * Render at most 30 messages per frame.
   */

  const take=
    Math.min(
      renderQueue.length,
      30
    );

  for(
    let i=0;
    i<take;
    i++
  ){

    const m=
      renderQueue.shift();

    const d=
      document.createElement("div");

    d.className=
      "msg"+
      (m.host?" host":"")+
      (m.gift?" gift-msg":"");

    const c=
      m.host||m.gift
        ?""
        :colorClass(m.name);

    d.innerHTML=
      `<span class="uname ${c}">
        ${esc(m.name)}
      </span>${esc(m.text)}`;

    frag.appendChild(d);
  }

  list.appendChild(frag);

  /*
   * Never let the chat DOM grow forever.
   */

  while(list.children.length>70){
    list.removeChild(
      list.firstChild
    );
  }

  if(renderQueue.length){
    scheduleRender();
  }
}


function displayMsg(
  name,
  text,
  host=false,
  gift=false
){

  renderQueue.push({
    name,
    text,
    host,
    gift
  });

  /*
   * Prevent an enormous queue
   * if chat suddenly becomes crazy.
   */

  if(renderQueue.length>100){

    renderQueue.splice(
      0,
      renderQueue.length-100
    );
  }

  scheduleRender();
}


function addMsg(
  name,
  text,
  host=false,
  gift=false
){

  displayMsg(
    name,
    text,
    host,
    gift
  );
}


/* FIREBASE CHAT */

function listenToChat(liveId){

  if(unsubChat){
    unsubChat();
  }

  const chatRef=
    ref(
      db,
      `lives/${liveId}/chat`
    );

  unsubChat=
    onChildAdded(
      chatRef,
      s=>{

        const m=s.val();

        if(!m){
          return;
        }

        displayMsg(
          m.name,
          m.text,
          !!m.host,
          !!m.gift
        );

        if(
          m.gift &&
          m.giftEmoji
        ){

          playGiftAnim(
            m.giftEmoji,
            m.giftName||"",
            m.giftCost||0
          );
        }
      }
    );
}


/* SEND CHAT */

document.getElementById("btn-send")
  .onclick=sendMsg;


document.getElementById("chat-input")
  .onkeydown=e=>{

    if(e.key==="Enter"){
      sendMsg();
    }
  };


async function sendMsg(){

  const i=
    document.getElementById("chat-input");

  const t=i.value.trim();

  if(!t||!currentLiveId){
    return;
  }

  try{

    await push(
      ref(
        db,
        `lives/${currentLiveId}/chat`
      ),
      {
        name:user?.name||"You",
        text:t,
        host:isHost,
        gift:false,
        at:Date.now()
      }
    );

  }catch(e){

    toast("Chat failed");
  }

  i.value="";
}

async function sendGift(g){

  if(!currentLiveId){
    return;
  }

  if(
    !isInfinite &&
    coins<g.cost
  ){

    return toast(
      "Not enough coins!"
    );
  }

  if(!isInfinite){

    coins-=g.cost;

    saveCoins();
    updateCoinsUI();
  }

  document
    .getElementById("gift-panel")
    .classList.remove("show");

  playGiftAnim(
    g.emoji,
    g.name,
    g.cost
  );

  try{

    await push(
      ref(
        db,
        `lives/${currentLiveId}/chat`
      ),
      {
        name:user?.name||"You",
        text:
          `sent ${g.emoji} ${g.name} (🪙${format(g.cost)})`,
        host:false,
        gift:true,
        giftEmoji:g.emoji,
        giftName:g.name,
        giftCost:g.cost,
        at:Date.now()
      }
    );

    await push(
      ref(
        db,
        `lives/${currentLiveId}/gifts`
      ),
      {
        from:user?.name||"You",
        emoji:g.emoji,
        name:g.name,
        cost:g.cost,
        toHost:Math.floor(g.cost*.7),
        at:Date.now()
      }
    );

  }catch(e){

    toast("Gift failed");
  }
}

    <div class="gift-label">

    </div>
  `;

  setTimeout(
    ()=>a.innerHTML="",
    1700
  );
}


/* HOST GIFTS */

function listenForGifts(id){

  onChildAdded(
    ref(db,`lives/${id}/gifts`),
    s=>{

      if(!isHost){
        return;
      }

      const g=s.val();

      if(!g){
        return;
      }

      if(!isInfinite){

        coins+=g.toHost||0;

        saveCoins();
        updateCoinsUI();
      }

      playGiftAnim(
        g.emoji,
        g.name,
        g.cost
      );

      toast(
        `+${format(g.toHost||0)} coins from gift!`
      );
    }
  );
}
