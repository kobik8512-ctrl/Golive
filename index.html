<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hardcore Economic Tycoon</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#05080f;font-family:'Segoe UI',system-ui,sans-serif;color:#e2e8f0}
body{display:flex;flex-direction:column;align-items:center}
.header{text-align:center;margin-top:8px;cursor:pointer;padding:12px 16px;border-radius:16px;
  background:rgba(15,23,42,.85);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 10px 25px rgba(0,0,0,.5);width:95%;max-width:460px;transition:transform .06s}
.header:active{transform:scale(.98)}
h1{font-size:.62rem;color:#64748b;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:2px}
.balance{font-size:2rem;font-weight:800;color:#22c55e;text-shadow:0 0 15px rgba(34,197,94,.25)}
.sub-balances{display:flex;justify-content:center;gap:12px;font-size:.78rem;font-weight:600;margin-top:4px;flex-wrap:wrap}
.btc-val{color:#f59e0b}.net-val{color:#38bdf8}.bank-val{color:#a78bfa}
.stats-row{display:flex;justify-content:space-around;margin-top:6px;font-size:.68rem;color:#94a3b8;flex-wrap:wrap;gap:4px}
.event-bar{width:95%;max-width:460px;margin-top:6px;padding:6px 10px;border-radius:8px;
  background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);font-size:.72rem;color:#fca5a5;
  text-align:center;display:none}
.event-bar.show{display:block}
.event-bar.good{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.25);color:#86efac}
.tabs{display:flex;width:95%;max-width:460px;margin-top:8px;gap:4px;overflow-x:auto;padding-bottom:2px}
.tab-btn{flex:1;min-width:58px;padding:7px 4px;background:rgba(15,23,42,.5);border:1px solid rgba(255,255,255,.05);
  border-radius:8px;color:#94a3b8;font-weight:600;cursor:pointer;font-size:.7rem;white-space:nowrap;text-align:center}
.tab-btn.active{background:#1e40af;color:#fff;border-color:#3b82f6;box-shadow:0 0 10px rgba(30,64,175,.35)}
.shop-container{width:95%;max-width:460px;margin-top:8px;flex:1;max-height:calc(100vh - 250px);
  overflow-y:auto;padding-bottom:24px;display:flex;flex-direction:column;gap:7px}
.shop-container::-webkit-scrollbar{width:3px}
.shop-container::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.shop-item{background:rgba(15,23,42,.55);border:1px solid rgba(255,255,255,.05);border-radius:10px;
  padding:10px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;gap:8px;
  transition:all 0.2s ease;}
.shop-item:active:not(.locked){background:rgba(30,41,59,.8)}
.shop-item.locked{opacity:.42;cursor:not-allowed}
.shop-item.affordable {
  border-color: rgba(255, 255, 255, 0.45);
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.22);
  background: rgba(30, 41, 59, 0.7);
}
.item-info{flex:1;min-width:0}
.item-info h3{margin:0 0 2px;font-size:.86rem;color:#f1f5f9}
.item-info p{margin:0;font-size:.68rem;color:#94a3b8;line-height:1.3}
.item-buy{text-align:right;min-width:88px}
.cost{font-weight:700;font-size:.8rem;color:#f59e0b}
.owned{font-size:.62rem;color:#64748b;background:rgba(255,255,255,.04);padding:1px 6px;border-radius:6px;display:inline-block;margin-top:2px}
.floating-text{position:absolute;font-weight:700;font-size:1.2rem;color:#22c55e;pointer-events:none;
  animation:floatUp .8s ease-out forwards;text-shadow:0 2px 6px rgba(0,0,0,.7);z-index:100}
.floating-btc{color:#f59e0b!important}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8)}50%{transform:translateY(-28px) scale(1.08)}100%{opacity:0;transform:translateY(-55px)}}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1e293b;color:#e2e8f0;
  padding:10px 16px;border-radius:10px;font-size:.8rem;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;
  border:1px solid rgba(255,255,255,.1);max-width:90%}
.toast.show{opacity:1}
.toolbar{width:95%;max-width:460px;display:flex;gap:6px;margin-top:6px}
.toolbar button{flex:1;padding:6px;border-radius:8px;border:1px solid rgba(255,255,255,.08);
  background:rgba(15,23,42,.6);color:#94a3b8;font-size:.68rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="header" id="clickArea">
  <h1>Hardcore Economic Tycoon</h1>
  <div class="balance" id="balanceDisplay">$10.00</div>
  <div class="sub-balances">
    <span class="btc-val" id="btcDisplay">₿ 0.00000000</span>
    <span class="bank-val" id="bankDisplay">Bank: $0</span>
    <span class="net-val" id="netWorthDisplay">Net: $10</span>
  </div>
  <div class="stats-row">
    <span id="clickPowerDisplay">Click: +$0.08</span>
    <span id="cpsDisplay">Net: -$0.00/s</span>
    <span id="taxDisplay">Upkeep: $0.00/s</span>
    <span id="dayDisplay">Day 1</span>
  </div>
</div>
<div class="event-bar" id="eventBar"></div>
<div class="toolbar">
  <button type="button" id="btnSave">Save</button>
  <button type="button" id="btnLoad">Load</button>
  <button type="button" id="btnReset">Reset</button>
</div>
<div class="tabs">
  <div class="tab-btn active" data-tab="labor">Labor</div>
  <div class="tab-btn" data-tab="business">SMEs</div>
  <div class="tab-btn" data-tab="crypto">Crypto</div>
  <div class="tab-btn" data-tab="stocks">Stocks</div>
  <div class="tab-btn" data-tab="invest">Invest</div>
  <div class="tab-btn" data-tab="research">R&D</div>
</div>
<div class="shop-container" id="shopList"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const SAVE_KEY = 'hardcore_tycoon_v2';

  let cash = 10;
  let bank = 0;
  let btc = 0;
  let btcPrice = 42000;
  let clickPower = 0.08;
  let currentTab = 'labor';
  let stockPrice = 100;
  let stockShares = 0;
  let taxRate = 0.07;
  let day = 1;
  let tickCount = 0;
  let debt = 0;
  let eventUntil = 0;
  let eventLabel = '';
  let eventGood = false;
  let cpsMult = 1;
  let clickMult = 1;

  let taxMultiplier = 1;
  let cryptoUpkeepMult = 1;
  let businessBoost = 1;
  let investBoost = 1;

  const items = [
    // LABOR — slower early game
    { id:'l1', name:'Scavenge Trash', desc:'+$0.12 / click', cost:20, power:0.12, type:'labor', count:0, mult:1.65 },
    { id:'l2', name:'Part-Time Shift', desc:'+$0.40 / click', cost:150, power:0.40, type:'labor', count:0, mult:1.7 },
    { id:'l3', name:'Freelance Gig', desc:'+$1.60 / click', cost:1200, power:1.60, type:'labor', count:0, mult:1.75 },
    { id:'l4', name:'Consulting Contract', desc:'+$7.00 / click', cost:9000, power:7.00, type:'labor', count:0, mult:1.8 },
    { id:'l5', name:'Executive Role', desc:'+$28.00 / click', cost:60000, power:28.00, type:'labor', count:0, mult:1.85 },
    { id:'l6', name:'Board Seat', desc:'+$120 / click', cost:400000, power:120, type:'labor', count:0, mult:1.9 },

    // BUSINESS — higher upkeep = harder
    { id:'b1', name:'Lemonade Stand', desc:'+$0.45/s · upkeep $0.18/s', cost:80, cps:0.45, upkeep:0.18, type:'business', count:0, mult:1.58 },
    { id:'b2', name:'Paper Route', desc:'+$1.60/s · upkeep $0.55/s', cost:520, cps:1.60, upkeep:0.55, type:'business', count:0, mult:1.6 },
    { id:'b3', name:'Local Cafe', desc:'+$7.00/s · upkeep $3.20/s', cost:3500, cps:7.00, upkeep:3.20, type:'business', count:0, mult:1.62 },
    { id:'b4', name:'Convenience Store', desc:'+$28/s · upkeep $14/s', cost:22000, cps:28, upkeep:14, type:'business', count:0, mult:1.65 },
    { id:'b5', name:'Tech Consultancy', desc:'+$120/s · upkeep $55/s', cost:120000, cps:120, upkeep:55, type:'business', count:0, mult:1.68 },
    { id:'b6', name:'Franchise Network', desc:'+$550/s · upkeep $260/s', cost:650000, cps:550, upkeep:260, type:'business', count:0, mult:1.7 },
    { id:'b7', name:'Holding Company', desc:'+$2200/s · upkeep $1100/s', cost:3500000, cps:2200, upkeep:1100, type:'business', count:0, mult:1.72 },

    // CRYPTO
    { id:'c1', name:'Old Laptop Rig', desc:'₿0.000004/s · power $0.08/s', cost:280, bps:0.000004, upkeep:0.08, type:'crypto', count:0, mult:1.52 },
    { id:'c2', name:'GPU Card', desc:'₿0.00002/s · power $0.28/s', cost:1800, bps:0.00002, upkeep:0.28, type:'crypto', count:0, mult:1.55 },
    { id:'c3', name:'ASIC Miner', desc:'₿0.0001/s · power $1.40/s', cost:11000, bps:0.0001, upkeep:1.40, type:'crypto', count:0, mult:1.58 },
    { id:'c4', name:'Warehouse Rig', desc:'₿0.0005/s · power $7/s', cost:75000, bps:0.0005, upkeep:7, type:'crypto', count:0, mult:1.6 },
    { id:'c5', name:'Mining Farm', desc:'₿0.0025/s · power $38/s', cost:420000, bps:0.0025, upkeep:38, type:'crypto', count:0, mult:1.62 },
    { id:'cs1', name:'Sell 0.1 BTC', desc:'Cash out 0.1 BTC at market', type:'crypto', isBtcSell:true, sellAmt:0.1 },
    { id:'cs2', name:'Sell 1.0 BTC', desc:'Cash out 1 BTC at market', type:'crypto', isBtcSell:true, sellAmt:1 },
    { id:'cb1', name:'Buy 0.01 BTC', desc:'Buy with cash at market', type:'crypto', isBtcBuy:true, buyAmt:0.01 },

    // STOCKS
    { id:'s1', name:'Buy 1 Share', desc:'Volatile equity', type:'stocks', isStockBuy:true },
    { id:'s2', name:'Buy 10 Shares', desc:'Bulk buy', type:'stocks', isStockBuy:true, qty:10 },
    { id:'s3', name:'Sell 1 Share', desc:'Sell at market', type:'stocks', isStockSell:true },
    { id:'s4', name:'Sell All Shares', desc:'Exit position', type:'stocks', isStockSellAll:true },

    // INVEST — slower safer money
    { id:'i1', name:'Deposit $50 to Bank', desc:'Bank earns 2%/day interest', type:'invest', isBankDep:true, amt:50 },
    { id:'i2', name:'Deposit $500 to Bank', desc:'Park cash safely', type:'invest', isBankDep:true, amt:500 },
    { id:'i3', name:'Withdraw $100', desc:'Pull from bank', type:'invest', isBankWd:true, amt:100 },
    { id:'i4', name:'Withdraw All', desc:'Empty bank account', type:'invest', isBankWdAll:true },
    { id:'i5', name:'Index Fund Unit', desc:'Slow +$0.80/s (low risk)', cost:2500, cps:0.80, upkeep:0, type:'invest', count:0, mult:1.45, safe:true },
    { id:'i6', name:'Bond Ladder', desc:'+$4.50/s stable', cost:18000, cps:4.50, upkeep:0, type:'invest', count:0, mult:1.48, safe:true },
    { id:'i7', name:'Private Equity Stake', desc:'+$40/s · risk events', cost:150000, cps:40, upkeep:5, type:'invest', count:0, mult:1.55 },
    { id:'i8', name:'Take Loan $1,000', desc:'Debt +$1000 · interest $0.40/s', type:'invest', isLoan:true, amt:1000, interest:0.40 },
    { id:'i9', name:'Repay $500 Debt', desc:'Reduce loan principal', type:'invest', isRepay:true, amt:500 },

    // R&D
    { id:'r1', name:'Tax Accountant', desc:'Tax drag −20%', cost:800, effect:'tax', val:0.8, type:'research', count:0, mult:2.4, max:5 },
    { id:'r2', name:'Solar Panels', desc:'Crypto power −30%', cost:5000, effect:'power', val:0.7, type:'research', count:0, mult:2.5, max:4 },
    { id:'r3', name:'AI Optimization', desc:'Business output +20%', cost:35000, effect:'boost', val:1.2, type:'research', count:0, mult:2.6, max:5 },
    { id:'r4', name:'Click Training', desc:'Click power +15%', cost:2000, effect:'click', val:1.15, type:'research', count:0, mult:2.3, max:6 },
    { id:'r5', name:'Market Analyst', desc:'Investment income +25%', cost:28000, effect:'invest', val:1.25, type:'research', count:0, mult:2.5, max:4 },
  ];

  const el = {
    balance: document.getElementById('balanceDisplay'),
    btc: document.getElementById('btcDisplay'),
    bank: document.getElementById('bankDisplay'),
    net: document.getElementById('netWorthDisplay'),
    click: document.getElementById('clickPowerDisplay'),
    cps: document.getElementById('cpsDisplay'),
    tax: document.getElementById('taxDisplay'),
    day: document.getElementById('dayDisplay'),
    shop: document.getElementById('shopList'),
    event: document.getElementById('eventBar'),
    toast: document.getElementById('toast'),
  };

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
  }

  function netWorth() {
    return cash + bank + btc * btcPrice + stockShares * stockPrice - debt;
  }

  function getCPS() {
    let grossBiz = 0, upkeepBiz = 0, grossInv = 0, upkeepInv = 0, cryptoCost = 0;
    items.forEach(i => {
      if (i.type === 'business' && i.cps) {
        grossBiz += i.cps * i.count * businessBoost;
        upkeepBiz += (i.upkeep || 0) * i.count;
      }
      if (i.type === 'invest' && i.cps) {
        grossInv += i.cps * i.count * investBoost;
        upkeepInv += (i.upkeep || 0) * i.count;
      }
      if (i.type === 'crypto' && i.upkeep) {
        cryptoCost += i.upkeep * i.count * cryptoUpkeepMult;
      }
    });
    const taxes = grossBiz * taxRate * taxMultiplier;
    const debtInterest = debt > 0 ? debt * 0.0004 : 0;
    const interest = debtInterest + (window._loanInterest || 0);
    const gross = (grossBiz + grossInv) * cpsMult;
    const upkeep = upkeepBiz + upkeepInv + cryptoCost + taxes + interest;
    return { gross, net: gross - upkeep, upkeep, interest };
  }

  function getBPS() {
    return items.reduce((t, i) => t + (i.bps ? i.bps * i.count : 0), 0);
  }

  function effectiveClick() {
    return clickPower * clickMult;
  }

  function canBuy(item) {
    if (item.isBtcSell) return btc >= (item.sellAmt || 1);
    if (item.isBtcBuy) return cash >= btcPrice * (item.buyAmt || 0.01);
    if (item.isStockBuy) return cash >= stockPrice * (item.qty || 1);
    if (item.isStockSell) return stockShares >= 1;
    if (item.isStockSellAll) return stockShares > 0;
    if (item.isBankDep) return cash >= item.amt;
    if (item.isBankWd) return bank >= item.amt;
    if (item.isBankWdAll) return bank > 0;
    if (item.isLoan) return debt < 50000;
    if (item.isRepay) return cash >= item.amt && debt > 0;
    if (item.max != null && item.count >= item.max) return false;
    return cash >= item.cost;
  }

  function renderShop() {
    el.shop.innerHTML = '';
    items.filter(u => u.type === currentTab).forEach(item => {
      const affordable = canBuy(item);
      const div = document.createElement('div');
      div.className = 'shop-item' + (affordable ? ' affordable' : ' locked');
      let costHtml = '', ownedHtml = '';

      if (item.isBtcSell) {
        const v = (item.sellAmt || 1) * btcPrice;
        costHtml = `<div class="cost" style="color:#22c55e">+$${fmt(v)}</div>`;
        ownedHtml = `<div class="owned">₿${btc.toFixed(4)}</div>`;
      } else if (item.isBtcBuy) {
        const v = (item.buyAmt || 0.01) * btcPrice;
        costHtml = `<div class="cost">$${fmt(v)}</div>`;
        ownedHtml = `<div class="owned">BTC $${fmt(btcPrice)}</div>`;
      } else if (item.isStockBuy) {
        const q = item.qty || 1;
        costHtml = `<div class="cost">$${fmt(stockPrice * q)}</div>`;
        ownedHtml = `<div class="owned">${stockShares} sh · $${stockPrice.toFixed(2)}</div>`;
      } else if (item.isStockSell || item.isStockSellAll) {
        costHtml = `<div class="cost" style="color:#22c55e">$${stockPrice.toFixed(2)}</div>`;
        ownedHtml = `<div class="owned">${stockShares} shares</div>`;
      } else if (item.isBankDep) {
        costHtml = `<div class="cost">$${item.amt}</div>`;
        ownedHtml = `<div class="owned">Bank $${fmt(bank)}</div>`;
      } else if (item.isBankWd || item.isBankWdAll) {
        costHtml = `<div class="cost" style="color:#22c55e">Out</div>`;
        ownedHtml = `<div class="owned">Bank $${fmt(bank)}</div>`;
      } else if (item.isLoan) {
        costHtml = `<div class="cost" style="color:#22c55e">+$${item.amt}</div>`;
        ownedHtml = `<div class="owned">Debt $${fmt(debt)}</div>`;
      } else if (item.isRepay) {
        costHtml = `<div class="cost">$${item.amt}</div>`;
        ownedHtml = `<div class="owned">Debt $${fmt(debt)}</div>`;
      } else {
        costHtml = `<div class="cost">$${fmt(Math.floor(item.cost))}</div>`;
        ownedHtml = `<div class="owned">Owned: ${item.count}${item.max != null ? '/' + item.max : ''}</div>`;
      }

      div.innerHTML = `<div class="item-info"><h3>${item.name}</h3><p>${item.desc}</p></div>
        <div class="item-buy">${costHtml}${ownedHtml}</div>`;
      div.onclick = () => buy(item);
      el.shop.appendChild(div);
    });
  }

  function fmt(n) {
    if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + 'B';
    if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + 'M';
    if (Math.abs(n) >= 1e4) return Math.floor(n).toLocaleString();
    return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function buy(item) {
    if (!canBuy(item)) return;

    if (item.isBtcSell) {
      const amt = item.sellAmt || 1;
      btc -= amt;
      cash += amt * btcPrice;
      toast('Sold ' + amt + ' BTC');
    } else if (item.isBtcBuy) {
      const amt = item.buyAmt || 0.01;
      cash -= amt * btcPrice;
      btc += amt;
      toast('Bought ' + amt + ' BTC');
    } else if (item.isStockBuy) {
      const q = item.qty || 1;
      cash -= stockPrice * q;
      stockShares += q;
    } else if (item.isStockSell) {
      stockShares -= 1;
      cash += stockPrice;
    } else if (item.isStockSellAll) {
      cash += stockShares * stockPrice;
      stockShares = 0;
    } else if (item.isBankDep) {
      cash -= item.amt;
      bank += item.amt;
      toast('Deposited $' + item.amt);
    } else if (item.isBankWd) {
      bank -= item.amt;
      cash += item.amt;
    } else if (item.isBankWdAll) {
      cash += bank;
      bank = 0;
    } else if (item.isLoan) {
      cash += item.amt;
      debt += item.amt;
      window._loanInterest = (window._loanInterest || 0) + (item.interest || 0);
      toast('Loan +$' + item.amt + ' (interest ticking)');
    } else if (item.isRepay) {
      const pay = Math.min(item.amt, debt, cash);
      cash -= pay;
      debt -= pay;
      if (debt <= 0) { debt = 0; window._loanInterest = 0; }
      toast('Repaid $' + pay.toFixed(0));
    } else {
      cash -= item.cost;
      item.count += 1;
      if (item.type === 'labor') clickPower += item.power;
      if (item.effect === 'tax') taxMultiplier *= item.val;
      if (item.effect === 'power') cryptoUpkeepMult *= item.val;
      if (item.effect === 'boost') businessBoost *= item.val;
      if (item.effect === 'click') clickMult *= item.val;
      if (item.effect === 'invest') investBoost *= item.val;
      item.cost *= item.mult;
    }
    update();
    renderShop();
  }

  function update() {
    const stats = getCPS();
    el.balance.textContent = '$' + cash.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    el.btc.textContent = '₿ ' + btc.toFixed(8);
    el.bank.textContent = 'Bank: $' + fmt(bank);
    el.net.textContent = 'Net: $' + fmt(netWorth());
    el.click.textContent = 'Click: +$' + effectiveClick().toFixed(2);
    el.cps.textContent = 'Net: ' + (stats.net >= 0 ? '+' : '') + '$' + stats.net.toFixed(2) + '/s';
    el.tax.textContent = 'Upkeep: $' + stats.upkeep.toFixed(2) + '/s';
    el.day.textContent = 'Day ' + day;

    if (Date.now() < eventUntil) {
      el.event.textContent = eventLabel;
      el.event.className = 'event-bar show' + (eventGood ? ' good' : '');
    } else {
      el.event.className = 'event-bar';
      cpsMult = 1;
      clickMult = Math.max(clickMult, 1);
    }

    const shopItems = el.shop.children;
    const tabItems = items.filter(u => u.type === currentTab);
    for(let i = 0; i < shopItems.length; i++) {
      if (tabItems[i]) {
        const affordable = canBuy(tabItems[i]);
        shopItems[i].className = 'shop-item' + (affordable ? ' affordable' : ' locked');
      }
    }
  }

  function floatText(x, y, text, btcMode) {
    const d = document.createElement('div');
    d.className = 'floating-text' + (btcMode ? ' floating-btc' : '');
    d.textContent = text;
    d.style.left = (x + (Math.random() - 0.5) * 28) + 'px';
    d.style.top = (y - 18) + 'px';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 800);
  }

  let activePointerId = null;

  document.getElementById('clickArea').addEventListener('pointerdown', e => {
    if (activePointerId !== null) return; // ignore extra fingers/pointers
    activePointerId = e.pointerId;

    const gain = effectiveClick() * (window._eventClick || 1);
    cash += gain;
    update();
    floatText(e.clientX, e.clientY, '+$' + gain.toFixed(2));
  });

  document.getElementById('clickArea').addEventListener('pointerup', e => {
    if (e.pointerId === activePointerId) activePointerId = null;
  });

  document.getElementById('clickArea').addEventListener('pointercancel', e => {
    if (e.pointerId === activePointerId) activePointerId = null;
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === currentTab));
      renderShop();
    };
  });

  // Main loop 20 ticks/s
  setInterval(() => {
    tickCount++;
    const stats = getCPS();
    cash += stats.net / 20;
    btc += getBPS() / 20;
    if (cash < 0) cash = 0;

    if (tickCount % 1200 === 0) {
      day++;
      if (bank > 0) bank *= 1.02;
      if (Math.random() < 0.35) triggerEvent();
    }

    if (tickCount % 5 === 0) update();
  }, 50);

  // Markets
  setInterval(() => {
    stockPrice = Math.max(15, stockPrice + (Math.random() - 0.49) * 5.5);
    btcPrice = Math.max(8000, btcPrice + (Math.random() - 0.48) * 900);
    if (currentTab === 'stocks' || currentTab === 'crypto') renderShop();
  }, 4000);

  function triggerEvent() {
    const events = [
      { label: '📉 Recession — business income −30% for 45s', cps: 0.7, good: false, t: 45000 },
      { label: '📈 Boom — business income +40% for 40s', cps: 1.4, good: true, t: 40000 },
      { label: '⚡ Energy crisis — crypto upkeep hurts more', note: 'power', good: false, t: 35000 },
      { label: '🔥 Viral product — click power +50% for 30s', click: 1.5, good: true, t: 30000 },
      { label: '🏦 Bank bonus — +3% bank interest now', bank: 1.03, good: true, t: 5000 },
      { label: '💥 Market crash — stocks −12%', stock: 0.88, good: false, t: 5000 },
      { label: '🚀 BTC rally — price +8%', btc: 1.08, good: true, t: 5000 },
    ];
    const e = events[Math.floor(Math.random() * events.length)];
    eventLabel = e.label;
    eventGood = e.good;
    eventUntil = Date.now() + e.t;
    cpsMult = e.cps || 1;
    window._eventClick = e.click || 1;
    if (e.bank) bank *= e.bank;
    if (e.stock) stockPrice *= e.stock;
    if (e.btc) btcPrice *= e.btc;
    if (e.note === 'power') cryptoUpkeepMult *= 1.25;
    toast(e.label);
    setTimeout(() => {
      cpsMult = 1;
      window._eventClick = 1;
      if (e.note === 'power') cryptoUpkeepMult = Math.max(0.3, cryptoUpkeepMult / 1.25);
    }, e.t);
  }

  function save() {
    const data = {
      cash, bank, btc, btcPrice, clickPower, stockPrice, stockShares, taxRate, day, debt,
      taxMultiplier, cryptoUpkeepMult, businessBoost, investBoost, clickMult,
      loanInterest: window._loanInterest || 0,
      items: items.map(i => ({ id: i.id, cost: i.cost, count: i.count })),
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
    toast('Game saved');
  }

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) { toast('No save found'); return; }
      const d = JSON.parse(raw);
      cash = d.cash; bank = d.bank; btc = d.btc; btcPrice = d.btcPrice || btcPrice;
      clickPower = d.clickPower; stockPrice = d.stockPrice; stockShares = d.stockShares;
      taxRate = d.taxRate; day = d.day || 1; debt = d.debt || 0;
      taxMultiplier = d.taxMultiplier; cryptoUpkeepMult = d.cryptoUpkeepMult;
      businessBoost = d.businessBoost; investBoost = d.investBoost || 1;
      clickMult = d.clickMult || 1;
      window._loanInterest = d.loanInterest || 0;
      (d.items || []).forEach(s => {
        const it = items.find(x => x.id === s.id);
        if (it) { it.cost = s.cost; it.count = s.count; }
      });
      toast('Game loaded');
      update();
      renderShop();
    } catch {
      toast('Save corrupted');
    }
  }

  function reset() {
    if (!confirm('Reset ALL progress?')) return;
    localStorage.removeItem(SAVE_KEY);
    location.reload();
  }

  document.getElementById('btnSave').onclick = save;
  document.getElementById('btnLoad').onclick = load;
  document.getElementById('btnReset').onclick = reset;

  setInterval(save, 30000);

  if (localStorage.getItem(SAVE_KEY)) load();
  else { renderShop(); update(); }
})();
</script>
</body>
</html>
