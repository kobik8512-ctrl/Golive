<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Go Live</title>
<style>
:root{--bg:#0a0a0c;--card:#16161a;--card2:#1c1c22;--accent:#ff2d55;--text:#f2f2f5;--muted:#8b8b96;--green:#30d158;--danger:#ff453a;--border:#2a2a32;--gold:#ffd60a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;font-family:inherit;background:none;color:inherit}
input{font-family:inherit}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* LOGIN */
#login-screen{
align-items:center;justify-content:center;padding:24px;
background:radial-gradient(ellipse at top,#1a0a12 0%,var(--bg) 60%)
}
.login-box{width:100%;max-width:360px;text-align:center}
.login-logo{font-size:2.4rem;font-weight:800;margin-bottom:8px}
.login-logo span,.menu-title span{color:var(--accent)}
.login-sub{color:var(--muted);margin-bottom:40px}
.btn-google{
width:100%;background:#fff;color:#1f1f1f;padding:14px 20px;border-radius:14px;
font-weight:600;font-size:1rem;display:flex;align-items:center;
justify-content:center;gap:12px
}
.btn-google svg{width:20px;height:20px}
.login-note{margin-top:24px;font-size:.8rem;color:var(--muted)}

/* MENU */
#menu{padding:20px 16px 160px}
.broadcast-label,.section-label{
font-size:.7rem;font-weight:600;letter-spacing:1.5px;color:var(--muted);
text-transform:uppercase;margin-bottom:6px
}
.menu-title{font-size:2.1rem;font-weight:800;margin-bottom:10px}
.signed-in{font-size:.95rem;color:var(--muted);margin-bottom:28px}
.signed-in strong{color:var(--green)}
.section-label{margin-bottom:12px}
.lives-list{display:flex;flex-direction:column;gap:10px}
.live-card{
background:var(--card);border:1px solid var(--border);border-radius:16px;
padding:14px 14px 14px 16px;display:flex;align-items:center;gap:12px
}
.live-info{flex:1;min-width:0}
.live-name{
font-weight:700;font-size:1.05rem;white-space:nowrap;
overflow:hidden;text-overflow:ellipsis
}
.live-meta{font-size:.82rem;color:var(--muted);margin-top:3px}
.live-meta .dot{
display:inline-block;width:7px;height:7px;background:var(--accent);
border-radius:50%;margin-right:6px
}
.btn-join{background:var(--accent);font-weight:700;padding:10px 18px;border-radius:999px}
.btn-x-small{
width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--muted)
}
.empty-state{
text-align:center;padding:48px 20px;color:var(--muted);
background:var(--card);border-radius:16px;border:1px dashed var(--border);
line-height:1.5
}
.bottom-actions{
position:fixed;bottom:0;left:0;right:0;padding:16px 16px 28px;
background:linear-gradient(transparent,var(--bg) 25%);
display:flex;flex-direction:column;gap:10px;z-index:30
}
.btn-go-live{
background:var(--accent);font-size:1.15rem;font-weight:700;padding:16px;
border-radius:999px;box-shadow:0 8px 28px rgba(255,45,85,.35)
}
.btn-secondary{
background:transparent;color:var(--muted);padding:12px;
border-radius:999px;border:1px solid var(--border)
}

/* LIVE ROOM */
#live-room{
position:relative;background:#000;height:100vh;height:100dvh;overflow:hidden
}
#video-wrap{
position:absolute;inset:0;background:#0d0d10;display:flex;
align-items:center;justify-content:center
}
#local-video,#remote-video{
width:100%;height:100%;object-fit:cover;display:none
}
#local-video.mirror{transform:scaleX(-1)}
.cam-off{text-align:center;color:var(--muted)}
.cam-off .icon{font-size:3.5rem;margin-bottom:10px}

.live-header{
position:absolute;top:0;left:0;right:0;padding:12px;
display:flex;justify-content:space-between;align-items:flex-start;
z-index:40;pointer-events:none
}
.live-header>*{pointer-events:auto}
.live-pill{
background:rgba(0,0,0,.6);backdrop-filter:blur(12px);
border-radius:999px;padding:8px 14px;display:flex;align-items:center;
gap:8px;font-size:.88rem;font-weight:600;max-width:65%
}
.red-dot{
width:8px;height:8px;background:var(--accent);border-radius:50%;
animation:blink 1.4s infinite
}
.title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watchers{color:var(--muted);white-space:nowrap}
.header-btns{display:flex;gap:8px}
.icon-btn{
width:40px;height:40px;border-radius:50%;
background:rgba(0,0,0,.55);backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.08);
display:flex;align-items:center;justify-content:center;font-size:1.05rem
}
.icon-btn.muted{background:var(--danger)}
.b-btn{
background:linear-gradient(135deg,#7c3aed,#06b6d4);
font-weight:800;border:0
}

/* CHAT */
.chat-wrap{
position:absolute;bottom:0;left:0;right:0;height:32%;
display:flex;flex-direction:column;
background:linear-gradient(to top,rgba(0,0,0,.88) 50%,transparent);
z-index:30;pointer-events:none
}
.chat-list{
flex:1;overflow-y:auto;padding:10px 12px 6px;
display:flex;flex-direction:column;gap:4px;
pointer-events:auto;scrollbar-width:none;
contain:layout paint
}
.chat-list::-webkit-scrollbar{display:none}
.msg{
font-size:.86rem;line-height:1.3;word-break:break-word
}
.msg .uname{font-weight:700;margin-right:5px}
.msg .c0{color:#ff6b9d}
.msg .c1{color:#5ac8fa}
.msg .c2{color:#30d158}
.msg .c3{color:#ffd60a}
.msg .c4{color:#bf5af2}
.msg .c5{color:#ff9f0a}
.msg .c6{color:#64d2ff}
.msg .c7{color:#ff375f}
.msg.host .uname{color:var(--accent)}
.msg.gift-msg{color:var(--gold);font-weight:600}

.chat-bar{
display:flex;gap:8px;padding:6px 10px 16px;
pointer-events:auto;align-items:center
}
#chat-input{
flex:1;background:rgba(255,255,255,.1);
border:1px solid rgba(255,255,255,.12);
border-radius:999px;padding:11px 16px;color:#fff;
font-size:.9rem;outline:none
}
.btn-send,.btn-gift{
font-weight:700;padding:11px 14px;border-radius:999px
}
.btn-send{background:var(--accent)}
.btn-gift{
background:linear-gradient(135deg,#ffd60a,#ff9f0a);
color:#1a1a1a
}

.mic-status{
position:absolute;bottom:34%;left:12px;font-size:.78rem;
color:var(--green);z-index:25;pointer-events:none
}
.coins-badge{
position:absolute;bottom:34%;right:12px;z-index:25;
background:rgba(0,0,0,.65);backdrop-filter:blur(8px);
border-radius:999px;padding:6px 12px;font-size:.82rem;
font-weight:700;border:1px solid rgba(255,215,0,.3)
}
.coin-icon{color:var(--gold)}

/* BOT MENU */
.b-wrap{position:relative}
.bot-menu{
position:absolute;top:48px;right:0;width:220px;padding:12px;
background:rgba(20,20,24,.98);
border:1px solid #33333b;border-radius:16px;
box-shadow:0 12px 40px rgba(0,0,0,.55);
display:none;z-index:200
}
.bot-menu.show{display:block}
.bot-menu-title{
font-size:.78rem;color:var(--muted);text-transform:uppercase;
letter-spacing:1px;font-weight:700;margin-bottom:9px
}
.bot-options{
display:grid;grid-template-columns:repeat(2,1fr);gap:7px
}
.bot-options button{
padding:10px 5px;border-radius:10px;
background:var(--card2);font-weight:700;font-size:.85rem
}
.bot-options button.selected{background:var(--accent)}
.bot-selected{
margin-top:9px;text-align:center;font-size:.72rem;color:var(--muted)
}

/* GIFT */
#gift-panel,#title-modal{
position:fixed;inset:0;background:rgba(0,0,0,.7);
display:none;z-index:90
}
#gift-panel.show,#title-modal.show{display:flex}
.gift-sheet{
margin-top:auto;background:var(--card);
border-radius:20px 20px 0 0;width:100%;max-height:62vh
}
.gift-sheet-header{
padding:14px 16px;border-bottom:1px solid var(--border);
display:flex;justify-content:space-between
}
.gift-grid{
display:grid;grid-template-columns:repeat(4,1fr);
gap:8px;padding:12px;overflow-y:auto;max-height:55vh
}
.gift-item{
background:var(--card2);border-radius:14px;padding:10px 6px;text-align:center
}
.g-emoji{font-size:1.7rem}
.g-name{font-size:.68rem;color:var(--muted)}
.g-cost{font-size:.72rem;font-weight:700;color:var(--gold)}

#gift-anim{
position:fixed;inset:0;pointer-events:none;z-index:100;
display:flex;align-items:center;justify-content:center
}
.gift-fly{font-size:4.5rem}
.gift-label{
position:absolute;bottom:38%;
background:rgba(0,0,0,.75);color:var(--gold);
padding:8px 18px;border-radius:999px;font-weight:700
}

/* TITLE */
#title-modal{align-items:center;justify-content:center;padding:20px}
.modal-card{
background:var(--card);border-radius:20px;padding:28px 22px;
width:100%;max-width:340px
}
.modal-card h3{text-align:center;margin-bottom:18px}
#title-input{
width:100%;background:var(--bg);border:1px solid var(--border);
border-radius:12px;padding:14px;color:#fff;font-size:1rem;margin-bottom:16px
}
.modal-actions{display:flex;gap:10px}
.modal-actions button{
flex:1;padding:13px;border-radius:12px;font-weight:600
}
.btn-cancel{background:var(--card2)}
.btn-confirm{background:var(--accent)}

#toast{
position:fixed;top:60px;left:50%;
transform:translateX(-50%) translateY(-12px);
background:rgba(20,20,24,.92);padding:10px 18px;
border-radius:999px;font-size:.88rem;opacity:0;
transition:.28s;z-index:200;border:1px solid var(--border);
pointer-events:none
}
.show-toast{
opacity:1!important;
transform:translateX(-50%) translateY(0)!important
}

@keyframes blink{
0%,100%{opacity:1}
50%{opacity:.35}
}
</style>
</head>

function rand(a){
return a[Math.floor(Math.random()*a.length)];
}

function makeName(){
return rand(adjs)+rand(nouns)+rand(tags)+
(Math.random()<.35?Math.floor(Math.random()*900+100):"");

function makeMsg(){
if(Math.random()<.6)return rand(phrases);

const n=1+Math.floor(Math.random()*3);

for(let i=0;i<n;i++){
p.push(Math.random()<.55?rand(phrases):rand(fillers));

}

e.textContent=t;
e.classList.add("show-toast");

setTimeout(()=>{
e.classList.remove("show-toast");
},ms);
}

function show(id){
document.querySelectorAll(".screen").forEach(s=>{
s.classList.remove("active");
});

document.getElementById(id).classList.add("active");
}

function esc(s){
return String(s)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");
}

function colorClass(n){
let h=0;

for(let i=0;i<n.length;i++){
h=(h*31+n.charCodeAt(i))>>>0;
}

return "c"+(h%8);
}

function format(n){
if(n>=1e9)return(n/1e9).toFixed(1)+"B";
if(n>=1e6)return(n/1e6).toFixed(1)+"M";
if(n>=1000)return(n/1000).toFixed(1)+"K";
return String(n);
}

/* CAMERA */

async function startCam(){

stopCam();

const vid=document.getElementById("local-video");
const off=document.getElementById("cam-off");

try{

stream=
await navigator.mediaDevices.getUserMedia({

video:{
facingMode,
width:{ideal:1280},
height:{ideal:720}
},

audio:true

});

vid.srcObject=stream;

vid.style.display="block";
off.style.display="none";

vid.muted=true;

if(facingMode==="user")
vid.classList.add("mirror");
else
vid.classList.remove("mirror");

document.getElementById("btn-mic")
.textContent="🎤";

Object.values(peerConnections)
.forEach(pc=>{

stream.getTracks().forEach(track=>{

const sender=
pc.getSenders()
.find(s=>s.track&&s.track.kind===track.kind);

if(sender)
sender.replaceTrack(track);

});

});

}catch(e){

vid.style.display="none";
off.style.display="block";

toast("Camera permission denied");

}

}


function stopCam(){

if(stream){

stream.getTracks().forEach(t=>t.stop());

stream=null;

}

document.getElementById("local-video")
.srcObject=null;

}


/* WEBRTC HOST */

function listenForViewers(){

const viewersRef=
ref(db,"lives/"+currentLiveId+"/viewers");

if(unsubViewers)
unsubViewers();

unsubViewers=
onChildAdded(
viewersRef,
async snap=>{

const vid=snap.key;

if(
snap.val()?.bot
){
return;
}

if(peerConnections[vid])
return;

await createHostPeer(vid);

}
);

onChildRemoved(
viewersRef,
snap=>{

const vid=snap.key;

if(peerConnections[vid]){

peerConnections[vid].close();

delete peerConnections[vid];

}

}
);

}


async function createHostPeer(viewerId){

const pc=
new RTCPeerConnection(ICE_SERVERS);

peerConnections[viewerId]=pc;

if(stream){

stream.getTracks().forEach(track=>{
pc.addTrack(track,stream);
});

}

pc.onicecandidate=e=>{

if(e.candidate){

push(
ref(
db,
`lives/${currentLiveId}/signals/${viewerId}/hostCandidates`
),
e.candidate.toJSON()
);

}

};


onValue(
ref(
db,
`lives/${currentLiveId}/signals/${viewerId}/answer`
),
snap=>{

const answer=snap.val();

if(
answer&&
pc.signalingState!=="closed"
){

pc.setRemoteDescription(
new RTCSessionDescription(answer)
).catch(()=>{});

}

});


onChildAdded(
ref(
db,
`lives/${currentLiveId}/signals/${viewerId}/viewerCandidates`
),
snap=>{

const c=snap.val();

if(c){

pc.addIceCandidate(
new RTCIceCandidate(c)
).catch(()=>{});

}

});


try{

const offer=
await pc.createOffer();

await pc.setLocalDescription(offer);

await set(
ref(
db,
`lives/${currentLiveId}/signals/${viewerId}/offer`
),
{
type:offer.type,
sdp:offer.sdp
}
);

}catch(e){

console.error("Host offer failed",e);

}

}

async function joinViewer(live){

isSpecialUser?"flex":"none";

document.getElementById("remote-video")

document.getElementById("cam-off")
.style.display="block";

document.getElementById("mic-status")
.textContent="Connecting...";

updateCountDisplay(live.viewers||1);

show("live-room");

toast("Joining "+live.title+"...");

viewerId=
"v"+Date.now()+"_"+Math.random().toString(36).slice(2,6);


try{

await set(
ref(
db,
`lives/${live.id}/viewers/${viewerId}`
),
{
name:user?.name||"Viewer",
joinedAt:Date.now()
}
);

}catch(e){}


unsubLiveEnd=
onValue(
ref(db,"lives/"+live.id),
snap=>{

if(
!snap.exists()&&
currentLiveId===live.id&&
!isHost
){

forceLeaveLive("Live ended by host");

}

}
);


listenToChat(live.id);

if(viewerPC){

try{
viewerPC.close();
}catch(e){}

}

viewerPC=
new RTCPeerConnection(ICE_SERVERS);


viewerPC.ontrack=e=>{

const v=
document.getElementById("remote-video");

v.srcObject=e.streams[0];

v.style.display="block";

document.getElementById("cam-off")
.style.display="none";

document.getElementById("mic-status")
.textContent="Connected";

v.play().catch(()=>{});

};


viewerPC.onconnectionstatechange=()=>{

if(
viewerPC.connectionState==="connected"
){

document.getElementById("mic-status")
.textContent="Connected";

}

if(
viewerPC.connectionState==="failed"
){

document.getElementById("mic-status")
.textContent="Connection failed";

}

};


viewerPC.onicecandidate=e=>{

if(e.candidate){

push(
ref(
db,
`lives/${live.id}/signals/${viewerId}/viewerCandidates`
),
e.candidate.toJSON()
);

}

};


onValue(
ref(
db,
`lives/${live.id}/signals/${viewerId}/offer`
),
async snap=>{

const offer=snap.val();

if(
!offer||
offerHandled||
!viewerPC
)return;

offerHandled=true;

try{

await viewerPC.setRemoteDescription(
new RTCSessionDescription(offer)
);

const answer=
await viewerPC.createAnswer();

await viewerPC.setLocalDescription(answer);

await set(
ref(
db,
`lives/${live.id}/signals/${viewerId}/answer`
),
{
type:answer.type,
sdp:answer.sdp
}
);

}catch(e){

offerHandled=false;

}

});


onChildAdded(
ref(
db,
`lives/${live.id}/signals/${viewerId}/hostCandidates`
),
snap=>{

const c=snap.val();

if(c&&viewerPC){

viewerPC.addIceCandidate(
new RTCIceCandidate(c)
).catch(()=>{});

}

});

}

/* ADD REAL FIREBASE BOTS */

async function addRealBots(amount){

if(
botAdding||
!currentLiveId||
!isSpecialUser||
!isHost
)return;

botAdding=true;

const id=currentLiveId;

const now=Date.now();

const updates={};

try{

for(
let i=0;
i<amount;
i++
){

const bid=
"bot_"+now+"_"+Math.random()
.toString(36)
.slice(2,10)+"_"+i;

activeBotIds.add(bid);

updates[
`lives/${id}/viewers/${bid}`
]={
name:nextName(),
bot:true,
joinedAt:now
};


/*
Bots leave automatically.
Longer random lifetime makes the viewer
count feel less mechanical.
*/
const lifetime=
30000+
Math.random()*180000;

const timer=
setTimeout(
()=>removeRealBot(bid,id),
lifetime
);

botLeaveTimers.set(bid,timer);

}


/*
For very large amounts, this is one Firebase
update instead of thousands of separate writes.
*/
await update(
ref(db),
updates
);

botCount+=amount;

updateCount();

startBotChat();

toast(
"+"+format(amount)+" viewers added"
);

}catch(e){

console.error(e);

toast("Could not add viewers");

}finally{

botAdding=false;

}

}

/* CHAT PERFORMANCE */

let chatQueue=[];
let chatFrame=false;

function displayMsg(
name,
text,
host=false,
gift=false
){

chatQueue.push({
name,
text,
host,
gift
});

if(!chatFrame){

chatFrame=true;

requestAnimationFrame(
renderChat
);

}

}


function renderChat(){

chatFrame=false;

const list=
document.getElementById("chat-list");

const fragment=
document.createDocumentFragment();


/*
Only render a limited number each frame.
This prevents a huge chat burst from freezing
the page.
*/

const batch=
chatQueue.splice(0,25);


batch.forEach(msg=>{

const div=
document.createElement("div");

div.className=
"msg"+
(msg.host?" host":"")+
(msg.gift?" gift-msg":"");

const cls=
msg.host||msg.gift
?""
:colorClass(msg.name);

div.innerHTML=
`<span class="uname ${cls}">
${esc(msg.name)}
</span>${esc(msg.text)}`;

fragment.appendChild(div);

});


list.appendChild(fragment);


/*
Keep only the newest 100 messages on screen.
Firebase can still contain more history,
but the DOM stays small.
*/

while(list.children.length>100){

list.removeChild(
list.firstChild
);

}


list.scrollTop=list.scrollHeight;


if(chatQueue.length){

chatFrame=true;

requestAnimationFrame(
renderChat
);

}

}

function playGiftAnim(
emoji,
name,
cost
){

const anim=
document.getElementById("gift-anim");

anim.innerHTML=`

<div class="gift-fly">
${emoji}
</div>

<div class="gift-label">
${emoji} ${name} · 🪙${format(cost)}
</div>

`;

setTimeout(()=>{

anim.innerHTML="";

},1700);

}


async function sendGift(g){

if(
!currentLiveId||
isHost
)return;

const cost=g[2];

if(
!isInfinite&&
coins<cost
){

toast("Not enough coins!");

return;

}


if(!isInfinite){

coins-=cost;

saveCoins();

updateCoinsUI();

}


document.getElementById("gift-panel")
.classList.remove("show");

playGiftAnim(
g[0],
g[1],
cost
);


try{

await push(
ref(db,`lives/${currentLiveId}/chat`),
{
name:user.name,
text:
`sent ${g[0]} ${g[1]} (🪙${format(cost)})`,
host:false,
gift:true,
giftEmoji:g[0],
giftName:g[1],
giftCost:cost,
at:Date.now()
}
);


await push(
ref(db,`lives/${currentLiveId}/gifts`),
{
from:user.name,
emoji:g[0],
name:g[1],
cost,
toHost:Math.floor(cost*.7),
at:Date.now()
}
);


}catch(e){

toast("Gift failed");

}

}


/* RECEIVE GIFTS */

function listenForGifts(id){

if(unsubGifts)
unsubGifts();

unsubGifts=
onChildAdded(
ref(db,`lives/${id}/gifts`),
snap=>{

if(!isHost)return;

const g=snap.val();

if(!g)return;

playGiftAnim(
g.emoji,
g.name,
g.cost
);

if(!isInfinite){

coins+=g.toHost||0;

saveCoins();

updateCoinsUI();

}

toast(
"+"+
format(g.toHost||0)+
" coins from gift!"
);

}
);

}


/* STOP LIVE */

async function stopLive(){

const id=currentLiveId;

cleanupViewerListeners();

stopOpeningChat();

clearTimeout(botChatTimer);

botChatTimer=null;

stopRealSim();


if(
isHost&&
id
){

await removeAllRealBots(id);

}


stopCam();


Object.values(peerConnections)
.forEach(pc=>{

try{
pc.close();
}catch(e){}

});

peerConnections={};


if(viewerPC){

try{
viewerPC.close();
}catch(e){}

viewerPC=null;

}


if(
viewerId&&
id&&
!isHost
){

await remove(
ref(
db,
`lives/${id}/viewers/${viewerId}`
)
).catch(()=>{});

}


if(isHost&&id){

await endLiveInDb();

}


isHost=false;

botCount=0;
realViewers=0;

viewerId=null;
currentLiveId=null;

document.getElementById("remote-video")
.style.display="none";

document.getElementById("remote-video")
.srcObject=null;

show("menu");

toast("Live ended");

}

</script>
