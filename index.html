// ---------- DIVIDEND ENGINE ----------
function tickDividends() {
  if (!S.dividendReinvest) return;
  Object.keys(S.stockHoldings || {}).forEach(sym => {
    const h = S.stockHoldings[sym];
    const def = (typeof STOCK_DEFS !== "undefined") ? STOCK_DEFS.find(s => s.symbol === sym) : null;
    if (!def || !def.div || !h.shares) return;
    // approximate daily dividend accrual
    const annual = def.div * (S.stocks[sym] ? S.stocks[sym].price : def.base) * h.shares;
    const daily = annual / 365;
    if (S.dividendReinvest) {
      // reinvest: buy more shares
      const p = S.stocks[sym].price;
      if (p > 0 && daily > 0) {
        const add = daily / p;
        h.shares += add;
        // avg cost slightly diluted
      }
    } else {
      S.brokerage = (S.brokerage || 0) + daily;
    }
  });
}

// ---------- AUTO-PAY BILLS ----------
function tryAutoPayBills() {
  if (!S.autoPayBills) return;
  (S.bills || []).forEach(b => {
    if (b.paid) return;
    if (S.checking >= b.amount) {
      S.checking -= b.amount;
      b.paid = true;
      b.overdue = false;
      logTx(-b.amount, "Auto-pay: " + b.name, "checking");
      adjustCredit(1);
    }
  });
}

// ---------- CREDIT UTILIZATION HELPER ----------
function creditUtilization() {
  const lim = S.creditLimit || 1;
  const bal = S.creditBalance || 0;
  return bal / lim;
}

function utilizationPenaltyOrBonus() {
  const u = creditUtilization();
  if (u > 0.7) adjustCredit(-2);
  else if (u > 0.5) adjustCredit(-1);
  else if (u < 0.1 && (S.creditBalance || 0) > 0) adjustCredit(1);
}

// ---------- EMERGENCY FUND TRACKER ----------
function emergencyFundStatus() {
  ensureWatchlist();
  const liquid = (S.checking || 0) + (S.savings || 0);
  const goal = S.emergencyFundGoal || 10000;
  return { liquid, goal, pct: Math.min(1, liquid / goal), ok: liquid >= goal };
}

// ---------- SECTOR COMMENTARY ----------
function sectorCommentary() {
  if (typeof sectorPerformance !== "function") return [];
  const perf = sectorPerformance();
  const entries = Object.keys(perf).map(s => ({ sector: s, chg: perf[s] }));
  entries.sort((a, b) => b.chg - a.chg);
  return entries.slice(0, 5).map(e => ({
    sector: e.sector,
    chg: e.chg,
    label: e.chg > 0.01 ? "Outperforming" : e.chg < -0.01 ? "Underperforming" : "Flat"
  }));
}

// ---------- AFFORDABILITY CHECK ----------
function affordabilityCheck(homePrice, downPct, rate, years) {
  const down = homePrice * (downPct || 0.2);
  const loan = homePrice - down;
  const r = (rate || 0.07) / 12;
  const n = (years || 30) * 12;
  const pmt = loan * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  const income = getMonthlyIncomeEstimate();
  const dti = income > 0 ? pmt / income : 999;
  return {
    down, loan, monthly: pmt,
    dti,
    affordable: dti <= 0.28 && (S.creditScore || 0) >= 620 && ((S.checking || 0) + (S.savings || 0)) >= down
  };
}

// ---------- RULE OF 72 ----------
function ruleOf72(ratePct) {
  if (!ratePct || ratePct <= 0) return Infinity;
  return 72 / ratePct;
}

// ---------- MORTGAGE PAYMENT CALCULATOR ----------
function mortgagePayment(principal, annualRate, years) {
  const r = annualRate / 12;
  const n = years * 12;
  if (r === 0) return principal / n;
  return principal * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
}

  ensureSkills();
  const def = SKILL_DEFS.find(s => s.id === skillId);
  if (!def) return "Unknown skill";
  const lvl = S.skills[skillId] || 0;
  if (lvl >= def.max) return "Max level reached";
  const cost = def.costPerLevel * (lvl + 1);
  if (S.checking < cost) return "Need $" + cost + " in checking";

  S.skills[skillId] = lvl + 1;
  logTx(-cost, "Skill training: " + def.name + " → " + (lvl + 1), "checking");
  save();
  return def.name + " raised to level " + (lvl + 1);
}

function transfer(from, to, amount) {
  amount = Math.abs(Number(amount) || 0);
  if (amount < 1) return "Minimum $1";
  if (amount > 50000) return "Daily transfer limit $50,000";
  if (!canAfford(from, amount)) return "Insufficient funds in " + from;
  debit(from, amount);
  credit(to, amount);
  logTx(-amount, "Transfer " + from + " → " + to, from);
  logTx(amount, "Transfer " + from + " → " + to, to);
  save();
  return "Transferred $" + amount.toFixed(2);
}

// ---------- PROPERTY DETAILED CASHFLOW ----------
function propertyDailyCashflow() {
  let net = 0;
  (S.properties || []).forEach(p => {
    const dailyRent = (p.rent || 0) / 30;
    const dailyTax = (p.tax || 0) / 365;
    const dailyMaint = (p.maint || 0) / 365;
    const dailyMort = (p.mortgagePayment || 0) / 30;
    const vacancy = p.vacant ? 0 : 1;
    net += dailyRent * vacancy - dailyTax - dailyMaint - dailyMort;
    // appreciation
    p.value = (p.value || p.price || 0) * (1 + (0.03 / 365) * (0.5 + Math.random()));
    // mortgage principal paydown approx
    if (p.mortgage > 0 && p.mortgagePayment) {
      const interestPortion = p.mortgage * ((p.rate || 0.07) / 365);
      const principalPortion = Math.max(0, (p.mortgagePayment / 30) - interestPortion);
      p.mortgage = Math.max(0, p.mortgage - principalPortion);
    }
  });
  return net;
}

  S.businesses.push({ id: def.id, name: def.name, income: def.income, upkeep: def.upkeep, since: S.day });
  logTx(-def.cost, "Started business: " + def.name, "checking");

}

// ---------- NEWS SENTIMENT SCORE ----------
function newsSentiment() {
  if (!S.news || !S.news.length) return 0;
  let s = 0;
  S.news.slice(0, 10).forEach(n => {
    const t = ((n.title || "") + " " + (n.body || "")).toLowerCase();
    if (/rally|boom|surge|gain|beat|growth|recovery/.test(t)) s += 0.1;
    if (/crash|recession|layoff|fraud|default|war|crisis|plunge/.test(t)) s -= 0.12;
  });
  return clamp(s, -1, 1);
}

// ---------- LIMIT ORDER STUB ----------
function placeLimitOrder(symbol, type, side, qty, limitPrice) {
  if (!S.limitOrders) S.limitOrders = [];
  S.limitOrders.push({
    id: "lo_" + Date.now(),
    symbol, type, side, // buy|sell
    qty, limitPrice,
    status: "open",
    day: S.day
  });
  save();
  return "Limit order placed";
}

function processLimitOrders() {
  if (!S.limitOrders) return;
  S.limitOrders.forEach(o => {
    if (o.status !== "open") return;
    let p = 0;
    if (o.type === "stock" && S.stocks[o.symbol]) p = S.stocks[o.symbol].price;
    else if (o.type === "crypto" && S.cryptos[o.symbol]) p = S.cryptos[o.symbol].price;
    if (!p) return;
    if (o.side === "buy" && p <= o.limitPrice) {
      if (o.type === "stock") {
        const err = buyStock(o.symbol, o.qty * p);
        if (!err || err === true) o.status = "filled";
      }
    } else if (o.side === "sell" && p >= o.limitPrice) {
      if (o.type === "stock") {
        const err = sellStock(o.symbol, o.qty);
        if (!err || err === true) o.status = "filled";
      }
    }
  });
}

// Unified allocation — always object with fractions (never array)
function allocationBreakdown(){
  const cash = (S.checking||0) + (S.savings||0) + (S.brokerage||0);
  const eq = (typeof portfolioStocks === "function") ? portfolioStocks() : 0;
  const cr = (typeof portfolioCrypto === "function") ? portfolioCrypto() : 0;
  const fu = ((typeof portfolioFunds === "function") ? portfolioFunds() : 0) + (S.ira||0);
  const pr = Math.max(0, (typeof propertyEquity === "function") ? propertyEquity() : 0);
  const total = cash + eq + cr + fu + pr;
  if (!total || total <= 0) {
    return { cash: 1, equity: 0, crypto: 0, funds: 0, property: 0, total: 0 };
  }
  return {
    cash: cash / total,
    equity: eq / total,
    crypto: cr / total,
    funds: fu / total,
    property: pr / total,
    total: total
  };
}

// Unified risk score 0-100
function riskScore(){
  const a = allocationBreakdown();
  let score = (a.crypto||0)*90 + (a.equity||0)*55 + (a.property||0)*35 + (a.funds||0)*30 + (a.cash||0)*5;
  try {
    const debt = (typeof totalDebt === "function") ? totalDebt() : 0;
    const nw = (typeof netWorth === "function") ? netWorth() : 0;
    score += Math.min(30, (debt / Math.max(1000, nw + debt)) * 40);
  } catch(_){}
  return clamp(Math.round(score), 0, 100);
}

// Unified risk label — always a STRING (fixes [object Object])
function riskLabel(n){
  const v = (typeof n === "number") ? n : riskScore();
  if (v < 25) return "Conservative";
  if (v < 45) return "Moderate";
  if (v < 70) return "Growth";
  if (v < 85) return "Aggressive";
  return "Speculative";
}

// Safe maxDrawdown — works with or without series arg
function maxDrawdown(series){
  try {
    if (!series) {
      if (S && S.netWorthHistory && S.netWorthHistory.length) {
        series = S.netWorthHistory.map(p => p.nw);
      } else if (S && S.netHistory && S.netHistory.length) {
        series = S.netHistory.map(x => x.nw);
      } else {
        return 0;
      }
    }
    if (!series || series.length < 2) return 0;
    let peak = series[0];
    let maxDd = 0;
    for (let i = 0; i < series.length; i++) {
      const v = series[i];
      if (v > peak) peak = v;
      if (peak > 0) {
        const dd = (peak - v) / peak;
        if (dd > maxDd) maxDd = dd;
      }
    }
    return maxDd;
  } catch(_) { return 0; }
}

function ensureBrokerageCash(dollars){
  dollars = Number(dollars) || 0;
  if (S.brokerage >= dollars) return null;
  const need = dollars - S.brokerage;
  if (S.checking >= need) {
    S.checking -= need;
    S.brokerage += need;
    addTx("transfer", "Auto-transfer to brokerage", -need, "checking");
    addTx("transfer", "Auto-transfer from checking", need, "brokerage");
    return null;
  }
  return "Not enough cash. Transfer to brokerage (Bank) or free up checking. Need " + fmt(need) + " more.";
}

// ---- Bank cards (realistic PAN display) ----
function luhnCard(seed){
  // deterministic 16-digit looking number from username+seed
  let s = String(seed || "0");
  let digits = [];
  let h = 0;
  for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  h = Math.abs(h);
  // Visa-like 4...
  digits.push(4);
  for (let i = 0; i < 14; i++) {
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    digits.push(h % 10);
  }
  // luhn check digit
  let sum = 0;
  for (let i = 0; i < 15; i++) {
    let d = digits[i];
    if ((15 - i) % 2 === 1) { d *= 2; if (d > 9) d -= 9; }
    sum += d;
  }
  digits.push((10 - (sum % 10)) % 10);
  const num = digits.join("");
  return num.replace(/(\d{4})(?=\d)/g, "$1 ");
}
function ensureAccountCards(){
  if (!S) return;
  if (!S.cards) S.cards = {};
  const base = (S.username || sessionUser || "user") + (S.createdAt || 1);
  if (!S.cards.debit) {
    S.cards.debit = {
      brand: "Ledger Debit",
      pan: luhnCard(base + "-debit"),
      exp: "09/29",
      cvv: String(100 + (Math.abs(hashPass(base).length * 7) % 900)),
      network: "Visa"
    };
  }
  if (!S.cards.credit) {
    S.cards.credit = {
      brand: "Ledger Credit",
      pan: luhnCard(base + "-credit"),
      exp: "12/28",
      cvv: String(100 + (Math.abs(hashPass(base + "c").length * 11) % 900)),
      network: "Mastercard",
      limit: S.creditLimit || 1500
    };
  }
  if (!S.routing) {
    let h = 0;
    const s = base + "rt";
    for (let i = 0; i < s.length; i++) h = ((h << 5) - h + s.charCodeAt(i)) | 0;
    S.routing = String(100000000 + (Math.abs(h) % 800000000)).slice(0, 9);
    S.accountNumber = String(1000000000 + (Math.abs(h * 3) % 9000000000));
  }
}

function openOwnerCMS(){
  ownerGate(async function(){
    // Prefer cloud user list
    let names = [];
    let cloudUsers = {};
    try {
      if (typeof cloudFetch === "function" && CLOUD_API) {
        const data = await cloudFetch("/owner/list", { ownerPassword: "kobiTheowner" });
        (data.users || []).forEach(function(u) {
          names.push(u.username);
          cloudUsers[u.username] = u;
        });
      }
    } catch (e) {
      console.warn("owner list cloud", e);
    }
    // merge local
    try {
      const local = allUsers();
      Object.keys(local).forEach(function(u) {
        if (names.indexOf(u) < 0) names.push(u);
      });
    } catch(_){}
    if (sessionUser && names.indexOf(sessionUser) < 0) names.unshift(sessionUser);

    let options = names.map(function(u) {
      const cu = cloudUsers[u];
      const extra = cu ? (" · chk " + (cu.checking != null ? Math.round(cu.checking) : "?")) : "";
      return '<option value="' + u + '"' + (u === sessionUser ? " selected" : "") + ">@" + u + extra + "</option>";
    }).join("");
    if (!options) options = '<option value="">No accounts</option>';

    openModal(
      '<h2>Owner CMS</h2>' +
      '<div class="meta mb-8">Changes save to Cloudflare for the selected account</div>' +
      "<label>Account</label>" +
      '<select id="own-user">' + options + "</select>" +
      "<label>Set checking</label>" +
      '<input type="number" id="own-checking" placeholder="leave blank = no change">' +
      "<label>Set savings</label>" +
      '<input type="number" id="own-savings" placeholder="leave blank = no change">' +
      "<label>Set brokerage</label>" +
      '<input type="number" id="own-brokerage" placeholder="leave blank = no change">' +
      "<label>Add / remove cash (checking)</label>" +
      '<input type="number" id="own-delta" placeholder="e.g. 500 or -200">' +
      "<label>Credit score (300–850)</label>" +
      '<input type="number" id="own-credit" min="300" max="850" placeholder="leave blank">' +
      "<label>Set day</label>" +
      '<input type="number" id="own-day" min="1" placeholder="leave blank">' +
      "<label>Credit limit</label>" +
      '<input type="number" id="own-limit" placeholder="leave blank">' +
      '<div class="modal-actions" style="flex-wrap:wrap;gap:8px">' +
      '<button class="btn btn-primary" type="button" id="own-apply">Apply + cloud save</button>' +
      '<button class="btn btn-secondary" type="button" id="own-load">Load into session</button>' +
      '<button class="btn btn-danger" type="button" id="own-wipe">Wipe debts</button>' +
      "</div>" +
      '<div class="meta mt-8" id="own-status"></div>'
    );

    setTimeout(function(){
      function uname() {
        return ((document.getElementById("own-user") || {}).value || "").trim().toLowerCase();
      }
      function num(id) {
        const el = document.getElementById(id);
        if (!el || el.value === "" || el.value == null) return null;
        const n = Number(el.value);
        return isNaN(n) ? null : n;
      }
      async function apply() {
        const username = uname();
        if (!username) { toast("No account"); return; }
        const stEl = document.getElementById("own-status");
        if (stEl) stEl.textContent = "Saving to cloud…";
        const payload = {
          ownerPassword: "kobiTheowner",
          username: username,
          checking: num("own-checking"),
          savings: num("own-savings"),
          brokerage: num("own-brokerage"),
          delta: num("own-delta"),
          creditScore: num("own-credit"),
          creditLimit: num("own-limit"),
          day: num("own-day")
        };
        // strip nulls
        Object.keys(payload).forEach(function(k) {
          if (payload[k] == null) delete payload[k];
        });
        payload.ownerPassword = "kobiTheowner";
        payload.username = username;
        try {
          const data = await cloudFetch("/owner/money", payload);
          // update live session if same user
          if (username === sessionUser && data.state) {
            S.checking = data.state.checking;
            S.savings = data.state.savings;
            S.brokerage = data.state.brokerage;
            if (data.state.creditScore != null) S.creditScore = data.state.creditScore;
            if (data.state.creditLimit != null) S.creditLimit = data.state.creditLimit;
            if (data.state.day != null) S.day = data.state.day;
            // also full cloud save of current S so nothing is lost
            if (sessionPassword) {
              await cloudFetch("/save", { username: sessionUser, password: sessionPassword, state: S, displayName: S.displayName });
            } else {
              await cloudFetch("/owner/save", { ownerPassword: "kobiTheowner", username: sessionUser, state: S });
            }
            refreshTopbar();
            if (typeof render === "function") render();
            else if (typeof renderHome === "function") renderHome();
          }
          // mirror local cache
          try {
            const users = allUsers();
            if (users[username] && data.state) {
              Object.assign(users[username].state, data.state);
              saveUsers(users);
            }
          } catch(_){}
          if (stEl) stEl.textContent = "Saved @" + username + " to cloud";
          toast("Owner: cloud saved @" + username);
        } catch (e) {
          if (stEl) stEl.textContent = e.message || String(e);
          toast("Owner save failed: " + (e.message || e));
        }
      }
      async function load() {
        const username = uname();
        if (!username) return;
        try {
          // load via owner: get list then we need full state — use money endpoint no-op or save/load
          // login path needs password; owner list doesn't return full state
          // Use owner/money with no changes after fetching via a save roundtrip:
          // Actually fetch login only with password. For owner load of other users, pull via owner/save after reading from list isn't enough.
          // Workaround: owner/money returns state — call with no field changes
          const data = await cloudFetch("/owner/money", { ownerPassword: "kobiTheowner", username: username });
          if (!data.state) { toast("No state"); return; }
          sessionUser = username;
          S = data.state;
          // keep session password only if same user we knew
          if (typeof ensureMarket === "function") ensureMarket(S);
          if (typeof sanitizeState === "function") sanitizeState();
          if (typeof ensureAccountCards === "function") ensureAccountCards();
          closeModal();
          const auth = document.getElementById("auth-screen");
          const main = document.getElementById("main-app");
          if (auth) auth.classList.add("hidden");
          if (main) { main.classList.remove("hidden"); main.style.display = "flex"; }
          if (typeof showScreen === "function") showScreen("home");
          refreshTopbar();
          toast("Loaded @" + username + " (owner)");
        } catch (e) {
          toast(e.message || String(e));
        }
      }
      async function wipe() {
        const username = uname();
        if (!username) return;
        try {
          let st = null;
          if (username === sessionUser && S) st = S;
          else {
            const data = await cloudFetch("/owner/money", { ownerPassword: "kobiTheowner", username: username });
            st = data.state;
          }
          if (!st) return;
          st.creditBalance = 0;
          st.loans = [];
          (st.properties || []).forEach(function(p) { p.mortgage = 0; });
          await cloudFetch("/owner/save", { ownerPassword: "kobiTheowner", username: username, state: st });
          if (username === sessionUser) {
            S = st;
            refreshTopbar();
          }
          toast("Debts wiped @" + username);
        } catch (e) {
          toast(e.message || String(e));
        }
      }
      const a = document.getElementById("own-apply");
      const l = document.getElementById("own-load");
      const w = document.getElementById("own-wipe");
      if (a) a.onclick = function(){ apply(); };
      if (l) l.onclick = function(){ load(); };
      if (w) w.onclick = function(){ wipe(); };
    }, 0);
  });
}

/** Cloud P2P — by card number and/or username */
async function paySomeoneCloud(opts){
  opts = opts || {};
  const amount = Number(opts.amount);
  if (!(amount > 0)) return "Enter a valid amount";
  if (!sessionUser || !sessionPassword) return "Not signed in";
  if (!CLOUD_API) return "Cloud offline";
  const body = {
    username: sessionUser,
    password: sessionPassword,
    amount: amount,
    note: opts.note || "",
    pan: opts.pan || "",
    toUsername: opts.toUsername || ""
  };
  try {
    const data = await cloudFetch("/pay", body);
    // sync sender local state from server result
    if (data.senderChecking != null) S.checking = data.senderChecking;
    if (typeof addTx === "function") {
      addTx("transfer", "Pay @" + data.toUsername + (opts.note ? " · " + opts.note : ""), -amount, "checking");
    }
    saveGame();
    return null;
  } catch (e) {
    return e.message || String(e);
  }
}

// ---------- CANDLESTICK ENGINE ----------
const CANDLE_THEMES = {
  classic: { up:"#00c853", down:"#ff5252", bg:"#0d0f14", grid:"#1e2230", wick:"#8b92a5" },
  neon: { up:"#18ffff", down:"#ff1744", bg:"#05060a", grid:"#1a1030", wick:"#b388ff" },
  mono: { up:"#e8eaed", down:"#5c6370", bg:"#12141a", grid:"#2a2e3a", wick:"#8b92a5" },
  gold: { up:"#ffc107", down:"#ff6f00", bg:"#120e08", grid:"#2a2218", wick:"#c9a227" },
};
let candleState = { symbol:"AAPL", kind:"stock", tf:"10s", theme:"classic", limit:60, stake:25 };

function ensureCandles(sym, kind){
  kind = kind || "stock";
  const book = kind === "crypto" ? S.cryptos : S.stocks;
  if (!book || !book[sym]) return null;
  const asset = book[sym];
  if (!asset.candles) asset.candles = [];
  // seed from history/price if empty
  if (asset.candles.length < 20) {
    let px = asset.price || 100;
    while (asset.candles.length < 40) {
      const o = px;
      const ch = px * rnd(-0.02, 0.02);
      const c = Math.max(0.01, px + ch);
      const h = Math.max(o, c) * (1 + rnd(0, 0.008));
      const l = Math.min(o, c) * (1 - rnd(0, 0.008));
      asset.candles.push({ o, h, l, c, t: Date.now() - (40-asset.candles.length)*60000 });
      px = c;
    }
    asset.price = px;
  }
  return asset;
}

function pushCandleTick(){
  if (!S) return;
  // update a few active symbols each tick
  const pool = [];
  Object.keys(S.stocks||{}).forEach(s => pool.push({s, k:"stock"}));
  Object.keys(S.cryptos||{}).forEach(s => pool.push({s, k:"crypto"}));
  for (let i = 0; i < 8; i++) {
    const pick = pool[Math.floor(Math.random()*pool.length)];
    if (!pick) break;
    const asset = ensureCandles(pick.s, pick.k);
    if (!asset) continue;
    const last = asset.candles[asset.candles.length-1];
    const vol = (asset.vol || 0.02) * (pick.k==="crypto"?1.8:1);
    // continue or new candle based on tf simulation: every few ticks new candle
    const newBar = (S.tick % (["3s","5s","10s","15s"].indexOf(candleState.tf)>=0 ? 1 : candleState.tf==="30s" ? 2 : candleState.tf==="60s" ? 3 : 5) === 0);
    if (newBar || !last) {
      const o = asset.price;
      const ch = o * rnd(-vol, vol);
      const c = Math.max(0.0001, o + ch);
      const h = Math.max(o, c) * (1 + rnd(0, vol*0.5));
      const l = Math.min(o, c) * (1 - rnd(0, vol*0.5));
      asset.candles.push({ o, h, l, c, t: Date.now() });
      if (asset.candles.length > 120) asset.candles.shift();
      asset.prev = asset.price;
      asset.price = c;
    } else {
      // wiggle current candle
      const ch = asset.price * rnd(-vol*0.3, vol*0.3);
      const c = Math.max(0.0001, asset.price + ch);
      last.c = c;
      last.h = Math.max(last.h, c, last.o);
      last.l = Math.min(last.l, c, last.o);
      asset.price = c;
    }
    if (asset.history) {
      asset.history.push(asset.price);
      if (asset.history.length > 60) asset.history.shift();
    }
  }
}

function renderCandleSVG(candles, themeName){
  const th = CANDLE_THEMES[themeName] || CANDLE_THEMES.classic;
  const w = 320, h = 200, pad = 8;
  if (!candles || !candles.length) return '<svg class="candle-chart" viewBox="0 0 320 200"></svg>';
  const slice = candles.slice(-candleState.limit);
  let min = Infinity, max = -Infinity;
  slice.forEach(c => { min = Math.min(min, c.l); max = Math.max(max, c.h); });
  if (!(max > min)) { max = min + 1; }
  const range = max - min;
  const bw = (w - pad*2) / slice.length;
  const y = v => pad + (1 - (v - min) / range) * (h - pad*2);
  let body = '';
  // grid
  for (let i = 0; i < 4; i++) {
    const gy = pad + (i/3) * (h-pad*2);
    body += '<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="'+th.grid+'" stroke-width="1"/>';
  }
  slice.forEach((c, i) => {
    const x = pad + i * bw + bw*0.5;
    const up = c.c >= c.o;
    const col = up ? th.up : th.down;
    const yO = y(c.o), yC = y(c.c), yH = y(c.h), yL = y(c.l);
    body += '<line x1="'+x+'" y1="'+yH+'" x2="'+x+'" y2="'+yL+'" stroke="'+th.wick+'" stroke-width="1"/>';
    const top = Math.min(yO, yC), bh = Math.max(2, Math.abs(yC - yO));
    body += '<rect x="'+(x-bw*0.3)+'" y="'+top+'" width="'+(bw*0.6)+'" height="'+bh+'" fill="'+col+'"/>';
  });
  const last = slice[slice.length-1];
  body += '<text x="'+(w-4)+'" y="14" fill="'+th.wick+'" font-size="10" text-anchor="end">'+ (last?last.c.toFixed(last.c>10?2:4):'') +'</text>';
  return '<svg class="candle-chart" viewBox="0 0 '+w+' '+h+'" style="background:'+th.bg+'">'+body+'</svg>';
}

// Original UI uses object map S.businesses[id]; expansion used array + reqSkills.
// Unify: always object map + req from def.req or def.reqSkills
buyBusiness = function(id){
  const def = BUSINESS_DEFS.find(b => b.id === id);
  if (!def) return "Unknown business";
  if (!S.businesses || Array.isArray(S.businesses)) {
    // migrate array → map
    const map = {};
    if (Array.isArray(S.businesses)) {
      S.businesses.forEach(b => { if (b && b.id) map[b.id] = b; });
    }
    S.businesses = map;
  }
  if (S.businesses[id]) return "Already owned";
  const req = def.req || def.reqSkills || {};
  // map skill aliases
  const skillMap = { physical:"strength", coding:"tech", analysis:"finance", leadership:"admin", care:"health", trade:"strength", admin:"admin", sales:"sales" };
  const ok = Object.keys(req).every(k => {
    const sk = skillMap[k] || k;
    return (S.skills[sk]||0) >= req[k];
  });
  if (!ok) return "Skills requirement not met";
  if ((S.checking||0) < def.cost) return "Need " + fmt(def.cost) + " in checking";
  S.checking -= def.cost;
  S.businesses[id] = { since: S.day, level: 1, income: def.income, upkeep: def.upkeep, name: def.name };
  if (typeof addTx === "function") addTx("business", "Bought: " + def.name, -def.cost, "checking");
  toast("Business acquired: " + def.name);
  saveGame();
  return null;
};
window.buyBusiness = buyBusiness;

// Daily net from object businesses
businessDailyNet = function(){
  let net = 0;
  if (!S.businesses) return 0;
  if (Array.isArray(S.businesses)) {
    S.businesses.forEach(b => { net += (b.income||0) - (b.upkeep||0); });
    return net;
  }
  Object.keys(S.businesses).forEach(id => {
    const def = BUSINESS_DEFS.find(b => b.id === id);
    const b = S.businesses[id];
    if (def) net += (def.income - def.upkeep);
    else if (b) net += (b.income||0) - (b.upkeep||0);
  });
  return net;
};

// Faster live tick for the open chart symbol
pushCandleTick = function(){
  if (!S) return;
  function step(asset, mult){
    if (!asset) return;
    if (!asset.candles) asset.candles = [];
    if (asset.candles.length < 60) {
      let px = asset.price || 100;
      while (asset.candles.length < 80) {
        const o = px;
        const ch = px * rnd(-0.015, 0.015) * mult;
        const c = Math.max(0.0001, px + ch);
        const h = Math.max(o, c) * (1 + rnd(0, 0.006));
        const l = Math.min(o, c) * (1 - rnd(0, 0.006));
        asset.candles.push({ o, h, l, c, t: Date.now() - (80-asset.candles.length)*1000 });
        px = c;
      }
      asset.price = px;
    }
    const vol = (asset.vol || 0.015) * mult;
    let last = asset.candles[asset.candles.length-1];
    // new candle every ~3 seconds of ticks
    const needNew = !last || (Date.now() - (last.t||0) > 3000);
    if (needNew) {
      const o = asset.price;
      const ch = o * rnd(-vol, vol);
      const c = Math.max(0.0001, o + ch);
      const h = Math.max(o, c) * (1 + rnd(0, vol*0.4));
      const l = Math.min(o, c) * (1 - rnd(0, vol*0.4));
      asset.candles.push({ o, h, l, c, t: Date.now() });
      if (asset.candles.length > 200) asset.candles.shift();
      asset.prev = asset.price;
      asset.price = c;
    } else {
      const ch = asset.price * rnd(-vol*0.35, vol*0.35);
      const c = Math.max(0.0001, asset.price + ch);
      last.c = c;
      last.h = Math.max(last.h, c, last.o);
      last.l = Math.min(last.l, c, last.o);
      last.t = Date.now();
      asset.prev = asset.price;
      asset.price = c;
    }
    if (!asset.history) asset.history = [];
    asset.history.push(asset.price);
    if (asset.history.length > 100) asset.history.shift();
  }
  // Always animate the selected chart symbol strongly
  const kind = candleState.kind;
  const sym = candleState.symbol;
  const book = kind === "crypto" ? S.cryptos : S.stocks;
  if (book && book[sym]) step(book[sym], kind==="crypto" ? 2.2 : 1.4);
  // Light random others
  Object.keys(S.stocks||{}).slice(0, 12).forEach(s => { if (s !== sym) step(S.stocks[s], 0.6); });
  Object.keys(S.cryptos||{}).slice(0, 8).forEach(s => { if (s !== sym) step(S.cryptos[s], 1.0); });
};

function settleTimedOrders(){
  if (!S || !S.timedTrades) return;
  const now = Date.now();
  const left = [];
  S.timedTrades.forEach(tr => {
    if (now < tr.expiresAt) { left.push(tr); return; }
    const book = tr.kind === "crypto" ? S.cryptos : S.stocks;
    const asset = book && book[tr.symbol];
    const exit = asset ? asset.price : tr.entry;
    const up = exit >= tr.entry;
    const win = (tr.side === "buy" && up) || (tr.side === "sell" && !up);
    // payout 85% profit on win, lose stake on loss
    let payout = 0;
    if (win) {
      payout = tr.stake * 1.85;
      S.checking = (S.checking||0) + payout;
      if (typeof addTx === "function") addTx("invest", "Timed "+tr.side.toUpperCase()+" WIN "+tr.symbol, payout, "checking");
      toast("WIN +" + fmt(payout - tr.stake) + " · " + tr.symbol);
    } else {
      if (typeof addTx === "function") addTx("invest", "Timed "+tr.side.toUpperCase()+" LOSS "+tr.symbol, -tr.stake, "checking");
      toast("LOSS −" + fmt(tr.stake) + " · " + tr.symbol);
    }
  });
  S.timedTrades = left;
}

function placeTimedTrade(side){
  if (!S) return "Not signed in";
  const amtEl = document.getElementById("c-amt");
  if (amtEl && amtEl.value) candleState.stake = Number(amtEl.value);
  const stake = Number(candleState.stake || (amtEl && amtEl.value));
  if (!(stake > 0)) return "Enter order size";
  if ((S.checking||0) < stake) return "Need " + fmt(stake) + " in checking";
  const durSec = { "3s": 3, "5s": 5, "10s": 10, "15s": 15, "30s": 30, "60s": 60, "30m": 1800, "1h": 3600, "24h": 86400 }[candleState.tf] || 10;
  // Map UI tf to real-seconds duration for the timed trade
  const tfDur = { "3s": 3, "5s": 5, "10s": 10, "15s": 15, "30s": 30, "60s": 60, "30m": 1800, "1h": 3600, "24h": 86400 };
  const seconds = tfDur[candleState.tf] || 60;
  const book = candleState.kind === "crypto" ? S.cryptos : S.stocks;
  const asset = book && book[candleState.symbol];
  if (!asset) return "Unknown symbol";
  S.checking -= stake;
  if (typeof addTx === "function") addTx("invest", "Timed "+side.toUpperCase()+" "+candleState.symbol, -stake, "checking");
  if (!S.timedTrades) S.timedTrades = [];
  S.timedTrades.push({
    id: uid(),
    symbol: candleState.symbol,
    kind: candleState.kind,
    side: side, // buy = call (win if up), sell = put (win if down)
    stake: stake,
    entry: asset.price,
    openedAt: Date.now(),
    expiresAt: Date.now() + seconds * 1000,
    seconds: seconds
  });
  saveGame();
  toast(side.toUpperCase() + " " + fmt(stake) + " · closes in " + seconds + "s");
  return null;
}
window.placeTimedTrade = placeTimedTrade;

// Scrollable live SVG
renderCandleSVG = function(candles, themeName){
  const th = CANDLE_THEMES[themeName] || CANDLE_THEMES.classic;
  const h = 220, pad = 10;
  if (!candles || !candles.length) return '<div class="candle-scroll"><svg class="candle-chart" viewBox="0 0 320 220"></svg></div>';
  const slice = candles.slice(-Math.max(candleState.limit || 60, 40));
  const bw = 8;
  const w = Math.max(320, slice.length * bw + pad * 2);
  let min = Infinity, max = -Infinity;
  slice.forEach(c => { min = Math.min(min, c.l); max = Math.max(max, c.h); });
  if (!(max > min)) max = min + 1;
  const range = max - min;
  const y = v => pad + (1 - (v - min) / range) * (h - pad * 2);
  let body = '';
  for (let i = 0; i < 5; i++) {
    const gy = pad + (i/4)*(h-pad*2);
    body += '<line x1="0" y1="'+gy+'" x2="'+w+'" y2="'+gy+'" stroke="'+th.grid+'" stroke-width="1"/>';
  }
  slice.forEach((c, i) => {
    const x = pad + i * bw + bw * 0.5;
    const up = c.c >= c.o;
    const col = up ? th.up : th.down;
    const yO = y(c.o), yC = y(c.c), yH = y(c.h), yL = y(c.l);
    body += '<line x1="'+x+'" y1="'+yH+'" x2="'+x+'" y2="'+yL+'" stroke="'+th.wick+'" stroke-width="1.2"/>';
    const top = Math.min(yO, yC), bh = Math.max(2, Math.abs(yC - yO));
    body += '<rect x="'+(x - bw*0.35)+'" y="'+top+'" width="'+(bw*0.7)+'" height="'+bh+'" fill="'+col+'" rx="0.5"/>';
  });
  const last = slice[slice.length-1];
  const priceStr = last ? (last.c > 10 ? last.c.toFixed(2) : last.c.toPrecision(4)) : '';
  body += '<text x="'+(w-6)+'" y="16" fill="'+th.up+'" font-size="11" text-anchor="end" font-weight="700">'+priceStr+'</text>';
  // entry lines for open timed trades
  if (S && S.timedTrades) {
    S.timedTrades.filter(t => t.symbol === candleState.symbol).forEach(tr => {
      const ey = y(tr.entry);
      body += '<line x1="0" y1="'+ey+'" x2="'+w+'" y2="'+ey+'" stroke="#448aff" stroke-width="1" stroke-dasharray="4 3"/>';
    });
  }
  return '<div class="candle-scroll" style="overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border)">' +
    '<svg class="candle-chart" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" style="background:'+th.bg+';display:block;min-width:100%">'+body+'</svg></div>';
};

async function cloudFetch(path, body) {
  if (!CLOUD_API) throw new Error("No cloud API URL set");
  const res = await fetch(CLOUD_API.replace(/\/$/, "") + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || ("HTTP " + res.status));
    err.status = res.status;
    err.data = data;
    if (data.conflict && data.state) {
      // auto-apply server state for conflict
      S = data.state;
      S._cloudUpdatedAt = data.updatedAt || Date.now();
      if (typeof ensureMarket === "function") ensureMarket(S);
      if (typeof refreshTopbar === "function") refreshTopbar();
    }
    throw err;
  }
  return data;
}

// Career tokens spend: 1 token = 10% off next skill train (stack max 5 = 50% off)
window.useCareerTokensOnTrain = true;
// Skill training: must afford cost + real-time study (not instant)
function formatTrainLeft(ms) {
  ms = Math.max(0, ms);
  const s = Math.ceil(ms / 1000);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + (s % 60) + "s";
  const h = Math.floor(m / 60);
  return h + "h " + (m % 60) + "m";
}
function trainDurationMs(level) {
  // Level 0→1: 20 min, then +25 min per level (real wall-clock)
  // Cap 8 hours so high levels still finish in a day
  const mins = Math.min(20 + level * 25, 8 * 60);
  return mins * 60 * 1000;
}
function trainSkillCost(def, level) {
  let cost = Math.floor((def.costBase || 200) * Math.pow(1.55, level));
  // First level of basic physical only: free tuition, still takes time
  if (level === 0 && def.id === "physical") cost = 0;
  let used = 0;
  if ((S.careerTokens || 0) > 0) {
    used = Math.min(5, S.careerTokens);
    cost = Math.floor(cost * (1 - used * 0.1));
  }
  return { cost: Math.max(0, cost), tokensUsed: used };
}
function settleTraining() {
  if (!S || !S.training) return;
  if (Date.now() < S.training.endsAt) return;
  const t = S.training;
  S.skills[t.skillId] = t.to;
  S.training = null;
  toast(t.skillName + " → level " + t.to + " (training complete)");
  if (typeof saveGame === "function") saveGame();
}
trainSkill = function(skillId) {
  if (!S) return "Not signed in";
  settleTraining();
  const def = SKILL_DEFS.find(s => s.id === skillId);
  if (!def) return "Unknown skill";
  const level = S.skills[skillId] || 0;
  if (level >= (def.max || 10)) return "Already maxed";
  if (S.training) {
    const left = formatTrainLeft(S.training.endsAt - Date.now());
    return "Still training " + S.training.skillName + " (" + left + " left)";
  }
  const { cost, tokensUsed } = trainSkillCost(def, level);
  const bal = Number(S.checking) || 0;
  if (bal < cost) return "Need " + fmt(cost) + " in checking (you have " + fmt(bal) + ")";
  // charge first, then start timer — skill does NOT increase until done
  S.checking = bal - cost;
  if (S.checking < 0) S.checking = 0; // never go negative from train
  // re-check edge case
  if (cost > 0 && bal < cost) {
    S.checking = bal;
    return "Need " + fmt(cost) + " in checking";
  }
  S.educationSpent = (S.educationSpent || 0) + cost;
  if (tokensUsed > 0) S.careerTokens = Math.max(0, (S.careerTokens || 0) - tokensUsed);
  const ms = trainDurationMs(level);
  S.training = {
    skillId: skillId,
    skillName: def.name,
    from: level,
    to: level + 1,
    startedAt: Date.now(),
    endsAt: Date.now() + ms,
    cost: cost
  };
  if (typeof addTx === "function") {
    addTx("education", "Train " + def.name + " (in progress)", cost ? -cost : 0, "checking");
  }
  toast(def.name + " training started · " + formatTrainLeft(ms) + (cost ? "" : " · free intro lesson"));
  saveGame();
  return null;
};

        S._cloudUpdatedAt = data.updatedAt || Date.now();

        toast("Payment received · +" + fmt(diff));
        if (typeof bankTab !== "undefined" && bankTab === "history") renderBank();
        if (typeof bankTab !== "undefined" && bankTab === "accounts") renderBank();
      } else if (data.updatedAt && S._cloudUpdatedAt && data.updatedAt > S._cloudUpdatedAt + 2000) {
        // general newer state (owner edits etc.)
        if (remote.transactions && remote.transactions.length > (S.transactions||[]).length) {
          S.transactions = remote.transactions;
        }
        S._cloudUpdatedAt = data.updatedAt;
      }
    } catch(_){}
  }, 12000);
}

        const feat = (p.coins === 100 || p.coins === 1000) ? " featured" : "";
        return '<div class="luba-buy-card' + feat + '" data-pack="' + i + '"><div class="amt">' + p.coins.toLocaleString() +
          '</div><div class="meta">' + p.label + '</div><div class="price">' + fmt(p.price) + "</div></div>";
      }).join("") + "</div></div>";
    document.getElementById("luba-back-chat").onclick = function() { lubaView = "chat"; renderLuba(); };
    root.querySelectorAll("[data-pack]").forEach(function(el) {
      el.onclick = function() {
        const err = buyLubaCoins(Number(el.getAttribute("data-pack")));
        if (err && err !== "Cancelled") toast(err);
        else if (!err) { lubaView = "chat"; renderLuba(); refreshTopbar(); }
      };
    });
    return;
  }

  // Chat shell — rebuild if input missing (compose must always show)
  if (!root.querySelector("#luba-input") || !root.querySelector(".luba-compose")) {
    root.innerHTML =
      '<div class="luba-head"><div class="id"><div class="avatar">' + lubaStarSvg() + '</div>' +
      '<div class="titles"><div class="n">Luba AI <span class="meta" style="font-weight:600;font-size:12px">Finance</span></div>' +
      '<div class="t">Invest · money · jobs · legal basics</div></div></div>' +
      '<div class="luba-coins" id="luba-coin-pill">' + coins + ' coins</div></div>' +
      '<div class="luba-msgs" id="luba-msgs"></div>' +
      '<div id="luba-img-prev" style="display:none;padding:0 12px 6px"></div>' +
      '<div class="luba-compose">' +
      '<button type="button" class="btn btn-secondary btn-sm" id="luba-photo" title="Photo" style="padding:10px;border-radius:12px">📷</button>' +
      '<textarea id="luba-input" rows="1" placeholder="Message Luba…"></textarea>' +
      '<button type="button" class="send" id="luba-send">Send</button></div>' +
      '<input type="file" id="luba-file" accept="image/*" style="display:none">';

    document.getElementById("luba-send").onclick = function() { sendLubaMessage(); };
    document.getElementById("luba-input").addEventListener("keydown", function(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendLubaMessage(); }
    });
    document.getElementById("luba-coin-pill").onclick = function() { lubaView = "buy"; renderLuba(); };
    document.getElementById("luba-photo").onclick = function() { document.getElementById("luba-file").click(); };
    document.getElementById("luba-file").onchange = function(e) {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = function() {
        lubaPendingImage = r.result;
        const prev = document.getElementById("luba-img-prev");
        if (prev) {
          prev.style.display = "block";
          prev.innerHTML = '<img src="' + lubaPendingImage + '" style="max-height:80px;border-radius:8px">' +
            ' <button type="button" class="btn btn-sm btn-secondary" id="luba-img-x">Remove</button>';
          document.getElementById("luba-img-x").onclick = function() {
            lubaPendingImage = null; prev.style.display = "none"; prev.innerHTML = "";
          };
        }
      };
      r.readAsDataURL(f);
    };
  }
  lubaRenderMessagesOnly();
}

async function sendLubaMessage() {
  if (lubaBusy) return;
  ensureLubaState();
  const input = document.getElementById("luba-input");
  const text = ((input && input.value) || "").trim();
  const img = lubaPendingImage;
  if (!text && !img) return;

  if ((S.luba.coins || 0) <= 0) {
    S.luba.messages.push({ role: "bot", text: "You're out of coins. Tap the coins pill or Buy more coins — pay from checking.", at: Date.now() });
    saveGame();
    lubaRenderMessagesOnly();
    const box = document.getElementById("luba-msgs");
    if (box && !document.getElementById("luba-buy-cta")) {
      const wrap = document.createElement("div");
      wrap.style.cssText = "text-align:center;margin:8px 0";
      wrap.innerHTML = '<button type="button" class="btn btn-primary" id="luba-buy-cta">Buy more coins</button>';
      box.appendChild(wrap);
      document.getElementById("luba-buy-cta").onclick = function() { lubaView = "buy"; renderLuba(); };
    }
    return;
  }

  const heavy = /(html|css|javascript|js|code|script|game|app|program|build|create|make|write|fix|5k|5000|lines)/i.test(text || "") || !!img;
  const cost = heavy ? 2 : 1;
  if ((S.luba.coins || 0) < cost) {
    S.luba.messages.push({ role: "bot", text: "Not enough coins (need " + cost + "). Buy more or wait for the 24h refresh.", at: Date.now() });
    saveGame();
    lubaRenderMessagesOnly();
    return;
  }
  S.luba.coins -= cost;
  S.luba.messages.push({ role: "me", text: text || "(photo)", image: img || null, at: Date.now() });
  if (input) input.value = "";
  lubaPendingImage = null;
  const prev = document.getElementById("luba-img-prev");
  if (prev) { prev.style.display = "none"; prev.innerHTML = ""; }
  saveGame();
  lubaRenderMessagesOnly();

  lubaBusy = true;
  const sendBtn = document.getElementById("luba-send");
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "…"; }

  try {
    const history = (S.luba.messages || []).slice(-12).map(function(m) {
      return { role: m.role === "me" ? "user" : "model", parts: [{ text: m.text || "" }] };
    });
    // last user already in history; API wants contents without duplicating oddly — rebuild clean
    const contents = [];
    (S.luba.messages || []).slice(-10).forEach(function(m) {
      if (m.role === "me") contents.push({ role: "user", parts: [{ text: m.text || "Hello" }] });
      else contents.push({ role: "model", parts: [{ text: m.text || "" }] });
    });
    // ensure ends with user
    if (!contents.length || contents[contents.length - 1].role !== "user") {
      contents.push({ role: "user", parts: [{ text: text || "Hello" }] });
    }
    if (img && contents.length) {
      try {
        const m = String(img).match(/^data:(image\/[a-zA-Z0-9+.-]+);base64,(.+)$/);
        if (m) {
          contents[contents.length - 1].parts.push({ inlineData: { mimeType: m[1], data: m[2] } });
        }
      } catch(_){}
    }

    const wantsCode = /\b(html|css|javascript|js|code|script|game|app|program|build|create|make|write|fix|bug|feature|canvas|react|5k|5000|lines)\b/i.test(text || "");
    const maxOut = wantsCode ? 8192 : 2048;
    const maxContinues = wantsCode ? 10 : 2;
    const modelChain = [
      "gemini-3.8-flash",
      "gemini-3.5-flash",
      "gemini-3.6-flash",
      "gemini-3.7-flash",
      "gemini-3.1-flash-lite",
      "gemini-3.5-flash-lite",
      "gemini-2.5-flash-lite",
      "gemini-2.5-flash"
    ];

    let accumulated = "";
    let lastErr = "";
    let modelIndex = 0;
    let continueCount = 0;
    let guard = 0;
    const workContents = contents.slice();

    while (guard < 16) {
      guard++;
      const payload = {
        contents: workContents,
        systemInstruction: { parts: [{ text: lubaSystemPrompt(text) }] },
        generationConfig: {
          temperature: wantsCode ? 0.35 : 0.55,
          maxOutputTokens: maxOut
        }
      };
      let data = null;
      let gotModel = false;
      for (; modelIndex < modelChain.length; modelIndex++) {
        try {
          const res = await fetch(LUBA_WORKER, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              model: modelChain[modelIndex],
              payload: payload,
              username: sessionUser || (S && S.username) || ""
            })
          });
          data = await res.json().catch(function() { return {}; });
          if (data && !data.error && data.candidates && data.candidates[0]) {
            gotModel = true;
            break;
          }
          const msg = (data && data.error && (data.error.message || data.error)) || ("HTTP " + res.status);
          lastErr = String(msg);
          if (/not found|no longer available|not available|invalid model/i.test(lastErr)) continue;
          if (/high demand|overloaded|429|503|quota|rate limit/i.test(lastErr)) continue;
          break;
        } catch (fe) {
          lastErr = fe.message || String(fe);
          continue;
        }
      }
      if (!gotModel || !data) {
        if (!accumulated) accumulated = lastErr || "Luba is busy. Try again.";
        break;
      }
      const candidate = data.candidates[0];
      const parts = candidate.content && candidate.content.parts;
      if (!parts || !parts.length) {
        if (!accumulated) accumulated = "Empty reply — try again.";
        break;
      }
      const chunk = parts.map(function(p) { return p.text || ""; }).join("");
      accumulated += chunk;
      const wasCut = candidate.finishReason === "MAX_TOKENS";
      if (wasCut && continueCount < maxContinues) {
        continueCount++;
        workContents.push({ role: "model", parts: parts });
        workContents.push({
          role: "user",
          parts: [{ text: "Continue EXACTLY where you left off. Do not repeat prior text. Do not say 'continuing'. If writing code, keep implementing the same project until it is complete and robust." }]
        });
        // soft status
        if (sendBtn) sendBtn.textContent = "…" + (continueCount + 1);
        lubaRenderMessagesOnly();
        continue;
      }
      break;
    }
    let reply = accumulated || lastErr || "Empty reply — try again.";
    if (wantsCode && continueCount > 0) {
      reply += "\n\n— (auto-continued " + continueCount + "× for length) —";
    }
    S.luba.messages.push({ role: "bot", text: reply, at: Date.now() });
    if (S.luba.messages.length > 100) S.luba.messages = S.luba.messages.slice(-100);
    saveGame();
    lubaRenderMessagesOnly();
  } catch (e) {
    S.luba.messages.push({ role: "bot", text: "Network error: " + (e.message || e), at: Date.now() });
    saveGame();
    lubaRenderMessagesOnly();
  }
  lubaBusy = false;
  if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = "Send"; }
}

window.renderLuba = renderLuba;
window.sendLubaMessage = sendLubaMessage;
