<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Go Live</title>
<style>
:root{--bg:#0a0a0c;--card:#16161a;--card2:#1c1c22;--accent:#ff2d55;--text:#f2f2f5;--muted:#8b8b96;--green:#30d158;--danger:#ff453a;--border:#2a2a32;--gold:#ffd60a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:none;font-family:inherit;background:none;color:inherit}
input{font-family:inherit}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
#login-screen{align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at top,#1a0a12 0%,var(--bg) 60%)}
.login-box{width:100%;max-width:360px;text-align:center}
.login-logo{font-size:2.4rem;font-weight:800;letter-spacing:-1px;margin-bottom:8px}
.login-logo span{color:var(--accent)}
.login-sub{color:var(--muted);font-size:.95rem;margin-bottom:40px}
.btn-google{width:100%;background:#fff;color:#1f1f1f;padding:14px 20px;border-radius:14px;font-weight:600;font-size:1rem;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.btn-google:disabled{opacity:.6}
.btn-google svg{width:20px;height:20px}
.login-note{margin-top:24px;font-size:.8rem;color:var(--muted)}
#menu{padding:20px 16px 160px}
.broadcast-label{font-size:.7rem;font-weight:600;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
.menu-title{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;margin-bottom:10px}
.menu-title span{color:var(--accent)}
.signed-in{font-size:.95rem;color:var(--muted);margin-bottom:28px}
.signed-in strong{color:var(--green);font-weight:600}
.section-label{font-size:.75rem;font-weight:600;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.lives-list{display:flex;flex-direction:column;gap:10px}
.live-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px}
.live-info{flex:1;min-width:0}
.live-name{font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-meta{font-size:.82rem;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.live-meta .dot{width:7px;height:7px;background:var(--accent);border-radius:50%;flex-shrink:0}
.btn-join{background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;padding:10px 18px;border-radius:999px;flex-shrink:0}
.btn-x-small{width:32px;height:32px;border-radius:50%;background:var(--card2);color:var(--muted);font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.empty-state{text-align:center;padding:48px 20px;color:var(--muted);background:var(--card);border-radius:16px;border:1px dashed var(--border);font-size:.95rem;line-height:1.5}
.bottom-actions{position:fixed;bottom:0;left:0;right:0;padding:16px 16px 28px;background:linear-gradient(transparent,var(--bg) 25%);display:flex;flex-direction:column;gap:10px;z-index:30}
.btn-go-live{background:var(--accent);color:#fff;font-size:1.15rem;font-weight:700;padding:16px;border-radius:999px;box-shadow:0 8px 28px rgba(255,45,85,.35)}
.btn-secondary{background:transparent;color:var(--muted);font-size:.95rem;padding:12px;border-radius:999px;border:1px solid var(--border)}
#live-room{position:relative;background:#000;height:100vh;height:100dvh;overflow:hidden}
#video-wrap{position:absolute;inset:0;background:#0d0d10;display:flex;align-items:center;justify-content:center}
#local-video,#remote-video{width:100%;height:100%;object-fit:cover;display:none}
#local-video.mirror{transform:scaleX(-1)}
.cam-off{text-align:center;color:var(--muted)}
.cam-off .icon{font-size:3.5rem;margin-bottom:10px;opacity:.5}
.live-header{position:absolute;top:0;left:0;right:0;padding:12px 12px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:40;pointer-events:none}
.live-header>*{pointer-events:auto}
.live-pill{background:rgba(0,0,0,.6);backdrop-filter:blur(12px);border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:600;max-width:70%}
.live-pill .red-dot{width:8px;height:8px;background:var(--accent);border-radius:50%;animation:blink 1.4s infinite;flex-shrink:0}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.title-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.watchers{color:var(--muted);font-weight:500;white-space:nowrap}
.header-btns{display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.icon-btn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.08);color:#fff;font-size:1.25rem;display:flex;align-items:center;justify-content:center}
.icon-btn:active{transform:scale(.92)}
.icon-btn.muted{background:var(--danger);border-color:transparent}
.icon-btn.b-btn{background:linear-gradient(135deg,#7c3aed,#06b6d4);font-weight:800;font-size:1rem;border:none}
.chat-wrap{position:absolute;bottom:0;left:0;right:0;height:34%;display:flex;flex-direction:column;background:linear-gradient(to top,rgba(0,0,0,.92) 55%,transparent);z-index:30;pointer-events:none}
.chat-list{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 14px 6px;display:flex;flex-direction:column;gap:5px;pointer-events:auto;scrollbar-width:none}
.chat-list::-webkit-scrollbar{display:none}
.msg{font-size:.88rem;line-height:1.35;word-break:break-word;text-shadow:0 1px 2px rgba(0,0,0,.85);padding:2px 0;flex-shrink:0}
.msg.msg-new{animation:msgIn .12s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.msg .uname{font-weight:700;margin-right:6px}
.msg .c0{color:#ff6b9d}.msg .c1{color:#5ac8fa}.msg .c2{color:#30d158}.msg .c3{color:#ffd60a}.msg .c4{color:#bf5af2}.msg .c5{color:#ff9f0a}.msg .c6{color:#64d2ff}.msg .c7{color:#ff375f}
.msg.host .uname{color:var(--accent)}
.msg.gift-msg{color:var(--gold);font-weight:600}
.chat-bar{display:flex;gap:6px;padding:6px 10px 16px;pointer-events:auto;align-items:center}
#chat-input{flex:1;min-width:0;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:11px 14px;color:#fff;font-size:.9rem;outline:none}
#chat-input::placeholder{color:rgba(255,255,255,.4)}
.btn-send{background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;padding:11px 14px;border-radius:999px;flex-shrink:0}
.btn-gift{background:linear-gradient(135deg,#ffd60a,#ff9f0a);color:#1a1a1a;font-weight:800;font-size:.95rem;padding:10px 12px;border-radius:999px;flex-shrink:0}
.btn-like{background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-size:.95rem;padding:10px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.btn-like.liked{background:rgba(255,45,85,.35);border-color:var(--accent);color:#ff8fa3}
.mic-status{position:absolute;bottom:36%;left:12px;font-size:.78rem;color:var(--green);z-index:25;pointer-events:none;opacity:.85}
.stats-row{position:absolute;bottom:36%;right:12px;z-index:25;display:flex;gap:8px;pointer-events:none}
.coins-badge,.likes-badge{background:rgba(0,0,0,.65);backdrop-filter:blur(8px);border-radius:999px;padding:6px 12px;font-size:.82rem;font-weight:700;display:flex;align-items:center;gap:5px;border:1px solid rgba(255,215,0,.3)}
.likes-badge{border-color:rgba(255,45,85,.4)}
.coin-icon{color:var(--gold)}
#b-menu{position:fixed;top:56px;right:64px;z-index:80;background:rgba(20,20,28,.95);border:1px solid var(--border);border-radius:14px;padding:8px;display:none;flex-direction:column;gap:4px;backdrop-filter:blur(12px);min-width:90px}
#b-menu.show{display:flex}
.b-opt{padding:10px 14px;border-radius:10px;font-weight:700;font-size:.9rem;text-align:center;background:var(--card2);color:#fff}
.b-opt.active{background:linear-gradient(135deg,#7c3aed,#06b6d4)}
#gift-panel{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:90}
#gift-panel.show{display:flex}
.gift-sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:62vh;display:flex;flex-direction:column;border:1px solid var(--border)}
.gift-sheet-header{padding:14px 16px 10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.gift-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;overflow-y:auto;flex:1}
.gift-item{background:var(--card2);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.gift-item .g-emoji{font-size:1.7rem}
.gift-item .g-name{font-size:.68rem;color:var(--muted);text-align:center}
.gift-item .g-cost{font-size:.72rem;font-weight:700;color:var(--gold)}
#gift-anim{position:fixed;inset:0;pointer-events:none;z-index:100;display:flex;align-items:center;justify-content:center}
.gift-fly{font-size:4.5rem;animation:giftFly 1.6s ease forwards}
@keyframes giftFly{0%{transform:scale(.3) translateY(80px);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:scale(.6) translateY(-120px);opacity:0}}
.gift-label{position:absolute;bottom:38%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);color:var(--gold);padding:8px 18px;border-radius:999px;font-weight:700;font-size:.95rem;animation:giftLabel 1.6s ease forwards}
@keyframes giftLabel{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.like-float{position:fixed;right:24px;bottom:28%;font-size:1.6rem;pointer-events:none;z-index:95;animation:likeUp 1.2s ease forwards}
@keyframes likeUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(1.4)}}
#title-modal,#ask-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
#title-modal.show,#ask-modal.show{display:flex}
.modal-card{background:var(--card);border-radius:20px;padding:28px 22px;width:100%;max-width:340px;border:1px solid var(--border)}
.modal-card h3{text-align:center;font-size:1.2rem;margin-bottom:18px}
#title-input,#ask-input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:#fff;font-size:1rem;margin-bottom:16px;outline:none}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;padding:13px;border-radius:12px;font-weight:600}
.btn-cancel{background:var(--card2)}
.btn-confirm{background:var(--accent);color:#fff}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-12px);background:rgba(20,20,24,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;transition:all .28s;z-index:200;pointer-events:none;border:1px solid var(--border)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="login-screen" class="screen active">

<div id="menu" class="screen">

const STOP=new Set('the a an and or but if so to of in on at for with about as by from up out is are was were be been am do does did have has had i me my we our you your he she it they them this that these those there here what which who when where why how not no yes just like really very can could should would will its im ive dont cant wont thats then than too also get got go going gonna wanna let lets say said says know think want mean okay ok yeah well one now some any more most much many even still only back into over off see look come came make made thing things guys chat hello hi hey right actually basically literally because cause gotta thing stuff kinda sorta maybe'.split(' '));

function words(t){return t.replace(/[^\p{L}\p{N}\s']/gu,' ').split(/\s+/).filter(Boolean)}
function extractKeywords(t){
  const seen=new Set(),out=[];
  for(const w of words(t)){
    const x=w.replace(/'/g,'');
    if(x.length<3||STOP.has(x)||STOP.has(w)||seen.has(x))continue;
    seen.add(x);out.push(x);
  }
  return out.slice(0,8);
}
function extractPhrases(t){
  const w=words(t),out=[];
  for(let i=0;i<w.length;i++){
    for(let n=2;n<=3;n++){
      const ch=w.slice(i,i+n);
      if(ch.length<n||ch.every(x=>STOP.has(x)))continue;
      const s=ch.join(' ');
      if(s.length<=24)out.push(s);
    }
  }
  return out.slice(0,12);
}
function detectKind(t){
  if(t.includes('?')||/^(what|why|how|who|where|when|do|does|did|can|could|should|is|are|am|have|has|would|will|which)\b/.test(t)||/\b(do you|you think|anyone|any of you|right guys)\b/.test(t))return 'question';
  if(/\b(follow|subscribe|like the|hit the like)\b/.test(t))return 'follow';
  if(/\b(thank|thanks|appreciate)\b/.test(t))return 'thanks';
  if(/\b(haha|lol|funny|laugh|joke|hilarious)\b/.test(t))return 'laugh';
  if(/\b(hi|hello|hey|welcome|whats up|what's up|sup|good morning|good evening)\b/.test(t))return 'greet';
  if(/\b(lets go|let's go|crazy|insane|amazing|awesome|wow|win|won|best|incredible)\b/.test(t))return 'hype';
  return 'talk';
}
function remember(m){
  recentMsgs.add(m);recentOrder.push(m);
  if(recentOrder.length>250){recentMsgs.delete(recentOrder.shift())}
}
function uniq(gen){
  for(let i=0;i<10;i++){const m=gen();if(m&&!recentMsgs.has(m)){remember(m);return m}}
  const m=(gen()||rand(PHRASES))+' '+rand(EMOJIS);
  remember(m);return m;
}
function dress(m){
  const r=Math.random();
  if(r<0.10)m=m.toUpperCase();
  else if(r<0.18)m=m.replace(/([aeiou])(?!.*[aeiou])/i,c=>c+c+c);
  else if(r<0.24)m=m.toLowerCase();
  if(Math.random()<0.18)m+=' '+rand(EMOJIS);
  return m.slice(0,90);
}
function hostFirst(){return ((user&&user.name)||'').split(' ')[0].toLowerCase()}
function greetingMsg(){
  const hf=hostFirst();
  if(hf&&Math.random()<0.15)return rand(['hi ','hey ','yo '])+hf;
  return rand(GREETINGS);
}
function genericMsg(){
  const r=Math.random();
  if(r<0.30)return rand(PHRASES);
  if(r<0.58)return rand(OPENERS)+' '+rand(CORES);
  if(r<0.80)return rand(CORES)+' '+rand(ENDINGS);
  return rand(OPENERS)+' '+rand(CORES)+' '+rand(ENDINGS);
}
function pickKw(u){return Math.random()<0.7?u.kws[0]:rand(u.kws)}
function answerMsg(u){
  if(Math.random()<0.1)return rand(T_UNSURE);
  const yes=(u.lean==='yes')===(Math.random()<0.8);   // most bots agree, a few disagree
  const pool=(yes?T_YES:T_NO).filter(t=>u.kws.length||!t.includes('{k}'));
  return rand(pool).replace(/\{k\}/g,u.kws.length?pickKw(u):'');
}
function contextMsg(u){
  if(!u)return null;
  const r=Math.random();
  let pool=null;
  if(u.kind==='greet'&&r<0.6)pool=T_GREET;
  else if(u.kind==='question'&&r<0.8){const a=answerMsg(u);if(a)return a}
  else if(u.kind==='laugh'&&r<0.6)pool=T_LAUGH;
  else if(u.kind==='thanks'&&r<0.6)pool=T_THANKS;
  else if(u.kind==='hype'&&r<0.5)pool=T_HYPE;
  else if(u.kind==='follow'&&r<0.7)pool=T_FOLLOW;
  if(pool)return rand(pool);
  if(u.phrases.length&&(Math.random()<0.4||!u.kws.length))return rand(T_PHRASE).replace(/\{p\}/g,rand(u.phrases));
  if(u.kws.length)return rand(T_KEYWORD).replace(/\{k\}/g,pickKw(u));
  return null;
}
function freshUtterance(){
  const now=Date.now();
  const fresh=heard.filter(h=>now-h.at<45000);
  if(!fresh.length)return null;
  return Math.random()<0.6?fresh[fresh.length-1]:rand(fresh);
}
function nextMsg(){
  if(chatPhase==='greet'&&Math.random()<0.72)return uniq(greetingMsg);
  if(Math.random()<CONTEXT_RATE){
    const a=takeAi();
    if(a){remember(a);return a}
    const u=freshUtterance();
    if(u)return uniq(()=>dress(contextMsg(u)||genericMsg()));
  }
  return uniq(()=>dress(genericMsg()));
}

/* ---------- OPTIONAL GEMINI ---------- */
// One call returns ~20 comments about what you just said; bots drip them out over time.
// If there is no key or the call fails, the built-in generator above keeps working.
const aiQueue=[];
let aiBusy=false, aiLastCall=0;
function takeAi(){
  while(aiQueue.length){
    const it=aiQueue.shift();
    if(Date.now()-it.at<45000)return it.m;
  }
  return null;
}
async function askGemini(){
  if(!GEMINI_API_KEY||aiBusy||Date.now()-aiLastCall<6000)return;
  const said=heard.filter(h=>Date.now()-h.at<60000).map(h=>h.text).join('. ');
  if(!said)return;
  aiBusy=true;aiLastCall=Date.now();
  try{
    const prompt='A streamer is live and just said: "'+said+'"\nWrite 20 short live-chat comments (2 to 10 words each) from different viewers reacting to exactly that. Casual slang, some emoji, some questions, some jokes, a few generic hype ones. No usernames, no hashtags, no repeats. Return only a JSON array of strings.';
    const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+GEMINI_MODEL+':generateContent',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-goog-api-key':GEMINI_API_KEY},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json',temperature:1.1}})
    });
    if(!res.ok)throw new Error('gemini '+res.status);
    const data=await res.json();
    const txt=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');
    const arr=JSON.parse(txt.replace(/```json|```/g,'').trim());
    if(Array.isArray(arr)){
      aiQueue.length=0;
      const now=Date.now();
      arr.forEach(m=>{m=String(m).trim().slice(0,90);if(m&&!recentMsgs.has(m))aiQueue.push({m,at:now})});
    }
  }catch(e){}
  aiBusy=false;
}
function hear(raw,typed=false){
  const text=String(raw||'').trim().toLowerCase();
  if(!text)return;
  const u={text,kws:extractKeywords(text).sort((a,b)=>b.length-a.length),phrases:extractPhrases(text),kind:detectKind(text),lean:Math.random()<0.7?'yes':'no',typed,at:Date.now()};
  heard.push(u);
  if(heard.length>12)heard.shift();
  askGemini();
  reactToSpeech(u);
}
// After the host says something, a wave of bots reacts within a few seconds
function reactToSpeech(u){
  if(!isHost||!isSpecialUser||botCount<=0)return;
  const n=Math.max(u.typed?4:1,Math.min(10,1+Math.floor(Math.log10(botCount+1)*2.5)));
  const base=GEMINI_API_KEY?2500:(u.typed?600:900);
  const rate=u.typed?0.9:CONTEXT_RATE;
  for(let i=0;i<n;i++){
    setTimeout(()=>{
      if(!isHost||!currentLiveId)return;
      let m;
      if(Math.random()<rate){
        const a=takeAi();
        if(a){remember(a);m=a}
        else m=uniq(()=>dress(contextMsg(u)||genericMsg()));
      }else m=uniq(()=>dress(genericMsg()));
      addMsg(nextName(),m);
    },base+Math.random()*4500+i*250);
  }
}

/* ---------- SPEECH (bots listen to the host) ---------- */
function startListening(){
  stopListening();
  const st=document.getElementById('mic-status');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){st.textContent='🎤 Mic: listening...';return}
  recogWanted=true;
  recog=new SR();
  recog.continuous=true;recog.interimResults=false;recog.lang=SPEECH_LANG;
  recog.onstart=()=>{st.textContent='🎤 Mic: listening...';st.style.color='var(--green)'};
  recog.onresult=e=>{
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal)hear(e.results[i][0].transcript);
    }
  };
  recog.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      recogWanted=false;st.textContent='🎤 Mic: listening...';
    }
  };
  recog.onend=()=>{
    if(recogWanted&&isHost&&!isMuted)setTimeout(()=>{try{recog&&recog.start()}catch(e){}},400);
  };
  try{recog.start()}catch(e){}
}
function stopListening(){
  recogWanted=false;
  if(recog){try{recog.onend=null;recog.stop()}catch(e){}recog=null}
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function colorClass(n){let h=0;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;return 'c'+(h%8)}
function format(n){n=Number(n)||0;if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(Math.floor(n))}

function listenLives(){
  if(unsubLives)unsubLives();
  unsubLives=onValue(ref(db,'lives'),snap=>{
    const list=document.getElementById('lives-list');
    const lives=[];
    snap.forEach(c=>{const v=c.val();if(v)lives.push({id:c.key,...v})});
    lives.sort((a,b)=>(b.startedAt||0)-(a.startedAt||0));
    if(!lives.length){list.innerHTML='<div class="empty-state" id="empty-state">No one is live right now.<br>Be the first to go live!</div>';return}
    list.innerHTML='';
    lives.forEach(live=>{
      const isMine=user&&live.hostEmail===user.email;
      const card=document.createElement('div');
      card.className='live-card';
      card.innerHTML=`<div class="live-info"><div class="live-name">${esc(live.title||'Live')}</div><div class="live-meta"><span class="dot"></span>${esc(live.host||'Host')} · ${format(Number(live.viewers)||0)} watching</div></div>
        <button class="btn-join" data-id="${live.id}">Join</button>
        ${isMine||isSpecialUser?`<button class="btn-x-small" data-remove="${live.id}">❌</button>`:''}`;
      list.appendChild(card);
    });
    list.querySelectorAll('.btn-join').forEach(b=>b.onclick=()=>{
      const live=lives.find(l=>l.id===b.dataset.id);if(live)joinViewer(live);
    });
    list.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{
      await remove(ref(db,'lives/'+b.dataset.remove));toast('Removed');
    });
  });
}

async function startCam(){
  stopCam();
  const vid=document.getElementById('local-video');
  const off=document.getElementById('cam-off');
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode,width:{ideal:1280},height:{ideal:720}},audio:true
    });
    if(facingMode==='user')vid.classList.add('mirror');else vid.classList.remove('mirror');
    vid.srcObject=stream;vid.style.display='block';off.style.display='none';
    vid.muted=true;isMuted=false;camOn=true;
    const mic=document.getElementById('btn-mic');mic.textContent='🎤';mic.classList.remove('muted');
    const cam=document.getElementById('btn-cam');cam.textContent='📷';cam.classList.remove('muted');
    Object.values(peerConnections).forEach(pc=>{
      stream.getTracks().forEach(track=>{
        const sender=pc.getSenders().find(s=>s.track&&s.track.kind===track.kind);
        if(sender)sender.replaceTrack(track);else pc.addTrack(track,stream);
      });
    });
  }catch(e){vid.style.display='none';off.style.display='block';toast('Camera permission denied')}
}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  document.getElementById('local-video').srcObject=null;
}

function listenForViewers(){
  if(unsubViewers)unsubViewers();
  const viewersRef=ref(db,'lives/'+currentLiveId+'/viewers');
  unsubViewers=onChildAdded(viewersRef,async(snap)=>{
    const vid=snap.key;
    if(peerConnections[vid])return;
    await createHostPeer(vid);
  });
  onChildRemoved(viewersRef,(snap)=>{
    const vid=snap.key;
    if(peerConnections[vid]){try{peerConnections[vid].close()}catch(e){}delete peerConnections[vid]}
  });
}

async function createHostPeer(viewerId){
  for(let i=0;i<30&&!stream;i++)await new Promise(r=>setTimeout(r,100));
  if(!stream)return;
  try{await remove(ref(db,`lives/${currentLiveId}/signals/${viewerId}`))}catch(e){}
  const pc=new RTCPeerConnection(ICE_SERVERS);
  peerConnections[viewerId]=pc;
  stream.getTracks().forEach(track=>{try{pc.addTrack(track,stream)}catch(e){}});
  const pendingViewerIce=[];let remoteSet=false;
  pc.onicecandidate=e=>{
    if(!e.candidate||!currentLiveId)return;
    push(ref(db,`lives/${currentLiveId}/signals/${viewerId}/hostCandidates`),e.candidate.toJSON()).catch(()=>{});
  };
  let answerDone=false;
  onValue(ref(db,`lives/${currentLiveId}/signals/${viewerId}/answer`),async(snap)=>{
    const answer=snap.val();
    if(!answer||answerDone||pc.signalingState==='closed')return;
    try{
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
      answerDone=true;remoteSet=true;
      while(pendingViewerIce.length){const c=pendingViewerIce.shift();try{await pc.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}
    }catch(e){}
  });
  onChildAdded(ref(db,`lives/${currentLiveId}/signals/${viewerId}/viewerCandidates`),(snap)=>{
    const c=snap.val();if(!c)return;
    if(!remoteSet){pendingViewerIce.push(c);return}
    pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
  });
  try{
    const offer=await pc.createOffer({offerToReceiveAudio:false,offerToReceiveVideo:false});
    await pc.setLocalDescription(offer);
    await set(ref(db,`lives/${currentLiveId}/signals/${viewerId}/offer`),{type:pc.localDescription.type,sdp:pc.localDescription.sdp});
  }catch(e){}
}

/* ---------- WEBRTC: VIEWER ---------- */
async function joinViewer(live){
  cleanupViewerListeners();
  isHost=false;currentLiveId=live.id;offerHandled=false;hasLiked=false;remoteBotPower=0;
  setRoleButtons(false);
  document.getElementById('live-title-text').textContent=live.title;
  document.getElementById('chat-list').innerHTML='';
  document.getElementById('local-video').style.display='none';
  document.getElementById('remote-video').style.display='none';
  document.getElementById('remote-video').srcObject=null;
  document.getElementById('cam-off').style.display='block';
  document.getElementById('mic-status').textContent='Connecting...';
  document.getElementById('mic-status').style.color='var(--muted)';
  document.getElementById('btn-like').classList.remove('liked');
  updateCountDisplay(Number(live.viewers)||1);
  likeCount=Number(live.likes)||0;updateLikesUI();
  show('live-room');toast('Joining '+live.title+'...');

  viewerId='v'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
  if(viewerPC){try{viewerPC.close()}catch(e){}viewerPC=null}
  viewerPC=new RTCPeerConnection(ICE_SERVERS);
  try{viewerPC.addTransceiver('video',{direction:'recvonly'});viewerPC.addTransceiver('audio',{direction:'recvonly'})}catch(e){}
  const pendingHostIce=[];let remoteSet=false;
  const showRemoteStream=(mediaStream)=>{
    const remoteVid=document.getElementById('remote-video');
    if(!remoteVid||!mediaStream)return;
    remoteVid.srcObject=mediaStream;remoteVid.style.display='block';
    document.getElementById('cam-off').style.display='none';
    document.getElementById('mic-status').textContent='Connected';
    document.getElementById('mic-status').style.color='var(--green)';
    remoteVid.play().catch(()=>{});
  };
  viewerPC.ontrack=e=>{
    if(e.streams&&e.streams[0])showRemoteStream(e.streams[0]);
    else if(e.track)showRemoteStream(new MediaStream([e.track]));
  };
  viewerPC.onicecandidate=e=>{
    if(!e.candidate||!currentLiveId)return;
    push(ref(db,`lives/${live.id}/signals/${viewerId}/viewerCandidates`),e.candidate.toJSON()).catch(()=>{});
  };
  try{await set(ref(db,`lives/${live.id}/viewers/${viewerId}`),{name:user?.name||'Viewer',joinedAt:Date.now()})}catch(e){}
  unsubLiveEnd=onValue(ref(db,'lives/'+live.id),(snap)=>{
    if(!snap.exists()&&currentLiveId===live.id&&!isHost){forceLeaveLive('Live ended by host');return}
    const data=snap.val();
    if(data&&currentLiveId===live.id){
      updateCountDisplay(Number(data.viewers)||0);
      likeCount=Number(data.likes)||0;updateLikesUI();
    }
  });
  listenToChat(live.id);
  onValue(ref(db,`lives/${live.id}/signals/${viewerId}/offer`),async(snap)=>{
    const offer=snap.val();
    if(!offer||!viewerPC||offerHandled)return;
    if(viewerPC.signalingState==='closed')return;
    offerHandled=true;
    try{
      await viewerPC.setRemoteDescription(new RTCSessionDescription(offer));
      remoteSet=true;
      while(pendingHostIce.length){const c=pendingHostIce.shift();try{await viewerPC.addIceCandidate(new RTCIceCandidate(c))}catch(e){}}
      const answer=await viewerPC.createAnswer();
      await viewerPC.setLocalDescription(answer);
      await set(ref(db,`lives/${live.id}/signals/${viewerId}/answer`),{type:viewerPC.localDescription.type,sdp:viewerPC.localDescription.sdp});
    }catch(e){offerHandled=false}
  });
  onChildAdded(ref(db,`lives/${live.id}/signals/${viewerId}/hostCandidates`),(snap)=>{
    const c=snap.val();if(!c||!viewerPC)return;
    if(!remoteSet){pendingHostIce.push(c);return}
    viewerPC.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
  });
}

function cleanupViewerListeners(){
  if(typeof unsubLiveEnd==='function'){try{unsubLiveEnd()}catch(e){}unsubLiveEnd=null}
  if(typeof unsubChat==='function'){try{unsubChat()}catch(e){}unsubChat=null}
  stopViewerBotChat();
}
function forceLeaveLive(msg){
  cleanupViewerListeners();stopCam();stopBots();stopRealSim();stopLikeSim();stopListening();
  if(viewerPC){try{viewerPC.close()}catch(e){}viewerPC=null}
  Object.values(peerConnections).forEach(pc=>{try{pc.close()}catch(e){}});
  peerConnections={};
  const leftId=currentLiveId,leftViewer=viewerId;
  isHost=false;botCount=0;realViewers=0;viewerId=null;currentLiveId=null;offerHandled=false;remoteBotPower=0;
  document.getElementById('remote-video').srcObject=null;
  document.getElementById('remote-video').style.display='none';
  if(leftViewer&&leftId)remove(ref(db,`lives/${leftId}/viewers/${leftViewer}`)).catch(()=>{});
  show('menu');toast(msg||'Live ended');
}
async function endLiveInDb(){
  if(currentLiveId)try{await remove(ref(db,'lives/'+currentLiveId))}catch(e){}
}
async function stopLive(){
  cleanupViewerListeners();stopCam();stopBots();stopRealSim();stopLikeSim();stopListening();
  Object.values(peerConnections).forEach(pc=>{try{pc.close()}catch(e){}});
  peerConnections={};
  if(viewerPC){try{viewerPC.close()}catch(e){}viewerPC=null}
  if(viewerId&&currentLiveId&&!isHost){try{await remove(ref(db,`lives/${currentLiveId}/viewers/${viewerId}`))}catch(e){}}
  if(isHost)await endLiveInDb();
  isHost=false;botCount=0;realViewers=0;viewerId=null;currentLiveId=null;offerHandled=false;remoteBotPower=0;
  document.getElementById('remote-video').srcObject=null;
  document.getElementById('remote-video').style.display='none';
  show('menu');toast('Live ended');
}

async function addBotsBatch(n){
  n=Math.floor(Number(n))||1;
  if(isHost){
    botCount+=n;updateCount();
    const msgs=Math.min(6,Math.max(1,Math.floor(Math.log10(n+1))+1));
    for(let i=0;i<msgs;i++)addMsg(nextName(),nextMsg());
    scheduleBotDonation();
    toast('+'+format(n)+' bots');
  }else if(currentLiveId){
    try{
      const liveRef=ref(db,'lives/'+currentLiveId);
      const snap=await new Promise(r=>onValue(liveRef,s=>r(s),{onlyOnce:true}));
      const cur=Math.floor(Number(snap.val()?.viewers))||0;
      await update(liveRef,{viewers:cur+n});
      updateCountDisplay(cur+n);
      remoteBotPower+=n;
      await push(ref(db,`lives/${currentLiveId}/chat`),{
        botRequest:true,amount:n,requesterEmail:user?.email||'',requesterAdmin:true,at:Date.now()
      });
      startViewerBotChat();
      toast('+'+format(n)+' bots in this live');
    }catch(e){toast('Bot add failed')}
  }
}

function startViewerBotChat(){
  if(isHost||!isSpecialUser||!currentLiveId||remoteBotPower<=0)return;
  if(viewerBotTimer)return;
  const tick=async()=>{
    viewerBotTimer=null;
    if(!currentLiveId||isHost||!isSpecialUser||remoteBotPower<=0)return;
    const power=remoteBotPower;
    let multi=1;
    if(power>30)multi=2;if(power>150)multi=3;if(power>800)multi=5;if(power>5000)multi=8;if(power>20000)multi=12;
    multi=Math.min(multi,15);
    const updates={};const now=Date.now();
    for(let i=0;i<multi;i++){
      const key=push(ref(db,`lives/${currentLiveId}/chat`)).key;
      if(!key)continue;
      seenChatIds.add(key);
      updates[`lives/${currentLiveId}/chat/${key}`]={name:nextName(),text:nextMsg(),host:false,gift:false,bot:true,at:now};
    }
    try{if(Object.keys(updates).length)await update(ref(db),updates)}catch(e){}
    let delay=800;if(power>100)delay=400;if(power>1000)delay=150;if(power>5000)delay=70;if(power>20000)delay=35;
    viewerBotTimer=setTimeout(tick,delay);
  };
  viewerBotTimer=setTimeout(tick,300);
}
function stopViewerBotChat(){clearTimeout(viewerBotTimer);viewerBotTimer=null}

  clearTimeout(leaveTimer);leaveTimer=null;

}
function scheduleJoin(){
  let delay;
  if(botCount<5)delay=6000+Math.random()*5000;
  else if(botCount<20)delay=4500+Math.random()*4000;
  else if(botCount<80)delay=3000+Math.random()*3000;
  else if(botCount<300)delay=2000+Math.random()*2000;
  else if(botCount<1000)delay=1200+Math.random()*1200;
  else if(botCount<5000)delay=800+Math.random()*800;
  else delay=500+Math.random()*500;
  let burst=1;
  if(botCount>100)burst=1+Math.floor(Math.random()*2);
  if(botCount>500)burst=1+Math.floor(Math.random()*3);
  if(botCount>3000)burst=2+Math.floor(Math.random()*5);
  if(botCount>15000)burst=3+Math.floor(Math.random()*8);
  botTimer=setTimeout(()=>{botCount+=burst;updateCount();scheduleJoin()},delay);
}
function scheduleLeave(){
  let delay=10000+Math.random()*8000;
  if(botCount>200)delay=5000+Math.random()*4000;
  if(botCount>2000)delay=2500+Math.random()*2000;
  leaveTimer=setTimeout(()=>{
    if(botCount>5){
      let leave=1+Math.floor(Math.random()*Math.min(5,botCount*0.03));
      botCount=Math.max(0,botCount-leave);updateCount();
    }
    scheduleLeave();
  },delay);
}
function scheduleChat(){
  let delay;
  if(botCount<5)delay=2500+Math.random()*2500;
  else if(botCount<20)delay=1400+Math.random()*1400;
  else if(botCount<80)delay=800+Math.random()*700;
  else if(botCount<300)delay=400+Math.random()*350;
  else if(botCount<1000)delay=220+Math.random()*180;
  else if(botCount<5000)delay=120+Math.random()*100;
  else if(botCount<20000)delay=80+Math.random()*60;
  else delay=55+Math.random()*40;
  let multi=1;
  if(botCount>40)multi=1+(Math.random()<0.5?1:0);
  if(botCount>200)multi=1+Math.floor(Math.random()*2);
  if(botCount>1000)multi=2+Math.floor(Math.random()*2);
  if(botCount>8000)multi=2+Math.floor(Math.random()*3);
  multi=Math.min(multi,5);
  chatTimer=setTimeout(()=>{
    if(botCount>0){
      for(let i=0;i<multi;i++)addMsg(nextName(),nextMsg());
      if(chatPhase==='greet'&&ni>30)chatPhase='normal';
    }
    scheduleChat();
  },delay);
}

/* ---------- CHAT ---------- */
const seenChatIds=new Set();
const MAX_CHAT=45;
const chatQueue=[];
let chatRenderScheduled=false;
function listenToChat(liveId){
  if(typeof unsubChat==='function'){try{unsubChat()}catch(e){}}
  seenChatIds.clear();chatQueue.length=0;chatRenderScheduled=false;
  document.getElementById('chat-list').replaceChildren();
  unsubChat=onChildAdded(query(ref(db,`lives/${liveId}/chat`),limitToLast(MAX_CHAT)),(snap)=>{
    const msg=snap.val();
    if(!msg||seenChatIds.has(snap.key))return;
    if(msg.botRequest){
      seenChatIds.add(snap.key);
      if(isHost&&currentLiveId===liveId&&(msg.requesterAdmin||String(msg.requesterEmail||'').toLowerCase().includes('kobik'))){
        const amount=Math.max(1,Math.min(1000000,Math.floor(Number(msg.amount)||1)));
        botCount+=amount;updateCount();
        const preview=Math.min(6,Math.max(1,Math.floor(Math.log10(amount+1))+1));
        for(let i=0;i<preview;i++)addMsg(nextName(),nextMsg());
      }
      return;
    }
    seenChatIds.add(snap.key);
    if(seenChatIds.size>2000){const f=seenChatIds.values().next().value;if(f)seenChatIds.delete(f)}
    chatQueue.push({name:msg.name,text:msg.text,host:!!msg.host,gift:!!msg.gift,giftEmoji:msg.giftEmoji,giftName:msg.giftName||'',giftCost:msg.giftCost||0});
    if(chatQueue.length>300)chatQueue.splice(0,chatQueue.length-300);
    scheduleChatRender();
  });
}
function scheduleChatRender(){
  if(chatRenderScheduled)return;
  chatRenderScheduled=true;
  requestAnimationFrame(flushChatQueue);
}
function flushChatQueue(){
  chatRenderScheduled=false;
  const list=document.getElementById('chat-list');
  if(!list||!chatQueue.length)return;
  const batch=chatQueue.splice(0,Math.min(8,chatQueue.length));
  const frag=document.createDocumentFragment();
  let lastGift=null;
  for(const msg of batch){
    const div=document.createElement('div');
    div.className='msg msg-new'+(msg.host?' host':'')+(msg.gift?' gift-msg':'');
    const cls=msg.host||msg.gift?'':colorClass(msg.name||'');
    const ns=document.createElement('span');
    ns.className='uname '+cls;
    ns.textContent=msg.name||'';
    div.appendChild(ns);
    div.appendChild(document.createTextNode(msg.text||''));
    frag.appendChild(div);
    if(msg.gift&&msg.giftEmoji)lastGift=msg;
  }
  list.appendChild(frag);
  while(list.children.length>MAX_CHAT)list.firstElementChild?.remove();
  list.scrollTop=list.scrollHeight;
  setTimeout(()=>list.querySelectorAll('.msg-new').forEach(el=>el.classList.remove('msg-new')),150);
  if(lastGift)playGiftAnim(lastGift.giftEmoji,lastGift.giftName,lastGift.giftCost);
  if(chatQueue.length)scheduleChatRender();
}
function addMsg(name,text,host=false,isGift=false){
  chatQueue.push({name,text,host,gift:isGift});
  if(chatQueue.length>300)chatQueue.splice(0,chatQueue.length-300);
  scheduleChatRender();
}
document.getElementById('btn-send').onclick=sendMsg;
document.getElementById('chat-input').onkeydown=e=>{if(e.key==='Enter')sendMsg()};
async function sendMsg(){
  const input=document.getElementById('chat-input');
  const t=input.value.trim();
  if(!t||!currentLiveId)return;
  try{await push(ref(db,`lives/${currentLiveId}/chat`),{name:user?user.name:'You',text:t,host:isHost,gift:false,at:Date.now()})}
  catch(e){toast('Chat failed')}
  if(isHost&&isSpecialUser)hear(t,true);
  input.value='';
}

/* ---------- GIFTS ---------- */
function pickBotGift(){
  if(!GIFTS.length)return null;
  const b=Math.max(0,Math.floor(Number(botCount)||0));
  const weights=GIFTS.map(g=>{
    let w=1/Math.pow(Math.max(1,g.cost),0.85);
    if(g.name==='Rose')w*=(b<20?0.1:b<100?0.6:2);
    return Math.max(0.000001,w);
  });
  let total=weights.reduce((a,v)=>a+v,0),r=Math.random()*total;
  for(let i=0;i<GIFTS.length;i++){r-=weights[i];if(r<=0)return GIFTS[i]}
  return GIFTS[0];
}
// Every gift (bot or real) pays the streamer 70% of its cost
function scheduleBotDonation(){
  clearTimeout(botGiftTimer);botGiftTimer=null;
  if(!isHost||!currentLiveId)return;
  const b=Math.max(1,Math.floor(Number(botCount)||1));
  let delay;
  if(b<5)delay=18000+Math.random()*18000;
  else if(b<20)delay=10000+Math.random()*10000;
  else if(b<80)delay=5500+Math.random()*5500;
  else if(b<300)delay=3000+Math.random()*3000;
  else if(b<1000)delay=1600+Math.random()*1600;
  else if(b<5000)delay=900+Math.random()*900;
  else delay=500+Math.random()*500;
  botGiftTimer=setTimeout(async()=>{
    botGiftTimer=null;
    if(!isHost||!currentLiveId||botCount<=0){scheduleBotDonation();return}
    if(Math.random()<Math.min(0.92,0.35+Math.log10(botCount+1)*0.18)){
      const gift=pickBotGift();
      if(gift){
        const from=nextName();
        const now=Date.now();
        const toStreamer=hostCut(gift.cost);
        playGiftAnim(gift.emoji,gift.name,gift.cost);
        coins+=toStreamer;saveCoins();updateCoinsUI();
        toast('🎁 '+from+' · '+gift.emoji+' +'+formatCoins(toStreamer)+' 🪙');
        addMsg(from,'sent '+gift.emoji+' '+gift.name+' (🪙'+formatCoins(gift.cost)+')',false,true);
        try{
          await push(ref(db,`lives/${currentLiveId}/gifts`),{from,emoji:gift.emoji,name:gift.name,cost:gift.cost,toHost:toStreamer,bot:true,at:now});
          await push(ref(db,`lives/${currentLiveId}/chat`),{name:from,text:`sent ${gift.emoji} ${gift.name} (🪙${formatCoins(gift.cost)})`,host:false,gift:true,bot:true,at:now,giftEmoji:gift.emoji,giftName:gift.name,giftCost:gift.cost,coinsToHost:toStreamer});
        }catch(e){}
      }
    }
    scheduleBotDonation();
  },delay);
}

function buildGiftGrid(){
  const grid=document.getElementById('gift-grid');
  grid.innerHTML='';
  GIFTS.forEach(g=>{
    const item=document.createElement('div');
    item.className='gift-item';
    item.innerHTML=`<div class="g-emoji">${g.emoji}</div><div class="g-name">${esc(g.name)}</div><div class="g-cost">🪙 ${formatCoins(g.cost)}</div>`;
    item.onclick=()=>sendGift(g);
    grid.appendChild(item);
  });
}
buildGiftGrid();
document.getElementById('btn-gift').onclick=()=>{
  if(isHost){toast("You can't gift in your own live");return}
  document.getElementById('gift-panel').classList.add('show');
};
document.getElementById('gift-close').onclick=()=>document.getElementById('gift-panel').classList.remove('show');
document.getElementById('gift-panel').onclick=e=>{if(e.target.id==='gift-panel')document.getElementById('gift-panel').classList.remove('show')};

async function sendGift(gift){
  if(isHost){toast("You can't gift in your own live");return}
  if(!currentLiveId){toast('Not in a live');return}
  if(coins<gift.cost){toast('Not enough coins!');return}
  coins-=gift.cost;saveCoins();updateCoinsUI();
  document.getElementById('gift-panel').classList.remove('show');
  playGiftAnim(gift.emoji,gift.name,gift.cost);
  const sender=user?user.name:'You';
  const toStreamer=hostCut(gift.cost);
  try{
    await push(ref(db,`lives/${currentLiveId}/chat`),{
      name:sender,text:`sent ${gift.emoji} ${gift.name} (🪙${formatCoins(gift.cost)})`,
      host:false,gift:true,at:Date.now(),giftEmoji:gift.emoji,giftName:gift.name,giftCost:gift.cost,coinsToHost:toStreamer
    });
    await push(ref(db,`lives/${currentLiveId}/gifts`),{from:sender,emoji:gift.emoji,name:gift.name,cost:gift.cost,toHost:toStreamer,at:Date.now()});
  }catch(e){
    coins+=gift.cost;saveCoins();updateCoinsUI();
    toast('Gift failed');return;
  }
  toast(`Gift sent! +${formatCoins(toStreamer)} to streamer`);
}
function playGiftAnim(emoji,name,cost){
  const anim=document.getElementById('gift-anim');
  anim.innerHTML=`<div class="gift-fly">${emoji}</div><div class="gift-label">${emoji} ${name} · 🪙${formatCoins(cost)}</div>`;
  setTimeout(()=>{anim.innerHTML=''},1700);
}
function listenForGifts(liveId){
  onChildAdded(ref(db,`lives/${liveId}/gifts`),(snap)=>{
    if(!isHost)return;
    const g=snap.val();if(!g)return;
    if(g.bot)return;
    playGiftAnim(g.emoji,g.name,g.cost);
    coins+=(g.toHost||0);saveCoins();updateCoinsUI();
    toast(`+${formatCoins(g.toHost||0)} coins from gift!`);
  });
}
</script>
