<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Catch</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b1840;--gold:#ffc531;--pink:#ff4f8b;--mint:#5ff2c1;--ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column}
#hud{padding:12px 16px 8px}
#row{display:flex;justify-content:space-between;align-items:baseline;font-family:Bungee,Impact,sans-serif}
#count{font-size:2rem;color:var(--gold)}
#goal{font-size:1rem;opacity:.7}
#bar{position:relative;height:12px;border-radius:6px;background:#ffffff22;margin-top:6px}
#fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--gold),var(--pink));transition:width .15s}
#mark{position:absolute;left:50%;top:-4px;width:3px;height:20px;background:var(--mint);border-radius:2px}
#stage{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#0b0820d9;padding:20px;z-index:5}
#ov.on{display:flex}
.card{max-width:420px;width:100%;text-align:center}
h1{font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:2.4rem;margin:0 0 12px;color:var(--gold)}
p{font-size:1.1rem;line-height:1.5;margin:0 0 20px}
button{font:inherit;font-family:Bungee,Impact,sans-serif;font-size:1.2rem;color:#1b1840;background:var(--gold);border:0;border-radius:14px;padding:14px 28px;cursor:pointer;box-shadow:0 5px 0 #b88a0e}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b88a0e}
button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.meme{background:linear-gradient(160deg,#6d3bd6,#ff4f8b);border-radius:16px;padding:18px 12px;margin-bottom:16px;border:4px solid #fff}
.mt{font-family:Impact,'Bungee',sans-serif;font-size:1.7rem;line-height:1.1;text-transform:uppercase;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000;margin:0}
.me{font-size:7rem;line-height:1.1;margin:8px 0}
@media (prefers-reduced-motion:no-preference){.me{animation:wob 1s ease-in-out infinite alternate}@keyframes wob{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.12)}}}
</style>
</head>
<body>
<div id="hud">
  <div id="row"><span id="count">0</span><span id="goal">goal 200</span></div>
  <div id="bar"><div id="fill"></div><div id="mark"></div></div>
</div>
<div id="stage"><canvas id="c"></canvas><div id="ov"></div></div>
<script>
// ---- Edit these to personalize it ----
const CONFIG = {
  friend: "Anita",
  goal: 200,
  half: 100,
  meme: {
    top: "Me after catching 100 coins",
    emoji: "🤑",
    bottom: "I'm basically a millionaire now",
    note: "Halfway there, {friend}. Keep going, something nice is waiting at 200."
  },
  win: {
    title: "200 coins!",
    text: "Anita, you're the richest person I know, because I get to have you as my best friend. Thank you for always being there. Love you! 💖"
  }
};
// --------------------------------------
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), ov = $('ov');
const fmt = s => s.replace(/\{friend\}/g, CONFIG.friend);
let W, H, S, coins = 0, items = [], pops = [], bits = [], bx = 0, tx = 0, spawnT = 0, state = 'menu', halfShown = false, last = 0;

function resize() {
  const d = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  W = r.width; H = r.height; S = Math.min(1.3, Math.max(.7, H / 650));
  cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  if (!bx) bx = tx = W / 2;
}
addEventListener('resize', resize);

function setX(e) { const r = cv.getBoundingClientRect(); tx = Math.max(30, Math.min(W - 30, e.clientX - r.left)); }
addEventListener('pointermove', setX);
addEventListener('pointerdown', setX);
const keys = {};
addEventListener('keydown', e => { keys[e.key] = true; });
addEventListener('keyup', e => { keys[e.key] = false; });

function show(html) { ov.innerHTML = '<div class="card">' + html + '</div>'; ov.classList.add('on'); }
function hide() { ov.classList.remove('on'); }

function menu() {
  state = 'menu';
  show('<h1>Coin Catch</h1><p>Hey ' + CONFIG.friend + '! Turn your volume all the way up to play. Catch ' + CONFIG.goal + ' coins in the basket. 🪙 = 1, 💰 = 5, and dodge the bananas 🍌 (-10). Drag or use the arrow keys.</p><button id="go">Play</button>');
  $('go').onclick = () => { initAudio(); start(); };
}
function start() {
  coins = 0; items = []; pops = []; halfShown = false; spawnT = 0; hud(); hide(); state = 'play';
}
function hud() {
  $('count').textContent = coins;
  $('goal').textContent = 'goal ' + CONFIG.goal;
  $('fill').style.width = Math.min(100, coins / CONFIG.goal * 100) + '%';
}
function confetti(n) {
  const cols = ['#ffc531', '#ff4f8b', '#5ff2c1', '#ffffff', '#8f6bff'];
  for (let i = 0; i < n; i++) bits.push({ x: W / 2, y: H * .4, vx: (Math.random() - .5) * 700, vy: -Math.random() * 600 - 100, c: cols[i % 5], life: 2.5 });
}
function halfway() {
  state = 'pause'; halfShown = true; confetti(120);
  const m = CONFIG.meme;
  show('<div class="meme"><p class="mt">' + m.top + '</p><div class="me">' + m.emoji + '</div><p class="mt" style="margin:0">' + m.bottom + '</p></div><p>' + fmt(m.note) + '</p><button id="go">Keep going</button>');
  $('go').onclick = () => { hide(); state = 'play'; };
}
let AC;
function initAudio() {
  try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {}
}
function chime() {
  if (!AC) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .18;
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.25, t + .03); g.gain.exponentialRampToValueAtTime(.001, t + 1.2);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 1.3);
  });
}
function win() {
  state = 'done'; items = []; initAudio(); chime(); confetti(160);
  for (let i = 0; i < 70; i++) bits.push({ x: Math.random() * W, y: -Math.random() * H, vx: (Math.random() - .5) * 40, vy: 60 + Math.random() * 80, g: 0, e: i % 3 ? '💖' : '🌸', life: 7 });
  show('<h1>' + CONFIG.win.title + '</h1><div class="me" style="font-size:5rem">💖</div><p>' + fmt(CONFIG.win.text) + '</p><button id="go">Play again</button>');
  $('go').onclick = start;
}

function spawn() {
  const r = Math.random(), t = r < .09 ? 'ban' : r < .22 ? 'bag' : 'coin';
  items.push({ t, x: 30 + Math.random() * (W - 60), y: -30, v: (150 + Math.random() * 70 + coins * .9) * S, rot: Math.random() * 6 });
}
function pop(x, y, txt, c) { pops.push({ x, y, txt, c, life: .7 }); }

function update(dt) {
  const k = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  if (k) tx = Math.max(30, Math.min(W - 30, tx + k * 700 * dt));
  bx += (tx - bx) * Math.min(1, dt * 18);
  if (state === 'play') {
    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(.3, .75 - coins / 450); }
    const by = H - 60 * S, bw = 40 * S;
    for (const it of items) {
      it.y += it.v * dt; it.rot += dt * 2;
      if (it.y > by - 20 * S && it.y < by + 30 * S && Math.abs(it.x - bx) < bw + 14 * S) {
        it.dead = true;
        const v = it.t === 'ban' ? -10 : it.t === 'bag' ? 5 : 1;
        coins = Math.max(0, coins + v);
        pop(it.x, it.y - 20, (v > 0 ? '+' : '') + v, v > 0 ? '#ffc531' : '#ff4f8b');
        hud();
        if (coins >= CONFIG.goal) { win(); break; }
        if (coins >= CONFIG.half && !halfShown) { halfway(); break; }
      } else if (it.y > H + 40) it.dead = true;
    }
    items = items.filter(i => !i.dead);
  }
  pops.forEach(p => { p.y -= 60 * dt; p.life -= dt; });
  pops = pops.filter(p => p.life > 0);
  bits.forEach(b => { b.vy += (b.g === undefined ? 900 : b.g) * dt; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt; });
  bits = bits.filter(b => b.life > 0);
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of items) {
    ctx.font = (it.t === 'coin' ? 34 : 40) * S + 'px sans-serif';
    ctx.fillText(it.t === 'ban' ? '🍌' : it.t === 'bag' ? '💰' : '🪙', it.x, it.y);
  }
  ctx.font = 68 * S + 'px sans-serif';
  ctx.fillText('🧺', bx, H - 55 * S);
  ctx.font = '22px Bungee, Impact, sans-serif';
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c; ctx.fillText(p.txt, p.x, p.y); }
  ctx.globalAlpha = 1;
  for (const b of bits) { if (b.e) { ctx.font = '28px sans-serif'; ctx.fillText(b.e, b.x, b.y); } else { ctx.fillStyle = b.c; ctx.fillRect(b.x, b.y, 8, 8); } }
}

function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000 || 0); last = t;
  update(dt); draw(); requestAnimationFrame(loop);
}
resize(); menu(); requestAnimationFrame(loop);
</script>
</body>
</html>
