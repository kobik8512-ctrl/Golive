<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Go Live</title>
  <style>
    :root {
      --bg: #0a0a0c; --card: #16161a; --card2: #1c1c22; --accent: #ff2d55;
      --text: #f2f2f5; --muted: #8b8b96; --green: #30d158; --danger: #ff453a;
      --border: #2a2a32; --gold: #ffd60a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    button { cursor: pointer; border: none; font-family: inherit; background: none; color: inherit; }
    input { font-family: inherit; }
    .screen { display: none; min-height: 100vh; flex-direction: column; }
    .screen.active { display: flex; }

    /* LOGIN */
    #login-screen { align-items: center; justify-content: center; padding: 24px; background: radial-gradient(ellipse at top, #1a0a12 0%, var(--bg) 60%); }
    .login-box { width: 100%; max-width: 360px; text-align: center; }
    .login-logo { font-size: 2.4rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
    .login-logo span { color: var(--accent); }
    .login-sub { color: var(--muted); font-size: 0.95rem; margin-bottom: 40px; }
    .btn-google {
      width: 100%; background: #fff; color: #1f1f1f; padding: 14px 20px; border-radius: 14px;
      font-weight: 600; font-size: 1rem; display: flex; align-items: center; justify-content: center; gap: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .btn-google:active { transform: scale(0.98); }
    .btn-google:disabled { opacity: 0.6; }
    .btn-google svg { width: 20px; height: 20px; flex-shrink: 0; }
    .login-note { margin-top: 24px; font-size: 0.8rem; color: var(--muted); }

    /* MENU */
    #menu { padding: 20px 16px 160px; }
    .broadcast-label { font-size: 0.7rem; font-weight: 600; letter-spacing: 1.5px; color: var(--muted); text-transform: uppercase; margin-bottom: 6px; }
    .menu-title { font-size: 2.1rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 10px; }
    .menu-title span { color: var(--accent); }
    .signed-in { font-size: 0.95rem; color: var(--muted); margin-bottom: 28px; }
    .signed-in strong { color: var(--green); font-weight: 600; }
    .section-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-bottom: 12px; }
    .lives-list { display: flex; flex-direction: column; gap: 10px; }
    .live-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 14px 14px 14px 16px; display: flex; align-items: center; gap: 12px;
    }
    .live-info { flex: 1; min-width: 0; }
    .live-name { font-weight: 700; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-meta { font-size: 0.82rem; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
    .live-meta .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; flex-shrink: 0; }
    .btn-join { background: var(--accent); color: #fff; font-weight: 700; font-size: 0.9rem; padding: 10px 18px; border-radius: 999px; flex-shrink: 0; }
    .btn-join:active { transform: scale(0.96); }
    .btn-x-small { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); color: var(--muted); font-size: 0.9rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .empty-state { text-align: center; padding: 48px 20px; color: var(--muted); background: var(--card); border-radius: 16px; border: 1px dashed var(--border); font-size: 0.95rem; line-height: 1.5; }
    .bottom-actions {
      position: fixed; bottom: 0; left: 0; right: 0; padding: 16px 16px 28px;
      background: linear-gradient(transparent, var(--bg) 25%); display: flex; flex-direction: column; gap: 10px; z-index: 30;
    }
    .btn-go-live {
      background: var(--accent); color: #fff; font-size: 1.15rem; font-weight: 700; padding: 16px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 8px 28px rgba(255,45,85,0.35);
    }
    .btn-go-live:active { transform: scale(0.98); }
    .btn-secondary { background: transparent; color: var(--muted); font-size: 0.95rem; font-weight: 500; padding: 12px; border-radius: 999px; border: 1px solid var(--border); }
    .btn-secondary:active { background: var(--card); }

    /* LIVE ROOM */
    #live-room { position: relative; background: #000; height: 100vh; height: 100dvh; overflow: hidden; }
    #video-wrap { position: absolute; inset: 0; background: #0d0d10; display: flex; align-items: center; justify-content: center; }
    #local-video, #remote-video { width: 100%; height: 100%; object-fit: cover; display: none; }
    #local-video.mirror { transform: scaleX(-1); }
    .cam-off { text-align: center; color: var(--muted); }
    .cam-off .icon { font-size: 3.5rem; margin-bottom: 10px; opacity: 0.5; }

    .live-header {
      position: absolute; top: 0; left: 0; right: 0; padding: 12px 12px 0;
      display: flex; justify-content: space-between; align-items: flex-start; z-index: 40; pointer-events: none;
    }
    .live-header > * { pointer-events: auto; }
    .live-pill {
      background: rgba(0,0,0,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-radius: 999px; padding: 8px 14px; display: flex; align-items: center; gap: 8px;
      font-size: 0.88rem; font-weight: 600; max-width: 65%;
    }
    .live-pill .red-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: blink 1.4s infinite; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .live-pill .title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .live-pill .watchers { color: var(--muted); font-weight: 500; white-space: nowrap; }
    .header-btns { display: flex; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08); color: #fff; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn.muted { background: var(--danger); border-color: transparent; }
    .icon-btn.b-btn { background: linear-gradient(135deg, #7c3aed, #06b6d4); font-weight: 800; font-size: 0.95rem; border: none; }

    .chat-wrap {
      position: absolute; bottom: 0; left: 0; right: 0; height: 32%;
      display: flex; flex-direction: column;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 50%, transparent); z-index: 30; pointer-events: none;
    }
    .chat-list {
      flex: 1; overflow-y: auto; overflow-x: hidden; padding: 8px 12px 4px;
      display: flex; flex-direction: column; gap: 2px; pointer-events: auto; scrollbar-width: none;
    }
    .chat-list::-webkit-scrollbar { display: none; }
    .msg {
      font-size: 0.84rem; line-height: 1.25;
      word-break: break-word; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
      padding: 1px 0; flex-shrink: 0;
      /* Avoid starting hundreds of CSS animations during a chat burst. */
      contain: layout paint;
    }
    .msg.msg-new { animation: msgIn 0.15s ease; }
    @keyframes msgIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
    .msg .uname { font-weight: 700; margin-right: 5px; }
    .msg .c0{color:#ff6b9d} .msg .c1{color:#5ac8fa} .msg .c2{color:#30d158}
    .msg .c3{color:#ffd60a} .msg .c4{color:#bf5af2} .msg .c5{color:#ff9f0a}
    .msg .c6{color:#64d2ff} .msg .c7{color:#ff375f}
    .msg.host .uname { color: var(--accent); }
    .msg.gift-msg { color: var(--gold); font-weight: 600; }

    /* B amount menu */
    #b-menu {
      position: fixed; top: 56px; right: 12px; z-index: 80;
      background: rgba(20,20,28,0.95); border: 1px solid var(--border);
      border-radius: 14px; padding: 8px; display: none; flex-direction: column; gap: 4px;
      backdrop-filter: blur(12px); min-width: 90px;
    }
    #b-menu.show { display: flex; }
    .b-opt {
      padding: 10px 14px; border-radius: 10px; font-weight: 700; font-size: 0.9rem;
      text-align: center; background: var(--card2); color: #fff;
    }
    .b-opt.active { background: linear-gradient(135deg,#7c3aed,#06b6d4); }
    .b-opt:active { transform: scale(0.96); }

    .chat-bar { display: flex; gap: 8px; padding: 6px 10px 16px; pointer-events: auto; align-items: center; }
    #chat-input {
      flex: 1; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 999px; padding: 11px 16px; color: #fff; font-size: 0.9rem; outline: none;
    }
    #chat-input::placeholder { color: rgba(255,255,255,0.4); }
    .btn-send { background: var(--accent); color: #fff; font-weight: 700; font-size: 0.85rem; padding: 11px 16px; border-radius: 999px; flex-shrink: 0; }
    .btn-gift { background: linear-gradient(135deg, #ffd60a, #ff9f0a); color: #1a1a1a; font-weight: 800; font-size: 0.85rem; padding: 11px 14px; border-radius: 999px; flex-shrink: 0; }
    .btn-send:active, .btn-gift:active { transform: scale(0.96); }

    .mic-status { position: absolute; bottom: 34%; left: 12px; font-size: 0.78rem; color: var(--green); z-index: 25; pointer-events: none; opacity: 0.85; }
    .coins-badge {
      position: absolute; bottom: 34%; right: 12px; z-index: 25;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); border-radius: 999px;
      padding: 6px 12px; font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 5px;
      border: 1px solid rgba(255,215,0,0.3); pointer-events: none;
    }
    .coins-badge .coin-icon { color: var(--gold); }

    /* Gift panel */
    #gift-panel { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 90; }
    #gift-panel.show { display: flex; }
    .gift-sheet {
      background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px;
      max-height: 62vh; display: flex; flex-direction: column; border: 1px solid var(--border); animation: sheetUp 0.25s ease;
    }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:none} }
    .gift-sheet-header { padding: 14px 16px 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .gift-sheet-header h3 { font-size: 1.05rem; }
    .gift-close { font-size: 1.3rem; color: var(--muted); padding: 4px 8px; }
    .gift-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px; overflow-y: auto; flex: 1; }
    .gift-item { background: var(--card2); border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid transparent; }
    .gift-item:active { border-color: var(--accent); transform: scale(0.95); }
    .gift-item .g-emoji { font-size: 1.7rem; }
    .gift-item .g-name { font-size: 0.68rem; color: var(--muted); text-align: center; line-height: 1.2; }
    .gift-item .g-cost { font-size: 0.72rem; font-weight: 700; color: var(--gold); }

    #gift-anim { position: fixed; inset: 0; pointer-events: none; z-index: 100; display: flex; align-items: center; justify-content: center; }
    .gift-fly { font-size: 4.5rem; animation: giftFly 1.6s ease forwards; text-shadow: 0 0 30px rgba(255,215,0,0.5); }
    @keyframes giftFly {
      0% { transform: scale(0.3) translateY(80px); opacity: 0; }
      30% { transform: scale(1.3) translateY(0); opacity: 1; }
      70% { transform: scale(1.1) translateY(-20px); opacity: 1; }
      100% { transform: scale(0.6) translateY(-120px); opacity: 0; }
    }
    .gift-label {
      position: absolute; bottom: 38%; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); color: var(--gold); padding: 8px 18px; border-radius: 999px;
      font-weight: 700; font-size: 0.95rem; animation: giftLabel 1.6s ease forwards;
    }
    @keyframes giftLabel {
      0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
      25% { opacity: 1; transform: translateX(-50%) translateY(0); }
      75% { opacity: 1; } 100% { opacity: 0; transform: translateX(-50%) translateY(-30px); }
    }

    #title-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    #title-modal.show { display: flex; }
    .modal-card { background: var(--card); border-radius: 20px; padding: 28px 22px; width: 100%; max-width: 340px; border: 1px solid var(--border); }
    .modal-card h3 { text-align: center; font-size: 1.2rem; margin-bottom: 18px; }
    #title-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 1rem; margin-bottom: 16px; outline: none; }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions button { flex: 1; padding: 13px; border-radius: 12px; font-weight: 600; font-size: 0.95rem; }
    .btn-cancel { background: var(--card2); color: var(--text); }
    .btn-confirm { background: var(--accent); color: #fff; }

    #toast {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-12px);
      background: rgba(20,20,24,0.92); color: #fff; padding: 10px 18px; border-radius: 999px;
      font-size: 0.88rem; opacity: 0; transition: all 0.28s; z-index: 200; pointer-events: none; border: 1px solid var(--border);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="login-screen" class="screen active">
    <div class="login-box">

      <button class="btn-google" id="btn-google">
        <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg>

  <div id="menu" class="screen">
    <div class="broadcast-label">Broadcast</div>

    // ============ WEBRTC ============
    async function startCam(){
      stopCam();
      const vid=document.getElementById('local-video');
      const off=document.getElementById('cam-off');
      if(!navigator.mediaDevices?.getUserMedia){
        vid.style.display='none';off.style.display='block';
        toast('Camera requires HTTPS and browser camera support.');
        return false;
      }
      try{
        stream=await navigator.mediaDevices.getUserMedia({
          video:{facingMode:{ideal:facingMode},width:{ideal:1280},height:{ideal:720}},
          audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}
        });
        vid.srcObject=stream;vid.style.display='block';off.style.display='none';
        vid.muted=true;vid.autoplay=true;vid.playsInline=true;isMuted=false;
        vid.classList.remove('mirror');
        if(facingMode==='user') vid.classList.add('mirror');
        else vid.classList.remove('mirror');
        document.getElementById('btn-mic').textContent='🎤';
        document.getElementById('btn-mic').classList.remove('muted');
        try{await vid.play();}catch(e){}

        // If a viewer somehow connected while the camera was restarting,
        // replace/add the fresh tracks instead of leaving the old connection
        // without video/audio.
        Object.entries(peerConnections).forEach(([viewerKey,pc])=>{
          if(pc.signalingState==='closed')return;
          stream.getTracks().forEach(track=>{
            const sender=pc.getSenders().find(s=>s.track&&s.track.kind===track.kind);
            if(sender) sender.replaceTrack(track).catch(()=>{});
            else pc.addTrack(track,stream);
          });
        });
        return true;
      }catch(e){
        console.error('getUserMedia failed:',e);
        vid.style.display='none';off.style.display='block';
        return false;
      }
    }
    function stopCam(){
      if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}

    }

    // Host: listen for real viewers and create peer connections.
    // Bot counts live in /botCount, while real viewers are represented by
    // /viewers. Keeping those separate prevents a viewer adding bots from
    // being overwritten by the host's local counter.
    function listenForViewers(){
      if(unsubViewers)unsubViewers();
      const viewersRef=ref(db,'lives/'+currentLiveId+'/viewers');
      realViewers=0;
      unsubViewers=onChildAdded(viewersRef,async(snap)=>{
        realViewers++;
        scheduleViewerCountSync();
        const vid=snap.key;
        if(peerConnections[vid])return;
        await createHostPeer(vid);
      });
      unsubViewerRemoved=onChildRemoved(viewersRef,(snap)=>{
        realViewers=Math.max(0,realViewers-1);
        scheduleViewerCountSync();
        const vid=snap.key;
        if(peerConnections[vid]){
          peerConnections[vid].close();
          delete peerConnections[vid];
        }
      });

      // Watch botCount changes made by other users/admins.
      if(unsubLiveMeta)unsubLiveMeta();
      unsubLiveMeta=onValue(ref(db,'lives/'+currentLiveId+'/botCount'),(snap)=>{
        const data=snap.val();
        if(!isHost || currentLiveId===null)return;
        const remoteBots=Math.max(0,Math.floor(Number(data)||0));
        if(remoteBots!==botCount){
          botCount=remoteBots;
          scheduleViewerCountSync();
        }
        updateCountDisplay(botCount+realViewers);
      });
    }

    async function createHostPeer(viewerId){
      // Wait briefly for camera if not ready yet
      for(let i=0;i<100&&!stream;i++) await new Promise(r=>setTimeout(r,100));

      const pc=new RTCPeerConnection({...ICE_SERVERS, iceCandidatePoolSize:10});
      peerConnections[viewerId]=pc;
      let recoveryTimer=null;
      pc.onconnectionstatechange=()=>{
        if(pc.connectionState==='failed' || pc.iceConnectionState==='failed'){
          clearTimeout(recoveryTimer);
          recoveryTimer=setTimeout(()=>{
            if(peerConnections[viewerId]===pc && currentLiveId && isHost){
              try{pc.restartIce?.();}catch(e){}
            }
          },1200);
        }
      };

      if(stream){
        stream.getTracks().forEach(track=>pc.addTrack(track,stream));
      } else {
        console.warn('No stream when creating peer');
      }

      let iceQ=[], iceT=null, hostRemoteReady=false, pendingViewerCandidates=[];
      pc.onicecandidate=e=>{
        if(!e.candidate)return;
        iceQ.push(e.candidate.toJSON());
        if(!iceT){
          iceT=setTimeout(()=>{
            iceQ.forEach(c=>push(ref(db,`lives/${currentLiveId}/signals/${viewerId}/hostCandidates`),c).catch(()=>{}));
            iceQ=[];iceT=null;
          },250);
        }
      };

      // Listen for answer from this viewer (once)
      let answerDone=false;
      onValue(ref(db,`lives/${currentLiveId}/signals/${viewerId}/answer`),(snap)=>{
        const answer=snap.val();
        if(!answer||answerDone||pc.signalingState==='closed')return;
        answerDone=true;
        pc.setRemoteDescription(new RTCSessionDescription(answer)).then(()=>{
          hostRemoteReady=true;
          const pending=pendingViewerCandidates.splice(0);
          pending.forEach(c=>pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}));
        }).catch(()=>{answerDone=false;});
      });

      // Listen for ICE from viewer
      onChildAdded(ref(db,`lives/${currentLiveId}/signals/${viewerId}/viewerCandidates`),(snap)=>{
        const c=snap.val();
        if(!c)return;
        if(hostRemoteReady) pc.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
        else pendingViewerCandidates.push(c);
      });

      try{
        const offer=await pc.createOffer();
        await pc.setLocalDescription(offer);
        await set(ref(db,`lives/${currentLiveId}/signals/${viewerId}/offer`),{
          type:offer.type,sdp:offer.sdp
        });
      }catch(e){console.error('Host offer failed',e);}
    }

    // Viewer joins
    async function joinViewer(live){
      cleanupViewerListeners();
      isHost=false;currentLiveId=live.id;offerHandled=false;
      document.getElementById('btn-b').style.display=isSpecialUser?'flex':'none';
      document.getElementById('live-title-text').textContent=live.title;
      document.getElementById('chat-list').innerHTML='';
      document.getElementById('local-video').style.display='none';
      document.getElementById('remote-video').style.display='none';
      document.getElementById('cam-off').style.display='block';
      document.getElementById('mic-status').textContent='Connecting...';
      document.getElementById('mic-status').style.color='var(--muted)';
      updateCountDisplay((Number(live.viewers)||0)+(Number(live.botCount)||0));
      pauseLivesListener();
      show('live-room');
      toast('Joining '+live.title+'...');

      viewerId='v'+Date.now()+'_'+Math.random().toString(36).slice(2,6);

      // Keep the WebRTC connection isolated from chat/gifts/signaling data.
      // Listening to the whole live node makes Firebase resend the entire
      // subtree on every chat message, which can overload mobile clients and
      // make the camera appear to disappear. Watch only tiny scalar paths.
      const liveTitleRef=ref(db,`lives/${live.id}/title`);
      const liveCountRef=ref(db,`lives/${live.id}/viewerCount`);
      const liveBotCountRef=ref(db,`lives/${live.id}/botCount`);
      let liveCountCache=Number(live.viewers)||0;
      let liveBotCountCache=Number(live.botCount)||0;

      unsubLiveEnd=onValue(liveTitleRef,(snap)=>{
        if(!snap.exists() && currentLiveId===live.id && !isHost){
          forceLeaveLive('Live ended by host');
        }
      });
      unsubLiveCount=onValue(liveCountRef,(snap)=>{
        if(currentLiveId===live.id && !isHost){
          liveCountCache=Number(snap.val())||0;
          updateCountDisplay(liveCountCache+liveBotCountCache);
        }
      });
      if(unsubLiveMeta)try{unsubLiveMeta();}catch(e){}
      unsubLiveMeta=onValue(liveBotCountRef,(snap)=>{
        if(currentLiveId===live.id && !isHost){
          liveBotCountCache=Number(snap.val())||0;
          botCount=liveBotCountCache;
          updateCountDisplay(liveCountCache+liveBotCountCache);
        }
      });
      listenToChat(live.id);

      if(viewerPC){try{viewerPC.close();}catch(e){} viewerPC=null;}
      viewerPC=new RTCPeerConnection({...ICE_SERVERS, iceCandidatePoolSize:10});

      viewerPC.ontrack=async(e)=>{
        const remoteVid=document.getElementById('remote-video');
        remoteVid.autoplay=true;
        remoteVid.playsInline=true;
        remoteVid.muted=false;
        remoteVid.volume=1;

        // Prefer the MediaStream supplied by WebRTC. This is more reliable on
        // mobile Safari/Chrome than rebuilding a stream track-by-track.
        if(e.streams && e.streams[0]){
          remoteVid.srcObject=e.streams[0];
        }else{
          if(!remoteVid.srcObject || !(remoteVid.srcObject instanceof MediaStream)){
            remoteVid.srcObject=new MediaStream();
          }
          const targetStream=remoteVid.srcObject;
          if(e.track && !targetStream.getTracks().some(t=>t.id===e.track.id)){
            targetStream.addTrack(e.track);
          }
        }

        remoteVid.style.display='block';
        document.getElementById('cam-off').style.display='none';
        document.getElementById('mic-status').textContent='Connected';
        document.getElementById('mic-status').style.color='var(--green)';
        try{ await remoteVid.play(); }catch(err){
          // Autoplay may be blocked until the user taps the page. The video
          // element remains ready and will play on the next user gesture.
        }
      };
      document.getElementById('remote-video').onloadedmetadata=()=>{
        const v=document.getElementById('remote-video');
        v.style.display='block';
        document.getElementById('cam-off').style.display='none';
        v.play().catch(()=>{});
      };
      viewerPC.onconnectionstatechange=()=>{
        if(viewerPC.connectionState==='connected'){
          document.getElementById('remote-video').style.display='block';
          document.getElementById('cam-off').style.display='none';
          document.getElementById('mic-status').textContent='Connected';
          document.getElementById('mic-status').style.color='var(--green)';
        } else if(viewerPC.connectionState==='failed'){
          // Do not hide the last good camera frame just because Firebase chat
          // or bot-count traffic is busy. The connection can recover.
          document.getElementById('mic-status').textContent='Reconnecting...';
          document.getElementById('mic-status').style.color='var(--muted)';
          setTimeout(()=>{
            if(viewerPC&&viewerPC.connectionState==='failed'){
              viewerPC.restartIce?.();
            }
          },1000);
        } else if(viewerPC.connectionState==='disconnected'){
          document.getElementById('mic-status').textContent='Reconnecting...';
          document.getElementById('mic-status').style.color='var(--muted)';
        }
      };

      // Throttle ICE writes to avoid flooding Firebase (causes freeze)
      let iceQueue=[], iceTimer=null, viewerRemoteReady=false, pendingHostCandidates=[];
      viewerPC.onicecandidate=e=>{
        if(!e.candidate)return;
        iceQueue.push(e.candidate.toJSON());
        if(!iceTimer){
          iceTimer=setTimeout(()=>{
            iceQueue.forEach(c=>push(ref(db,`lives/${live.id}/signals/${viewerId}/viewerCandidates`),c).catch(()=>{}));
            iceQueue=[];iceTimer=null;
          },300);
        }
      };

      // Wait for host offer — only handle once
      onValue(ref(db,`lives/${live.id}/signals/${viewerId}/offer`),async(snap)=>{
        const offer=snap.val();
        if(!offer||!viewerPC||offerHandled)return;
        if(viewerPC.signalingState==='closed')return;
        offerHandled=true;
        try{
          await viewerPC.setRemoteDescription(new RTCSessionDescription(offer));
          viewerRemoteReady=true;
          const pending=pendingHostCandidates.splice(0);
          pending.forEach(c=>viewerPC.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{}));
          const answer=await viewerPC.createAnswer();
          await viewerPC.setLocalDescription(answer);
          await set(ref(db,`lives/${live.id}/signals/${viewerId}/answer`),{
            type:answer.type,sdp:answer.sdp
          });
        }catch(e){console.error('Viewer answer failed',e);offerHandled=false;}
      });

      onChildAdded(ref(db,`lives/${live.id}/signals/${viewerId}/hostCandidates`),(snap)=>{
        const c=snap.val();
        if(!c||!viewerPC)return;
        if(viewerRemoteReady) viewerPC.addIceCandidate(new RTCIceCandidate(c)).catch(()=>{});
        else pendingHostCandidates.push(c);
      });

      // Register the viewer only AFTER the offer listener exists. This removes
      // the small signaling race where the host could publish an offer before
      // this phone started listening for it.
      try{
        await set(ref(db,`lives/${live.id}/viewers/${viewerId}`),{
          name:user?.name||'Viewer',joinedAt:Date.now()
        });
      }catch(e){
        console.error('Viewer registration failed:',e);
        toast('Could not join this live (Firebase permission).');
      }
    }

    function cleanupViewerListeners(){
      if(typeof unsubLiveEnd==='function'){try{unsubLiveEnd();}catch(e){} unsubLiveEnd=null;}
      if(typeof unsubLiveCount==='function'){try{unsubLiveCount();}catch(e){} unsubLiveCount=null;}
      if(typeof unsubChat==='function'){try{unsubChat();}catch(e){} unsubChat=null;}
      if(typeof unsubViewers==='function'){try{unsubViewers();}catch(e){} unsubViewers=null;}
      if(typeof unsubViewerRemoved==='function'){try{unsubViewerRemoved();}catch(e){} unsubViewerRemoved=null;}
      if(typeof unsubLiveMeta==='function'){try{unsubLiveMeta();}catch(e){} unsubLiveMeta=null;}
    }

    function forceLeaveLive(msg){
      cleanupViewerListeners();
      clearTimeout(viewerCountSyncTimer);viewerCountSyncTimer=null;
      clearTimeout(botDeltaTimer);botDeltaTimer=null;pendingBotDelta=0;
      stopCam();stopBots();stopRealSim();
      if(viewerPC){try{viewerPC.close();}catch(e){} viewerPC=null;}
      Object.values(peerConnections).forEach(pc=>{try{pc.close();}catch(e){}});
      peerConnections={};
      const leftId=currentLiveId, leftViewer=viewerId;
      isHost=false;botCount=0;realViewers=0;viewerId=null;currentLiveId=null;offerHandled=false;
      document.getElementById('remote-video').srcObject=null;
      document.getElementById('remote-video').style.display='none';
      if(leftViewer&&leftId){
        remove(ref(db,`lives/${leftId}/viewers/${leftViewer}`)).catch(()=>{});
      }
      show('menu');
      pauseLivesListener();
      listenToLives();
      toast(msg||'Live ended');
    }

    // Controls
    document.getElementById('btn-mic').onclick=()=>{
      if(!isHost||!stream)return;

      stream.getAudioTracks().forEach(t=>t.enabled=!isMuted);

    async function stopLive(){
      cleanupViewerListeners();
      clearTimeout(viewerCountSyncTimer);viewerCountSyncTimer=null;
      clearTimeout(botDeltaTimer);botDeltaTimer=null;pendingBotDelta=0;
      stopCam();stopBots();stopRealSim();
      Object.values(peerConnections).forEach(pc=>{try{pc.close();}catch(e){}});
      peerConnections={};
      if(viewerPC){try{viewerPC.close();}catch(e){} viewerPC=null;}
      if(viewerId&&currentLiveId&&!isHost){
        try{await remove(ref(db,`lives/${currentLiveId}/viewers/${viewerId}`));}catch(e){}
      }
      if(isHost)await endLiveInDb();
      isHost=false;botCount=0;realViewers=0;viewerId=null;currentLiveId=null;offerHandled=false;
      document.getElementById('remote-video').srcObject=null;
      document.getElementById('remote-video').style.display='none';
      show('menu');
      pauseLivesListener();
      listenToLives();
      toast('Live ended');
    }

    // Viewers count. The displayed/published count is derived from the
    // shared botCount plus actual viewer connections. Writes are throttled so
    // rapid bot joins/leaves cannot hammer Firebase or interfere with WebRTC.
    function updateCount(){
      const total=Math.max(0,Math.floor(Number(botCount)+Number(realViewers))||0);
      updateCountDisplay(total);
      if(isHost&&currentLiveId)scheduleViewerCountSync();
    }

    let viewerCountSyncTimer=null;
    function scheduleViewerCountSync(){
      if(!currentLiveId||!isSpecialUser)return;
      clearTimeout(viewerCountSyncTimer);
      viewerCountSyncTimer=setTimeout(()=>{
        viewerCountSyncTimer=null;
        const total=Math.max(0,Math.floor(Number(botCount)+Number(realViewers))||0);
        update(ref(db,'lives/'+currentLiveId),{viewerCount:Math.max(0,Math.floor(Number(realViewers)||0)),botCount:Math.max(0,Math.floor(Number(botCount)||0))}).catch(()=>{});
      },250);
    }
    function updateCountDisplay(n){
      document.getElementById('watchers-text').textContent=format(n)+' watching';
    }

    // Mobile browsers can reject an unmuted remote video until the user has
    // interacted with the page. Retry playback on the next tap without ever
    // replacing the active WebRTC MediaStream.
    document.addEventListener('pointerdown',()=>{
      const v=document.getElementById('remote-video');
      if(v && v.srcObject) v.play().catch(()=>{});
    },{passive:true});

    // B button (only special)
    // B button: click = add botsPerClick, hold = open amount menu
    let bHoldTimer=null, bHoldFired=false;
    const btnB=document.getElementById('btn-b');
    const bMenu=document.getElementById('b-menu');

    function highlightBMenu(){
      bMenu.querySelectorAll('.b-opt').forEach(o=>{
        o.classList.toggle('active', Number(o.dataset.amt)===botsPerClick);
      });
    }
    bMenu.querySelectorAll('.b-opt').forEach(opt=>{
      opt.onclick=(e)=>{

      };
    });

    btnB.addEventListener('pointerdown',(e)=>{
      if(!isSpecialUser)return;
      bHoldFired=false;
      bHoldTimer=setTimeout(()=>{
        bHoldFired=true;
        highlightBMenu();
        bMenu.classList.add('show');
      },450);
    });
    btnB.addEventListener('pointerup',async(e)=>{
      clearTimeout(bHoldTimer);
      if(bHoldFired)return; // menu was opened
      if(!isSpecialUser)return;
      await addBotsBatch(botsPerClick);
    });
    btnB.addEventListener('pointerleave',()=>clearTimeout(bHoldTimer));
    document.addEventListener('click',(e)=>{
      if(!bMenu.contains(e.target)&&e.target!==btnB) bMenu.classList.remove('show');
    });

    let pendingBotDelta=0;
    let botDeltaTimer=null;

    // Queue host-side bot changes and commit them in small batches. This keeps
    // the bot counter shared between host/viewers without flooding Firebase.
    function queueBotDelta(delta){
      if(!isHost||!currentLiveId)return;
      delta=Math.trunc(Number(delta)||0);
      if(!delta)return;
      botCount=Math.max(0,botCount+delta);
      pendingBotDelta+=delta;
      updateCount();
      if(botDeltaTimer)return;
      botDeltaTimer=setTimeout(flushBotDelta,300);
    }

    async function flushBotDelta(){
      botDeltaTimer=null;
      if(!isHost||!currentLiveId||!pendingBotDelta)return;
      const liveId=currentLiveId;
      const delta=pendingBotDelta;
      pendingBotDelta=0;
      try{
        const result=await runTransaction(ref(db,`lives/${liveId}/botCount`),current=>{
          const value=Math.max(0,Math.floor(Number(current)||0));
          return Math.max(0,value+delta);
        });
        if(liveId===currentLiveId){
          botCount=Math.max(0,Math.floor(Number(result.snapshot.val())||0));
          updateCount();
        }
      }catch(e){
        // Re-read the shared value rather than leaving the UI permanently out
        // of sync if a transaction is interrupted.
        try{
          const snap=await new Promise(resolve=>onValue(ref(db,`lives/${liveId}/botCount`),resolve,{onlyOnce:true}));
          if(liveId===currentLiveId)botCount=Math.max(0,Math.floor(Number(snap.val())||0));
          updateCount();
        }catch(_e){}
      }
      if(pendingBotDelta&&!botDeltaTimer)botDeltaTimer=setTimeout(flushBotDelta,300);
    }

    async function addBotsBatch(n){
      n=Math.floor(Number(n))||1;
      if(isHost){
        queueBotDelta(n);
        // A few chat lines, not n lines (keeps chat clean).
        const msgs=Math.min(8, Math.max(1, Math.floor(Math.log10(n+1))+1));
        for(let i=0;i<msgs;i++){
          const botName=nextName();
          const botText=nextMsg();
          broadcastBotChat(botName,botText);
        }
        toast('+'+format(n)+' bots');
      } else if(currentLiveId){
        // Do not let a viewer transaction /botCount directly. That commonly
        // fails under Firebase rules because only the host should own the
        // shared counter. Send a normal chat write as a hidden bot request;
        // the host receives it and performs the counter transaction.
        const amount=Math.max(1,Math.min(1000000,n));
        const requestRef=push(ref(db,`lives/${currentLiveId}/chat`));
        const requestKey=requestRef.key;
        try{
          await set(requestRef,{
            botRequest:true,
            requesterUid:user?.uid||'',
            requesterEmail:user?.email||'',
            requesterAdmin:!!isSpecialUser,
            amount,
            at:Date.now()
          });
          // Hide our own request from the chat listener immediately. The host
          // processes the request and changes the shared botCount; the viewer
          // must NOT try to simulate the bots locally because that can make it
          // look like the button worked while the shared count stays unchanged.
          if(requestKey)seenChatIds.add(requestKey);
          toast('Bot request sent — waiting for host...');
        }catch(e){
          console.error('Bot request failed:',e);
          toast('Could not request bots. Make sure you can send chat messages.');
        }
      }
    }
    function addBot(){ addBotsBatch(1); }

    // Bots auto join/leave + chat
    function startBots(){
      stopBots();
      chatPhase='greet';
      // After ~40 messages or ~25s switch to normal chat
      setTimeout(()=>{chatPhase='normal';},25000);
      botTimer=setTimeout(scheduleJoin,4000+Math.random()*4000);
      scheduleChat();
      scheduleLeave();
    }
    function stopBots(){
      clearTimeout(botTimer);botTimer=null;
      clearTimeout(chatTimer);chatTimer=null;
      stopViewerBotChat();
      clearTimeout(leaveTimer);leaveTimer=null;
    }
    let leaveTimer=null;

    function scheduleJoin(){
      // Keep very large counts smooth instead of letting the number race by
      // hundreds/thousands every fraction of a second. The count still grows
      // continuously, but the visible increments become deliberately slower.
      let delay;
      if(botCount<5)delay=5000+Math.random()*5000;
      else if(botCount<20)delay=3000+Math.random()*3000;
      else if(botCount<80)delay=1800+Math.random()*1600;
      else if(botCount<300)delay=1100+Math.random()*900;
      else if(botCount<1000)delay=850+Math.random()*650;
      else if(botCount<5000)delay=700+Math.random()*500;
      else if(botCount<20000)delay=650+Math.random()*450;
      else delay=600+Math.random()*450;

      let burst=1;
      if(botCount>50) burst=1+Math.floor(Math.random()*2);
      if(botCount>200) burst=1+Math.floor(Math.random()*3);
      if(botCount>1000) burst=2+Math.floor(Math.random()*4);
      if(botCount>10000) burst=3+Math.floor(Math.random()*7);
      if(botCount>50000) burst=5+Math.floor(Math.random()*10);
      if(botCount>100000) burst=6+Math.floor(Math.random()*12);

      botTimer=setTimeout(()=>{
        queueBotDelta(burst);
        scheduleJoin();
      },delay);
    }

    function scheduleLeave(){
      // Bots leave slowly once there are some
      let delay=8000+Math.random()*8000;
      if(botCount>100) delay=4000+Math.random()*4000;
      if(botCount>1000) delay=2000+Math.random()*2000;
      if(botCount>10000) delay=800+Math.random()*800;
      leaveTimer=setTimeout(()=>{
        if(botCount>3){
          let leave=1;
          if(botCount>50) leave=1+Math.floor(Math.random()*3);
          if(botCount>500) leave=2+Math.floor(Math.random()*8);
          if(botCount>5000) leave=10+Math.floor(Math.random()*40);
          leave=Math.min(leave, Math.floor(botCount*0.05)+1); // max 5% leave at once
          queueBotDelta(-leave);
        }
        scheduleLeave();
      },delay);
    }

    let lastBotChatWrite=0;
    let botChatWriteBusy=false;
    const BOT_CHAT_MIN_GAP=55;
    async function broadcastBotChat(name,text){
      const liveId=currentLiveId;
      if(!liveId || !isSpecialUser)return false;
      const now=Date.now();
      if(now-lastBotChatWrite<BOT_CHAT_MIN_GAP)return false;
      if(botChatWriteBusy)return false;
      botChatWriteBusy=true;
      lastBotChatWrite=now;

      // Generate the Firebase key ourselves and mark it as seen BEFORE the
      // write. This prevents the local copy + onChildAdded copy from rendering
      // the same bot message twice.
      const msgRef=push(ref(db,`lives/${liveId}/chat`));
      const key=msgRef.key;
      if(key)seenChatIds.add(key);
      const payload={name,text,host:false,gift:false,bot:true,at:now};
      try{
        await set(msgRef,payload);
        addMsg(name,text);
        return true;
      }catch(e){
        if(key)seenChatIds.delete(key);
        console.warn('Bot chat write failed:',e);
        return false;
      }finally{
        botChatWriteBusy=false;
      }
    }

    function startViewerBotChat(){
      if(isHost || !isSpecialUser || !currentLiveId) return;
      if(viewerBotChatTimer) return;
      const tick=async()=>{
        viewerBotChatTimer=null;
        if(!currentLiveId || isHost || !isSpecialUser || botCount<=0) return;
        const amount=botCount>500 ? 2 : 1;
        for(let i=0;i<amount;i++){
          const botName=nextName();
          const botText=nextMsg();
          broadcastBotChat(botName,botText);
        }
        const delay=botCount>1000 ? 500 : botCount>100 ? 900 : 1400;
        viewerBotChatTimer=setTimeout(tick,delay);
      };
      viewerBotChatTimer=setTimeout(tick,350);
    }
    function stopViewerBotChat(){
      clearTimeout(viewerBotChatTimer);
      viewerBotChatTimer=null;
    }

    function scheduleChat(){
      // Keep chat responsive even when the bot count is huge. The old 180ms
      // write gate limited the room to about 5 messages/sec. This version
      // targets a much healthier stream without creating hundreds of DOM nodes
      // per frame.
      let delay;
      if(botCount<5)delay=3500+Math.random()*2500;
      else if(botCount<20)delay=1800+Math.random()*1400;
      else if(botCount<80)delay=850+Math.random()*650;
      else if(botCount<300)delay=450+Math.random()*300;
      else if(botCount<1000)delay=260+Math.random()*180;
      else if(botCount<5000)delay=150+Math.random()*90;
      else if(botCount<20000)delay=95+Math.random()*55;
      else delay=65+Math.random()*35;

      // More bots = more chat, but keep each tick small. broadcastBotChat has
      // its own 55ms gate so messages remain smooth instead of arriving as a
      // giant Firebase/DOM burst.
      let multi=1;
      if(botCount>30) multi=1+Math.floor(Math.random()*2);
      if(botCount>150) multi=1+Math.floor(Math.random()*3);
      if(botCount>800) multi=2+Math.floor(Math.random()*3);
      if(botCount>5000) multi=2+Math.floor(Math.random()*4);
      if(botCount>20000) multi=3+Math.floor(Math.random()*4);
      multi=Math.min(multi,6);

      chatTimer=setTimeout(()=>{
        if(botCount>0){
          for(let i=0;i<multi;i++){
            const botName=nextName();
            const botText=nextMsg();
            broadcastBotChat(botName,botText);
          }
          if(chatPhase==='greet' && ni>35) chatPhase='normal';
        }
        scheduleChat();
      },delay);
    }
    function startRealSim(){
      stopRealSim();
      realTimer=setInterval(()=>{
        if(Math.random()<0.35){
          realViewers=Math.max(0,Math.min(8,realViewers+(Math.random()<0.55?1:-1)));
          updateCount();
        }
      },10000+Math.random()*8000);
    }
    function stopRealSim(){clearInterval(realTimer);realTimer=null;}

    // Chat (synced via Firebase)
    //
    // Firebase can deliver a large burst of child_added events in the same
    // moment. Rendering every event immediately causes repeated layout,
    // DOM removal and scroll calculations, which is what makes fast chat
    // visibly glitch. Queue messages and render them once per animation
    // frame instead. This keeps the UI at roughly 60fps even during bursts.
    const seenChatIds=new Set();
    const MAX_CHAT_MESSAGES=40;
    const MAX_CHAT_QUEUE=80;
    const MAX_SEEN_CHAT_IDS=2000;
    const chatQueue=[];
    let chatRenderScheduled=false;

    function listenToChat(liveId){
      if(typeof unsubChat==='function'){try{unsubChat();}catch(e){}}
      seenChatIds.clear();
      chatQueue.length=0;
      chatRenderScheduled=false;
      document.getElementById('chat-list').replaceChildren();

      unsubChat=onChildAdded(query(ref(db,`lives/${liveId}/chat`),limitToLast(MAX_CHAT_MESSAGES)),(snap)=>{
        const msg=snap.val();
        if(!msg||seenChatIds.has(snap.key))return;

        // Hidden bot requests are written to the chat path so viewers can use
        // the same Firebase permission they already need for normal chat.
        // Only the live host turns the request into a bot-count transaction.
        if(msg.botRequest){
          seenChatIds.add(snap.key);
          if(isHost && currentLiveId===liveId && (
            msg.requesterEmail===SPECIAL_EMAIL ||
            String(msg.requesterEmail||'').toLowerCase().includes('kobik8512') ||
            msg.requesterAdmin===true
          )){
            const amount=Math.max(1,Math.min(1000000,Math.floor(Number(msg.amount)||1)));
            queueBotDelta(amount);
            // A request should create a small, visible burst of bot chat, but
            // never one line per bot. The normal bot-chat loop takes over after
            // this burst.
            const previewCount=Math.min(6,Math.max(1,Math.floor(Math.log10(amount+1))+1));
            for(let i=0;i<previewCount;i++) broadcastBotChat(nextName(),nextMsg());
          }
          return;
        }

        seenChatIds.add(snap.key);
        // Prevent the de-duplication set from growing forever in long lives.
        if(seenChatIds.size>MAX_SEEN_CHAT_IDS){
          const first=seenChatIds.values().next().value;
          if(first!==undefined)seenChatIds.delete(first);
        }

        chatQueue.push({
          name:msg.name,
          text:msg.text,
          host:!!msg.host,
          gift:!!msg.gift,
          giftEmoji:msg.giftEmoji,
          giftName:msg.giftName||'',
          giftCost:msg.giftCost||0
        });
        // The UI only keeps the newest 40 messages, so never let a network
        // burst build an unbounded render queue. Drop stale queued messages.
        if(chatQueue.length>MAX_CHAT_QUEUE){
          chatQueue.splice(0,chatQueue.length-MAX_CHAT_QUEUE);
        }
        scheduleChatRender();
      });
    }

    function scheduleChatRender(){
      if(chatRenderScheduled)return;
      chatRenderScheduled=true;
      requestAnimationFrame(flushChatQueue);
    }

    function flushChatQueue(){
      chatRenderScheduled=false;
      const list=document.getElementById('chat-list');
      if(!list||chatQueue.length===0)return;

      // Take the whole burst at once so there is only one DOM/layout pass.
      const batch=chatQueue.splice(0,chatQueue.length);
      const fragment=document.createDocumentFragment();
      const gifts=[];

      for(const msg of batch){
        const div=document.createElement('div');
        div.className='msg msg-new'+(msg.host?' host':'')+(msg.gift?' gift-msg':'');
        const cls=msg.host||msg.gift?'':colorClass(msg.name);

        const nameSpan=document.createElement('span');
        nameSpan.className='uname '+cls;
        nameSpan.textContent=msg.name||'';
        div.appendChild(nameSpan);
        div.appendChild(document.createTextNode(msg.text||''));
        fragment.appendChild(div);

        if(msg.gift&&msg.giftEmoji)gifts.push(msg);
      }

      list.appendChild(fragment);

      // Trim in one pass instead of removing one node for every message.
      const excess=list.children.length-MAX_CHAT_MESSAGES;
      if(excess>0){
        for(let i=0;i<excess;i++)list.firstElementChild?.remove();
      }

      // One scroll calculation per rendered batch, not once per message.
      list.scrollTop=list.scrollHeight;

      // Remove the animation class after it has finished so long chats do not
      // accumulate animation state. Only animate a small burst; when chat is
      // extremely busy, skipping the animation is smoother than animating 40
      // elements at once.
      if(batch.length>8){
        list.querySelectorAll('.msg-new').forEach(el=>el.classList.remove('msg-new'));
      }else{
        setTimeout(()=>{
          list.querySelectorAll('.msg-new').forEach(el=>el.classList.remove('msg-new'));
        },180);
      }

      // Gift effects are also throttled. A chat burst should never create
      // dozens of full-screen animations at the same time.
      if(gifts.length){
        const gift= gifts[gifts.length-1];
        playGiftAnim(gift.giftEmoji,gift.giftName,gift.giftCost);
      }

      // If new Firebase events arrived while we were rendering, process them
      // on the next frame instead of recursively touching the DOM.
      if(chatQueue.length)scheduleChatRender();
    }

    function displayMsg(name,text,host=false,isGift=false){
      chatQueue.push({name,text,host,gift:isGift});
      if(chatQueue.length>MAX_CHAT_QUEUE){
        chatQueue.splice(0,chatQueue.length-MAX_CHAT_QUEUE);
      }
      scheduleChatRender();
    }

    // Local-only messages (bots) still use this
    function addMsg(name,text,host=false,isGift=false){
      displayMsg(name,text,host,isGift);
    }
    document.getElementById('btn-send').onclick=sendMsg;
    document.getElementById('chat-input').onkeydown=e=>{if(e.key==='Enter')sendMsg();};
    async function sendMsg(){
      const input=document.getElementById('chat-input');
      const t=input.value.trim();
      if(!t||!currentLiveId)return;
      const name=user?user.name:'You';
      try{
        await push(ref(db,`lives/${currentLiveId}/chat`),{
          name, text:t, host:isHost, gift:false, at:Date.now()
        });
      }catch(e){toast('Chat failed');}
      input.value='';
    }

    // Gifts
    function buildGiftGrid(){
      const grid=document.getElementById('gift-grid');
      grid.innerHTML='';
      GIFTS.forEach(g=>{
        const item=document.createElement('div');
        item.className='gift-item';
        item.innerHTML=`<div class="g-emoji">${g.emoji}</div><div class="g-name">${esc(g.name)}</div><div class="g-cost">🪙 ${formatCoins(g.cost)}</div>`;
        item.onclick=()=>sendGift(g);
        grid.appendChild(item);
      });
    }
    buildGiftGrid();

    document.getElementById('btn-gift').onclick=()=>{
      if(isHost){toast("You can't gift in your own live");return;}
      document.getElementById('gift-panel').classList.add('show');
    };
    document.getElementById('gift-close').onclick=()=>document.getElementById('gift-panel').classList.remove('show');
    document.getElementById('gift-panel').onclick=e=>{if(e.target.id==='gift-panel')document.getElementById('gift-panel').classList.remove('show');};

    async function sendGift(gift){
      if(isHost){toast("You can't gift in your own live");return;}
      if(!currentLiveId){toast('Not in a live');return;}
      if(!isInfinite&&coins<gift.cost){toast('Not enough coins!');return;}
      if(!isInfinite){coins-=gift.cost;saveCoins();updateCoinsUI();}
      document.getElementById('gift-panel').classList.remove('show');

      // Animation on sender side
      playGiftAnim(gift.emoji,gift.name,gift.cost);

      const sender=user?user.name:'You';
      const text=`sent ${gift.emoji} ${gift.name} (🪙${formatCoins(gift.cost)})`;
      const toStreamer=Math.floor(gift.cost*0.7);

      try{
        await push(ref(db,`lives/${currentLiveId}/chat`),{
          name:sender, text, host:false, gift:true, at:Date.now(),
          giftEmoji:gift.emoji, giftName:gift.name, giftCost:gift.cost,
          coinsToHost:toStreamer
        });
        // Direct credit to live node so host gets it immediately
        await push(ref(db,`lives/${currentLiveId}/gifts`),{
          from:sender, emoji:gift.emoji, name:gift.name, cost:gift.cost,
          toHost:toStreamer, at:Date.now()
        });
      }catch(e){console.error(e);toast('Gift failed');return;}
      toast(`Gift sent! +${formatCoins(toStreamer)} to streamer`);
    }

    function playGiftAnim(emoji,name,cost){
      const anim=document.getElementById('gift-anim');
      anim.innerHTML=`<div class="gift-fly">${emoji}</div><div class="gift-label">${emoji} ${name} · 🪙${formatCoins(cost)}</div>`;
      setTimeout(()=>{anim.innerHTML='';},1700);
    }

    // Host listens for incoming gifts → gets coins + animation
    function listenForGifts(liveId){
      onChildAdded(ref(db,`lives/${liveId}/gifts`),(snap)=>{
        if(!isHost)return;
        const g=snap.val();
        if(!g)return;
        playGiftAnim(g.emoji,g.name,g.cost);
        if(!isInfinite){
          coins+=(g.toHost||0);
          saveCoins();
          updateCoinsUI();
        }
        toast(`+${formatCoins(g.toHost||0)} coins from gift!`);
      });
    }
  </script>
</body>
</html>
