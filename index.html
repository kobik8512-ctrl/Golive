function toast(text, ms = 1800) {

  const el = document.getElementById("toast");

  el.textContent = text;

  el.classList.add("show-toast");

  clearTimeout(el.__toastTimer);

  el.__toastTimer = setTimeout(() => {
    el.classList.remove("show-toast");
  }, ms);
}


function show(id) {

    .forEach(x => x.classList.remove("active"));

  const el = document.getElementById(id);

  if (el) {
    el.classList.add("active");
  }
}


function esc(s) {

  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function format(n) {

  n = Math.max(0, Number(n) || 0);

  if (n >= 1e9) return (n / 1e9).toFixed(1) + "B";
  if (n >= 1e6) return (n / 1e6).toFixed(1) + "M";
  if (n >= 1000) return (n / 1000).toFixed(1) + "K";

  return String(Math.floor(n));
}


function colorClass(name) {

  let h = 0;

  for (let i = 0; i < name.length; i++) {
    h = (h * 31 + name.charCodeAt(i)) >>> 0;
  }

  return "c" + (h % 8);
}

/* =========================================================

async function loginWithGoogle() {

  const btn = document.getElementById("btn-google");

  if (!btn) return;

  btn.disabled = true;

  const originalText = btn.innerHTML;

  btn.textContent = "Signing in...";

  try {

    /*
      Popup is attempted first.

      If the browser blocks the popup, we fall back
      to redirect authentication.
    */

    await signInWithPopup(auth, provider);

  } catch (error) {

    console.error("Google sign-in error:", error);

    const code = error?.code || "";

    /*
      These errors mean popup authentication isn't
      usable in the current browser, so redirect is
      the correct fallback.
    */

    if (
      code === "auth/popup-blocked" ||
      code === "auth/popup-cancelled"
    ) {

      try {

        await signInWithRedirect(auth, provider);
        return;

      } catch (redirectError) {

        console.error(
          "Google redirect error:",
          redirectError
        );

        showLoginError(redirectError);

      }

    } else {

      showLoginError(error);

    }

  } finally {

    btn.disabled = false;

    btn.innerHTML = originalText;

  }

}


function showLoginError(error) {

  const code = error?.code || "unknown";

  switch (code) {

    case "auth/popup-closed-by-user":
      toast("Google login cancelled");
      break;

    case "auth/popup-blocked":
      toast("Popup blocked by browser");
      break;

    case "auth/unauthorized-domain":
      toast("This website is not authorized in Firebase");
      console.error(
        "Add this website's hostname under Firebase Authentication > Settings > Authorized domains."
      );
      break;

    case "auth/operation-not-allowed":
      toast("Google sign-in is disabled in Firebase");
      break;

    case "auth/network-request-failed":
      toast("Network error. Check your connection.");
      break;

    case "auth/account-exists-with-different-credential":
      toast("This email uses another sign-in method");
      break;

    default:
      toast("Login failed: " + code);
      break;

  }

}

/* =========================================================
   CAMERA
========================================================= */

async function startCamera() {

  try {

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Camera API unavailable");
    }


    if (stream) {

      stream.getTracks()
        .forEach(track => track.stop());

      stream = null;

    }


    const newStream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode,
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30, max: 30 }
        },

        audio: true

      });


    stream = newStream;

    cameraOn = true;


    const video =
      document.getElementById("local-video");


    video.srcObject = stream;

    video.style.display = "block";


    document.getElementById("cam-off")
      .style.display = "none";


    video.classList.toggle(
      "mirror",
      facingMode === "user"
    );


    document.getElementById("mic-status")
      .textContent =
      isMuted ? "Mic: muted" : "Mic: on";


    document.getElementById("btn-camera")
      .textContent = "📷";


    for (
      const pc of Object.values(peerConnections)
    ) {

      const videoSender =
        pc.getSenders().find(
          sender =>
            sender.track?.kind === "video"
        );


      const audioSender =
        pc.getSenders().find(
          sender =>
            sender.track?.kind === "audio"
        );


      try {

        if (videoSender) {

          await videoSender.replaceTrack(
            newStream.getVideoTracks()[0] ||
            null
          );

        }


        if (audioSender) {

          await audioSender.replaceTrack(
            newStream.getAudioTracks()[0] ||
            null
          );

        }

      } catch (error) {

        console.warn(
          "Track replacement:",
          error
        );

      }

    }

  } catch (error) {

    console.error(
      "Camera:",
      error
    );

    cameraOn = false;

    document.getElementById("local-video")
      .style.display = "none";

    document.getElementById("cam-off")
      .style.display = "block";

    document.getElementById("mic-status")
      .textContent = "Camera off";


    toast(
      error.name === "NotAllowedError"
        ? "Camera/mic permission denied"
        : "Camera unavailable"
    );

  }

}

/* =========================================================
   WEBRTC HOST
========================================================= */

function listenForViewers() {

  if (unsubViewers) {

    try {
      unsubViewers();
    } catch {}

  }


  const viewersRef =
    ref(
      db,
      `lives/${currentLiveId}/viewers`
    );


  unsubViewers =
    onChildAdded(
      viewersRef,
      async snap => {

        const id = snap.key;

        if (peerConnections[id]) {
          return;
        }

        realViewers++;

        updateViewerCount();

        await createHostPeer(id);

      }
    );


  onChildRemoved(
    viewersRef,
    snap => {

      const id = snap.key;

      if (peerConnections[id]) {

        try {
          peerConnections[id].close();
        } catch {}

        delete peerConnections[id];

      }


      realViewers =
        Math.max(
          0,
          realViewers - 1
        );

      updateViewerCount();

    }
  );

}


/* =========================================================
   HOST PEER
========================================================= */

async function createHostPeer(id) {

  const pc =
    new RTCPeerConnection({
      iceServers: [
        {
          urls: "stun:stun.l.google.com:19302"
        },
        {
          urls: "stun:stun1.l.google.com:19302"
        }
      ]
    });


  peerConnections[id] = pc;


  const videoTrans =
    pc.addTransceiver(
      "video",
      { direction: "sendonly" }
    );


  const audioTrans =
    pc.addTransceiver(
      "audio",
      { direction: "sendonly" }
    );


  if (stream) {

    await videoTrans.sender.replaceTrack(
      stream.getVideoTracks()[0] || null
    );

    await audioTrans.sender.replaceTrack(
      stream.getAudioTracks()[0] || null
    );

  }


  pc.onicecandidate = event => {

    if (!event.candidate) return;


    push(
      ref(
        db,
        `lives/${currentLiveId}/signals/${id}/hostCandidates`
      ),
      event.candidate.toJSON()
    ).catch(() => {});

  };


  onValue(
    ref(
      db,
      `lives/${currentLiveId}/signals/${id}/answer`
    ),
    async snap => {

      const answer = snap.val();

      if (
        !answer ||
        pc.signalingState !==
          "have-local-offer"
      ) {
        return;
      }


      try {

        await pc.setRemoteDescription(
          new RTCSessionDescription(answer)
        );

      } catch (error) {

        console.warn(
          "Host answer:",
          error
        );

      }

    }
  );


  onChildAdded(
    ref(
      db,
      `lives/${currentLiveId}/signals/${id}/viewerCandidates`
    ),
    snap => {

      const candidate = snap.val();

      if (!candidate) return;


      pc.addIceCandidate(
        new RTCIceCandidate(candidate)
      ).catch(() => {});

    }
  );


  pc.onconnectionstatechange = () => {

    if (
      pc.connectionState === "failed" ||
      pc.connectionState === "closed"
    ) {

      try {
        pc.close();
      } catch {}

      delete peerConnections[id];

    }

  };


  try {

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );


    await set(
      ref(
        db,
        `lives/${currentLiveId}/signals/${id}/offer`
      ),
      {
        type: offer.type,
        sdp: offer.sdp
      }
    );

  } catch (error) {

    console.error(
      "WebRTC offer:",
      error
    );

  }

}

          urls: "stun:stun.l.google.com:19302"
        },
        {
          urls: "stun:stun1.l.google.com:19302"
        }
      ]
    });


  const pendingCandidates = [];


  viewerPC.ontrack = event => {

    const video =
      document.getElementById(
        "remote-video"
      );


    if (event.streams?.[0]) {

      video.srcObject =
        event.streams[0];

      video.style.display =
        "block";


      document.getElementById("cam-off")
        .style.display =
        "none";


      video.play().catch(() => {});

    }

  };


  viewerPC.onicecandidate =
    event => {

      if (!event.candidate) return;


      push(
        ref(
          db,
          `lives/${live.id}/signals/${viewerId}/viewerCandidates`
        ),
        event.candidate.toJSON()
      ).catch(() => {});

    };


  onValue(
    ref(
      db,
      `lives/${live.id}/signals/${viewerId}/offer`
    ),
    async snap => {

      const offer = snap.val();


      if (
        !offer ||
        !viewerPC ||
        viewerPC.signalingState !==
          "stable"
      ) {
        return;
      }


      try {

        await viewerPC.setRemoteDescription(
          new RTCSessionDescription(offer)
        );


        while (
          pendingCandidates.length
        ) {

          const candidate =
            pendingCandidates.shift();

          try {

            await viewerPC
              .addIceCandidate(
                candidate
              );

          } catch {}

        }


        const answer =
          await viewerPC.createAnswer();


        await viewerPC.setLocalDescription(
          answer
        );


        await set(
          ref(
            db,
            `lives/${live.id}/signals/${viewerId}/answer`
          ),
          {
            type: answer.type,
            sdp: answer.sdp
          }
        );

      } catch (error) {

        console.error(
          "Viewer WebRTC:",
          error
        );

      }

    }
  );


  onChildAdded(
    ref(
      db,
      `lives/${live.id}/signals/${viewerId}/hostCandidates`
    ),
    async snap => {

      const candidate =
        snap.val();

      if (!candidate || !viewerPC) {
        return;
      }


      const iceCandidate =
        new RTCIceCandidate(candidate);


      if (
        viewerPC.remoteDescription
      ) {

        try {

          await viewerPC
            .addIceCandidate(
              iceCandidate
            );

        } catch {}

      } else {

        pendingCandidates.push(
          iceCandidate
        );

      }

    }
  );

}

function calculateBotCount() {

  let total = 0;

  const now = Date.now();


  Object.values(
    botBatches || {}
  ).forEach(batch => {

    if (
      batch &&
      Number(batch.expiresAt || 0) >
        now
    ) {

      total +=
        Number(batch.amount || 0);

    }

  });


  return total;

}


function updateViewerCount() {

  botCount =
    calculateBotCount();


  const total =
    realViewers + botCount;


  document.getElementById(
    "watchers-text"
  ).textContent =
    format(total) +
    " watching";


  if (
    isHost &&
    currentLiveId
  ) {

    update(
      ref(
        db,
        "lives/" +
        currentLiveId
      ),
      {
        viewers: total,
        botCount
      }
    ).catch(() => {});

  }

}

function startBotExpiryWatcher() {

  clearInterval(
    botExpiryTimer
  );


  botExpiryTimer =
    setInterval(
      async () => {

        if (
          !isHost ||
          !currentLiveId
        ) {
          return;
        }


        const now =
          Date.now();

        const updates = {};


        Object.entries(
          botBatches || {}
        ).forEach(
          ([id, batch]) => {

            if (
              batch &&
              Number(batch.expiresAt || 0) <=
                now
            ) {

              updates[
                `lives/${currentLiveId}/botBatches/${id}`
              ] = null;

            }

          }
        );


        if (
          Object.keys(updates).length
        ) {

          await update(
            ref(db),
            updates
          ).catch(() => {});

        }


        updateViewerCount();

      },
      5000
    );

}

function rand(array) {

  return array[
    Math.floor(
      Math.random() *
      array.length
    )
  ];

}


function makeName() {

  return (
    rand(adjs) +
    rand(nouns) +
    rand(tags) +
    (
      Math.random() < .35
        ? Math.floor(
            Math.random() * 900 + 100
          )
        : ""
    )
  );

}


const names =
  Array.from(
    { length: 2500 },

function nextName() {

  return names[
    Math.floor(
      Math.random() *
      names.length
    )
  ];

}


function nextBotMessage(
  opening = false
) {

  if (
    opening &&
    Math.random() < .70
  ) {
    return rand(
      openingGreetings
    );
  }


  if (
    Math.random() < .72
  ) {
    return rand(
      normalMessages
    );
  }


  return (
    rand(normalMessages) +
    " " +
    rand(normalMessages)
  );

}


function getChatSpeed() {

  const count =
    calculateBotCount();


  if (count < 10)
    return {
      interval: 1600,
      burst: 1
    };


  if (count < 100)
    return {
      interval: 650,
      burst: 1
    };


  if (count < 1000)
    return {
      interval: 180,
      burst: 2
    };


  if (count < 3000)
    return {
      interval: 80,
      burst: 3
    };


  if (count < 7000)
    return {
      interval: 40,
      burst: 5
    };


  if (count < 20000)
    return {
      interval: 25,
      burst: 8
    };


  if (count < 100000)
    return {
      interval: 18,
      burst: 12
    };


  return {
    interval: 16,
    burst: 18
  };

}


function startLocalBotChat() {

  clearTimeout(
    localBotChatTimer
  );


  if (
    calculateBotCount() > 0
  ) {

    localBotChatTick();

  }

}


function localBotChatTick() {

  const count =
    calculateBotCount();


  if (count <= 0) {

    localBotChatTimer =
      setTimeout(
        localBotChatTick,
        1000
      );

    return;

  }


  const speed =
    getChatSpeed();


  const opening =
    Date.now() -
    (
      window.__liveStartedAt ||
      Date.now()
    ) <
    45000;


  for (
    let i = 0;
    i < speed.burst;
    i++
  ) {

    enqueueChat({

      name: nextName(),

      text:
        nextBotMessage(
          opening
        ),

      host: false,

      gift: false

    });

  }


  localBotChatTimer =
    setTimeout(
      localBotChatTick,
      speed.interval
    );

}


/* =========================================================
   CHAT
========================================================= */

function enqueueChat(message) {

  chatQueue.push(message);


  if (
    chatQueue.length > 300
  ) {

    chatQueue.splice(
      0,
      chatQueue.length - 300
    );

  }


  if (!chatFramePending) {

    chatFramePending = true;

    requestAnimationFrame(
      renderChat
    );

  }

}


function renderChat() {

  chatFramePending = false;


  const list =
    document.getElementById(
      "chat-list"
    );


  const batch =
    chatQueue.splice(
      0,
      80
    );


  const fragment =
    document.createDocumentFragment();


  batch.forEach(message => {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "msg" +
      (
        message.host
          ? " host"
          : ""
      ) +
      (
        message.gift
          ? " gift-msg"
          : ""
      );


    const cls =
      message.host ||
      message.gift
        ? ""
        : colorClass(
            message.name
          );


    div.innerHTML =
      `<span class="uname ${cls}">
        ${esc(message.name)}
      </span>${esc(message.text)}`;


    fragment.appendChild(div);

  });


  list.appendChild(
    fragment
  );


  while (
    list.children.length >
    MAX_CHAT_DOM
  ) {

    list.removeChild(
      list.firstChild
    );

  }


  list.scrollTop =
    list.scrollHeight;


  if (chatQueue.length) {

    chatFramePending = true;

    requestAnimationFrame(
      renderChat
    );

  }

}


function listenToChat(id) {

  if (unsubChat) {

    try {
      unsubChat();
    } catch {}

  }


  seenChat.clear();


  unsubChat =
    onChildAdded(
      ref(
        db,
        `lives/${id}/chat`
      ),
      snap => {

        if (
          seenChat.has(
            snap.key
          )
        ) {
          return;
        }


        seenChat.add(
          snap.key
        );


        const message =
          snap.val();


        if (
          !message ||
          message.bot
        ) {
          return;
        }


        enqueueChat({

          name:
            message.name ||
            "User",

          text:
            message.text ||
            "",

          host:
            !!message.host,

          gift:
            !!message.gift

        });

      }
    );

}

  if (unsubBotData) {

    try {
      unsubBotData();
    } catch {}

    unsubBotData = null;

  }


  if (unsubViewers) {

    try {
      unsubViewers();
    } catch {}

    unsubViewers = null;

  }


  if (unsubChat) {

    try {
      unsubChat();
    } catch {}

    unsubChat = null;

  }


  if (unsubGifts) {

    try {
      unsubGifts();
    } catch {}

    unsubGifts = null;

  }


  if (unsubLiveEnd) {

    try {
      unsubLiveEnd();
    } catch {}

    unsubLiveEnd = null;

  }


  if (stream) {

    stream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

    stream = null;

  }


  Object.values(
    peerConnections
  ).forEach(pc => {

    try {
      pc.close();
    } catch {}

  });


  peerConnections = {};


  if (viewerPC) {

    try {
      viewerPC.close();
    } catch {}

    viewerPC = null;

  }


  if (
    viewerId &&
    id
  ) {

    await remove(
      ref(
        db,
        `lives/${id}/viewers/${viewerId}`
      )
    ).catch(() => {});

  }


  if (
    isHost &&
    id
  ) {

    await remove(
      ref(
        db,
        "lives/" + id
      )
    ).catch(() => {});

  }


  isHost = false;
  cameraOn = false;

  currentLiveId = null;
  viewerId = null;

  botCount = 0;
  realViewers = 0;
  botBatches = {};


  document.getElementById(
    "local-video"
  ).srcObject = null;


  document.getElementById(
    "remote-video"
  ).srcObject = null;


  document.getElementById(
    "local-video"
  ).style.display = "none";


  document.getElementById(
    "remote-video"
  ).style.display = "none";


  document.getElementById(
    "cam-off"
  ).style.display = "block";


  document.getElementById(
    "chat-list"
  ).innerHTML = "";


  chatQueue = [];


  show("menu");

  toast("Live ended");

}


/* =========================================================
   LEAVE
========================================================= */

document.getElementById("btn-leave")
  .onclick = async () => {

    if (isHost) {

      await stopLive();

    } else {

      await leaveViewer();

      currentLiveId = null;

      show("menu");

      toast("Left live");

    }

  };


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  () => {

    if (
      viewerId &&
      currentLiveId
    ) {

      remove(
        ref(
          db,
          `lives/${currentLiveId}/viewers/${viewerId}`
        )
      ).catch(() => {});

    }

  }
);

  </script>
